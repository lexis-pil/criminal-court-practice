성휴대폰) 임의제출, 경찰관들 위 휴대전화 2대를 영장 없이 압수 피해자 갑에게 제출 범위 확인하지 않았음 / - 피고인 휴대전화 1개(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여, 다른 휴대전화 1개(삼성휴대폰)에 대해서는 비밀번호 제공을 거부, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음 / - 경찰은 휴대전화(아이폰)에 저장된 동영상 파일을 통해 피해자 공소외 1에 대한 2014년 범행을 확인한 다음, 후자의 휴대전화(삼성휴대폰)에서 2014년 범행의 증거 영상을 추가로 찾던 중, 피해자 갑이 아닌 다른 남성 2인이 침대 위에서 잠든 모습, 누군가가 손으로 그들의 성기를 잡고있는 모습 등이 촬영된 동영상 30개와 사진 등을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함 / - 경찰은 위 동영상에 등장하는 남성 2인의 인적 사항 등에 대해 조사하여 추가 수사를 통해 피고인이 2013. 12.경 피해자 을, 병에 대한 범행 인지함 / - 그 후 경찰 영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디를 증거물로 압수 / (3) 압수된 CD / O 위 인정사실에 의하면, 사안은 휴대전화에 담긴 전자정보의 제출 범위에 관한 제출자의 의사가 명확하지 않거나 이를 알 수 없는 경우에 해당하므로 압수의 범위는 2014년 범행 자체와 구체적, 개별적 연관관계가 있는 전자정보로 제한됨. 각 범죄발생 시점 사이에 상당한 간격이 있는 점, 피해자 및 범행에 이용한 휴대전화도 전혀 다른 점에 비추어 보면, 피고인의 2013년 범행에 관한 사진은 임의제출에 따른 압수의 동기가 된 2014년 범행의 범죄혐의사실과 구체적, 개별적 연관관계 있는 전자정보로 보기 어려움 / O 따라서 위 증거는 수사기관이 사전영장 없이 이를 취득한 이상 영장주의에 반하여 수집된 증거로 증거능력이 없고, 사후에 압수, 수색영장을 받아 압수절차가 진행되었고 피고인 및 그 변호인의 증거동의가 있다 하여도 달리 볼 수 없음 / (4) 피고인에 대한 제2회 경찰 피신조서, 수사보고(디지털증거분석 등), - 가 작성한 진술서, 0000. 0. 0. 자 압수조서 / O 위 각 증거들은 위법하게 수집된 나체사진을 기초로 수집되거나 이를 제시하며 작성된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 그 수집 절차와의 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 피고인에 대하여 증거능력이 없고, 피고인, 변호인이 위 각 증거에 증거동의를 하였다고 하더라도 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / 마) 소결론 - 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 피고인이 2014. 12. 11. 피해자 A를 상대로 저지른 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영) 범행(이하 2014년 범행이라 함)에 대하여 피해자 A가 즉시 피해사실을 경찰에 신고하면서 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 갤럭시 휴대폰)를 범행의 증거물로 임의제출함\n2) 경찰관들은 위 휴대전화 2대를 영장 없이 압수하면서, 피해자 A에게 위 휴대전화에 저장된 동영상과 사진 등 전자정보 전부를 제출하는 취지인지 등 제출 범위에 관한 의사를 따로 확인하지는 않음\n3) 피고인은 경찰관에게 휴대전화 1대(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여한 반면, 다른 휴대전화 1대(갤럭시 휴대폰)에 대해서는 사실상 비밀번호 제공을 거부하고, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음\n4) 경찰관은 아이폰에 저장된 동영상 파일을 통해 피해자 A에 대한 2014년 범행을 확인한 다음, A를 촬영한 휴대전화(아이폰)가 아닌 갤럭시 휴대폰에서 피고인이 2013. 12.경 피해자 B, C를 상대로 저지른 같은 법 위반 범행(이하 2013년 범행이라 함)을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함\n5) 그 후 (추가적인 조사를 거쳐) 압수, 수색영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디(CD)를 증거물로 압수함","링판번호":114},{"카드ID":"C112-5","판례ID":"C112","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"임의제출된 정보저장매체로부터 압수할 정보의 범위, 정보탐색시 필요한 조치","사건번호":"2016도348","태그":["L"],"중요도":1,"단락순번":5,"총단락수":5,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"범죄혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관은 더 이상의 추가 탐색을 중단하고 법원으로부터 별도의 범죄혐의에 대한 압수, 수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수, 수색을 할 수 있음","힌트_첫어절":"범죄혐의사실과 관련된 전자정보를 적법하게","힌트_초성":"ㅂㅈㅎㅇㅅㅅㄱ ㄱㄹㄷ ㅈㅈㅈㅂㄹ ㅈㅂㅎㄱ ㅌㅅㅎㄴ ㄱㅈㅇㅅ ㅂㄷㅇ ㅂㅈㅎㅇㅇ ㄱㄹㄷ ㅈㅈㅈㅂㄹ ㅇㅇㅎ ㅂㄱㅎ ㄱㅇㄹㅁ, ㅅㅅㄱㄱㅇ ㄷ ㅇㅅㅇ ㅊㄱ ㅌㅅㅇ ㅈㄷㅎㄱ ㅂㅇㅇㄹㅂㅌ ㅂㄷㅇ ㅂㅈㅎㅇㅇ ㄷㅎ ㅇㅅ, ㅅㅅㅇㅈㅇ ㅂㅂㅂㅇ ㄱㅇㅇ ㅎㅎㅇ ㄱㄹㅎ ㅈㅂㅇ ㄷㅎㅇㄷ ㅈㅂㅎㄱ ㅇㅅ, ㅅㅅㅇ ㅎ ㅅ ㅇㅇ","핵심키워드":["범죄혐의","수색영장","수색","전자정보","압수","정보","범죄혐의사실","적법","과정","발견","관련"],"유사법리":"C103-2(2011모1839,0.49)","빈칸":{"1":[[0,6],[8,10],[12,16],[18,20],[28,30],[37,41],[43,45],[47,51],[57,59],[102,106],[111,113],[115,119],[138,140],[147,149],[152,154],[156,158]],"2":[[0,6],[8,10],[12,16],[18,20],[23,25],[28,30],[37,41],[43,45],[47,51],[57,59],[67,71],[82,84],[91,93],[102,106],[111,113],[115,119],[138,140],[147,149],[152,154],[156,158]],"3":[[0,71],[82,93],[102,119],[138,158]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 피고인의 2013년 범행 부분에 대한 동영상, 사진 등을 복제한 CD는 위수증으로 증거능력 없다고 주장 / O 직권으로, 자백에 대한 보강증거 유무 검토 / 2) 검토 / 가) 검제증 / 나) 증없증 / (1) 관련 법리 / O 위수증 (원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우, 압수의 대상은 임의제출의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 정보로 한정됨. 그 관련성에는 범행 동기와 경위, 수단과 방법, 시간과 장소 등에 관한 간접증거나 정황증거로 사용될 수 있는 정보도 포함됨. 다만 단순히 동종, 유사 범행임을 넘어서 구체적, 개별적 연관관계가 있어야 함. 제3자가 제출할 경우에는 더욱 제한적으로 해석하여야 함 / O 수사기관이 저장매체 자체 또는 복제본을 사무실에서 탐색, 복제, 출력하는 경우에도, 피압수자측 참여권 보장, 압수 목록 교부 하여야 하며, 피의자의 소유 관리에 속하는 정보저장매체를 제3자가 임의제출하는 경우에는 그 피의자에 대하여도 위 절차가 준수되어야 함. 압수된 전자정보가 피의자의 소유, 관리에 속하는지는 피의자가 실질적인 압수수색 당사자라는 점이 압수수색 당시 외형적, 객관적으로 인식 가능하였는지를 기준으로 판단함 / O 전자정보에 대한 압수, 수색 중 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관은 더 이상의 추가 탐색을 중단하고 법원으로부터 별도의 범죄혐의에 대한 압수, 수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수, 수색을 할 수 있음. 따라서 영장 없이 무관증거를 압수한 경우 위수증에 해당하여 증거능력 없음 / O 피고인, 변호인이 증거로 함에 동의하고 사후영장이 발부되어도 달리 볼 것 아님 / (2) 인정사실 / - 피고인은 2014. 12. 11. 자기 집에서 피해자 갑의 의사에 반해 성기를 촬영, 피해자 갑은 즉시 경찰에 신고하면서, 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 삼성휴대폰) 임의제출, 경찰관들 위 휴대전화 2대를 영장 없이 압수 피해자 갑에게 제출 범위 확인하지 않았음 / - 피고인 휴대전화 1개(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여, 다른 휴대전화 1개(삼성휴대폰)에 대해서는 비밀번호 제공을 거부, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음 / - 경찰은 휴대전화(아이폰)에 저장된 동영상 파일을 통해 피해자 공소외 1에 대한 2014년 범행을 확인한 다음, 후자의 휴대전화(삼성휴대폰)에서 2014년 범행의 증거 영상을 추가로 찾던 중, 피해자 갑이 아닌 다른 남성 2인이 침대 위에서 잠든 모습, 누군가가 손으로 그들의 성기를 잡고있는 모습 등이 촬영된 동영상 30개와 사진 등을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함 / - 경찰은 위 동영상에 등장하는 남성 2인의 인적 사항 등에 대해 조사하여 추가 수사를 통해 피고인이 2013. 12.경 피해자 을, 병에 대한 범행 인지함 / - 그 후 경찰 영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디를 증거물로 압수 / (3) 압수된 CD / O 위 인정사실에 의하면, 사안은 휴대전화에 담긴 전자정보의 제출 범위에 관한 제출자의 의사가 명확하지 않거나 이를 알 수 없는 경우에 해당하므로 압수의 범위는 2014년 범행 자체와 구체적, 개별적 연관관계가 있는 전자정보로 제한됨. 각 범죄발생 시점 사이에 상당한 간격이 있는 점, 피해자 및 범행에 이용한 휴대전화도 전혀 다른 점에 비추어 보면, 피고인의 2013년 범행에 관한 사진은 임의제출에 따른 압수의 동기가 된 2014년 범행의 범죄혐의사실과 구체적, 개별적 연관관계 있는 전자정보로 보기 어려움 / O 따라서 위 증거는 수사기관이 사전영장 없이 이를 취득한 이상 영장주의에 반하여 수집된 증거로 증거능력이 없고, 사후에 압수, 수색영장을 받아 압수절차가 진행되었고 피고인 및 그 변호인의 증거동의가 있다 하여도 달리 볼 수 없음 / (4) 피고인에 대한 제2회 경찰 피신조서, 수사보고(디지털증거분석 등), - 가 작성한 진술서, 0000. 0. 0. 자 압수조서 / O 위 각 증거들은 위법하게 수집된 나체사진을 기초로 수집되거나 이를 제시하며 작성된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 그 수집 절차와의 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 피고인에 대하여 증거능력이 없고, 피고인, 변호인이 위 각 증거에 증거동의를 하였다고 하더라도 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / 마) 소결론 - 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 피고인이 2014. 12. 11. 피해자 A를 상대로 저지른 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영) 범행(이하 2014년 범행이라 함)에 대하여 피해자 A가 즉시 피해사실을 경찰에 신고하면서 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 갤럭시 휴대폰)를 범행의 증거물로 임의제출함\n2) 경찰관들은 위 수의 대상은 임의제출의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 정보로 한정됨. 그 관련성에는 범행 동기와 경위, 수단과 방법, 시간과 장소 등에 관한 간접증거나 정황증거로 사용될 수 있는 정보도 포함됨. 다만 단순히 동종, 유사 범행임을 넘어서 구체적, 개별적 연관관계가 있어야 함 / O 수사기관이 피의자로부터 범죄혐의사실과 관련된 전자정보와 그렇지 않은 전자정보가 섞인 매체를 임의제출받아 사무실 등에서 탐색 복제 출력하는 경우 피의자나 변호인에게 참여의 기회를 보장하고 압수된 전자정보가 특정된 목록을 교부하여야 하나, 그러한 조치를 취하지 않았더라도 피의자의 참여권이 실질적으로 침해되지 않았다면 압수 수색이 위법하다고 볼 것은 아님 / (2) 인정사실 / 경찰관 피고인이 소지하던 휴대전화 임의제출 받아 압수, 임의동행 요구하여 이동, 압수조서 상 -라고 기재되어 있을 뿐 다른 범행에 대하여 아무런 기재 없음, 휴대전화 탐색 중 불특정 다수 여성 촬영된 사진들 발견, 디지털 증거분석 의뢰, 탐색하는 과정에서 피고인 참여, 압수목록 교부하지 않음, 피의자 신문시 피고인은 1-7번 범행 영상 언제 어디서 찍은 것인지 진술 / (3) 판단 / O 위 인정사실 종합하여 알 수 있는 다음과 같은 사정 등을 종합하여 보면, 1-7번 범행으로 촬영한 영상의 출력물, 파일 복사본을 다음 CD는 적법한 압수, 수색에 의해 수집된 증거임 / - 1-7번 범행에 관한 동영상은 촬영 기간이 8번 범행 일시와 가깝고 8번 범행과 마찬가지로 공공장소에서 촬영되어 임의제출의 동기가 된 8번 범죄혐의사실과 관련성 있는 증거임 / - 임의제출 받은 휴대전화를 피고인이 있는 자리에서 살펴봤으므로 피고인이 탐색에 참여하였다고 볼 수 있음 / - 경찰관이 1-7번 범행 영상을 제시하자 피고인은 그 영상이 언제 어디에서 찍은 것인지 쉽게 알아보고 그에 관해 구체적으로 진술하였던 점에 비추어, 피고인에게 압수된 전자정보가 특정된 목록이 교부되지 않았더라도 절차상 권리가 실질적으로 침해되었다고 보기 어려움 / O 1-7번 범행에 관한 전자정보 압수물은 증거능력 있음 / O 변호인의 위 주장 받아들이지 아니함 / 나) 증거의 요지 / 다) 소결론 / 라) 부수처분 / 압수된 휴대전화를 피고인으로부터 몰수(형법48조 제1항 제1호)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 경찰관 P는 피해자 A로부터 불법촬영(1번 범행) 신고를 받고 사건 현장에 출동하여 피고인이 소지하고 있던 이 사건 휴대전화를 임의제출 받아 영장 없이 압수하고, 피고인에게 임의동행을 요구하여 경찰서로 함께 이동함\n2) 당시 작성된 압수조서 상에는 신고를 받고 현장에 도착하여 확인한바 피해자는 피고인이 소지하고 있는 휴대전화를 지목하면서 자신의 뒷모습을 찍었다고 주장하고, 피고인 또한 찍은 사실에 대하여 인정하여 범죄에 사용된 휴대전화를 임의제출받아 압수하였다고 기재되어 있을 뿐, 다른 범행에 대하여는 아무런 기재가 없음\n3) 경찰관 P는 이 사건 휴대전화에 저장된 사진 또는 동영상을 확인하는 과정에서 위 피해자에 대한 촬영물은 확인하지 못하였으나 불특정 다수 여성의 엉덩이가 촬영된 사진들을 발견하였고, 경찰청에 이 사건 휴대전화에 대한 디지털 증거분석을 의뢰하여 그 분석 결과를 토대로 위 피해자 외에 불상의 여성 7명의 하체 부분이 촬영된 동영상을 캡쳐하여 기록에 첨부하고, 각 동영상 파일 생성 일시를 범행 시각으로 특정한 후 피의자신문을 거쳐 범죄의 일시, 장소를 특정하였음(1~7번 범행)","링판번호":115},{"카드ID":"C113-2","판례ID":"C113","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"임의제출된 전자정보매체로부터 압수할 정보의 범위, 정보탐색 시 필요한 조치","사건번호":"2019도4938","태그":["L"],"중요도":1,"단락순번":2,"총단락수":2,"소제목":"2020. , 압수조서 상 -라고 기재되어 있을 뿐 다른 범행에 대하여 아무런 기재 없음, 휴대전화 탐색 중 불특정 다수 여성 촬영된 사진들 발견, 디지털 증거분석 의뢰, 탐색하는 과정에서 피고인 참여, 압수목록 교부하지 않음, 피의자 신문시 피고인은 1-7번 범행 영상 언제 어디서 찍은 것인지 진술 / (3) 판단 / O 위 인정사실 종합하여 알 수 있는 다음과 같은 사정 등을 종합하여 보면, 1-7번 범행으로 촬영한 영상의 출력물, 파일 복사본을 다음 CD는 적법한 압수, 수색에 의해 수집된 증거임 / - 1-7번 범행에 관한 동영상은 촬영 기간이 8번 범행 일시와 가깝고 8번 범행과 마찬가지로 공공장소에서 촬영되어 임의제출의 동기가 된 8번 범죄혐의사실과 관련성 있는 증거임 / - 임의제출 받은 휴대전화를 피고인이 있는 자리에서 살펴봤으므로 피고인이 탐색에 참여하였다고 볼 수 있음 / - 경찰관이 1-7번 범행 영상을 제시하자 피고인은 그 영상이 언제 어디에서 찍은 것인지 쉽게 알아보고 그에 관해 구체적으로 진술하였던 점에 비추어, 피고인에게 압수된 전자정보가 특정된 목록이 교부되지 않았더라도 절차상 권리가 실질적으로 침해되었다고 보기 어려움 / O 1-7번 범행에 관한 전자정보 압수물은 증거능력 있음 / O 변호인의 위 주장 받아들이지 아니함 / 나) 증거의 요지 / 다) 소결론 / 라) 부수처분 / 압수된 휴대전화를 피고인으로부터 몰수(형법48조 제1항 제1호)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 경찰관 P는 피해자 A로부터 불법촬영(1번 범행) 신고를 받고 사건 현장에 출동하여 피고인이 소지하고 있던 이 사건 휴대전화를 임의제출 받아 영장 없이 압수하고, 피고인에게 임의동행을 요구하여 경찰서로 함께 이동함\n2) 당시 작성된 압수조서 상에는 신고를 받고 현장에 도착하여 확인한바 피해자는 피고인이 소지하고 있는 휴대전화를 지목하면서 자신의 뒷모습을 찍었다고 주장하고, 피고인 또한 찍은 사실에 대하여 인정하여 범죄에 사용된 휴대전화를 임의제출받아 압수하였다고 기재되어 있을 뿐, 다른 범행에 대하여는 아무런 기재가 없음\n3) 경찰관 P는 이 사건 휴대전화에 저장된 사진 또는 동영상을 확인하는 과정에서 위 피해자에 대한 촬영물은 확인하지 못하였으나 불특정 다수 여성의 엉덩이가 촬영된 사진들을 발견하였고, 경찰청에 이 사건 휴대전화에 대한 디지털 증거분석을 의뢰하여 그 분석 결과를 토대로 위 피해자 외에 불상의 여성 7명의 하체 부분이 촬영된 동영상을 캡쳐하여 기록에 첨부하고, 각 동영상 파일 생성 일시를 범행 시각으로 특정한 후 피의자신문을 거쳐 범죄의 일시, 장소를 특정하였음(1~7번 범행)","링판번호":115},{"카드ID":"C114-1","판례ID":"C114","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"유류물 압수에서의 참여권보장 및 압수물 목록 교부","사건번호":"2021도1181","태그":["NL"],"중요도":1,"단락순번":1,"총단락수":1,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"유류물 압수의 근거인 형소법 제218조는 유류물을 압수하는 경우에 사전, 사후에 영장을 받을 것을 요구하지 않는다. 유류물 압수와 같은 조문에 규정된 임의제출물 압수의 경우, 제출자가 제출, 압수의 대상을 개별적으로 지정하거나 그 범위를 한정할 수 있으나, 유류물 압수는 그와 같은 제출자의 존재를 생각하기도 어려움. 따라서 유류물 압수, 수색에 대해서는 원칙적으로 영장에 의한 압수, 수색, 검증에 관하여 적용되는 형소법 제215조 제1항이나 임의제출물 압수에 관하여 적용되는 형소법 제219조에 의하여 준용되는 제106조 제1항, 제3항, 제4항에 따른 관련성의 제한이 적용된다고 보기 어려움. 정보저장매체에 대한 압수, 수색에 있어, 압수, 수색 당시 또는 이와 시간적으로 근접한 시기까지 정보저장매체를 현실적으로 지배, 관리하면서 그 정보저장매체 내 전자정보 전반에 관한 전속적인 관리처분권을 보유, 행사하고, 달리 이를 자신의 의사에 따라 제3자에게 양도하거나 포기하지 아니한 경우에는, 그 지배, 관리자인 피의자를 정보저장매체에 저장된 전자정보 전반에 대한 실질적인 압수, 수색 당사자로 평가할 수 있음. 그러나 유류물 압수는 수사기관이 소유권이나 관리처분권이 처음부터 존재하지 않거나, 존재하였지만 적법하게 포기된 물건, 또는 그와 같은 외관을 가진 물건 등의 점유를 수사상 필요에 따라 취득하는 수사방법을 말함. 따라서 유류물 압수에 있어서는 정보저장매체의 현실적 지배, 관리 혹은 이에 담겨있는 전자정보 전반에 관한 전속적인 관리처분권을 인정하기 어렵다. 정보저장매체를 소지하고 있던 사람이 이를 분실한 경우와 같이 그 권리를 포기하였다고 단정하기 어려운 경우에도, 수사기관이 그러한 사정을 알거나 충분히 알 수 있었음에도 이를 유류물로서 영장 없이 압수하였다는 등의 특별한 사정이 없는 한, 영장에 의한 압수나 임의제출물 압수와 같이 수사기관의 압수 당시 참여권 행사의 주체가 되는 피압수자가 존재한다고 평가할 수는 없음. 따라서 범죄수사를 위해 정보저장매체의 압수가 필요하고, 정보저장매체를 소지하던 사람이 그에 관한 권리를 포기하였거나 포기한 것으로 인식할 수 있는 경우에는, 수사기관이 형소법 제218조에 따라 피의자 기타 사람이 유류한 정보저장매체를 영장 없이 압수할 때 해당 사건과 관계가 있다고 인정할 수 있는 것에 압수의 대상이나 범위가 한정된다거나, 참여권자의 참여가 필수적이라고 볼 수는 없음","힌트_첫어절":"유류물 압수의 근거인 형소법","힌트_초성":"ㅇㄹㅁ ㅇㅅㅇ ㄱㄱㅇ ㅎㅅㅂ ㅈ218ㅈㄴ ㅇㄹㅁㅇ ㅇㅅㅎㄴ ㄱㅇㅇ ㅅㅈ, ㅅㅎㅇ ㅇㅈㅇ ㅂㅇ ㄱㅇ ㅇㄱㅎㅈ ㅇㄴㄷ. ㅇㄹㅁ ㅇㅅㅇ ㄱㅇ ㅈㅁㅇ ㄱㅈㄷ ㅇㅇㅈㅊㅁ ㅇㅅㅇ ㄱㅇ, ㅈㅊㅈㄱ ㅈㅊ, ㅇㅅㅇ ㄷㅅㅇ ㄱㅂㅈㅇㄹ ㅈㅈㅎㄱㄴ ㄱ ㅂㅇㄹ ㅎㅈㅎ ㅅ ㅇㅇㄴ, ㅇㄹㅁ ㅇㅅㄴ ㄱㅇ ㄱㅇ ㅈㅊㅈㅇ ㅈㅈㄹ ㅅㄱㅎㄱㄷ ㅇㄹㅇ. ㄸㄹㅅ ㅇㄹㅁ ㅇㅅ, ㅅㅅㅇ ㄷㅎㅅㄴ ㅇㅊㅈㅇㄹ ㅇㅈㅇ ㅇㅎ ㅇㅅ, ㅅㅅ, ㄱㅈㅇ ㄱㅎㅇ ㅈㅇㄷㄴ ㅎㅅㅂ ㅈ215ㅈ ㅈ1ㅎㅇㄴ ㅇㅇㅈㅊㅁ ㅇㅅㅇ ㄱㅎㅇ ㅈㅇㄷㄴ ㅎㅅㅂ ㅈ219ㅈㅇ ㅇㅎㅇ ㅈㅇㄷㄴ ㅈ106ㅈ ㅈ1ㅎ, ㅈ3ㅎ, ㅈ4ㅎㅇ ㄸㄹ ㄱㄹㅅㅇ ㅈㅎㅇ ㅈㅇㄷㄷㄱ ㅂㄱ ㅇㄹㅇ. ㅈㅂㅈㅈㅁㅊㅇ ㄷㅎ ㅇㅅ, ㅅㅅㅇ ㅇㅇ, ㅇㅅ, ㅅㅅ ㄷㅅ ㄸㄴ ㅇㅇ ㅅㄱㅈㅇㄹ ㄱㅈㅎ ㅅㄱㄲㅈ ㅈㅂㅈㅈㅁㅊㄹ ㅎㅅㅈㅇㄹ ㅈㅂ, ㄱㄹㅎㅁㅅ ㄱ ㅈㅂㅈㅈㅁㅊ ㄴ ㅈㅈㅈㅂ ㅈㅂㅇ ㄱㅎ ㅈㅅㅈㅇ ㄱㄹㅊㅂㄱㅇ ㅂㅇ, ㅎㅅㅎㄱ, ㄷㄹ ㅇㄹ ㅈㅅㅇ ㅇㅅㅇ ㄸㄹ ㅈ3ㅈㅇㄱ ㅇㄷㅎㄱㄴ ㅍㄱㅎㅈ ㅇㄴㅎ ㄱㅇㅇㄴ, ㄱ ㅈㅂ, ㄱㄹㅈㅇ ㅍㅇㅈㄹ ㅈㅂㅈㅈㅁㅊㅇ ㅈㅈㄷ ㅈㅈㅈㅂ ㅈㅂㅇ ㄷㅎ ㅅㅈㅈㅇ ㅇㅅ, ㅅㅅ ㄷㅅㅈㄹ ㅍㄱㅎ ㅅ ㅇㅇ. ㄱㄹㄴ ㅇㄹㅁ ㅇㅅㄴ ㅅㅅㄱㄱㅇ ㅅㅇㄱㅇㄴ ㄱㄹㅊㅂㄱㅇ ㅊㅇㅂㅌ ㅈㅈㅎㅈ ㅇㄱㄴ, ㅈㅈㅎㅇㅈㅁ ㅈㅂㅎㄱ ㅍㄱㄷ ㅁㄱ, ㄸㄴ ㄱㅇ ㄱㅇ ㅇㄱㅇ ㄱㅈ ㅁㄱ ㄷㅇ ㅈㅇㄹ ㅅㅅㅅ ㅍㅇㅇ ㄸㄹ ㅊㄷㅎㄴ ㅅㅅㅂㅂㅇ ㅁㅎ. ㄸㄹㅅ ㅇㄹㅁ ㅇㅅㅇ ㅇㅇㅅㄴ ㅈㅂㅈㅈㅁㅊㅇ ㅎㅅㅈ ㅈㅂ, ㄱㄹ ㅎㅇ ㅇㅇ ㄷㄱㅇㄴ ㅈㅈㅈㅂ ㅈㅂㅇ ㄱㅎ ㅈㅅㅈㅇ ㄱㄹㅊㅂㄱㅇ ㅇㅈㅎㄱ ㅇㄹㄷ. ㅈㅂㅈㅈㅁㅊㄹ ㅅㅈㅎㄱ ㅇㄷ ㅅㄹㅇ ㅇㄹ ㅂㅅㅎ ㄱㅇㅇ ㄱㅇ ㄱ ㄱㄹㄹ ㅍㄱㅎㅇㄷㄱ ㄷㅈㅎㄱ ㅇㄹㅇ ㄱㅇㅇㄷ, ㅅㅅㄱㄱㅇ ㄱㄹㅎ ㅅㅈㅇ ㅇㄱㄴ ㅊㅂㅎ ㅇ ㅅ ㅇㅇㅇㅇㄷ ㅇㄹ ㅇㄹㅁㄹㅅ ㅇㅈ ㅇㅇ ㅇㅅㅎㅇㄷㄴ ㄷㅇ ㅌㅂㅎ ㅅㅈㅇ ㅇㄴ ㅎ, ㅇㅈㅇ ㅇㅎ ㅇㅅㄴ ㅇㅇㅈㅊㅁ ㅇㅅㅇ ㄱㅇ ㅅㅅㄱㄱㅇ ㅇㅅ ㄷㅅ ㅊㅇㄱ ㅎㅅㅇ ㅈㅊㄱ ㄷㄴ ㅍㅇㅅㅈㄱ ㅈㅈㅎㄷㄱ ㅍㄱㅎ ㅅㄴ ㅇㅇ. ㄸㄹㅅ ㅂㅈㅅㅅㄹ ㅇㅎ ㅈㅂㅈㅈㅁㅊㅇ ㅇㅅㄱ ㅍㅇㅎㄱ, ㅈㅂㅈㅈㅁㅊㄹ ㅅㅈㅎㄷ ㅅㄹㅇ ㄱㅇ ㄱㅎ ㄱㄹㄹ ㅍㄱㅎㅇㄱㄴ ㅍㄱㅎ ㄱㅇㄹ ㅇㅅㅎ ㅅ ㅇㄴ ㄱㅇㅇㄴ, ㅅㅅㄱㄱㅇ ㅎㅅㅂ ㅈ218ㅈㅇ ㄸㄹ ㅍㅇㅈ ㄱㅌ ㅅㄹㅇ ㅇㄹㅎ ㅈㅂㅈㅈㅁㅊㄹ ㅇㅈ ㅇㅇ ㅇㅅㅎ ㄸ ㅎㄷ ㅅㄱㄱ ㄱㄱㄱ ㅇㄷㄱ ㅇㅈㅎ ㅅ ㅇㄴ ㄱㅇ ㅇㅅㅇ ㄷㅅㅇㄴ ㅂㅇㄱ ㅎ 권리를 포기하였거나 포기한 것으로 인식할 수 있는 경우이었으므로 해당 사건과 관계가 있다고 인정할 수 있는 것에 압수의 대상이나 범위가 한정된다거나, 피고인의 참여가 필수적이라고 볼 수는 없으므로 피고인이 SSD카드 파일의 증거능력 인정됨 / O 변호인의 위 주장은 받아들이지 아니함 / 라) 증거의 요지","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"피고인 저장매체(SSD카드) 등이 든 신발주머니를 고층 아파트 바깥으로 투척, 소유권 부인하여 유류물로 압수함 / - SSD카드 탐색, 출력과정에서 피고인 참여하지 않았음","링판번호":116},{"카드ID":"C115-1","판례ID":"C115","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"6) 위법한 강제처분이 미치는 영향","쟁점":"체포이유와 피의사실 등의 고지","사건번호":"2017도10866","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"사법경찰관 등이 체포영장을 소지하고 피의자를 체포하기 위해서는 체포영장을 피의자에게 제시하고(형소법 제200조의6, 제85조 제1항), 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 함(제200조의5). 이와 같은 체포영장의 제시나 고지 등은 체포를 위한 실력행사에 들어가기 이전에 미리 하여야 하는 것이 원칙임. 그러나 달아나는 피의자를 쫓아가 붙들거나 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에는 붙들거나 제압하는 과정에서 하거나, 그것이 여의치 않은 경우에는 일단 붙들거나 제압한 후에 지체 없이 하여야 함","힌트_첫어절":"사법경찰관 등이 체포영장을 소지하고","힌트_초성":"ㅅㅂㄱㅊㄱ ㄷㅇ ㅊㅍㅇㅈㅇ ㅅㅈㅎㄱ ㅍㅇㅈㄹ ㅊㅍㅎㄱ ㅇㅎㅅㄴ ㅊㅍㅇㅈㅇ ㅍㅇㅈㅇㄱ ㅈㅅㅎㄱ(ㅎㅅㅂ ㅈ200ㅈㅇ6, ㅈ85ㅈ ㅈ1ㅎ), ㅍㅇㅅㅅㅇ ㅇㅈ, ㅊㅍㅇ ㅇㅇㅇ ㅂㅎㅇㅇ ㅅㅇㅎ ㅅ ㅇㅇㅇ ㅁㅎㄱ ㅂㅁㅎ ㄱㅎㄹ ㅈㅇㅇ ㅎ(ㅈ200ㅈㅇ5). ㅇㅇ ㄱㅇ ㅊㅍㅇㅈㅇ ㅈㅅㄴ ㄱㅈ ㄷㅇ ㅊㅍㄹ ㅇㅎ ㅅㄹㅎㅅㅇ ㄷㅇㄱㄱ ㅇㅈㅇ ㅁㄹ ㅎㅇㅇ ㅎㄴ ㄱㅇ ㅇㅊㅇ. ㄱㄹㄴ ㄷㅇㄴㄴ ㅍㅇㅈㄹ ㅉㅇㄱ ㅂㄷㄱㄴ ㅍㄹㅇㄹ ㄷㅎㅎㄴ ㅍㅇㅈㄹ ㅅㄹㅇㄹ ㅈㅇㅎㄴ ㄱㅇㅇㄴ ㅂㄷㄱㄴ ㅈㅇㅎㄴ ㄱㅈㅇㅅ ㅎㄱㄴ, ㄱㄱㅇ ㅇㅇㅊ ㅇㅇ ㄱㅇㅇㄴ ㅇㄷ ㅂㄷㄱㄴ ㅈㅇㅎ ㅎㅇ ㅈㅊ ㅇㅇ ㅎㅇㅇ ㅎ","핵심키워드":["체포영장","피의사실","대항","고지","요지","들어가기","실력행사","체포","선임","소지","과정","제시"],"유사법리":"C116-2(2013도2168,0.77) ; C084-2(99도4341,0.62)","빈칸":{"1":[[9,13],[15,17],[25,27],[35,39],[47,49],[76,80],[82,84],[86,88],[99,101],[143,147],[149,151],[153,155],[159,161],[166,170],[172,176],[227,229],[262,264]],"2":[[0,5],[9,13],[15,17],[20,23],[25,27],[35,39],[41,44],[47,49],[56,63],[65,69],[70,73],[76,80],[82,84],[86,88],[94,97],[99,101],[113,115],[143,147],[149,151],[153,155],[159,161],[166,170],[172,176],[208,211],[222,224],[227,229],[232,235],[237,239],[262,264],[303,305]],"3":[[0,101],[113,115],[137,197],[208,211],[222,239],[262,264],[303,305]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 현행범 체포 위법 공집방, 상해 무죄 주장함 / 2) 검토 / 가) 법리 / O 사고차량으로 인정되는 차량에서 내리는 사람을 발견한 경우 형소법 제211조 제2항 제2호 소정의 장물이나 범죄에 사용되었다고 인정함에 충분한 흉기 기타 물건을 소지하고 있는 때에 해당하므로 준현행범으로서 영장없이 체포할 수 있음 / O 현행범 체포의 경우 반드시 형소법 제200조의5에 따라 범죄사실의 요지 등 권리를 고지하여야 하고 이는 체포를 위한 실력행사 이전에 미리 하여야 함이 원칙이나 달아나거나 폭력으로 대항하는 피의자를 제압하는 경우 그 과정에서 하거나 제압한 후 지체없이 하여야 함 / O 위법한 체포를 면하려고 반항하는 과정에서 경찰의 안경을 손괴한 경우 공집방은 적법한 공무에 해당하지 아니하여 구성요건 해당성이 없어 무죄이고, 재물손괴죄는 신체에 대한 현재의 부당한 침해에서 벗어나기 위한 행위로 정당방위에 해당하므로 위법성이 조각되어 무죄임 / 나) 인정사실 / 검정색 차량이 도주하였다는 무전 받고 수색, 10분 후 1km 떨어진 곳에서 해당 차량에서 피고인이 내리는 것 발견, 범퍼 및 휀더 부분 파손, 차적 조회, 피고인 저항, 권리 미고지 / 다) 판단 (해당 판례 결론) / O 피고인 형소법 제211조 제2항 제2호 소정의 준현행범인에 해당함 / O (현체 권리고지 법리)하여야 하나 A, B가 위와 같은 절차를 준수했다는 사실을 인정할 아무런 증거가 없음 / O 따라서 경찰 A가 피고인을 체포한 행위는 적법한 공무집행이라고 볼 수 없어 공무집행방해죄의 구성요건 해당성이 없고, 피고인이 위법한 체포를 면하려고 경찰에게 상해를 가한 것은 위법한 체포로 인한 신체에 대한 현재의 부당한 침해에서 벗어나기 위한 행위로서 정당방위에 해당하여 위법성이 조각됨 / 라) 소결론 / 공무집행방해 형소법 제325조 후단, 상해 제325조 전단에 의하여 각 무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 6) 위법한 강제처분이 미치는 영향","사실관계":"교통사고를 낸 차량이 도주하였다는 연락을 받은 경찰관이 사고차량으로 인정되는 차량에서 내린 운전자를 준현행범인으로 체포하는 중 권리 미고지하였고 피고인은 경찰관에 상해를 가함","링판번호":117},{"카드ID":"C115-2","판례ID":"C115","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"6) 위법한 강제처분이 미치는 영향","쟁점":"체포이유와 피의사실 등의 고지","사건번호":"2017도10866","태그":["L"],"중요도":1,"단락순번":2,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"형법 제136조가 규정하는 공무집행방해죄는 공무원의 직무집행이 적법한 경우에 한하여 성립함. 이때 적법한 공무집행은 그 행위가 공무원의 추상적 권한에 속할 뿐 아니라 구체적 직무집행에 관한 법률상 요건과 방식을 갖춘 경우를 가리킴. 경찰관이 적법절차를 준수하지 않은 채 실력으로 피의자를 체포하려고 하였다면 적법한 공무집행이라고 할 수 없음. 그리고 경찰관의 체포행위가 적법한 공무집행을 벗어나 불법하게 체포한 것으로 볼 수밖에 없다면, 피의자가 그 체포를 면하려고 반항하는 과정에서 경찰관에게 상해를 가한 것은 불법체포로 인한 신체에 대한 현재의 부당한 침해에서 벗어나기 위한 행위로서 정당방위에 해당하여 위법성이 조각됨","힌트_첫어절":"형법 제136조가 규정하는 공무집행방해죄는","힌트_초성":"ㅎㅂ ㅈ136ㅈㄱ ㄱㅈㅎㄴ ㄱㅁㅈㅎㅂㅎㅈㄴ ㄱㅁㅇㅇ ㅈㅁㅈㅎㅇ ㅈㅂㅎ ㄱㅇㅇ ㅎㅎㅇ ㅅㄹㅎ. ㅇㄸ ㅈㅂㅎ ㄱㅁㅈㅎㅇ ㄱ ㅎㅇㄱ ㄱㅁㅇㅇ ㅊㅅㅈ ㄱㅎㅇ ㅅㅎ ㅃ ㅇㄴㄹ ㄱㅊㅈ ㅈㅁㅈㅎㅇ ㄱㅎ ㅂㄹㅅ ㅇㄱㄱ ㅂㅅㅇ ㄱㅊ ㄱㅇㄹ ㄱㄹㅋ. ㄱㅊㄱㅇ ㅈㅂㅈㅊㄹ ㅈㅅㅎㅈ ㅇㅇ ㅊ ㅅㄹㅇㄹ ㅍㅇㅈㄹ ㅊㅍㅎㄹㄱ ㅎㅇㄷㅁ ㅈㅂㅎ ㄱㅁㅈㅎㅇㄹㄱ ㅎ ㅅ ㅇㅇ. ㄱㄹㄱ ㄱㅊㄱㅇ ㅊㅍㅎㅇㄱ ㅈㅂㅎ ㄱㅁㅈㅎㅇ ㅂㅇㄴ ㅂㅂㅎㄱ ㅊㅍㅎ ㄱㅇㄹ ㅂ ㅅㅂㅇ ㅇㄷㅁ, ㅍㅇㅈㄱ ㄱ ㅊㅍㄹ ㅁㅎㄹㄱ ㅂㅎㅎㄴ ㄱㅈㅇㅅ ㄱㅊㄱㅇㄱ ㅅㅎㄹ ㄱㅎ ㄱㅇ ㅂㅂㅊㅍㄹ ㅇㅎ ㅅㅊㅇ ㄷㅎ ㅎㅈㅇ ㅂㄷㅎ ㅊㅎㅇㅅ 행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"검사 또는 사법경찰관리가 현행범인을 체포하는 경우에는 반드시 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 함(형소법 제213조의2, 제200조의5). 이와 같은 고지는 체포를 위한 실력행사에 들어가기 전에 미리 하는 것이 원칙임. 그러나 달아나는 피의자를 쫓아가 붙들거나 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에는 붙들거나 제압하는 과정에서 고지하거나, 그것이 여의치 않은 경우에는 일단 붙들거나 제압한 후에 지체없이 고지하여야 함","힌트_첫어절":"검사 또는 사법경찰관리가 현행범인을","힌트_초성":"ㄱㅅ ㄸㄴ ㅅㅂㄱㅊㄱㄹㄱ ㅎㅎㅂㅇㅇ ㅊㅍㅎㄴ ㄱㅇㅇㄴ ㅂㄷㅅ ㅍㅇㅅㅅㅇ ㅇㅈ, ㅊㅍㅇ ㅇㅇㅇ ㅂㅎㅇㅇ ㅅㅇㅎ ㅅ ㅇㅇㅇ ㅁㅎㄱ ㅂㅁㅎ ㄱㅎㄹ ㅈㅇㅇ ㅎ(ㅎㅅㅂ ㅈ213ㅈㅇ2, ㅈ200ㅈㅇ5). ㅇㅇ ㄱㅇ ㄱㅈㄴ ㅊㅍㄹ ㅇㅎ ㅅㄹㅎㅅㅇ ㄷㅇㄱㄱ ㅈㅇ ㅁㄹ ㅎㄴ ㄱㅇ ㅇㅊㅇ. ㄱㄹㄴ ㄷㅇㄴㄴ ㅍㅇㅈㄹ ㅉㅇㄱ ㅂㄷㄱㄴ ㅍㄹㅇㄹ ㄷㅎㅎㄴ ㅍㅇㅈㄹ ㅅㄹㅇㄹ ㅈㅇㅎㄴ ㄱㅇㅇㄴ ㅂㄷㄱㄴ ㅈㅇㅎㄴ ㄱㅈㅇㅅ ㄱㅈㅎㄱㄴ, ㄱㄱㅇ ㅇㅇㅊ ㅇㅇ ㄱㅇㅇㄴ ㅇㄷ ㅂㄷㄱㄴ ㅈㅇㅎ ㅎㅇ ㅈㅊㅇㅇ ㄱㅈㅎㅇㅇ ㅎ","핵심키워드":["사법경찰관리","피의사실","대항","현행범인","고지","요지","들어가기","실력행사","체포","선임","과정"],"유사법리":"C115-1(2017도10866,0.77)","빈칸":{"1":[[6,12],[14,18],[20,22],[34,38],[40,42],[44,46],[57,59],[114,116],[118,120],[125,129],[131,135],[181,183],[216,218],[221,223],[264,266]],"2":[[0,2],[6,12],[14,18],[20,22],[34,38],[40,42],[44,46],[52,55],[57,59],[71,73],[89,96],[98,105],[114,116],[118,120],[125,129],[131,135],[162,165],[176,178],[181,183],[186,189],[191,193],[216,218],[221,223],[264,266]],"3":[[0,22],[34,59],[71,73],[89,105],[108,151],[162,165],[176,193],[216,223],[228,271]]},"발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 6) 위법한 강제처분이 미치는 영향","사실관계":"1) OO자동차 주식회사 XX공장 점거 농성 중이던 노동조합 조합원들이 경찰과 부식 반입 문제를 협의하거나 기자회견장 촬영을 위해 공장 밖으로 나오자, 전투경찰대원들은 고착관리 명목으로 A 등 6명의 조합원을 방패로 에워싸 이동하지 못하게 하였음\n2) 전투경찰대원들이 그 과정에서 조합원들을 체포하였고 피고인이 전투경찰대원들의 방패를 손으로 잡아당기거나 발로 차고 몸으로 밀며(전투경찰대원들에게 상해를 입힘) 항의하자 30~40분이 지난 후 체포의 이유 등을 고지함(공무집행방해 및 상해로 기소)","링판번호":118},{"카드ID":"C117-1","판례ID":"C117","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"6) 위법한 강제처분이 미치는 영향","쟁점":"현행범인 체포의 요건 충족 여부","사건번호":"2017도21537","태그":["L"],"중요도":0,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"현행범인으로 체포하기 위하여는 행위의 가벌성, 범죄의 현행성, 시간적 접착성, 범인, 범죄의 명백성 외에 체포의 필요성, 즉 도망 또는 증거인멸의 염려가 있어야 하고, 이러한 요건을 갖추지 못한 현행범인 체포는 법적 근거에 의하지 아니한 영장 없는 체포로서 위법한 체포에 해당함. 여기서 현행범인 체포의 요건을 갖추었는지 여부는 체포 당시의 상황을 기초로 판단하  경찰관의 가슴을 밀치자 공집방 현행범 체포, 신분증 제시 요구하였으나 거절 / (2) 직무를 집행하는 중에 폭행하였는지 여부 / O 예정된 순찰근무의 일환이었던 바 피고인과 시비가 붙었다는 사정만으로 직무수행이 종료되었다고 할 수 없음 / O 행위 당시 정황과 태양을 고려하면 폭행의 정도가 경미하다고 할 수 없음 / O 이 부분 주장 받아들이지 아니함 / (3) 현행범 체포가 위법한지 여부 / O 신고한 것은 피고인이 아닌 제3자이고, 피고인이 현행범으로 체포된 뒤에도 신분증 제시 요구에 응하지 아니한 점 등 고려하면 도망 또는 증거인멸의 염려가 없었다고 할 수 없어 체포의 필요성 인정되므로 현행범 체포 적법 / O 이 부분 주장 받아들이지 아니함 / 다) 증거의 요지 / 라) 소결론","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 6) 위법한 강제처분이 미치는 영향","사실관계":"1) A는 피고인과 아파트 지하주차장에서 주차문제와 접촉사고 등으로 시비가 붙었고 다툼이 커지자 112에 전화로 신고함\n2) 같은 날 12:00 무렵까지 예정된 오전 순찰근무 중 위 신고를 전달받고 출동한 경찰관 B, C가 피고인을 제지하는 한편 피고인으로부터 접촉사고의 경위에 관한 진술을 들음\n3) 피고인이 그 사고경위를 말하는 과정에서 B에게 반말을 하였고, 이로 인하여 시비가 붙자, B에게 욕을 하면서 손으로 가슴을 세게 밀침\n4) 그러자 B, C는 피고인이 경찰관의 공무를 방해하였다고 판단하여 피고인을 공무집행방해죄의 현행범으로 체포함. 체포 과정에서 피고인은 경찰관 B의 정강이 부분을 양발로 걷어차는 등 폭행함\n5) 현행범으로 체포되어 파출소에 도착한 피고인은 경찰관 C 등으로부터 신분증 제시를 요구받았으나 인적 사항을 밝힐 수 없다고 거절하다가 약 20분 경과해서야 자신의 인적사항을 알려줌 (공무집행방해죄로 기소)","링판번호":119},{"카드ID":"C117-2","판례ID":"C117","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"6) 위법한 강제처분이 미치는 영향","쟁점":"현행범인 체포의 요건 충족 여부","사건번호":"2017도21537","태그":["L"],"중요도":0,"단락순번":2,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"현행범인 체포행위가 적법한 공무집행을 벗어나 불법하게 체포한 것으로 볼 수밖에 없다면, 현행범이 그 체포를 면하려고 반항하는 과정에서 경찰관을 폭행하거나 경찰관에게 상해를 가한 것은 불법체포로 인한 신체에 대한 현재의 부당한 침해에서 벗어나기 위한 행위로서 정당방위에 해당하여 위법성이 조각됨","힌트_첫어절":"현행범인 체포행위가 적법한 공무집행을","힌트_초성":"ㅎㅎㅂㅇ ㅊㅍㅎㅇㄱ ㅈㅂㅎ ㄱㅁㅈㅎㅇ ㅂㅇㄴ ㅂㅂㅎㄱ ㅊㅍㅎ ㄱㅇㄹ ㅂ ㅅㅂㅇ ㅇㄷㅁ, ㅎㅎㅂㅇ ㄱ ㅊㅍㄹ ㅁㅎㄹㄱ ㅂㅎㅎㄴ ㄱㅈㅇㅅ ㄱㅊㄱㅇ ㅍㅎㅎㄱㄴ ㄱㅊㄱㅇㄱ ㅅㅎㄹ ㄱㅎ ㄱㅇ ㅂㅂㅊㅍㄹ ㅇㅎ ㅅㅊㅇ ㄷㅎ ㅎㅈㅇ ㅂㄷㅎ ㅊㅎㅇㅅ ㅂㅇㄴㄱ ㅇㅎ ㅎㅇㄹㅅ ㅈㄷㅂㅇㅇ ㅎㄷㅎㅇ ㅇㅂㅅㅇ ㅈㄱㄷ","핵심키워드":["공무집행","현행범","체포행위","불법체포","현행범인","정당방위","상해","불법","침해","현재","위법성","폭행","체포","적법","신체","행위","과정","반항"],"유사법리":"C115-2(2017도10866,0.56)","빈칸":{"1":[[0,4],[5,9],[11,13],[15,19],[25,27],[30,32],[49,52],[56,58],[65,67],[70,72],[80,82],[92,94],[102,106],[111,113],[118,120],[126,128],[139,141],[144,148],[155,158]],"2":[[0,4],[5,9],[11,13],[15,19],[25,27],[30,32],[49,52],[56,58],[65,67],[70,72],[75,78],[80,82],[86,89],[92,94],[102,106 /사법정의/인과희석/검사입증) / O 긴급체포는 중범죄혐의의 상당성, 체포의 필요성, 긴급성이 인정되어야 하고, 체포현장에서 영장없는 압수수색은 그 체포가 적법함을 전제로 함. 이를 위반하여 수집한 압수물은 증거능력 없고, 위법한 유치상태에서 작성한 조서 등도 증거능력 없음 / O 피고인, 변호인이 증거동의하거나 사후에 영장이 발부되어도 달리 볼 것 아님 / (2) 인정사실 / 경찰은 피고인을 직접 미행, 주거지에 따라감, 위조된 신용카드에 의한 거래로 의심된다는 거래내역을 전화로 통보받았으나 범인이 피고인이라고 지목된 바 없음, 통역인 없이 동료 경찰관과 피고인 긴급체포하여 노트북 및 신용카드 25매 압수, 다음날 주거지 다시 찾아가 옷가지 압수, 압수한 신용카드 진위여부 조사결과 12장 위조된 신용카드임 / (3) 압수된 노트북, 신용카드25매, 흰색 모자, 트레이닝 상의 / O 피고인 죄를 범하였다고 의심할만한 상당한 이유 있다고 볼 수 없고 이미 수개월 전부터 피고인을 추적하고 있었으므로 미리 판사로부터 체포영장을 받을 시간적 여유가 충분하였다 할 것이므로 긴급체포 위법함 / O 위 각 증거 역시 위법한 체포상태에 수반하여 이루어졌으므로 적법한 절차에 따르지 아니하고 수집된 것으로 유죄인정의 증거로 삼을 수 없음. 피고인, 변호인이 증거동의하거나 사후영장 발부받더라도 마찬가지임 / (4) 피고인에 대한 검피신, 압수조서, 수사보고(카드내역서 위조카드 수사) / O 위 증거들은 위법하게 압수된 물품들을 기초로 수집되었거나 제시되면서 작성된 2차 증거로서 그 절차위반행위가 적법절차의 실질적 요소를 침해할 정도로 중대한 경우에 해당한다는 점을 고려하면 그 수집절차와 1차증거의 수집절차 사이에 인과관계가 희석 내지 단절되었다고 할 수 없으므로 위 각 증거는 피고인에 대하여 증거능력 없고 피고인 및 변호인이 증거동의 하였다고 하여 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / O 형소법 제310조에 의하면 자백이 피고인에게 불리한 유일의 증거인 때에는 유죄인정의 증거로 하지 못함. 법정자백 증거능력 있으나 자백을 보강할 증거 없으므로 피고인의 자백이 피고인에게 불리한 유일의 증거에 해당하여 유죄의 증거로 할 수 없음 / 마) 소결론 - 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"외국인인 피고인을 긴급체포하고 피고인의 주거지에서 압수, 수색하였으나 임의제출로 압수하였다는 취지로 미리 작성해간 압수조서 구체적 설명없이 피고인의 무인등을 받았음","링판번호":123},{"카드ID":"C121-2","판례ID":"C121","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"제217조 제2, 제3항에 위반한 압수물의 증거능력 인정여부","사건번호":"2009도11401","태그":["L"],"중요도":0,"단락순번":2,"총단락수":3,"법리원문":"다만, 위법하게 수집한 압수물의 증거능력 인정 여부를 최종적으로 판단함에 있어서는, 수사기관의 증거 수집 과정에서 이루어진 절차 위반행위와 관련된 모든 사정을 전체적, 종합적으로 살펴볼 때, 수사기관의 절차 위반행위가 적법절차의 실질적인 내용을 침해하는 경우에 해당하지 아니하고, 오히려 그 증거의 증거능력을 배제하는 것이 헌법과 형소법이 형사소송에 관한 절차조항을 마련하여 적법절차의 원칙과 실체적 진실규명의 조화를 도모하고 이를 통하여 형사 사법 정의를 실현하려고 한 취지에 반하는 결과를 초래하는 것으로 평가되는 예외적인 경우라면, 법원은 그 증거를 유죄 인정의 증거로 사용할 수 있다고 보아야 함. 이는 적법한 절차에 따르지 아니하고 수집한 증거를 기초로 하여 획득한 2차적 증거의 경우에도 마찬가지여서, 절차에 따르지 아니한 증거 수집과 2차적 증거 수집 사이 인과관계의 희석 또는 단절 , 사후영장 발부받지 않았으므로 이에 기초하여 수집된 증거들은 증거능력 없다고 주장 / O 직권으로 자백에 대한 보강증거 유무 검토 / 2) 검토 / 가) 검제증 / 나) 증없증 / (1) 관련법리 / O 위수증(원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 긴급체포는 중범죄혐의의 상당성, 체포의 필요성, 긴급성이 인정되어야 하고, 체포현장에서 영장없는 압수수색은 그 체포가 적법함을 전제로 함. 이를 위반하여 수집한 압수물은 증거능력 없고, 위법한 유치상태에서 작성한 조서 등도 증거능력 없음 / O 피고인, 변호인이 증거동의하거나 사후에 영장이 발부되어도 달리 볼 것 아님 / (2) 인정사실 / 경찰은 피고인을 직접 미행, 주거지에 따라감, 위조된 신용카드에 의한 거래로 의심된다는 거래내역을 전화로 통보받았으나 범인이 피고인이라고 지목된 바 없음, 통역인 없이 동료 경찰관과 피고인 긴급체포하여 노트북 및 신용카드 25매 압수, 다음날 주거지 다시 찾아가 옷가지 압수, 압수한 신용카드 진위여부 조사결과 12장 위조된 신용카드임 / (3) 압수된 노트북, 신용카드25매, 흰색 모자, 트레이닝 상의 / O 피고인 죄를 범하였다고 의심할만한 상당한 이유 있다고 볼 수 없고 이미 수개월 전부터 피고인을 추적하고 있었으므로 미리 판사로부터 체포영장을 받을 시간적 여유가 충분하였다 할 것이므로 긴급체포 위법함 / O 위 각 증거 역시 위법한 체포상태에 수반하여 이루어졌으므로 적법한 절차에 따르지 아니하고 수집된 것으로 유죄인정의 증거로 삼을 수 없음. 피고인, 변호인이 증거동의하거나 사후영장 발부받더라도 마찬가지임 / (4) 피고인에 대한 검피신, 압수조서, 수사보고(카드내역서 위조카드 수사) / O 위 증거들은 위법하게 압수된 물품들을 기초로 수집되었거나 제시되면서 작성된 2차 증거로서 그 절차위반행위가 적법절차의 실질적 요소를 침해할 정도로 중대한 경우에 해당한다는 점을 고려하면 그 수집절차와 1차증거의 수집절차 사이에 인과관계가 희석 내지 단절되었다고 할 수 없으므로 위 각 증거는 피고인에 대하여 증거능력 없고 피고인 및 변호인이 증거동의 하였다고 하여 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / O 형소법 제310조에 의하면 자백이 피고인에게 불리한 유일의 증거인 때에는 유죄인정의 증거로 하지 못함. 법정자백 증거능력 있으나 자백을 보강할 증거 없으므로 피고인의 자백이 피고인에게 불리한 유일의 증거에 해당하여 유죄의 증거로 할 수 없음 / 마) 소결론 - 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"외국인인 피고인을 긴급체포하고 피고인의 주거지에서 압수, 수색하였으나 임의제출로 압수하였다는 취지로 미리 작성해간 압수조서 구체적 설명없이 피고인의 무인등을 받았음","링판번호":123},{"카드ID":"C121-3","판례ID":"C121","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"제217조 제2, 제3항에 위반한 압수물의 증거능력 인정여부","사건번호":"2009도11401","태그":["L"],"중요도":0,"단락순번":3,"총단락수":3,"법리원문":"형소법 제216조 제1항 제2호, 제217조 제2항, 제3항은 사법경찰관은 형소법 제200조의3(긴급체포)의 규정에 의하여 피의자를 체포하는 경우에 필요한 때에는 영장 없이 체포현장에서 압수, 수색을 할 수 있고, 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수수색영장을 청구하여야 하며, 청구한 압수수색영장을 발부받지 못한 때에는 압수한 물건을 즉시 반환하여야 한다고 규정하고 있는바, 형소법 제217조 제2항, 제3항에 위반하여 압수수색영장을 청구하여 이를 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 이를 유죄 인정의 증거로 사용할 수 없 피고인 긴급체포하여 노트북 및 신용카드 25매 압수, 다음날 주거지 다시 찾아가 옷가지 압수, 압수한 신용카드 진위여부 조사결과 12장 위조된 신용카드임 / (3) 압수된 노트북, 신용카드25매, 흰색 모자, 트레이닝 상의 / O 피고인 죄를 범하였다고 의심할만한 상당한 이유 있다고 볼 수 없고 이미 수개월 전부터 피고인을 추적하고 있었으므로 미리 판사로부터 체포영장을 받을 시간적 여유가 충분하였다 할 것이므로 긴급체포 위법함 / O 위 각 증거 역시 위법한 체포상태에 수반하여 이루어졌으므로 적법한 절차에 따르지 아니하고 수집된 것으로 유죄인정의 증거로 삼을 수 없음. 피고인, 변호인이 증거동의하거나 사후영장 발부받더라도 마찬가지임 / (4) 피고인에 대한 검피신, 압수조서, 수사보고(카드내역서 위조카드 수사) / O 위 증거들은 위법하게 압수된 물품들을 기초로 수집되었거나 제시되면서 작성된 2차 증거로서 그 절차위반행위가 적법절차의 실질적 요소를 침해할 정도로 중대한 경우에 해당한다는 점을 고려하면 그 수집절차와 1차증거의 수집절차 사이에 인과관계가 희석 내지 단절되었다고 할 수 없으므로 위 각 증거는 피고인에 대하여 증거능력 없고 피고인 및 변호인이 증거동의 하였다고 하여 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / O 형소법 제310조에 의하면 자백이 피고인에게 불리한 유일의 증거인 때에는 유죄인정의 증거로 하지 못함. 법정자백 증거능력 있으나 자백을 보강할 증거 없으므로 피고인의 자백이 피고인에게 불리한 유일의 증거에 해당하여 유죄의 증거로 할 수 없음 / 마) 소결론 - 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"외국인인 피고인을 긴급체포하고 피고인의 주거지에서 압수, 수색하였으나 임의제출로 압수하였다는 취지로 미리 작성해간 압수조서 구체적 설명없이 피고인의 무인등을 받았음","링판번호":123},{"카드ID":"C122-1","판례ID":"C122","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"위법수집증거 (현행범 체포 및 압수 후 사후영장 발부받지 않은 사안)","사건번호":"2008도10914","태그":["L"],"중요도":0,"단락순번":1,"총단락수":3,"소제목":"대마 소지의 점","법리원문":"헌법과 형소법이 정한 절차에 따르지 아니하고 수집한 증거는 물론, 이를 기초로 하여 획득한 2차적 증거 역시 기본적 인권 보장을 위해 마련된 적법한 절차에 따르지 않은 것으로서 원칙적으로 유죄 인정의 증거로 삼을 수 없음","힌트_첫어절":"헌법과 형소법이 정한 절차에","힌트_초성":"ㅎㅂㄱ ㅎㅅㅂㅇ ㅈㅎ ㅈㅊㅇ ㄸㄹㅈ ㅇㄴㅎㄱ ㅅㅈㅎ ㅈㄱㄴ ㅁㄹ, ㅇㄹ ㄱㅊㄹ ㅎㅇ ㅎㄷㅎ 2ㅊㅈ ㅈㄱ ㅇㅅ ㄱㅂㅈ ㅇㄱ ㅂㅈㅇ ㅇㅎ ㅁㄹㄷ ㅈㅂㅎ ㅈㅊㅇ ㄸㄹㅈ ㅇㅇ ㄱㅇㄹㅅ ㅇㅊㅈㅇㄹ ㅇㅈ ㅇㅈㅇ ㅈㄱㄹ ㅅㅇ ㅅ ㅇㅇ","핵심키워드":["유죄","절차","인권","원칙","증거","적법","보장","수집"],"중복그룹":"G17","그룹대표":"N","유사법리":"C132-1(2011도1902,0.52) ; C120-1(2007도3061,0.49)","빈칸":{"1":[[12,14],[25,27],[29,31],[55,57],[65,67],[68,70],[79,81],[83,85],[99,101],[105,107],[112,114]],"2":[[0,2],[4,7],[12,14],[25,27],[29,31],[55,57],[65,67],[68,70],[79,81],[83,85],[99,101],[105,107],[112,114]],"3":[[0,14],[25,31],[55,70],[79,85],[99,114]]},"기재례":"[기재] / 가) 엑스터시 투약의 점에 대하여 / (1) 법리 / 형소법 제254조 제4항이 변호인 조력, 인과관계 희석 또는 단절 / 라) 보강증거 / 마) 소결론 - 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 사법경찰관은 2020. 10. 6. 12:34경 피고인이 운영하는 영업소에서 전화금융사기조직의 인출책인 G를 긴급체포하였는데, 그 과정에서 현장에 있던 피고인이 스마트폰 채팅 애플리케이션인 위챗 대화방의 성명불상자에게 경찰이 왔다고 알리면서 일부 대화방을 지우고 있는 것을 목격하고, 형사소송법 제216조 제3항을 근거로 피고인이 소지, 소유한 이 사건 휴대전화를 영장없이 긴급압수함. 그러나 사법경찰관이 당시 피고인에 대하여 수사를 개시하거나 범죄혐의를 인지한 상황은 아니었고, 피고인에게 압수조서를 작성하거나 압수목록을 교부하지 않음\n2) 검사는 2020. 10. 7. 이 사건 휴대전화에 관하여 사후압수영장을 청구하였으나, 2020. 10. 8. 법원에서 압수조서와 압수목록을 피고인에게 작성, 교부하지 아니하였다는 이유로 이 사건 사후압수영장 청구가 기각됨. 검사는 사법경찰관에게 압수조서와 압수목록을 첨부하여 사전 압수, 수색영장을 재신청하라고 지휘함\n3) 피고인은 2020. 10. 8. 사법경찰관의 소환요구에 따라 경찰청에 출석하여 피의자신문조사를 받았는데, 당시 사법경찰관은 피고인을 소환할 때는 조사가 끝나면 휴대전화를 반환하겠다고 말하고도 조사를 마친 이후 피고인에게 이 사건 휴대전화를 반환하여 주지 않음. 피고인은 위 조사를 받고 19:00경 귀가함\n4) 사법경찰관은 피고인이 경찰청을 떠난 후 이 사건 사후압수영장이 법원에서 기각된 사실을 인지하고 피고인이 귀가한 시간으로부터 약 2시간이 경과한 21:03경 피고인에게 연락하여, 경찰청에 다시 방문하여 이 사건 휴대전화를 반환받아 갈 것을 고지하면서, 피고인이 휴대전화를 반환받더라도 다시 이를 압수할 것이라고 말함. 당시 피고인은 합리적인 근거를 들어 이 사건 휴대전화를 우편반환을 요청함. 그러나 사법경찰관은 휴대전화를 우편으로 보낼 경우 위험성이 있다는 점을 들어 거절하였고, 이에 피고인은 2020. 10. 12. 경찰청에 방문하여 이 사건 휴대전화를 반환받겠다고 말하였으나, 위 일시에 위 경찰청에 방문하지 않았음\n5) 사법경찰관은 2020. 10. 12. 검찰에 이 사건 휴대전화에 저장된 전자정보에 관하여 이 사건 사전압수영장을 신청하였고 그에 따라 2020. 10. 13. 법원에서 이 사건 사전압수영장이 발부되었음. 사법경찰관은 피고인에게 다시 연락하여 이 사건 휴대전화를 반환받아 갈 것을 고지하면서도 다시 압수하여야 해서 결국 피고인이 이 사건 휴대전화를 가져갈 수는 없다는 취지로 말함. 피고인은 2020. 10. 15. 경찰청에 방문하기로 하였으나, 반환받을 수 없다고 생각하고 위 일시에도 경찰청에 방문하지 않았음\n6) 사법경찰관은 이 사건 사전압수영장의 유효기간이 만료되기 전날인 2020. 10. 19. 14:55경 피고인의 영업소로 찾아가 피고인에게 이 사건 휴대전화를 반환하고 정보저장매체인수증에 피고인의 서명날인을 받은 후 곧바로 이 사건 사전압수영장을 집행하여 다시 이 사건 휴대전화를 봉인하고 현장에서 이를 반출함. 피고인은 사법경찰관이 이 사건 휴대전화를 다시 가져간 것에 항의하면서 압수조서 및 정보저장매체 원본 반출 확인서 등에 서명날인을 거부하였음\n7) 사법경찰관은 2021. 1. 11. 피고인의 참여 하에 디지털포렌식을 통해 획득한 복제본을 토대로 혐의사실과 관련된 전자정보를 특정하여 해시값을 확인한 후, 피고인에게 상세목록을 교부하고 위 전자정보를 압수함. 사법경찰관은 이 사건 휴대전화를 피고인에게 반환하였고, 피고인은 이 사건 휴대전화를 반환받았음을 확인한다는 취지로 반출 원본 저장매체 등 인수증에 서명날인함\n9) 검사는 이 사건 휴대전화에 대한 디지털포렌식을 통해 획득한 위챗 대화내역에서 확인된 송금증, 송금내역사진, 송금계좌, 성명불상자와 대화내용 등을 기초로 범죄사실을 특정하였고 피고인을 성명불상자가 지정한 중국 소재 은행 계좌로 금전을 송금하여 무등록 외국환업무를 하였다는 외국환거래법 위반 등으로 기소함\n10) 원심은 수사기관이 적법절차를 지키지 않고 휴대전화를 압수하고 이에 대한 사후 압수영장이 기각되었음에도 즉시 반환하지 아니하다가 그 사이에 압수영장을 발부받아 휴대전화를 형식적으로 반환한 외관을 만든 후 다시 압수하는 것은 적법절차의 원칙이나 영장주의를 잠탈하는 것으로 허용할 수 없으므로 휴대전화 압수의 위법성이 압수영장 집행으로 희석, 단절되었다고 할 수 없다고 보아, 휴대전화 및 위 증거들은 위법하게 수집된 증거이거나 이를 기초로 획득한 2차 증거로서 증거능력이 부정된다고 판단함","링판번호":125},{"카드ID":"C123-2","판례ID":"C123","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"사후압수영장 기각시 압수물 반환하지 않은 상태에서 다시 압수영장 발부받은 경우","사건번호":"2024도10062","태그":["NL"],"중요도":2,"단락순번":2,"총단락수":2,"법리원문":"여기서 압수한 물건을 즉시 반환한다는 것은 수사기관이 압수한 물건을 곧바로 반환하는 것이 현저히 곤란하다는 등의 특별한 사정이 없는 한 영장을 청구하였다가 기각되는 바로 그 때에 압수물을 돌려주기 위한 절차에 착수하여 그 절차를 지연하거나 불필요하게 수사기관의 점유를 계속하는 등으로 지체함 없이 적극적으로 압수 이전의 상태로 회복시켜주는 것을 의미함","힌트_첫어절":"여기서 압수한 물건을 즉시","힌트_초성":"ㅇㄱㅅ ㅇㅅㅎ ㅁㄱㅇ ㅈㅅ ㅂㅎㅎㄷㄴ ㄱㅇ ㅅㅅㄱㄱㅇ ㅇㅅㅎ ㅁㄱㅇ ㄱㅂㄹ ㅂㅎㅎㄴ ㄱㅇ ㅎㅈㅎ ㄱㄹㅎㄷㄴ ㄷㅇ ㅌㅂㅎ ㅅㅈㅇ ㅇㄴ ㅎ ㅇㅈㅇ ㅊㄱㅎㅇㄷㄱ ㄱㄱㄷㄴ ㅂㄹ ㄱ ㄸㅇ ㅇㅅㅁㅇ ㄷㄹㅈㄱ ㅇㅎ ㅈㅊㅇ ㅊㅅㅎㅇ ㄱ ㅈㅊㄹ ㅈㅇㅎㄱㄴ ㅂㅍㅇㅎㄱ ㅅㅅㄱㄱㅇ ㅈㅇㄹ ㄱㅅㅎㄴ ㄷㅇㄹ ㅈㅊㅎ ㅇㅇ ㅈㄱㅈㅇㄹ ㅇㅅ ㅇㅈㅇ ㅅㅌㄹ ㅎㅂㅅㅋㅈㄴ ㄱㅇ ㅇㅁㅎ","핵심키워드":["점유","영장","압수물","절차","기각","압수","반환","물건","상태","착수","계속"],"빈칸":{"1":[[4,6],[8,10],[15,17],[30,32],[34,36],[42,44],[76,78],[87,89],[100,103],[113,115],[117,119],[124,126],[146,148],[150,152],[172,174],[179,181]],"2":[[4,6],[8,10],[15,17],[24,28],[30,32],[34,36],[42,44],[76,78],[87,89],[100,103],[113,115],[117,119],[124,126],[128,130],[140,144],[146,148],[150,152],[159,161],[172,174],[179,181]],"3":[[4,44],[76,78],[87,89],[100,103],[113,130],[140,161],[172,181]]},"기재례":"[기재] / 1. 주장 및 쟁점 / O 변호인 휴대폰 및 2차증거 증거능력 없다고 주장함 / O 직권으로, 자백에 대한 보강증거 여부 검토함 / 2. 검토 / 가) 검제증 / 나) 증없증 / (1) 법리 / O 위수증(원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 위 첫 번째 법리 / O 위 두 번째 법리 / (2) 인정사실 / - 사경 피고인의 휴대폰을 영장없이 긴급압수 / - 압수수색영장 청구 기각 / - 휴대폰 반환하여 주지 않고 피고인 귀가함 / - 기각된 사실 알고 피고인에게 알렸으며 다시 압수할 것이라고 말함 / - 사전압수영장 발부받고 다시 연락하여 가져가도 다시 못가져간다고 말했고, 피고인 찾아가 휴대전화 반환 후 압수영장 집행 / (3) 압수한 휴대전화 / O 위 인정사실을 종합하면, 형소법 제216조 제3항에 의하여 영장없이 피고인의 휴대폰을 압수하였다 하더라도 사후압수영장이 기각되어 피고인에게 압수물을 즉시 반환하여야 하였던 점, 그럼에도 압수물을 즉시 반환하지 아니하다가 압수영장을 발부받아 휴대전화를 형식적으로 반환한 외관을 만든 후 다시 압수하는 것은 적법절차의 원칙이나 영장주의를 잠탈하는 것으로 허용할 수 없으므로 위 휴대전화는 위법하게 수집된 증거로서 증거능력 없음 / (4) 디지털포렌식 통해 획득한 증거들 / O 위 증거들은 위법하게 수집된 증거들을 기초로 수집되거나 그 증거들이 제시되면서 작성된 2차적 증거로서, 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 당초 증거 수집절차와 2차적 증거 수집절차 사이에 인과관계가 단절 내지 희석되었다고 볼 수 없으므로 피고인 및 변호인이 위 증거들에 대하여 증거동의 하였다고 하더라도 증거능력 없음 / 다) 피고인의 법정진술 / O 진술거부권 적법 고지, 공개된 법정에서 변호인 조력, 인과관계 희석 또는 단절 / 라) 보강증거 / 마) 소결론 - 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 사법경찰관은 2020. 10. 6. 12:34경 피고인이 운영하는 영업소에서 전화금융사기조직의 인출책인 G를 긴급체포하였는데, 그 과정에서 현장에 있던 피고인이 스마트폰 채팅 애플리케이션인 위챗 대화방의 성명불상자에게 경찰이 왔다고 알리면서 일부 대화방을 지우고 있는 것을 목격하고, 형사소송법 제216조 제3항을 근거로 피고인이 소지, 소유한 이 사건 휴대전화를 영장없이 긴급압수함. 그러나 사법경찰관이 당시 피고인에 대하여 수사를 개시하거나 범죄혐의를 인지한 상황은 아니었고, 피고인에게 압수조서를 작성하거나 압수목록을 교부하지 않음\n2) 검사는 2020. 10. 7. 이 사건 휴대전화에 관하여 사후압수영장을 청구하였으나, 2020. 10. 8. 법원에서 압수조서와 압수목록을 피고인에게 작성, 교부하지 아니하였다는 이유로 이 사건 사후압수영장 청구가 기각됨. 검사는 사법경찰관에게 압수조서와 압수목록을 첨부하여 사전 압수, 수색영장을 재신청하라고 지휘함\n3) 피고인은 2020. 10. 8. 사법경찰관의 소환요구에 따라 경찰청에 출석하여 피의자신문조사를 받았는데, 당시 사법경찰관은 피고인을 소환할 때는 조사가 끝나면 휴대전화를 반환하겠다고 말하고도 조사를 마친 이후 피고인에게 이 사건 휴대전화를 반환하여 주지 않음. 피고인은 위 조사를 받고 19:00경 귀가함\n4) 사법경찰관은 피고인이 경찰청을 떠난 후 이 사건 사후압수영장이 법원에서 기각된 사실을 인지하고 피고인이 귀가한 시간으로부터 약 2시간이 경과한 21:03경 피고인에게 연락하여, 경찰청에 다시 방문하여 이 사건 휴대전화를 반환받아 갈 것을 고지하면서, 피고인이 휴대전화를 반환받더라도 다시 이를 압수할 것이라고 말함. 당시 피고인은 합리적인 근거를 들어 이 사건 휴대전화를 우편반환을 요청함. 그러나 사법경찰관은 휴대전화를 우편으로 보낼 경우 위험성이 있다는 점을 들어 거절하였고, 이에 피고인은 2020. 10. 12. 경찰청에 방문하여 이 사건 휴대전화를 반환받겠다고 말하였으나, 위 일시에 위 경찰청에 방문하지 않았음\n5) 사법경찰관은 2020. 10. 12. 검찰에 이 사건 휴대전화에 저장된 전자정보에 관하여 이 사건 사전압수영장을 신청하였고 그에 따라 2020. 10. 13. 법원에서 이 사건 사전압수영장이 발부되었음. 사법경찰관은 피고인에게 다시 연락하여 이 사건 휴대전화를 반환받아 갈 것을 고지하면서도 다시 압수하여야 해서 결국 피고인이 이 사건 휴대전화를 가져갈 수는 없다는 취지로 말함. 피고인은 2020. 10. 15. 경찰청에 방문하기로 하였으나, 반환받을 수 없다고 생각하고 위 일시에도 경찰청에 방문하지 않았음\n6) 사법경찰관은 이 사건 사전압수영장의 유효기간이 만료되기 전날인 2020. 10. 19. 14:55경 피고인의 영업소로 찾아가 피고인에게 이 사건 휴대전화를 반환하고 정보저장매체인수증에 피고인의 서명날인을 받은 후 곧바로 이 사건 사전압수영장을 집행하여 다시 이 사건 휴대전화를 봉인하고 현장에서 이를 반출함. 피고인은 사법경찰관이 이 사건 휴대전화를 다시 가져간 것에 항의하면서 압수조서 및 정보저장매체 원본 반출 확인서 등에 서명날인을 거부하였음\n7) 사법경찰관은 2021. 1. 11. 피고인의 참여 하에 디지털포렌식을 통해 획득한 복제본을 토대로 혐의사실과 관련된 전자정보를 특정하여 해시값을 확인한 후, 피고인에게 상세목록을 교부하고 위 전자정보를 압수함. 사법경찰관은 이 사건 휴대전화를 피고인에게 반환하였고, 피고인은 이 사건 휴대전화를 반환받았음을 확인한다는 취지로 반출 원본 저장매체 등 인수증에 서명날인함\n9) 검사는 이 사건 휴대전화에 대한 디지털포렌식을 통해 획득한 위챗 대화내역에서 확인된 송금증, 송금내역사진, 송금계좌, 성명불상자와 대화내용 등을 기초로 범죄사실을 특정하였고 피고인을 성명불상자가 지정한 중국 소재 은행 계좌로 금전을 송금하여 무등록 외국환업무를 하였다는 외국환거래법 위반 등으로 기소함\n10) 원심은 수사기관이 적법절차를 지키지 않고 휴대전화를 압수하고 이에 대한 사후 압수영장이 기각되었음에도 즉시 반환하지 아니하다가 그 사이에 압수영장을 발부받아 휴대전화를 형식적으로 반환한 외관을 만든 후 다시 압수하는 것은 적법절차의 원칙이나 영장주의를 잠탈하는 것으로 허용할 수 없으므로 휴대전화 압수의 위법성이 압수영장 집행으로 희석, 단절되었다고 할 수 없다고 보아, 휴대전화 및 위 증거들은 위법하게 수집된 증거이거나 이를 기초로 획득한 2차 증거로서 증거능력이 부정된다고 판단함","링판번호":125},{"카드ID":"C124-1","판례ID":"C124","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"피고인 주거지에서 피해자로부터 물건을 임의제출 받은 경우","사건번호":"2009도10092","태그":["L"],"중요도":0,"단락순번":1,"총단락수":1,"법리원문":"형소법 제218조는 사법경찰관은 소유자, 소지자 또는 보관자가 임의로 제출한 물건을 영장없이 압수할 수 있다고 규정하고 있는바, 위 규정을 위반하여 소유자, 소지자 또는 보관자가 아닌 자로부터 제출받은 물건을 영장없이 압수한 경우 그 압수물 및 압수물을 찍은 사진은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 헌법과 형소법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아님","힌트_첫어절":"형소법 제218조는 사법경찰관은 소유자,","힌트_초성":"ㅎㅅㅂ ㅈ218ㅈㄴ ㅅㅂㄱㅊㄱㅇ ㅅㅇㅈ, ㅅㅈㅈ ㄸㄴ ㅂㄱㅈㄱ ㅇㅇㄹ ㅈㅊㅎ ㅁㄱㅇ ㅇㅈㅇㅇ ㅇㅅㅎ ㅅ ㅇㄷㄱ ㄱㅈㅎㄱ ㅇㄴㅂ, ㅇ ㄱㅈㅇ ㅇㅂㅎㅇ ㅅㅇㅈ, ㅅㅈㅈ ㄸㄴ ㅂㄱㅈㄱ ㅇㄴ ㅈㄹㅂㅌ ㅈㅊㅂㅇ ㅁㄱㅇ ㅇㅈㅇㅇ ㅇㅅㅎ ㄱㅇ ㄱ ㅇㅅㅁ ㅁ ㅇㅅㅁㅇ ㅉㅇ ㅅㅈㅇ ㅇㄹ ㅇㅈ ㅇㅈㅇ ㅈㄱㄹ ㅅㅇㅎ ㅅ ㅇㄴ ㄱㅇㄱ, ㅎㅂㄱ ㅎㅅㅂㅇ ㅅㅇㅎ ㅇㅈㅈㅇㅇ ㅈㅇㅅㅇ ㅂㅊㅇ ㅂ ㄸ ㅍㄱㅇㅇㄴ ㅂㅎㅇㅇ ㅇㄹ ㅈㄱㄹ ㅎㅇ ㄷㅇㅎㅇㄷㄱ ㅎㄷㄹㄷ ㄷㄹ ㅂ ㄱㅇ ㅇㄴ","핵심키워드":["영장주의","소지자","보관자","유죄","압수물","사진","소유자","증거","중요성","압수","물건","위반","제출","사용","규정"],"빈칸":{"1":[[18,21],[23,26],[30,33],[39,41],[43,45],[52,54],[62,64],[74,76],[78,80],[83,86],[88,91],[95,98],[113,115],[122,124],[131,134],[137,140],[145,147],[152,154],[159,161],[163,165],[190,194],[196,199],[223,225]],"2":[[0,3],[4,9],[11,16],[18,21],[23,26],[30,33],[39,41],[43,45],[52,54],[62,64],[74,76],[78,80],[83,86],[88,91],[95,98],[113,115],[122,124],[131,134],[137,140],[145,147],[152,154],[159,161],[163,165],[177,179],[181,184],[190,194],[196,199],[209,212],[215,218],[223,225],[250,252]],"3":[[0,64],[74,98],[113,165],[177,199],[209,225],[250,252]]},"기재례":"[기재] - 18년 기말 / 1) 주장 및 쟁점 / O 사실관계 인정 / O 직권으로, 쇠 파이프 임의제출이 위법하여 증거능력 없는지 검토 / 2) 검토 / 가) 검사가 제출한 증거들 / 나) 증거능력 없는 증거 / (1) 법리 / O 위수증(원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 형소법 제218조의 소유, 소지 또는 보관자가 아닌자가 임의로 제출하는 물건을 영장 없이 압수한 경우 그 압수물은 위수증에 해당하여 증거능력 없음 / O 피고인, 변호인이 증거동의 하거나 사후영장 발부되어도 달리 볼 것 아님 / O 범인식별절차에서 용의자 한 사람을 단독으로 목격자와 대질시키거나 용의자의 사진 한 장만을 목격자에게 제시하여 수집한 목격자의 진술은, 그 용의자가 피해자와 안면이 있는 사람이라든지, 범행 직후여서 기억이 생생하다는 등의 부가적인 사정이 없는 한 그 신빙성 낮음 / (2) 인정사실 / A는 자신이 관리하는 주차장에 주차된 B의 차량을 범인이 쇠파이프로 손괴하는 장면 목격하고 차주에 알림, 경찰신고하고 주변 수색중 피고인의 집에서 쇠파이프 발견 후 차주에게서 임의제출받아 압수 / (3) B의 법정진술 중 A로부터 피고인이 B의 승용차를 손괴하는 것을 보았다는 말을 전해들었다는 부분 / O 피고인 아닌자가 피고인 아닌 타인의 진술을 내용으로 하여 진술한 전문진술에 해당함. 원진술자가 이 법정에 증인으로 출석하여 증언한 이상 형소법 제316조 제2항에서 정한 사유로 인하여 진술불능인 때에 해당하지 않으므로 증거능력 없음 / (4) 압수된 쇠파이프 / 위 인정사실 종합하면 피해자는 쇠파이프의 소유자, 소지자, 보관자가 아닌자인 점이 분명하므로, 앞서 본 법리에 비추어, 쇠파이프는 위법한 임의제출물로서 영장주의에 반하는 위수증에 해당하여 증거능력 없음. 증거동의 하였다고 하더라도 달리 볼 것 아님 / (5) 압수조서 / O 위법하게 수집된 쇠파이프를 기초로 수집되었거나 제시하면서 작성된 2차 증거로서 적법절차의 실질적 요소를 침해할 정도로 중대한 경우에 해당한다는 점을 고려하면 인과관계가 희석 내지 단절되었다고 할 수 없으므로 위 증거는 피고인에 대하여 증거능력 없고 피고인 및 그 변호인이 증거동의 하였고 사후영장 발부되었다 하여도 달리 볼 것 아님 / 다) 신빙성 없는 증거 / O A의 법정진술을 다음 사정에 비추어 믿기 어려움 / - A는 시력이 안좋은데 야간에 목격한 곳에서 50m가량 떨어져 있었음 / - B와의 통화내역 시간도 범행시간과 일치하지 않음 / - A의 진술은 B의 진술과 일치X, 일관X, 구체적X / - 경찰에서 사진 1장만 보고 용의자로 지목한 진술은 범인식별절차의 신빙성이 담보되지 않은 상황에서 이루어진 것으로 신빙성 매우 낮음 / 라) 부족증거 / 마) 소결론 / 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"피고인 소유의 쇠파이프를 피고인 주거지 앞마당에서 발견하고 피해자로부터 임의로 제출받고 압수, 사진찍고 피고인이 사진에 대하여 증거동의","링판번호":126},{"카드ID":"C125-1","판례ID":"C125","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"위법수집증거 (위법한 압수에 대한 임의제출 부정 사안)","사건번호":"2009도14376","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"법리원문":"형소법 제215조 제2항은 사법경찰관이 범죄수사에 필요한 때에는 검사에게 신청하여 검사의 청구로 지방법원 판사가 발부한 영장에 의하여 압수, 수색 또는 검증을 할 수 있다.고 규정하고 있는바, 사법경찰관이 위 규정을 위반하여 영장없이 물건을 압수한 경우 그 압수물은 물론 이를 기초로 하여 획득한 2차적 증거 역시 유죄 인정의 33],[235,237],[239,243],[248,252],[255,257],[263,265]],"3":[[0,12],[26,40],[56,98],[112,114],[126,146],[158,187],[196,212],[227,265]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 이 사건 PC압수는 위법하고 이로부터 출력, 복사된 증거물들은 위수증에 해당하여 증거능력 없다고 주장 / 2) 검토 / 가) 관련 법리 / O 형소법 제218조에 의하면, 물건의 소유, 소지, 보관자가 임의제출한 물건을 영장없이 압수 가능함. 사후영장도 필요하지 아니함 / O 전자정보의 임의제출은 혐의사실 관련 부분만 정하여 출력, 복제하는 방법이 현저히 곤란한 경우에 예외적으로 저장매체자체 또는 복제본 반출하는 방법으로 압수 가능함 / O 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우, 압수의 대상은 임의제출의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 정보로 한정됨. 그 관련성에는 범행 동기와 경위, 수단과 방법, 시간과 장소 등에 관한 간접증거나 정황증거로 사용될 수 있는 정보도 포함됨. 다만 단순히 동종, 유사 범행임을 넘어서 구체적, 개별적 연관관계가 있어야 함. / O 수사기관이 저장매체 자체 또는 복제본을 사무실에서 탐색, 복제, 출력하는 경우에도, 피압수자측 참여권 보장, 압수 목록 교부 하여야 하며, 피의자의 소유 관리에 속하는 정보저장매체를 제3자가 임의제출하는 경우에는 그 피의자에 대하여도 위 절차가 준수되어야 함. 압수된 전자정보가 피의자의 소유, 관리에 속하는지는 피의자가 실질적인 압수수색 당사자라는 점이 압수수색 당시 외형적, 객관적으로 인식가능하였는지를 기준으로 판단함 / 나) 인정사실 / - 제3자 임의제출 경위 / 검찰은 피고인을 -혐의로 수사하던 중 이 사건 PC에 저장된 전자정보를 탐색하게 되었음, 이 사건 PC는 피고인이 잠시 자신의 주거지 등으로 가져가 사용하다가 다시 가져다 놓은 것으로 강사휴게실 내에 약 3년간 보관중이었고 대학교 조교들이 이를 공용PC로 사용하거나 필요시 처분할 의사로 관리해오고 있었음, 이 사건 PC 탐색 중 PC가 꺼졌고 OO대학교 행정처장은 이를 임의제출, 임의제출 범위 확인하지 않았음 / - 전자정보 압수수색과정 / 임의제출 당시 임의제출동의서를 작성한 OOO에게 참관의사를 물었으나 참관하지 않겠다고 답함. 압수목록 교부서를 위 사람에게 교부하고 이 사건 PC를 대검으로 가져가 전자정보 추출, 이 사건 범행 관련 파일들 발견되어 법원에 증거로 제출하고 압수 파일 명세가 특정된 목록 OOO에게 교부 / 다) 판단 / 위 인정사실을 앞서 본 법리에 비추어, 다음과 같은 사정이 인정되므로 변호인의 각 주장 받아들이지 아니함 / - 이 사건 PC가 물건의 소유자, 소지자, 보관자로부터 제출받은 것인지 / 이 사건 PC임의제출 당시 이 사건 PC를 객관적, 현실적으로 지배, 보관하면서 전속적, 포괄적 관리처분권을 가지고 있던 것은 OO대학교 이므로 피압수자는 OO대학교이고 보관관리 업무 담당자인 조교와 행정처장이 임의제출한 것이므로 적법 / - 압수의 필요성과 관련성 부정되는지 / 범죄혐의사실 관련 전자정보와 그렇지 않은 전자정보가 혼재된 저장매체에서 확인되지 않은 제출자의 의사를 임의로 추단하여 전자정보 전부가 임의제출 되어 압수된 것으로 취급하는 것은 원칙적으로 허용될 수 없고 임의제출에 따른 압수 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 전자정보에 한하여 압수대상 / 이 사건 전자정보는 피고인에 대한 범죄혐의사실에 관한 범행 동기, 경위, 수단, 방법 등을 증명하기 위한 구체적, 개별적 연관관계 있는 증거에 해당하고 수사 대상과 경위 임의제출의 과정 종합적으로 고려하여 압수의 필요성, 관련성 모두 인정 / - 참여권 보장되었는지 / 피압수자인 OO대학교에 참여의 기회를 보장하여야 하나, 임의제출자에게 참여의사를 확인하였고 이를 포기하였으므로 하자 없음 / 이 사건 PC임의제출 당시 그에 저장된 전자정보 전반에 관하여 포괄적 관리처분권을 보유, 행사한 것은 OO대학교이므로, 피고인은 실질적 피압수자에 해당하지 않음. 따라서 피고인에게 참여권을 보장해야 하는 경우 아님 / 피고인이 이 사건 PC를 전속적으로 이용한 바 있다고 하더라도 압수수색 당시까지 그에 저장된 전자정보 전반에 관한 관리처분권이 유지되고 있었다고 볼 수 없음 / 라) 증거의 요지 / 마) 소결론","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 검찰은 피고인이 OO대학교 총장 명의 표창장을 위조하고 이를 A의 DD대학교 의학전문대학원 등 지원과정에서 제출함으로써 사문서를 위조하고 이를 행사하고 국립대학인 DD대학교의 공무를 위계로 방해하였다는 범죄혐의사실로 피고인을 수사하던 중인 2019. 9. 10. OO대학교 강사휴게실에 보관되어 있던 이 사건 PC에 저장된 전자정보를 탐색하게 되었음\n2) 이 사건 PC는 OO대학교 공용PC로 사용하던 것을 교수인 피고인이 잠시 자신의 주거지 등으로 가져가 사용하다가 2016. 12.경 공용PC로 사용할 수 있도록 OO대학교에 다시 가져다 놓은 것으로 그 후부터 권리관계에 대한 별도의 표식 없이 위 강사휴게실 내에 약 3년 동안 보관 하고 있던 중이었고, 위 강사휴게실을 관리하는 OO대학교 조교들이 퇴직자가 놔두고 간 물건으로 인수인계하며 이를 공용PC로 사용하거나 필요시 처분할 의사로 관리해 오고 있었음\n3) 당시 위 강사휴게실 관리 업무를 맡고 있던 조교 갑의 협조(OO대학교측 지시에 따름)를 받아 위와 같이 전자정보를 탐색 중이던 검찰수사관이 위 범죄혐의사실 관련된 것으로 보이는 폴더를 발견하며 탐색 갑자기 중 이 사건 PC의 전원이 꺼져버렸고, 검찰수사관의 이 사건 PC 제출 문의, 요청을 받은 조교 갑, OO대학교 행정처장은 임의로 이 사건 PC를 제출하였음. 당시 검찰수사관은 이 사건 PC에 저장된 전자정보 중 임의제출하는 범위가 어떻게 되는지에 관한 의사를 위 두 사람으로부터 별도로 확인하지는 않았음\n4) 이 사건 PC 임의제출 당시 검찰수사관이 임의제출동의서를 작성한 조교 갑 및 OO대학교 행정처장에게 이 사건 PC의 이미징, 탐색, 전자정보 추출 등 과정에 참관의사를 물었으나, 위 두 사람은 모두 참관하지 않겠다고 답하였음. 검찰수사관은 이 사건 PC에 관한 압수목록 교부서를 위 두 사람에게 교부하고 이 사건 PC를 대검찰청으로 가져가 이미징, 포렌식 작업을 거쳐 전자정보를 추출하였음\n5) 이 사건 PC에서 추출된 전자정보 중 OO대학교 총장 명의 표창장을 위조하는 범행이 이 사건 PC를 이용하여 이루어진 정황이 담긴 파일들(이 사건 전자정보)이 발견되어, 검찰은 이를 위 범죄혐의사실로 피고인을 기소하여 계속 중인 법원에 증거로 제출하였음. 그 후 검찰은 이 사건 PC 임의제출자인 조교 갑 등에게 이 사건 PC에서 추출되어 압수된 전자정보의 파일 명세가 특정된 목록을 교부함","링판번호":131},{"카드ID":"C127-2","판례ID":"C127","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"정보저장매체의 실질적 피압수자 해당 여부 등","사건번호":"2021도11170","태그":["L"],"중요도":0,"단락순번":2,"총단락수":4,"법리원문":"수사기관이 그 정보저장매체 등을 수사기관 사무실 등으로 옮겨 이를 탐색, 복제, 출력하는 경우, 그와 같은 일련의 과정에서 형소법 제219조, 제121조에서 규정하는 피압수, 수색 당사자(이하 피압수자라 한다)나 그 변호인에게 참여의 기회를 보장하고 압수된 전자정보의 파일 명세가 특정된 압수목록을 작성, 교부하여야 하며 범죄혐의사실과 무관한 전자정보의 임의적인 복제 등을 막기 위한 적절한 조치를 취하는 등 영장주의 원칙과 적법절차를 준수하여야 함. 만약 그러한 조치가 취해지지 않았다면 피압수자 측이 참여하지 아니한다는 의사를 명시적으로 표시하였거 5],[498,500],[502,504],[521,523]],"3":[[0,26],[37,47],[60,112],[121,205],[219,246],[260,262],[274,284],[293,295],[310,314],[328,344],[360,377],[430,440],[457,504],[521,523]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 이 사건 PC압수는 위법하고 이로부터 출력, 복사된 증거물들은 위수증에 해당하여 증거능력 없다고 주장 / 2) 검토 / 가) 관련 법리 / O 형소법 제218조에 의하면, 물건의 소유, 소지, 보관자가 임의제출한 물건을 영장없이 압수 가능함. 사후영장도 필요하지 아니함 / O 전자정보의 임의제출은 혐의사실 관련 부분만 정하여 출력, 복제하는 방법이 현저히 곤란한 경우에 예외적으로 저장매체자체 또는 복제본 반출하는 방법으로 압수 가능함 / O 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우, 압수의 대상은 임의제출의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 정보로 한정됨. 그 관련성에는 범행 동기와 경위, 수단과 방법, 시간과 장소 등에 관한 간접증거나 정황증거로 사용될 수 있는 정보도 포함됨. 다만 단순히 동종, 유사 범행임을 넘어서 구체적, 개별적 연관관계가 있어야 함. / O 수사기관이 저장매체 자체 또는 복제본을 사무실에서 탐색, 복제, 출력하는 경우에도, 피압수자측 참여권 보장, 압수 목록 교부 하여야 하며, 피의자의 소유 관리에 속하는 정보저장매체를 제3자가 임의제출하는 경우에는 그 피의자에 대하여도 위 절차가 준수되어야 함. 압수된 전자정보가 피의자의 소유, 관리에 속하는지는 피의자가 실질적인 압수수색 당사자라는 점이 압수수색 당시 외형적, 객관적으로 인식가능하였는지를 기준으로 판단함 / 나) 인정사실 / - 제3자 임의제출 경위 / 검찰은 피고인을 -혐의로 수사하던 중 이 사건 PC에 저장된 전자정보를 탐색하게 되었음, 이 사건 PC는 피고인이 잠시 자신의 주거지 등으로 가져가 사용하다가 다시 가져다 놓은 것으로 강사휴게실 내에 약 3년간 보관중이었고 대학교 조교들이 이를 공용PC로 사용하거나 필요시 처분할 의사로 관리해오고 있었음, 이 사건 PC 탐색 중 PC가 꺼졌고 OO대학교 행정처장은 이를 임의제출, 임의제출 범위 확인하지 않았음 / - 전자정보 압수수색과정 / 임의제출 당시 임의제출동의서를 작성한 OOO에게 참관의사를 물었으나 참관하지 않겠다고 답함. 압수목록 교부서를 위 사람에게 교부하고 이 사건 PC를 대검으로 가져가 전자정보 추출, 이 사건 범행 관련 파일들 발견되어 법원에 증거로 제출하고 압수 파일 명세가 특정된 목록 OOO에게 교부 / 다) 판단 / 위 인정사실을 앞서 본 법리에 비추어, 다음과 같은 사정이 인정되므로 변호인의 각 주장 받아들이지 아니함 / - 이 사건 PC가 물건의 소유자, 소지자, 보관자로부터 제출받은 것인지 / 이 사건 PC임의제출 당시 이 사건 PC를 객관적, 현실적으로 지배, 보관하면서 전속적, 포괄적 관리처분권을 가지고 있던 것은 OO대학교 이므로 피압수자는 OO대학교이고 보관관리 업무 담당자인 조교와 행정처장이 임의제출한 것이므로 적법 / - 압수의 필요성과 관련성 부정되는지 / 범죄혐의사실 관련 전자정보와 그렇지 않은 전자정보가 혼재된 저장매체에서 확인되지 않은 제출자의 의사를 임의로 추단하여 전자정보 전부가 임의제출 되어 압수된 것으로 취급하는 것은 원칙적으로 허용될 수 없고 임의제출에 따른 압수 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 전자정보에 한하여 압수대상 / 이 사건 전자정보는 피고인에 대한 범죄혐의사실에 관한 범행 동기, 경위, 수단, 방법 등을 증명하기 위한 구체적, 개별적 연관관계 있는 증거에 해당하고 수사 대상과 경위 임의제출의 과정 종합적으로 고려하여 압수의 필요성, 관련성 모두 인정 / - 참여권 보장되었는지 / 피압수자인 OO대학교에 참여의 기회를 보장하여야 하나, 임의제출자에게 참여의사를 확인하였고 이를 포기하였으므로 하자 없음 / 이 사건 PC임의제출 당시 그에 저장된 전자정보 전반에 관하여 포괄적 관리처분권을 보유, 행사한 것은 OO대학교이므로, 피고인은 실질적 피압수자에 해당하지 않음. 따라서 피고인에게 참여권을 보장해야 하는 경우 아님 / 피고인이 이 사건 PC를 전속적으로 이용한 바 있다고 하더라도 압수수색 당시까지 그에 저장된 전자정보 전반에 관한 관리처분권이 유지되고 있었다고 볼 수 없음 / 라) 증거의 요지 / 마) 소결론","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 검찰은 피고인이 OO대학교 총장 명의 표창장을 위조하고 이를 A의 DD대학교 의학전문대학원 등 지원과정에서 제출함으로써 사문서를 위조하고 이를 행사하고 국립대학인 DD대학교의 공무를 위계로 방해하였다는 범죄혐의사실로 피고인을 수사하던 중인 2019. 9. 10. OO대학교 강사휴게실에 보관되어 있던 이 사건 PC에 저장된 전자정보를 탐색하게 되었음\n2) 이 사건 PC는 OO대학교 공용PC로 사용하던 것을 교수인 피고인이 잠시 자신의 주거지 등으로 가져가 사용하다가 2016. 12.경 공용PC로 사용할 수 있도록 OO대학교에 다시 가져다 놓은 것으로 그 후부터 권리관계에 대한 별도의 표식 없이 위 강사휴게실 내에 약 3년 동안 보관 하고 있던 중이었고, 위 강사휴게실을 관리하는 OO대학교 조교들이 퇴직자가 놔두고 간 물건으로 인수인계하며 이를 공용PC로 사용하거나 필요시 처분할 의사로 관리해 오고 있었음\n3) 당시 위 강사휴게실 관리 업무를 맡고 있던 조교 갑의 협조(OO대학교측 지시에 따름)를 받아 위와 같이 전자정보를 탐색 중이던 검찰수사관이 위 범죄혐의사실 관련된 것으로 보이는 폴더를 발견하며 탐색 갑자기 중 이 사건 PC의 전원이 꺼져버렸고, 검찰수사관의 이 사건 PC 제출 문의, 요청을 받은 조교 갑, OO대학교 행정처장은 임의로 이 사건 PC를 제출하였음. 당시 검찰수사관은 이 사건 PC에 저장된 전자정보 중 임의제출하는 범위가 어떻게 되는지에 관한 의사를 위 두 사람으로부터 별도로 확인하지는 않았음\n4) 이 사건 PC 임의제출 당시 검찰수사관이 임의제출동의서를 작성한 조교 갑 및 OO대학교 행정처장에게 이 사건 PC의 이미징, 탐색, 전자정보 추출 등 과정에 참관의사를 물었으나, 위 두 사람은 모두 참관하지 않겠다고 답하였음. 검찰수사관은 이 사건 PC에 관한 압수목록 교부서를 위 두 사람에게 교부하고 이 사건 PC를 대검찰청으로 가져가 이미징, 포렌식 작업을 거쳐 전자정보를 추출하였음\n5) 이 사건 PC에서 추출된 전자정보 중 OO대학교 총장 명의 표창장을 위조하는 범행이 이 사건 PC를 이용하여 이루어진 정황이 담긴 파일들(이 사건 전자정보)이 발견되어, 검찰은 이를 위 범죄혐의사실로 피고인을 기소하여 계속 중인 법원에 증거로 제출하였음. 그 후 검찰은 이 사건 PC 임의제출자인 조교 갑 등에게 이 사건 PC에서 추출되어 압수된 전자정보의 파일 명세가 특정된 목록을 교부함","링판번호":131},{"카드ID":"C127-3","판례ID":"C127","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"정보저장매체의 실질적 피압수자 해당 여부 등","사건번호":"2021도11170","태그":["L"],"중요도":0,"단락순번":3,"총단락수":4,"법리원문":"피해자 등 제3자가 피의자의 소유, 관리에 속하는 정보저장매체를 영장에 의하지 않고 임의제출한 경우에는 실질적 피압수자인 피의자가 수사기관으로 하여금 그 전자정보 전부를 무제한 탐색하는 데 동의한 것으로 보기 어려울 뿐만 아니라 피의자 스스로 임의제출한 경우 피의자의 참여권 등이 보장되어야 하는 것과 견주어 보더라도 특별한 사정이 없는 한 형소법 제219조, 제121조, 제129조에 따라 피의자에게 참여권을 보장하고 압수한 전자정보 목록을 교부하는 등 피의자의 절차적 권리를  저장된 전자정보를 탐색하게 되었음, 이 사건 PC는 피고인이 잠시 자신의 주거지 등으로 가져가 사용하다가 다시 가져다 놓은 것으로 강사휴게실 내에 약 3년간 보관중이었고 대학교 조교들이 이를 공용PC로 사용하거나 필요시 처분할 의사로 관리해오고 있었음, 이 사건 PC 탐색 중 PC가 꺼졌고 OO대학교 행정처장은 이를 임의제출, 임의제출 범위 확인하지 않았음 / - 전자정보 압수수색과정 / 임의제출 당시 임의제출동의서를 작성한 OOO에게 참관의사를 물었으나 참관하지 않겠다고 답함. 압수목록 교부서를 위 사람에게 교부하고 이 사건 PC를 대검으로 가져가 전자정보 추출, 이 사건 범행 관련 파일들 발견되어 법원에 증거로 제출하고 압수 파일 명세가 특정된 목록 OOO에게 교부 / 다) 판단 / 위 인정사실을 앞서 본 법리에 비추어, 다음과 같은 사정이 인정되므로 변호인의 각 주장 받아들이지 아니함 / - 이 사건 PC가 물건의 소유자, 소지자, 보관자로부터 제출받은 것인지 / 이 사건 PC임의제출 당시 이 사건 PC를 객관적, 현실적으로 지배, 보관하면서 전속적, 포괄적 관리처분권을 가지고 있던 것은 OO대학교 이므로 피압수자는 OO대학교이고 보관관리 업무 담당자인 조교와 행정처장이 임의제출한 것이므로 적법 / - 압수의 필요성과 관련성 부정되는지 / 범죄혐의사실 관련 전자정보와 그렇지 않은 전자정보가 혼재된 저장매체에서 확인되지 않은 제출자의 의사를 임의로 추단하여 전자정보 전부가 임의제출 되어 압수된 것으로 취급하는 것은 원칙적으로 허용될 수 없고 임의제출에 따른 압수 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 전자정보에 한하여 압수대상 / 이 사건 전자정보는 피고인에 대한 범죄혐의사실에 관한 범행 동기, 경위, 수단, 방법 등을 증명하기 위한 구체적, 개별적 연관관계 있는 증거에 해당하고 수사 대상과 경위 임의제출의 과정 종합적으로 고려하여 압수의 필요성, 관련성 모두 인정 / - 참여권 보장되었는지 / 피압수자인 OO대학교에 참여의 기회를 보장하여야 하나, 임의제출자에게 참여의사를 확인하였고 이를 포기하였으므로 하자 없음 / 이 사건 PC임의제출 당시 그에 저장된 전자정보 전반에 관하여 포괄적 관리처분권을 보유, 행사한 것은 OO대학교이므로, 피고인은 실질적 피압수자에 해당하지 않음. 따라서 피고인에게 참여권을 보장해야 하는 경우 아님 / 피고인이 이 사건 PC를 전속적으로 이용한 바 있다고 하더라도 압수수색 당시까지 그에 저장된 전자정보 전반에 관한 관리처분권이 유지되고 있었다고 볼 수 없음 / 라) 증거의 요지 / 마) 소결론","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 검찰은 피고인이 OO대학교 총장 명의 표창장을 위조하고 이를 A의 DD대학교 의학전문대학원 등 지원과정에서 제출함으로써 사문서를 위조하고 이를 행사하고 국립대학인 DD대학교의 공무를 위계로 방해하였다는 범죄혐의사실로 피고인을 수사하던 중인 2019. 9. 10. OO대학교 강사휴게실에 보관되어 있던 이 사건 PC에 저장된 전자정보를 탐색하게 되었음\n2) 이 사건 PC는 OO대학교 공용PC로 사용하던 것을 교수인 피고인이 잠시 자신의 주거지 등으로 가져가 사용하다가 2016. 12.경 공용PC로 사용할 수 있도록 OO대학교에 다시 가져다 놓은 것으로 그 후부터 권리관계에 대한 별도의 표식 없이 위 강사휴게실 내에 약 3년 동안 보관 하고 있던 중이었고, 위 강사휴게실을 관리하는 OO대학교 조교들이 퇴직자가 놔두고 간 물건으로 인수인계하며 이를 공용PC로 사용하거나 필요시 처분할 의사로 관리해 오고 있었음\n3) 당시 위 강사휴게실 관리 업무를 맡고 있던 조교 갑의 협조(OO대학교측 지시에 따름)를 받아 위와 같이 전자정보를 탐색 중이던 검찰수사관이 위 범죄혐의사실 관련된 것으로 보이는 폴더를 발견하며 탐색 갑자기 중 이 사건 PC의 전원이 꺼져버렸고, 검찰수사관의 이 사건 PC 제출 문의, 요청을 받은 조교 갑, OO대학교 행정처장은 임의로 이 사건 PC를 제출하였음. 당시 검찰수사관은 이 사건 PC에 저장된 전자정보 중 임의제출하는 범위가 어떻게 되는지에 관한 의사를 위 두 사람으로부터 별도로 확인하지는 않았음\n4) 이 사건 PC 임의제출 당시 검찰수사관이 임의제출동의서를 작성한 조교 갑 및 OO대학교 행정처장에게 이 사건 PC의 이미징, 탐색, 전자정보 추출 등 과정에 참관의사를 물었으나, 위 두 사람은 모두 참관하지 않겠다고 답하였음. 검찰수사관은 이 사건 PC에 관한 압수목록 교부서를 위 두 사람에게 교부하고 이 사건 PC를 대검찰청으로 가져가 이미징, 포렌식 작업을 거쳐 전자정보를 추출하였음\n5) 이 사건 PC에서 추출된 전자정보 중 OO대학교 총장 명의 표창장을 위조하는 범행이 이 사건 PC를 이용하여 이루어진 정황이 담긴 파일들(이 사건 전자정보)이 발견되어, 검찰은 이를 위 범죄혐의사실로 피고인을 기소하여 계속 중인 법원에 증거로 제출하였음. 그 후 검찰은 이 사건 PC 임의제출자인 조교 갑 등에게 이 사건 PC에서 추출되어 압수된 전자정보의 파일 명세가 특정된 목록을 교부함","링판번호":131},{"카드ID":"C128-1","판례ID":"C128","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"수사과정에서 작성한 진술서(제312조 제5항)와 적법한 절차와 방식","사건번호":"2022도9510","태그":["L"],"중요도":0,"단락순번":1,"총단락수":4,"법리원문":"형소법 제312조 제5항은 피고인 또는 피고인이 아닌 자가 수사과정에서 작성한 진술서의 증거능력에 관하여 형소법 제312조 제1항부터 제4항까지 준용하도록 규정하고 있으므로, 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서의 증거능력이 인정되려면 적법한 절차와 방식에 따라 작성된 것이어야 한다는 법리가 피고인이 아닌 자가 수사과정에서 작성한 진술서의 증거능력에 관하여도 적용됨","힌트_첫어절":"형소법 제312조 제5항은 피고인","힌트_초성":"ㅎㅅㅂ ㅈ312ㅈ ㅈ5ㅎㅇ ㅍㄱㅇ ㄸㄴ ㅍㄱㅇㅇ ㅇㄴ ㅈㄱ ㅅㅅㄱㅈㅇㅅ ㅈㅅㅎ ㅈㅅㅅㅇ ㅈㄱㄴㄹㅇ ㄱㅎㅇ ㅎㅅㅂ ㅈ312ㅈ ㅈ1ㅎㅂㅌ ㅈ4ㅎㄲㅈ ㅈㅇㅎㄷㄹ ㄱㅈㅎㄱ ㅇㅇㅁㄹ, ㄱㅅ ㄸㄴ ㅅㅂㄱㅊㄱㅇ ㅍㄱㅇㅇ ㅇㄴ ㅈㅇ ㅈㅅㅇ ㄱㅈㅎ ㅈㅅㅇ ㅈㄱㄴㄹㅇ ㅇㅈㄷㄹㅁ ㅈㅂㅎ ㅈㅊㅇ ㅂㅅㅇ ㄸㄹ ㅈㅅㄷ ㄱㅇㅇㅇ ㅎㄷㄴ ㅂㄹㄱ ㅍㄱㅇㅇ ㅇㄴ ㅈㄱ ㅅㅅㄱㅈㅇㅅ ㅈㅅㅎ ㅈㅅㅅㅇ ㅈㄱㄴㄹㅇ ㄱㅎㅇㄷ ㅈㅇㄷ","핵심키워드":["조서","수사과정","증거능력","진술서","절차","진술","법리","적법","작성","규정"],"빈칸":{"1":[[33,37],[40,42],[44,47],[49,53],[87,89],[122,124],[130,132],[134,138],[146,148],[150,152],[161,163],[174,176],[189,193],[196,198],[200,203],[205,209]],"2":[[0,3],[4,9],[10,13],[15,18],[22,25],[33,37],[40,42],[44,47],[49,53],[59,62],[63,68],[69,72],[75,78],[87,89],[98,100],[104,109],[111,114],[122,124],[130,132],[134,138],[146,148],[150,152],[161,163],[174,176],[178,181],[189,193],[196,198],[200,203],[205,209]],"3":[[0,78],[87,89],[98,152],[161,163],[174,181],[189,193],[196,198],[200,203],[205,209]]},"발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"입당원서 작성자들의 주거지나 근무지에 방문하여 진술서 작성을 요구하여 제출받았고 유죄인정의 증거로 제출 / - 피의자가 조사장소에 도착한 시각, 조사를 시작하고 마친 시각 등을 기록한 자료 없음","링판번호":132},{"카드ID 방 등 임의제출 받아 압수, 그 직후 진술거부권 고지, 가방 날치기 자백, 검 경 피고인신문 전에 모두 진술거부권 고지, 피고인 일관하여 자백, 압수된 가방 내용물 기초로 공소외 피해자 피해사실에 관한 진술 / (3) 판단 / O 피고인에 대한 경피신(피고인의 집으로 향하는 차안에서의 진술 부분에 한하여) / 위 인정사실을 종합하면 피고인 체포 이후 집으로 향하는 차안에서 진술거부권 고지받지 아니한 채 공소외 피해자 소유의 물건을 탈취하였다는 사실을 진술하였기에 피고인의 진술거부권 침해하였고 이는 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당한다는 점 고려하면 증거능력 없고 피고인 및 변호인 증거동의하여도 달리볼 것 아님 / O 피고인에 대한 검, 경 피신조서, 압수조서, 압수된 가방 / 위 각 증거는 위법하게 수집된 피고인의 진술을 기초로 수집된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 그 수집절차와 진술거부권 미고지의 위법 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 위 각 증거는 피고인에 대하여 증거능력 없고 피고인, 변호인이 증거동의하더라도 달리 볼 것 아님 / O 피고인, 피해자 각 법정진술 / 다음과 같은 사정들 종합하여 고려하면 피고인 및 피해자의 각 법정진술과 위 진술거부권 미고지의 위법성 사이에 인과관계 단절되었다고 봄이 타당하므로 피해자의 법정진술과 피고인 법정진술은 모두 증거능력 있음 / - 피고인이 이 법정에서의 자백에 이르기까지의 앞서 본 모든 사정들, 즉 피고인의 법정진술은 진술거부권을 고지받지 못한 상태에서 이루어진 피고인의 최초 자백과 같은 내용이기는 하나, 최초 자백이 이루어진 이후 몇시간 뒤 바로 수사기관의 진술거부권 고지가 이루어졌을 뿐 아니라 그 후 신문시마다 진술거부권 고지가 모두 적법하게 이루어졌고, 1심 법정자백은 최초 자백 이후 약 40여일이 지난 후 공개된 법정에서 변호인의 충분한 조력을 받으며 진술거부권을 고지받는 등 적법한 절차를 통해 임의로 이루어졌음 / - 피해자의 법정진술 또한 그 진술에 이르게 되기까지의 앞서 본 바와 같은 모든 사정들, 특히 피해자가 범행일로부터 7개월 이상 지난 시점에서 법원의 적법한 소환에 따라 자발적으로 공개된 법정에 출석하여 위증의 벌을 경고받고 선서한 후 직접 경험한 사실을 임의로 진술함 / 다) 증거의 요지 / 라) 소결론","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 2008. 3. 12. 05:00경 경찰 P1은 경찰서에서 03:00경 P2에게 강도 현행범으로 체포된 피고인을 인계받아 진술거부권을 고지하지 아니한 채 같은 날 06:00경까지 조사를 하면서 위 강도 범행에 대한 자백을 받음\n2) P1은 피고인의 또 다른 범행을 의심하여 같은 날 06:00경 피고인의 주거지로 향하는 차 안에서 진술거부권을 고지하지 아니한 채 피고인에게 이 사건 전의 범행이 있으면 경찰관이 찾기 전에 먼저 이야기하라, 그렇게 해야 너에게 도움이 된다는 취지로 이야기하여 피고인으로부터 같은 해 2월 초 새벽에 어떤 아주머니 가방을 날치기한 적이 있고, 그 가방을 피고인의 집에 보관하고 있다는 진술을 듣게 됨\n3) P1은 같은 날 09:00경 피고인의 집에서 가방 등을 발견하여 임의제출받아 압수하였고, 그 직후인 10:20경 피고인에 대하여 최초로 진술거부권을 고지한 후 피고인으로부터 가방을 빼앗았다는 자백을 받음. 경찰 및 검찰의 피고인에 대한 신문 전에 모두 진술거부권 고지가 이루어졌고, 피고인은 일관하여 임의로 자백하였음. 한편 압수된 가방 내용물을 기초로 그 피해자가 A인 점이 확인된 후 A를 상대로 피해 사실에 관한 진술을 받는 등 A에 대한 조사가 이루어짐\n4) 2008. 4. 23. 열린 제1심 제1회 공판기일에서 피고인은 인정신문에 앞서 진술을 하지 아니하거나 각개의 물음에 대하여 진술을 거부할 수 있고 이익되는 사실을 진술할 수 있음을 고지받은 후, 공소사실을 인정하나 피해자들에게 강압적이고 의도적으로 심하게 하면서 가방을 빼앗은 것은 아니다라고 진술하였고, 변호인은 제출된 증거들이 위법한 절차에 의해서 수집된 것들이기 때문에 비록 피고인이 자백하고는 있지만 위 증거들의 증거능력에 대하여 다툼이 있다고 진술하였음\n5) 그 후에도 피고인은 원심에 이르기까지 계속 A에 대한 범행을 시인했고, 원심에서 검찰은 A를 증인으로 신청했고, A는 원심 3회 공판기일에 출석하여 이 부분 공소사실에 부합하는 증언을 함","링판번호":135},{"카드ID":"C131-2","판례ID":"C131","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"위법수집증거 (진술거부권을 고지하지 아니하여 변호인만 다툰 사안)","사건번호":"2008도11437","태그":["L"],"중요도":1,"단락순번":2,"총단락수":2,"법리원문":"따라서 법원이 2차적 증거의 증거능력 인정 여부를 최종적으로 판단할 때에는 먼저 절차에 따르지 아니한 1차적 증거 수집과 관련된 모든 사정들, 2차적 증거를 수집하는 과정에서 추가로 발생한 모든 사정들까지 구체적인 사안에 따라 주로 인과관계 희석 또는 단절 여부를 중심으로 전체적, 종합적으로 고려하여야 함","힌트_첫어절":"따라서 법원이 2차적 증거의","힌트_초성":"ㄸㄹㅅ ㅂㅇㅇ 2ㅊㅈ ㅈㄱㅇ ㅈㄱㄴㄹ ㅇㅈ ㅇㅂㄹ ㅊㅈㅈㅇㄹ ㅍㄷㅎ ㄸㅇㄴ ㅁㅈ ㅈㅊㅇ ㄸㄹㅈ ㅇㄴㅎ 1ㅊㅈ ㅈㄱ ㅅㅈㄱ ㄱㄹㄷ ㅁㄷ ㅅㅈㄷ, 2ㅊㅈ ㅈㄱㄹ ㅅㅈㅎㄴ ㄱㅈㅇㅅ ㅊㄱㄹ ㅂㅅㅎ ㅁㄷ ㅅㅈㄷㄲㅈ ㄱㅊㅈㅇ ㅅㅇㅇ ㄸㄹ ㅈㄹ ㅇㄱㄱㄱ ㅎㅅ ㄸㄴ ㄷㅈ ㅇㅂㄹ ㅈㅅㅇㄹ ㅈㅊㅈ, ㅈㅎㅈㅇㄹ ㄱㄹㅎㅇㅇ ㅎ","핵심키워드":["단절","증거능력","인과관계","절차","사안","증거","수집","사정들","과정","관련","발생"],"중복그룹":"G02","그룹대표":"N","빈칸":{"1":[[12,14],[16,20],[45,47],[61,63],[64,66],[68,70],[75,78],[84,86],[88,90],[93,95],[102,104],[109,112],[120,122],[130,134],[141,143]],"2":[[4,6],[12,14],[16,20],[45,47],[61,63],[64,66],[68,70],[75,78],[84,86],[88,90],[93,95],[102,104],[109,112],[120,122],[130,134],[141,143],[148,150]],"3":[[4,20],[45,47],[61,150],[158,171]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 피고인의 자백과 이에 기초하여 획득한 증거들이 진술거부권 고지받지 못한 상태에서 수집된 것이므로 증거능력 없다고 주장 / 2) 검토 / 가) 증없증 / (1) 관련 법리 / O 위수증 (원칙,예외,적법절차,사법정의,인과희석,검사입증) / O 형소법 제244조의3 제1항에 의하면 검사 또는 사법경찰관은 피의자를 신문하기 전에 각 호에 해당하는 사항을 알려주어 진술거부권을 고지해야함. 이를 위반하여 작성된 피신조서는 위수증에 해당하여 증거능력 없고 피고인, 변호인이 증거동의 하여도 마찬가지임 / (2) 인정사실 / 피고인 강도 현체, 경찰관 진술거부권 미고지하고 피고인 자백함, 같은날 피고인의 주거지로 향하는 차 안에서 진술거부권 고지받지 않은 채 별건 범행 자백, 피고인 집에서 가방 등 임의제출 받아 압수, 그 직후 진술거부권 고지, 가방 날치기 자백, 검 경 피고인신문 전에 모두 진술거부권 고지, 피고인 일관하여 자백, 압수된 가방 내용물 기초로 공소외 피해자 피해사실에 관한 진술 / (3) 판단 / O 피고인에 대한 경피신(피고인의 집으로 향하는 차안에서의 진술 부분에 한하여) / 위 인정사실을 종합하면 피고인 체포 이후 집으로 향하는 차안에서 진술거부권 고지받지 아니한 채 공소외 피해자 소유의 물건을 탈취하였다는 사실을 진술하였기에 피고인의 진술거부권 침해하였고 이는 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당한다는 점 고려하면 증거능력 없고 피고인 및 변호인 증거동의하여도 달리볼 것 아님 / O 피고인에 대한 검, 경 피신조서, 압수조서, 압수된 가방 / 위 각 증거는 위법하게 수집된 피고인의 진술을 기초로 수집된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 그 수집절차와 진술거부권 미고지의 위법 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 위 각 증거는 피고인에 대하여 증거능력 없고 피고인, 변호인이 증거동의하더라도 달리 볼 것 아님 / O 피고인, 피해자 각 법정진술 / 다음과 같은 사정들 종합하여 고려하면 피고인 및 피해자의 각 법정진술과 위 진술거부권 미고지의 위법성 사이에 인과관계 단절되었다고 봄이 타당하므로 피해자의 법정진술과 피고인 법정진술은 모두 증거능력 있음 / - 피고인이 이 법정에서의 자백에 이르기까지의 앞서 본 모든 사정들, 즉 피고인의 법정진술은 진술거부권을 고지받지 못한 상태에서 이루어진 피고인의 최초 자백과 같은 내용이기는 하나, 최초 자백이 이루어진 이후 몇시간 뒤 바로 수사기관의 진술거부권 고지가 이루어졌을 뿐 아니라 그 후 신문시마다 진술거부권 고지가 모두 적법하게 이루어졌고, 1심 법정자백은 최초 자백 이후 약 40여일이 지난 후 공개된 법정에서 변호인의 충분한 조력을 받으며 진술거부권을 고지받는 등 적법한 절차를 통해 임의로 이루어졌음 / - 피해자의 법정진술 또한 그 진술에 이르게 되기까지의 앞서 본 바와 같은 모든 사정들, 특히 피해자가 범행일로부터 7개월 이상 지난 시점에서 법원의 적법한 소환에 따라 자발적으로 공개된 법정에 출석하여 위증의 벌을 경고받고 선서한 후 직접 경험한 사실을 임의로 진술함 / 다) 증거의 요지 / 라) 소결론","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 2008. 3. 12. 05:00경 경찰 P1은 경찰서에서 03:00경 P2에게 강도 현행범으로 체포된 피고인을 인계받아 진술거부권을 고지하지 아니한 채 같은 날 06:00경까지 조사를 하면서 위 강도 범행에 대한 자백을 받음\n2) P1은 피고인의 또 다른 범행을 의심하여 같은 날 06:00경 피고인의 주거지로 향하는 차 안에서 진술거부권을 고지하지 아니한 채 피고인에게 이 사건 전의 범행이 있으면 경찰관이 찾기 전에 먼저 이야기하라, 그렇게 해야 너에게 도움이 된다는 취지로 이야기하여 피고인으로부터 같은 해 2월 초 새벽에 어떤 아주머니 가방을 날치기한 적이 있고, 그 가방을 피고인의 집에 보관하고 있다는 진술을 듣게 됨\n3) P1은 같은 날 09:00경 피고인의 집에서 가방 등을 발견하여 임의제출받아 압수하였고, 그 직후인 10:20경 피고인에 대하여 최초로 진술거부권을 고지한 후 피고인으로부터 가방을 빼앗았다는 자백을 받음. 경찰 및 검찰의 피고인에 대한 신문 전에 모두 진술거부권 고지가 이루어졌고, 피고인은 일관하여 임의로 자백하였음. 한편 압수된 가방 내용물을 기초로 그 피해자가 A인 점이 확인된 후 A를 상대로 피해 사실에 관한 진술을 받는 등 A에 대한 조사가 이루어짐\n4) 2008. 4. 23. 열린 제1심 제1회 공판기일에서 피고인은 인정신문에 앞서 진술을 하지 아니하거나 각개의 물음에 대하여 진술을 거부할 수 있고 이익되는 사실을 진술할 수 있음을 고지받은 후, 공소사실을 인정하나 피해자들에게 강압적이고 의도적으로 심하게 하면서 가방을 빼앗은 것은 아니다라고 진술하였고, 변호인은 제출된 증거들이 위법한 절차에 의해서 수집된 것들이기 때문에 비록 피고인이 자백하고는 있지만 위 증거들의 증거능력에 대하여 다툼이 있다고 진술하였음\n5) 그 후에도 피고인은 원심에 이르기까지 계속 A에 대한 범행을 시인했고, 원심에서 검찰은 A를 증인으로 신청했고, A는 원심 3회 공판기일에 출석하여 이 부분 공소사실에 부합하는 증언을 함","링판번호":135},{"카드ID":"C132-1","판례ID":"C132","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"감정결과의 증거능력을 인정하기 위한 요건","사건번호":"2011도1902","태그":["L"],"중요도":1,"단락순번":1,"총단락수":3,"법리원문":"수사기관이 헌법과 형소법이 정한 절차에 따르지 아니하고 수집한 증거는 물론이거니와 이를 기초로 하여 획득한 2차적 증거 또한 기본적 인권 보장을 위해 마련된 적법한 절차에 따르지 않은 것으로서 원칙적으로 유죄 인정의 증거로 삼을 수 없고, 다만 수사기관의 절차 위반행위가 적법절차의 실질적인 내용을 침해하는 경우에 해당하지 아니하고, 그 증거의 증거능력을 배제하는 것이 오히려 헌법과 형소법이 적법절차의 원칙과 실체적 진실 규명의 조화를 통하여 형사 사법 정의를 실현하려고 한 취지에 반하는 결과를 초래하는 것으로 평가되는 예외적인 경우라면 법원은 그 증거를 유죄 인정의 증거로 사용할 수 있음","힌트_첫어절":"수사기관이 헌법과 형소법이 정한","힌트_초성":"ㅅㅅㄱㄱㅇ ㅎㅂㄱ ㅎㅅㅂㅇ ㅈㅎ ㅈㅊㅇ ㄸㄹㅈ ㅇㄴㅎㄱ ㅅㅈㅎ ㅈㄱㄴ ㅁㄹㅇㄱㄴㅇ ㅇㄹ ㄱㅊㄹ ㅎㅇ ㅎㄷㅎ 2ㅊㅈ ㅈㄱ ㄸㅎ ㄱㅂㅈ ㅇㄱ ㅂㅈㅇ ㅇㅎ ㅁㄹㄷ ㅈㅂㅎ ㅈㅊㅇ ㄸㄹㅈ ㅇㅇ ㄱㅇㄹㅅ ㅇㅊㅈㅇㄹ ㅇㅈ ㅇㅈㅇ ㅈㄱㄹ ㅅㅇ ㅅ ㅇㄱ, ㄷㅁ ㅅㅅㄱㄱㅇ ㅈㅊ ㅇㅂㅎㅇㄱ ㅈㅂㅈㅊㅇ ㅅㅈㅈㅇ ㄴㅇㅇ ㅊㅎㅎㄴ ㄱㅇㅇ ㅎㄷㅎㅈ ㅇㄴㅎㄱ, ㄱ ㅈㄱㅇ ㅈㄱㄴㄹㅇ ㅂㅈㅎㄴ ㄱㅇ ㅇㅎㄹ ㅎㅂㄱ ㅎㅅㅂㅇ ㅈㅂㅈㅊㅇ ㅇㅊㄱ ㅅㅊㅈ ㅈㅅ ㄱㅁㅇ ㅈㅎㄹ ㅌㅎㅇ ㅎㅅ ㅅㅂ ㅈㅇㄹ ㅅㅎㅎㄹㄱ ㅎ ㅊㅈㅇ ㅂㅎㄴ ㄱㄱㄹ ㅊㄹㅎㄴ ㄱㅇㄹ ㅍㄱㄷㄴ ㅇㅇㅈㅇ ㄱㅇㄹㅁ ㅂㅇㅇ ㄱ ㅈㄱㄹ ㅇㅈ ㅇㅈㅇ ㅈㄱㄹ ㅅㅇㅎ ㅅ ㅇㅇ","핵심키워드":["적법절차","증거능력","유죄","절차","위반행위","인권","사법","원칙","진실","증거","침해","적법","보장","수집","배제","사용"],"유사법리":"C120-1(2007도3061,0.84) ; C131-1(2008도11437,0.67) ; C090-2(2009도10412,0.62) ; C122-1(2008도10914,0.52)","빈칸":{"1":[[18,20],[31,33],[35,37],[64,66],[74,76],[77,79],[88,90],[92,94],[108,110],[114,116],[121,123],[143,145],[146,150],[152,156],[167,169],[189,191],[193,197],[199,201],[220,224],[226,228],[234,236],[252,254],[309,311],[313,315],[320,322],[324,326]],"2":[[0,4],[6,8],[10,13],[18,20],[31,33],[35,37],[64,66],[74,76],[77,79],[88,90],[92,94],[108,110],[114,116],[121,123],[137,141],[143,145],[146,150],[152,156],[167,169],[189,191],[193,197],[199,201],[211,213],[215,218],[220,224],[226,228],[234,236],[237,239],[241,243],[252,254],[279,281],[303,305],[309,311],[313,315],[320,322],[324,326]],"3":[[0,20],[31,37],[64,79],[88,94],[108,123],[137,156],[167,169],[189,201],[211,243],[252,254],[279,281],[303,326]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 피고인 사고 낸 사실 인정하나 운전미숙으로 인한 교통사고이므로 살인의 범의에 기한 1차 사고가 존재하지 않았다고 주장함 / O 변호인 수사기관에서 압수한 보강용 강판, 강판조각과 페인트의 각 압수 및 감정 과정에 절차적 위법이 있으므로 강판조각 등 증거능력 없다고 주장함 / 2) 검토 / 가) 위법수집증거여부 / (1) 법리 / O 형소법 제218조에 의하여 피의자 기타인의 유류한 물건이나 소유자, 소지자 또는 보관자가 임의로 제출한 물건은 영장없이 압수할 수 있음 / O 형소법 제173조 제1항에 의해 감정인은 감정에 관하여 필요한 때 법원의 허가를 얻어야 물건의 파괴 등을 할 수 있음 / (2) 인정사실 / 경찰관 이 사건 보강용 강판 임의제출 받음, 철제구조물에서 이 사건 강판조각 발견, 철제 구조물에 부착된 페인트와 이 사건 차량에 묻은 페인트 대조, 강판조각 두들겨 펴서 이 사건 보강용 강판과 크기 비교, 피고인으로부터 강판조각 임의제출 받는 형식으로 압수 / (3) 판단 / O 위 인정사실을 종합하여 알 수 있는 다음과 같은 사정들, 즉 이 사건 강판조각은 형소법 제218조의 유류물이고 이 사건 차량에서 탈거 또는 채취된 이 사건 보강용 강판과 페인트는 차량의 보관자가 감정을 위하여 임의로 제출한 물건에 각 해당한다는 점, 압수 후 압수조서의 작성 및 압수목록의 작성, 교부 절차가 제대로 이행되지 아니한 잘못이 있다 하더라도, 그것이 적법절차의 실질적인 내용을 침해하지 않는 점 등을 앞서 본 법리에 비추어 보면 위 각 증거는 영장을 요하지 않는 임의제출물로 증거능력 있음 / O 감정인이 이 사건 강판조각이 이 사건 보강용 강판에서 분리된 것인지 여부를 감정하는 과정에서 이를 두드려 펴 그 형상에 변형을 가한 행위는 법원의 허가를 얻어야 하는 물건의 파괴로는 볼 수 없고 임의수사인 감정에 수반되는 행위이며, 페인트 성분을 비교분석한 행위 역시 법원의 허가를 얻어야 하는 물건의 파괴로는 볼 수 없고 임의수사인 감정에 해당하여 영장을 요하지 않음 / O 피고인과 변호인의 위법하게 수집된 증거에 관한 주장은 받아들이지 아니함 / 나) 1차 사고가 존재하지 않았다는 주장 / (1) 검제증 / (2) 부족판단 / (가) 법리 / O 살인죄 등과 같이 법정형이 무거운 범죄의 경우에도 직접증거 없이 간접증거만으로 유죄를 인정할 수 있으나, 간접증거에 의하여 주요사실의 전제가 되는 간접사실을 인정함에 있어서는 그 증명이 합리적인 의심을 허용하지 않을 정도에 이르러야 하고, 그 하나하나의 간접사실은 그 사이에 모순, 저촉이 없어야 함은 물론 논리와 경험칙, 과학법칙에 의하여 뒷받침되어야 함 / (나) 인정사실 / - 사고 현장 인근 대전차 방호벽 내부 철제구조물에서 강판조각이 발견됨 / - 이 사건 강판조각의 파단면은 피고인 차량 우측 앞 휀더의 보강용 강판 파단면과 파단각도 및 접합물질의 연장선이 일치하고, 두 조각을 펴서 비교했을 때 크기와 모양이 유사함 / - 피고인 차량에 가로방향으로 긁힌 흔적이 있고 우측 앞 휀더부터 우측 앞 문짝 끝부분까지 찢겨진 손상이 있음 / - 이 사건 보강용 강판의 지면으로부터의 높이는 약 90cm이고, 철제구조물의 높이는 약 79~91cm이며, 강판조각이 발견된 높이는 약 86~90cm임 / - 피고인 차량 우측 앞 문짝에는 약 88~90cm 높이와 약 80cm 높이에 두 줄로 긁힌 흔적이 있음 / - 사고 직후 촬영된 현장 사진 파일을 분석한 결과, 철제구조물에 회색 계통의 물체가 식별됨 / - 피해자는 사고 직후 운전석 옆 좌석 밑으로 들어가 있는 상태로 발견되었고 안면부와 두부에는 에어백이나 전면 유리창에 충격한 흔적이 없음 / (다) 판단 / O 앞서 본 법리와 위 인정사실에 의해 알 수 있는 다음 사정들을 종합하여 보면 피고인이 살인을 저지른 바 없다고 부인하고 있고 그에 관한 직접증거도 없는 이 사건에서, 검사가 제출한 증거들 만으로는 살인의 범의에 기한 1차 사고가 존재하였음이 합리적 의심의 여지가 없을 정도로 증명되었다고 보기 어려움 / - 이 사건 사고 직후에 촬영된 사진들 중 이 사건 철제구조물이 나온 사진들의 컴퓨터 파일을 확대, 분석한 감정서에는 이 사건 철제구조물과는 구분되는 회색계통 물체가 식별된다는 감정결과만 있을 뿐, 그 모양이 강판 끼어있음 사진상의 강판조각과 일치함을 인정할 만한 다른 객관적 자료는 없음 / - 공소외 1이 작성한 감정서의 감정결과는 이 사건 강판조각의 일부 파단면을 이 사건 보강용 강판의 파단면에 비교하여 보거나 이 사건 강판조각과 이 사건 보강용 강판을 두들겨 펴서 크기를 비교하는 육안 관찰의 방법에 따른 것일 뿐, 양자의 성분 비교 등 과학적 분석과정을 전혀 거치지 아니한 것임 / - 위 감정서의 차량 우측면의 적색 페인트와 철제구조물의 페인트가 유사하다는 감정결과는 적외선 흡수 스펙트럼 실험 결과가 첨부되어 있지도 않아 어떤 근거에서 유사하다고 판단한 것인지 알 방법이 없음 / - 차량 우측 부위에 발생한 긁힌 흔적과 찢긴 손상만으로는 2차 사고에 선행하여 1차 사고가 발생한 사실이 증명된다고 단정하기 어려움 / - 이 사건 차량이 위 방호벽 전방의 옹벽과 알람등에 충돌하며 그러한 흔적 등이 발생하였을 가능성을 배제하기도 어려움 / - 피해자가 당초 정상적으로 조수석에 앉아 있는 상태에서 1차 사고로 정신을 잃고 제대로 앉아 있을 수 없을 만큼 강한 충격을 받았다면, 피해자의 안면부나 두부 등에 충격의 흔적이 생겼어야 할 터인데 그러하지 아니함 / (3) 부족증거 / 그 외 나머지 증거들만으로는 피고인에게 살인의 고의가 있었다고 인정하기에 부족하고 달리 이를 인정할 증거가 없음 / (4) 소결론 / 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 공소사실 : 피고인이 자신의 처인 피해자를 승용차 조수석에 태우고 운전하던 중 교통사고를 가장하여 살해하기로 마음먹고 도로 옆에 설치된 대전차 방호벽의 안쪽 벽면을 차량 우측 부분으로 들이받아 피해자가 차에서 탈출하거나 저항할 수 없는 상태가 되자(1차 사고), 사고 장소로 되돌아와 다시 차량 앞범퍼 부분으로 방호벽 중 진행방향 오른쪽 돌출된 부분의 모서리를 들이받아(2차 사고) 피해자를 살해하였음\n2) 감정인은 경찰서로부터 이 사건 사고의 재구성에 대하여 감정의뢰를 받아 경찰관 P1과 함께 이 사건 사고현장을 방문하여 현장조사를 하던 중 이 사건 보강용 강판조각을 발견하였음. 경찰관은 강판조각이 이 사건 철제구조물에 끼어 있는 것을 발견하고 감정인의 지시에 따라 사진(이하 강판 끼어있음 사진)을 찍었음. 그 후 감정인은 국립과학수사연구소에서 보관 중이던 이 사건 차량의 좌측 휀더를 탈거하여 이 사건 강판조각과 강판구조물의 형상과 비교하였으며, 위 강판조각과 강판을 두들겨 펴서 크기를 비교하는 실험을 하였고, 이를 감정결과에 기재하였음 (1심 5회 공판기일에서 감정인이 위 기재의 성립의 진정을 인정함)\n3) 수사기관은 소유권포기확인서에 피고인의 무인을 받고 피고인으로부터 보강용 강판조각을 압수하였고, 이 사건 철제구조물에 부착된 페인트가루는 P1이 채취하여 감정인에게 등기로 보냈고, 이 사건 차량에 묻은 페인트는 VV공업사에 보관중이던 이 사건 차량을 VV공업사로부터 임의로 제출받아 국립과학수사연구소에서 직접 채취하였음. (각 압수물에 대하여 압수조서의 작성 및 압수목록의 작성, 교부 절차는 이루어지지 않았음)\n4) 피고인의 변소 : (1) 커브길에서의 운전미숙으로 인한 교통사고임 (2) 수사기관에서 압수한 차량부품조각 2개는 그 성질과 형상의 변형을 가한 것이므로 그 진정성을 인정할 수 없고, 그 압수 및 감정 과정에 영장주의 원칙 등 중대한 절차적 위법이 있으므로 증거능력이 없으며, 이를 근거로 작성된 감정인 작성의 감정서 중 보강용 강판조각에 대한 부분은 증거능력이 없음 (3) 감정인은 피고인의 동의나 법원으로부터 영장을 발부받지 아니하고 이 사건 차량에 묻은 적색페인트를 채취하여 방호벽 내부 측면벽에 부착된 철제구조물의 도색 페인트와 비교분석 하였으므로, 그 감정결과 부분은 증거능력이 없음","링판번호":136},{"카드ID":"C132-2","판례ID":"C132","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"감정결과의 증거능력을 인정하기 위한 요건","사건번호":"2011도1902","태그":["L"],"중요도":1,"단락순번":2,"총단락수":3,"법리원문":"살인죄 등과 같이 법정형이 무거운 범죄의 경우에도 직접증거 없이 간접증거만으로 유죄를 인정할 수 있으나, 그러한 유죄 인정에는 공소사실에 대한 관련성이 깊은 간접증거들에 의하여 신중한 판단이 요구되므로, 간접증거에 의하여 주요사실의 전제가 되는 간접사실을 인정할 때에는 증명이 합리적인 의심을 허용하지 않을 정도에 이르러야 하고, 하나하나의 간접사실 사이에 모순, 저촉이 없어야 하는 것은 물론 간접사실이 논리와 경험칙, 과학법칙에 의하여 뒷받침되어야 함","힌트_첫어절":"살인죄 등과 같이 법정형이","힌트_초성":"ㅅㅇㅈ ㄷㄱ ㄱㅇ ㅂㅈㅎㅇ ㅁㄱㅇ ㅂㅈㅇ ㄱㅇㅇㄷ ㅈㅈㅈㄱ ㅇㅇ ㄱㅈㅈㄱㅁㅇㄹ ㅇㅈㄹ ㅇㅈㅎ ㅅ ㅇㅇㄴ, ㄱㄹㅎ ㅇㅈ ㅇㅈㅇㄴ ㄱㅅㅅㅅㅇ ㄷㅎ ㄱㄹㅅㅇ ㄱㅇ ㄱㅈㅈㄱㄷㅇ ㅇㅎㅇ ㅅㅈㅎ ㅍㄷㅇ ㅇㄱㄷㅁㄹ, ㄱㅈㅈㄱㅇ ㅇㅎㅇ ㅈㅇㅅㅅㅇ ㅈㅈㄱ ㄷㄴ ㄱㅈㅅㅅㅇ ㅇㅈㅎ ㄸㅇㄴ ㅈㅁㅇ ㅎㄹㅈㅇ ㅇㅅㅇ ㅎㅇㅎㅈ ㅇㅇ ㅈㄷㅇ ㅇㄹㄹㅇ ㅎㄱ, ㅎㄴㅎㄴㅇ ㄱㅈㅅㅅ ㅅㅇㅇ ㅁㅅ, ㅈㅊㅇ ㅇㅇㅇ ㅎㄴ ㄱㅇ ㅁㄹ ㄱㅈㅅㅅㅇ ㄴㄹㅇ ㄱㅎㅊ, ㄱㅎㅂㅊㅇ ㅇㅎㅇ ㄷㅂㅊㄷㅇㅇ ㅎ","핵심키워드":["간접증거","살인죄","간접사실","주요사실","과학법칙","직접증거","법정형","유죄","관련성","범죄","전제","의심","공소사실","증명","경험칙","요구","허용"],"빈칸":{"1":[[0,3],[10,13],[19,21],[28,32],[36,40],[44,46],[63,65],[71,75],[80,83],[88,92],[107,109],[114,118],[124,128],[130,132],[137,141],[151,153],[160,162],[164,166],[191,195],[221,225],[231,234],[236,240]],"2":[[0,3],[10,13],[19,21],[28,32],[36,40],[44,46],[63,65],[71,75],[80,83],[88,92],[99,101],[107,109],[114,118],[124,128],[130,132],[137,141],[151,153],[160,162],[164,166],[191,195],[200,202],[204,206],[221,225],[227,229],[231,234],[236,240]],"3":[[0,46],[63,141],[151,166],[191,206],[221,240]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 피고인 사고 낸 사실 인정하나 운전미숙으로 인한 교통사고이므로 살인의 범의에 기한 1차 사고가 존재하지 않았다고 주장함 / O 변호인 수사기관에서 압수한 보강용 강판, 강판조각과 페인트의 각 압수 및 감정 과정에 절차적 위법이 있으므로 강판조각 등 증거능력 없다고 주장함 / 2) 검토 / 가) 위법수집증거여부 / (1) 법리 / O 형소법 제218조에 의하여 피의자 기타인의 유류한 물건이나 소유자, 소지자 또는 보관자가 임의로 제출한 물건은 영장없이 압수할 수 있음 / O 형소법 제173조 제1항에 의해 감정인은 감정에 관하여 필요한 때 법원의 허가를 얻어야 물건의 파괴 등을 할 수 있음 / (2) 인정사실 / 경찰관 이 사건 보강용 강판 임의제출 받음, 철제구조물에서 이 사건 강판조각 발견, 철제 구조물에 부착된 페인트와 이 사건 차량에 묻은 페인트 대조, 강판조각 두들겨 펴서 이 사건 보강용 강판과 크기 비교, 피고인으로부터 강판조각 임의제출 받는 형식으로 압수 / (3) 판단 / O 위 인정사실을 종합하여 알 수 있는 다음과 같은 사정들, 즉 이 사건 강판조각은 형소법 제218조의 유류물이고 이 사건 차량에서 탈거 또는 채취된 이 사건 보강용 강판과 페인트는 차량의 보관자가 감정을 위하여 임의로 제출한 물건에 각 해당한다는 점, 압수 후 압수조서의 작성 및 압수목록의 작성, 교부 절차가 제대로 이행되지 아니한 잘못이 있다 하더라도, 그것이 적법절차의 실질적인 내용을 침해하지 않는 점 등을 앞서 본 법리에 비추어 보면 위 각 증거는 영장을 요하지 않는 임의제출물로 증거능력 있음 / O 감정인이 이 사건 강판조각이 이 사건 보강용 강판에서 분리된 것인지 여부를 감정하는 과정에서 이를 두드려 펴 그 형상에 변형을 가한 행위는 법원의 허가를 얻어야 하는 물건의 파괴로는 볼 수 없고 임의수사인 감정에 수반되는 행위이며, 페인트 성분을 비교분석한 행위 역시 법원의 허가를 얻어야 하는 물건의 파괴로는 볼 수 없고 임의수사인 감정에 해당하여 영장을 요하지 않음 / O 피고인과 변호인의 위법하게 수집된 증거에 관한 주장은 받아들이지 아니함 / 나) 1차 사고가 존재하지 않았다는 주장 / (1) 검제증 / (2) 부족판단 / (가) 법리 / O 살인죄 등과 같이 법정형이 무거운 범죄의 경우에도 직접증거 없이 간접증거만으로 유죄를 인정할 수 있으나, 간접증거에 의하여 주요사실의 전제가 되는 간접사실을 인정함에 있어서는 그 증명이 합리적인 의심을 허용하지 않을 정도에 이르러야 하고, 그 하나하나의 간접사실은 그 사이에 모순, 저촉이 없어야 함은 물론 논리와 경험칙, 과학법칙에 의하여 뒷받침되어야 함 / (나) 인정사실 / - 사고 현장 인근 대전차 방호벽 내부 철제구조물에서 강판조각이 발견됨 / - 이 사건 강판조각의 파단면은 피고인 차량 우측 앞 휀더의 보강용 강판 파단면과 파단각도 및 접합물질의 연장선이 일치하고, 두 조각을 펴서 비교했을 때 크기와 모양이 유사함 / - 피고인 차량에 가로방향으로 긁힌 흔적이 있고 우측 앞 휀더부터 우측 앞 문짝 끝부분까지 찢겨진 손상이 있음 / - 이 사건 보강용 강판의 지면으로부터의 높이는 약 90cm이고, 철제구조물의 높이는 약 79~91cm이며, 강판조각이 발견된 높이는 약 86~90cm임 / - 피고인 차량 우측 앞 문짝에는 약 88~90cm 높이와 약 80cm 높이에 두 줄로 긁힌 흔적이 있음 / - 사고 직후 촬영된 현장 사진 파일을 분석한 결과, 철제구조물에 회색 계통의 물체가 식별됨 / - 피해자는 사고 직후 운전석 옆 좌석 밑으로 들어가 있는 상태로 발견되었고 안면부와 두부에는 에어백이나 전면 유리창에 충격한 흔적이 없음 / (다) 판단 / O 앞서 본 법리와 위 인정사실에 의해 알 수 있는 다음 사정들을 종합하여 보면 피고인이 살인을 저지른 바 없다고 부인하고 있고 그에 관한 직접증거도 없는 이 사건에서, 검사가 제출한 증거들 만으로는 살인의 범의에 기한 1차 사고가 존재하였음이 합리적 의심의 여지가 없을 정도로 증명되었다고 보기 어려움 / - 이 사건 사고 직후에 촬영된 사진들 중 이 사건 철제구조물이 나온 사진들의 컴퓨터 파일을 확대, 분석한 감정서에는 이 사건 철제구조물과는 구분되는 회색계통 물체가 식별된다는 감정결과만 있을 뿐, 그 모양이 강판 끼어있음 사진상의 강판조각과 일치함을 인정할 만한 다른 객관적 자료는 없음 / - 공소외 1이 작성한 감정서의 감정결과는 이 사건 강판조각의 일부 파단면을 이 사건 보강용 강판의 파단면에 비교하여 보거나 이 사건 강판조각과 이 사건 보강용 강판을 두들겨 펴서 크기를 비교하는 육안 관찰의 방법에 따른 것일 뿐, 양자의 성분 비교 등 과학적 분석과정을 전혀 거치지 아니한 것임 / - 위 감정서의 차량 우측면의 적색 페인트와 철제구조물의 페인트가 유사하다는 감정결과는 적외선 흡수 스펙트럼 실험 결과가 첨부되어 있지도 않아 어떤 근거에서 유사하다고 판단한 것인지 알 방법이 없음 / - 차량 우측 부위에 발생한 긁힌 흔적과 찢긴 손상만으로는 2차 사고에 선행하여 1차 사고가 발생한 사실이 증명된다고 단정하기 어려움 / - 이 사건 차량이 위 방호벽 전방의 옹벽과 알람등에 충돌하며 그러한 흔적 등이 발생하였을 가능성을 배제하기도 어려움 / - 피해자가 당초 정상적으로 조수석에 앉아 있는 상태에서 1차 사고로 정신을 잃고 제대로 앉아 있을 수 없을 만큼 강한 충격을 받았다면, 피해자의 안면부나 두부 등에 충격의 흔적이 생겼어야 할 터인데 그러하지 아니함 / (3) 부족증거 / 그 외 나머지 증거들만으로는 피고인에게 살인의 고의가 있었다고 인정하기에 부족하고 달리 이를 인정할 증거가 없음 / (4) 소결론 / 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 공소사실 : 피고인이 자신의 처인 피해자를 승용차 조수석에 태우고 운전하던 중 교통사고를 가장하여 살해하기로 마음먹고 도로 옆에 설치된 대전차 방호벽의 안쪽 벽면을 차량 우측 부분으로 들이받아 피해자가 차에서 탈출하거나 저항할 수 없는 상태가 되자(1차 사고), 사고 장소로 되돌아와 다시 차량 앞범퍼 부분으로 방호벽 중 진행방향 오른쪽 돌출된 부분의 모서리를 들이받아(2차 사고) 피해자를 살해하였음\n2) 감정인은 경찰서로부터 이 사건 사고의 재구성에 대하여 감정의뢰를 받아 경찰관 P1과 함께 이 사건 사고현장을 방문하여 현장조사를 하던 중 이 사건 보강용 강판조각을 발견하였음. 경찰관은 강판조각이 이 사건 철제구조물에 끼어 있는 것을 발견하고 감정인의 지시에 따라 사진(이하 강판 끼어있음 사진)을 찍었음. 그 후 감정인은 국립과학수사연구소에서 보관 중이던 이 사건 차량의 좌측 휀더를 탈거하여 이 사건 강판조각과 강판구조물의 형상과 비교하였으며, 위 강판조각과 강판을 두들겨 펴서 크기를 비교하는 실험을 하였고, 이를 감정결과에 기재하였음 (1심 5회 공판기일에서 감정인이 위 기재의 성립의 진정을 인정함)\n3) 수사기관은 소유권포기확인서에 피고인의 무인을 받고 피고인으로부터 보강용 강판조각을 압수하였고, 이 사건 철제구조물에 부착된 페인트가루는 P1이 채취하여 감정인에게 등기로 보냈고, 이 사건 차량에 묻은 페인트는 VV공업사에 보관중이던 이 사건 차량을 VV공업사로부터 임의로 제출받아 국립과학수사연구소에서 직접 채취하였음. (각 압수물에 대하여 압수조서의 작성 및 압수목록의 작성, 교부 절차는 이루어지지 않았음)\n4) 피고인의 변소 : (1) 커브길에서의 운전미숙으로 인한 교통사고임 (2) 수사기관에서 압수한 차량부품조각 2개는 그 성질과 형상의 변형을 가한 것이므로 그 진정성을 인정할 수 없고, 그 압수 및 감정 과정에 영장주의 원칙 등 중대한 절차적 위법이 있으므로 증거능력이 없으며, 이를 근거로 작성된 감정인 작성의 감정서 중 보강용 강판조각에 대한 부분은 증거능력이 없음 (3) 감정인은 피고인의 동의나 법원으로부터 영장을 발부받지 아니하고 이 사건 차량에 묻은 적색페인트를 채취하여 방호벽 내부 측면벽에 부착된 철제구조물의 도색 페인트와 비교분석 하였으므로, 그 감정결과 부분은 증거능력이 없음","링판번호":136},{"카드ID":"C132-3","판례ID":"C132","대분류":"7. 증거능력","중분류":"다. 위법수집증거 배제법칙","소분류":"2) 위법수집증거의 유형","쟁점":"감정결과의 증거능력을 인정하기 위한 요건","사건번호":"2011도1902","태그":["L"],"중요도":1,"단락순번":3,"총단락수":3,"법리원문":"공소사실을 뒷받침하는 과학적 증거방법은 전제로 하는 사실이 모두 진실인 것이 입증되고 추론의 방법이 과학적으로 정당하여 오류 가능성이 전혀 없거나 무시할 정도로 극소한 것으로 인정되는 경우라야 법관이 사실인정을 하는 데 상당한 정도로 구속력을 가진다 할 것인데, 이를 위해서는 그 증거방법이 전문적인 지식, 기술, 경험을 가진 감정인에 의하여 공인된 표준 검사기법으로 분석을 거쳐 법원에 제출된 것이어야 할 뿐만 아니라, 채취, 보관, 분석 등 모든 과정에서 자료의 동일성이 인정되고 인위적인 조작, 훼손, 첨가가 없었다는 것이 담보되어야 함","힌트_첫어절":"공소사실을 뒷받침하는 과학적 증거방법은","힌트_초성":"ㄱㅅㅅㅅㅇ ㄷㅂㅊㅎㄴ ㄱㅎㅈ ㅈㄱㅂㅂㅇ ㅈㅈㄹ ㅎㄴ ㅅㅅㅇ ㅁㄷ ㅈㅅㅇ ㄱㅇ ㅇㅈㄷㄱ ㅊㄹㅇ ㅂㅂㅇ ㄱㅎㅈㅇㄹ ㅈㄷㅎㅇ ㅇㄹ ㄱㄴㅅㅇ ㅈㅎ ㅇㄱㄴ ㅁㅅㅎ ㅈㄷㄹ ㄱㅅㅎ ㄱㅇㄹ ㅇㅈㄷㄴ ㄱㅇㄹㅇ ㅂㄱㅇ ㅅㅅㅇㅈㅇ ㅎㄴ ㄷ ㅅㄷㅎ ㅈㄷㄹ ㄱㅅㄹㅇ ㄱㅈㄷ ㅎ ㄱㅇㄷ, ㅇㄹ ㅇㅎㅅㄴ ㄱ ㅈㄱㅂㅂㅇ ㅈㅁㅈㅇ ㅈㅅ, ㄱㅅ, ㄱㅎㅇ ㄱㅈ ㄱㅈㅇㅇ ㅇㅎㅇ ㄱㅇㄷ ㅍㅈ ㄱㅅㄱㅂㅇㄹ ㅂㅅㅇ ㄱㅊ ㅂㅇㅇ ㅈㅊㄷ ㄱㅇㅇㅇ ㅎ ㅃㅁ ㅇㄴㄹ, ㅊㅊ, ㅂㄱ, ㅂㅅ ㄷ ㅁㄷ ㄱㅈㅇㅅ ㅈㄹㅇ ㄷㅇㅅㅇ ㅇㅈㄷㄱ ㅇㅇㅈㅇ ㅈㅈ, ㅎㅅ, ㅊㄱㄱ ㅇㅇㄷㄴ ㄱㅇ ㄷㅂㄷㅇㅇ ㅎ","핵심키워드":["검사기법","분석","사실인정","증거방법","감정인","보관","동일성","진실","자료","전제","구속력","공소사실","과정","담보","입증","제출"],"빈칸":{"1":[[0,4],[16,20],[22,24],[36,38],[43,45],[112,116],[131,134],[157,161],[183,186],[199,203],[206,208],[217,219],[240,242],[244,246],[252,254],[257,259],[261,264],[296,298]],"2":[[0,4],[16,20],[22,24],[36,38],[43,45],[48,50],[67,69],[108,110],[112,116],[131,134],[157,161],[168,170],[176,178],[183,186],[199,203],[206,208],[213,215],[217,219],[236,238],[240,242],[244,246],[252,254],[257,259],[261,264],[276,278],[280,282],[296,298]],"3":[[0,4],[16,24],[36,50],[67,69],[108,116],[131,134],[157,186],[199,219],[236,264],[276,282],[284,303]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 피고인 사고 낸 사실 인정하나 운전미숙으로 인한 교통사고이므로 살인의 범의에 기한 1차 사고가 존재하지 않았다고 주장함 / O 변호인 수사기관에서 압수한 보강용 강판, 강판조각과 페인트의 각 압수 및 감정 과정에 절차적 위법이 있으므로 강판조각 등 증거능력 없다고 주장함 / 2) 검토 / 가) 위법수집증거여부 / (1) 법리 / O 형소법 제218조에 의하여 피의자 기타인의 유류한 물건이나 소유자, 소지자 또는 보관자가 임의로 제출한 물건은 영장없이 압수할 수 있음 / O 형소법 제173조 제1항에 의해 감정인은 감정에 관하여 필요한 때 법원의 허가를 얻어야 물건의 파괴 등을 할 수 있음 / (2) 인정사실 / 경찰관 이 사건 보강용 강판 임의제출 받음, 철제구조물에서 이 사건 강판조각 발견, 철제 구조물에 부착된 페인트와 이 사건 차량에 묻은 페인트 대조, 강판조각 두들겨 펴서 이 사건 보강용 강판과 크기 비교, 피고인으로부터 강판조각 임의제출 받는 형식으로 압수 / (3) 판단 / O 위 인정사실을 종합하여 알 수 있는 다음과 같은 사정들, 즉 이 사건 강판조각은 형소법 제218조의 유류물이고 이 사건 차량에서 탈거 또는 채취된 이 사건 보강용 강판과 페인트는 차량의 보관자가 감정을 위하여 임의로 제출한 물건에 각 해당한다는 점, 압수 후 압수조서의 작성 및 압수목록의 작성, 교부 절차가 제대로 이행되지 아니한 잘못이 있다 하더라도, 그것이 적법절차의 실질적인 내용을 침해하지 않는 점 등을 앞서 본 법리에 비추어 보면 위 각 증거는 영장을 요하지 않는 임의제출물로 증거능력 있음 / O 감정인이 이 사건 강판조각이 이 사건 보강용 강판에서 분리된 것인지 여부를 감정하는 과정에서 이를 두드려 펴 그 형상에 변형을 가한 행위는 법원의 허가를 얻어야 하는 물건의 파괴로는 볼 수 없고 임의수사인 감정에 수반되는 행위이며, 페인트 성분을 비교분석한 행위 역시 법원의 허가를 얻어야 하는 물건의 파괴로는 볼 수 없고 임의수사인 감정에 해당하여 영장을 요하지 않음 / O 피고인과 변호인의 위법하게 수집된 증거에 관한 주장은 받아들이지 아니함 / 나) 1차 사고가 존재하지 않았다는 주장 / (1) 검제증 / (2) 부족판단 / (가) 법리 / O 살인죄 등과 같이 법정형이 무거운 범죄의 경우에도 직접증거 없이 간접증거만으로 유죄를 인정할 수 있으나, 간접증거에 의하여 주요사실의 전제가 되는 간접사실을 인정함에 있어서는 그 증명이 합리적인 의심을 허용하지 않을 정도에 이르러야 하고, 그 하나하나의 간접사실은 그 사이에 모순, 저촉이 없어야 함은 물론 논리와 경험칙, 과학법칙에 의하여 뒷받침되어야 함 / (나) 인정사실 / - 사고 현장 인근 대전차 방호벽 내부 철제구조물에서 강판조각이 발견됨 / - 이 사건 강판조각의 파단면은 피고인 차량 우측 앞 휀더의 보강용 강판 파단면과 파단각도 및 접합물질의 연장선이 일치하고, 두 조각을 펴서 비교했을 때 크기와 모양이 유사함 / - 피고인 차량에 가로방향으로 긁힌 흔적이 있고 우측 앞 휀더부터 우측 앞 문짝 끝부분까지 찢겨진 손상이 있음 / - 이 사건 보강용 강판의 지면으로부터의 높이는 약 90cm이고, 철제구조물의 높이는 약 79~91cm이며, 강판조각이 발견된 높이는 약 86~90cm임 / - 피고인 차량 우측 앞 문짝에는 약 88~90cm 높이와 약 80cm 높이에 두 줄로 긁힌 흔적이 있음 / - 사고 직후 촬영된 현장 사진 파일을 분석한 결과, 철제구조물에 회색 계통의 물체가 식별됨 / - 피해자는 사고 직후 운전석 옆 좌석 밑으로 들어가 있는 상태로 발견되었고 안면부와 두부에는 에어백이나 전면 유리창에 충격한 흔적이 없음 / (다) 판단 / O 앞서 본 법리와 위 인정사실에 의해 알 수 있는 다음 사정들을 종합하여 보면 피고인이 살인을 저지른 바 없다고 부인하고 있고 그에 관한 직접증거도 없는 이 사건에서, 검사가 제출한 증거들 만으로는 살인의 범의에 기한 1차 사고가 존재하였음이 합리적 의심의 여지가 없을 정도로 증명되었다고 보기 어려움 / - 이 사건 사고 직후에 촬영된 사진들 중 이 사건 철제구조물이 나온 사진들의 컴퓨터 파일을 확대, 분석한 감정서에는 이 사건 철제구조물과는 구분되는 회색계통 물체가 식별된다는 감정결과만 있을 뿐, 그 모양이 강판 끼어있음 사진상의 강판조각과 일치함을 인정할 만한 다른 객관적 자료는 없음 / - 공소외 1이 작성한 감정서의 감정결과는 이 사건 강판조각의 일부 파단면을 이 사건 보강용 강판의 파단면에 비교하여 보거나 이 사건 강판조각과 이 사건 보강용 강판을 두들겨 펴서 크기를 비교하는 육안 관찰의 방법에 따른 것일 뿐, 양자의 성분 비교 등 과학적 분석과정을 전혀 거치지 아니한 것임 / - 위 감정서의 차량 우측면의 적색 페인트와 철제구조물의 페인트가 유사하다는 감정결과는 적외선 흡수 스펙트럼 실험 결과가 첨부되어 있지도 않아 어떤 근거에서 유사하다고 판단한 것인지 알 방법이 없음 / - 차량 우측 부위에 발생한 긁힌 흔적과 찢긴 손상만으로는 2차 사고에 선행하여 1차 사고가 발생한 사실이 증명된다고 단정하기 어려움 / - 이 사건 차량이 위 방호벽 전방의 옹벽과 알람등에 충돌하며 그러한 흔적 등이 발생하였을 가능성을 배제하기도 어려움 / - 피해자가 당초 정상적으로 조수석에 앉아 있는 상태에서 1차 사고로 정신을 잃고 제대로 앉아 있을 수 없을 만큼 강한 충격을 받았다면, 피해자의 안면부나 두부 등에 충격의 흔적이 생겼어야 할 터인데 그러하지 아니함 / (3) 부족증거 / 그 외 나머지 증거들만으로는 피고인에게 살인의 고의가 있었다고 인정하기에 부족하고 달리 이를 인정할 증거가 없음 / (4) 소결론 / 후단무죄","발문":"7. 증거능력 > 다. 위법수집증거 배제법칙 > 2) 위법수집증거의 유형","사실관계":"1) 공소사실 : 피고인이 자신의 처인 피해자를 승용차 조수석에 태우고 운전하던 중 교통사고를 가장하여 살해하기로 마음먹고 도로 옆에 설치된 대전차 방호벽의 안쪽 벽면을 차량 우측 부분으로 들이받아 피해자가 차에서 탈출하거나 저항할 수 없는 상태가 되자(1차 사고), 사고 장소로 되돌아와 다시 차량 앞범퍼 부분으로 방호벽 중 진행방향 오른쪽 돌출된 부분의 모서리를 들이받아(2차 사고) 피해자를 살해하였음\n2) 감정인은 경찰서로부터 이 사건 사고의 재구성에 대하여 감정의뢰를 받아 경찰관 P1과 함께 이 사건 사고현장을 방문하여 현장조사를 하던 중 이 사건 보강용 강판조각을 발견하였음. 경찰관은 강판조각이 이 사건 철제구조물에 끼어 있는 것을 발견하고 감정인의 지시에 따라 사진(이하 강판 끼어있음 사진)을 찍었음. 그 후 감정인은 국립과학수사연구소에서 보관 중이던 이 사건 차량의 좌측 휀더를 탈거하여 이 사건 강판조각과 강판구조물의 형상과 비교하였으며, 위 강판조각과 강판을 두들겨 펴서 크기를 비교하는 실험을 하였고, 이를 감정결과에 기재하였음 (1심 5회 공판기일에서 감정인이 위 기재의 성립의 진정을 인정함)\n3) 수사기관은 소유권포기확인서에 피고인의 무인을 받고 피고인으로부터 보강용 강판조각을 압수하였고, 이 사건 철제구조물에 부착된 페인트가루는 P1이 채취하여 감정인에게 등기로 보냈고, 이 사건 차량에 묻은 페인트는 VV공업사에 보관중이던 이 사건 차량을 VV공업사로부터 임의로 제출받아 국립과학수사연구소에서 직접 채취하였음. (각 압수물에 대하여 압수조서의 작성 및 압수목록의 작성, 교부 절차는 이루어지지 않았음)\n4) 피고인의 변소 : (1) 커브길에서의 운전미숙으로 인한 교통사고임 (2) 수사기관에서 압수한 차량부품조각 2개는 그 성질과 형상의 변형을 가한 것이므로 그 진정성을 인정할 수 없고, 그 압수 및 감정 과정에 영장주의 원칙 등 중대한 절차적 위법이 있으므로 증거능력이 없으며, 이를 근거로 작성된 감정인 작성의 감정서 중 보강용 강판조각에 대한 부분은 증거능력이 없음 (3) 감정인은 피고인의 동의나 법원으로부터 영장을 발부받지 아니하고 이 사건 차량에 묻은 적색페인트를 채취하여 방호벽 내부 측면벽에 부착된 철제구조물의 도색 페인트와 비교분석 하였으므로, 그 감정결과 부분은 증거능력이 없음","링판번호":136},{"카드ID":"C133-1","판례ID":"C133","대분류":"7. 증거능력","중분류":"증거능력 I","쟁점":"사인의 위법수집증거 (주거침입하여 확보한 물건의 증거능력)","사건번호":"2008도3990","태그":["L"],"중요도":0,"단락순번":1,"총단락수":1,"소제목":"3. '살인의 범의에 기한 1차 사고'의 존재","법리원문":"(사인의 위법수집증거의 증거능력 판단과 관련하여,) 국민의 인간으로서의 존엄과 가치를 보장하는 것은 국가기관의 기본적인 의무에 속하는 것이고 이는 형사절차에서도 당연히 구현되어야 하는 것이지만, 국민의 사생활 영역에 관계된 모든 증거의 제출이 곧바로 금지되는 것으로 볼 수는 없으므로 법원으로서는 효과적인 형사소추 및 형사소송에서의 진실발견이라는 공익과 개인의 인격적 이익 등의 보호이익을 비교형량하여 그 허용 여부를 결정하여야 함","힌트_첫어절":"(사인의 위법수집증거의 증거능력 판단과","힌트_초성":"(ㅅㅇㅇ ㅇㅂㅅㅈㅈㄱㅇ ㅈㄱㄴㄹ ㅍㄷㄱ ㄱㄹㅎㅇ,) ㄱㅁㅇ ㅇㄱㅇㄹㅅㅇ ㅈㅇㄱ ㄱㅊㄹ ㅂㅈㅎㄴ ㄱㅇ ㄱㄱㄱㄱㅇ ㄱㅂㅈㅇ ㅇㅁㅇ ㅅㅎㄴ ㄱㅇㄱ ㅇㄴ ㅎㅅㅈㅊㅇㅅㄷ ㄷㅇㅎ ㄱㅎㄷㅇㅇ ㅎㄴ ㄱㅇㅈㅁ, ㄱㅁㅇ ㅅㅅㅎ ㅇㅇㅇ ㄱㄱㄷ ㅁㄷ ㅈㄱㅇ ㅈㅊㅇ ㄱㅂㄹ ㄱㅈㄷㄴ ㄱㅇㄹ ㅂ ㅅㄴ ㅇㅇㅁㄹ ㅂㅇㅇㄹㅅㄴ ㅎㄱㅈㅇ ㅎㅅㅅㅊ ㅁ ㅎㅅㅅㅅㅇㅅㅇ ㅈㅅㅂㄱㅇㄹㄴ ㄱㅇㄱ ㄱㅇㅇ ㅇㄱㅈ ㅇㅇ ㄷㅇ ㅂㅎㅇㅇㅇ ㅂㄱㅎㄹㅎㅇ ㄱ ㅎㅇ ㅇㅂㄹ ㄱㅈㅎㅇㅇ ㅎ","핵심키워드":["위법수집증거","효과","국가기관","보호이익","형사절차","형사소추","증거능력","의무","형사소송","이익","진실발견","가치","증거","결정","금지","사생활","제출","허용","보장"],"빈칸":{"1":[[5,11],[13,17],[44,46],[48,50],[56,60],[67,69],[82,86],[113,116],[128,130],[132,134],[140,142],[166,168],[171,175],[178,182],[186,190],[206,208],[212,216],[227,229],[234,236]],"2":[[5,11],[13,17],[29,31],[33,35],[40,42],[44,46],[48,50],[56,60],[67,69],[82,86],[109,111],[113,116],[117,119],[128,130],[132,134],[140,142],[159,161],[166,168],[171,175],[178,182],[186,190],[194,196],[206,208],[212,216],[227,229],[234,236]],"3":[[5,17],[29,69],[82,86],[109,119],[128,142],[159,196],[206,216],[227,236]]},"발문":"7. 증거능력 > 증거능력 I","사실관계":"1) 남편인 병이 피고인 갑을 폭행하는 일 등이 발생하자 피고인 갑은 집을 나왔고, 그 다음날 병에게 이혼을 요구했으나 공소외인이 불응하자 거처를 옮겼음\n2) 피고인 갑의 소지품에서 빼내어 따로 복사해 두었던 열쇠로 갑의 집 문을 열고 들어가 쓰레기봉투에서 혈흔이 묻은 휴지 및 침대시트를 수거하였음. 이후 병은 피고인들을 고소하였고, 수사기관에 자신이 수거하였다면서 휴지와 침대시트를 제출하였으며, 병이 의뢰한 감정의뢰회보(유전자분석감정서)에 의하면 병이 제출한 위 휴지와 침대시트에서 피고인 을의 혈액과 일치하는 남성의 유전자형 및 여성의 유전자형이 검출되었음","링판번호":137},{"카드ID":"C134-1","판례ID":"C134","대분류":"7. 증거능력","중분류":"라. 전문법칙","소분류":"1) 법관 또는 법관의 조서 (제311조)","쟁점":"공판기일이 끝난 후 열람, 등사 신청에 응한 경우 공판조서 증거능력","사건번호":"2007도3906","태그":["NL"],"중요도":0,"단락순번":1,"총단락수":1,"소제목":"3. '살인의 범의에 기한 1차 사고'의 존재","법리원문":"형소법 제55조 제1항이 피고인에게 공판조서의 열람 또는 등사청구권을 부여한 이유는 공판조서의 열람 또는 등사를 통하여 피고인으로 하여금 진술자의 진술내용과 그 기재된 조서의 기재 내용의 일치 여부를 확인할 수 있도록 기회를 줌으로써 그 조서의 정확성을 담보함과 아울러 피고인의 방어권을 충실하게 보장하려는 데 있으므로, 비록 피고인이 차회 공판기일 전 등 원하는 시기에 공판조서를 열람, 등사하지 못하였다 하더라도 그 변론종결 이전에 이를 열람, 등사한 경우에는 그 열람, 등사가 늦어짐으로 인하여 피고인의 방어권 행사에 지장이 있었다는 등의 특별한 사정이 없는 한 형소법 제55조 제1항 소정의 피고인의 공판조서의 열람, 등사청구권이 침해되었다고 볼 수 없어, 그 공판조서를 유죄의 증거로 할 수 있다고 보아야 함","힌트_첫어절":"형소법 제55조 제1항이 피고인에게","힌트_초성":"ㅎㅅㅂ ㅈ55ㅈ ㅈ1ㅎㅇ ㅍㄱㅇㅇㄱ ㄱㅍㅈㅅㅇ ㅇㄹ ㄸㄴ ㄷㅅㅊㄱㄱㅇ ㅂㅇㅎ ㅇㅇㄴ ㄱㅍㅈㅅㅇ ㅇㄹ ㄸㄴ ㄷㅅㄹ ㅌㅎㅇ ㅍㄱㅇㅇㄹ ㅎㅇㄱ ㅈㅅㅈㅇ ㅈㅅㄴㅇㄱ ㄱ ㄱㅈㄷ ㅈㅅㅇ ㄱㅈ ㄴㅇㅇ ㅇㅊ ㅇㅂㄹ ㅎㅇㅎ ㅅ ㅇㄷㄹ ㄱㅎㄹ ㅈㅇㄹㅆ ㄱ ㅈㅅㅇ ㅈㅎㅅㅇ ㄷㅂㅎㄱ ㅇㅇㄹ ㅍㄱㅇㅇ ㅂㅇㄱㅇ ㅊㅅㅎㄱ ㅂㅈㅎㄹㄴ ㄷ ㅇㅇㅁㄹ, ㅂㄹ ㅍㄱㅇㅇ ㅊㅎ ㄱㅍㄱㅇ ㅈ ㄷ ㅇㅎㄴ ㅅㄱㅇ ㄱㅍㅈㅅㄹ ㅇㄹ, ㄷㅅㅎㅈ ㅁㅎㅇㄷ ㅎㄷㄹㄷ ㄱ ㅂㄹㅈㄱ ㅇㅈㅇ ㅇㄹ ㅇㄹ, ㄷㅅㅎ ㄱㅇㅇㄴ ㄱ ㅇㄹ, ㄷㅅㄱ ㄴㅇㅈㅇㄹ ㅇㅎㅇ ㅍㄱㅇㅇ ㅂㅇㄱ ㅎㅅㅇ ㅈㅈㅇ ㅇㅇㄷㄴ ㄷㅇ ㅌㅂㅎ ㅅㅈㅇ ㅇㄴ ㅎ ㅎㅅㅂ ㅈ55ㅈ ㅈ1ㅎ ㅅㅈㅇ ㅍㄱㅇㅇ ㄱㅍㅈㅅㅇ ㅇㄹ, ㄷㅅㅊㄱㄱㅇ ㅊㅎㄷㅇㄷㄱ ㅂ ㅅ ㅇㅇ, ㄱ ㄱㅍㅈㅅㄹ ㅇㅈㅇ ㅈㄱㄹ ㅎ ㅅ ㅇㄷㄱ ㅂㅇㅇ ㅎ","핵심키워드":["등사청구권","공판조서","공판기일","조서","진술자","등사","유죄","열람","소정","증거","정확성","진술내용","방어권","행사","확인"],"빈칸":{"1":[[20,24],[26,28],[32,37],[47,51],[53,55],[59,61],[77,80],[82,86],[94,96],[112,114],[133,135],[137,140],[156,159],[191,195],[208,212],[214,216],[218,220],[247,249],[251,253],[262,264],[266,268],[285,288],[289,291],[331,333],[340,344],[346,348],[350,355],[374,378],[380,382],[384,386]],"2":[[0,3],[4,8],[9,12],[14,17],[20,24],[26,28],[32,37],[39,41],[47,51],[53,55],[59,61],[67,70],[77,80],[82,86],[94,96],[112,114 해자 D는 같은 날 경찰에서 이 사건 제1 USB의 제출 경위에 관하여, 저에게 피해 사실을 알려준 언니(피해자 H)가 가지고 있던 피혐의자 USB에 저장된 내용물을 다른 USB에 저장해서 저에게 우편으로 보내주었고, 우편으로 받은 USB를 증거자료로 제출하는 거에요.라고 진술함 / 3) 경찰은 피해자 H으로부터 위 피해자 소유의 USB(제2 USB) 및 위 USB에 담긴 사진 및 동영상 파일을 임의제출받았고 당시 작성된 압수조서에는 라고 기재되어 있음 / 4) 경찰은 피해자들이 제출한 이 사건 제1, 2 USB에서 피해자들의 사진 및 동영상을 확인하였고, 이를 토대로 피고인의 피해자들에 대한 성폭법위반(카메라등이용촬영) 범행 혐의에 대하여 압수수색검증영장을 발부받아 위 영장에 의하여 피고인 소유의 하드디스크, 외장하드, 휴대폰 등 저장장치들을 증거물로 압수함 / 5) 경찰은 위와 같이 압수한 휴대폰 중 2대에 대해 이 사건 공소사실과 관련된 전자정보를 특정하여 해시값을 확인한 후, 피고인에게 상세목록을 전자정보 확인서의 형태로 교부하고 위 전자정보를 증거로 압수하였음. / 6) 경찰은 피해자 D로부터 위 피해자 소유의 USB(제3 USB)를 임의제출받았고 당시 작성된 압수조서에는 -라고 기재되어 있음 / (3) 판단 / O 위 인정사실에 의하여 알 수 있는 다음과 같은 사정들을 종합하면 피해자들이 임의제출한 USB 및 이를 기초로 수집한 2차적 증거는 적법한 절차에 의하여 수집된 증거로서 모두 증거능력이 있음 / - 피해자들이 임의제출한 제1,2,3 USB는 피해자가 소유, 관리에 속하는 정보저장매체로서 그 자체는 피고인과 관련이 없는 점 / - 피고인이 소유, 관리하는 원본 USB는 수사기관에 임의제출되거나 압수된 바 없으므로 원본 USB에 관하여 실질적 피압수자라는 지위를 상정하기 어려운 점 / - 이 사건 전자정보 등의 압수, 수색(임의제출) 과정에서는 특별한 사정이 없는 한 임의제출자인 피해자들(피압수자)에게 형사소송법이 정하는 바에 따라 참여의 기회를 부여하는 것으로 충분하므로 피고인을 실질적 피압수자로 보아 피고인에게까지 참여의 기회를 부여해야만 임의제출이 적법하다고 평가할 수는 없는 점 / O 변호인의 위 주장 받아들이지 아니함 / 나) 증거의 요지","발문":"7. 증거능력 > 라. 전문법칙 > 8) 정보저장매체 및 출력물의 증거능력","사실관계":"피해자들 소유 USB1,2,3에 피고인 소유 USB에 저장되어 있는 사진, 동영상을 복사하고 피해자들이 USB 1,2,3 임의제출","링판번호":154},{"카드ID":"C148-2","판례ID":"C148","대분류":"7. 증거능력","중분류":"라. 전문법칙","소분류":"8) 정보저장매체 및 출력물의 증거능력","쟁점":"전자정보가 제3자 소유, 관리의 정보저장매체에 동일하게 복제되어 임의제출시, 실질적 피압수자 및 참여권의 인정 여부","사건번호":"2023도3626","태그":["NL"],"중요도":2,"단락순번":2,"총단락수":4,"소제목":"3. '살인의 범의에 기한 1차 사고'의 존재","법리원문":"전자정보의 특성을 고려하면, 제3자가 피의자 소유, 관리의 정보저장매체 자체를 수사기관에 제출하는 방법으로 그 정보저장매체 내에 저장된 전자정보를 임의제출하는 것과 그 전자정보를 제3자 소유, 관리의 정보저장매체에 복제한 후 복제 전자정보가 저장된 정보저장매체를 그 제3자가 수사기관에 제출하는 방법으로 복제 전자정보를 임의제출하는 것은 적어도 그 임의제출 과정에서 보장되어야 하는 참여권의 관점에서는 동일하다고 평가할 수 없음","힌트_첫어절":"전자정보의 특성을 고려하면, 제3자가","힌트_초성":"ㅈㅈㅈㅂㅇ ㅌㅅㅇ ㄱㄹㅎㅁ, ㅈ3ㅈㄱ ㅍㅇㅈ ㅅㅇ, ㄱㄹㅇ ㅈㅂㅈㅈㅁㅊ ㅈㅊㄹ ㅅㅅㄱㄱㅇ ㅈㅊㅎㄴ ㅂㅂㅇㄹ ㄱ ㅈㅂㅈㅈㅁㅊ ㄴㅇ ㅈㅈㄷ ㅈㅈㅈㅂㄹ ㅇㅇㅈㅊㅎㄴ ㄱㄱ ㄱ ㅈㅈㅈㅂㄹ ㅈ3ㅈ ㅅㅇ, ㄱㄹㅇ ㅈㅂㅈㅈㅁㅊㅇ ㅂㅈㅎ ㅎ ㅂㅈ ㅈㅈㅈㅂㄱ ㅈㅈㄷ ㅈㅂㅈㅈㅁㅊㄹ ㄱ ㅈ3ㅈㄱ ㅅㅅㄱㄱㅇ ㅈㅊㅎㄴ ㅂㅂㅇㄹ ㅂㅈ ㅈㅈㅈㅂㄹ ㅇㅇㅈㅊㅎㄴ ㄱㅇ ㅈㅇㄷ 들을 증거물로 압수함 / 5) 경찰은 위와 같이 압수한 휴대폰 중 2대에 대해 이 사건 공소사실과 관련된 전자정보를 특정하여 해시값을 확인한 후, 피고인에게 상세목록을 전자정보 확인서의 형태로 교부하고 위 전자정보를 증거로 압수하였음. / 6) 경찰은 피해자 D로부터 위 피해자 소유의 USB(제3 USB)를 임의제출받았고 당시 작성된 압수조서에는 -라고 기재되어 있음 / (3) 판단 / O 위 인정사실에 의하여 알 수 있는 다음과 같은 사정들을 종합하면 피해자들이 임의제출한 USB 및 이를 기초로 수집한 2차적 증거는 적법한 절차에 의하여 수집된 증거로서 모두 증거능력이 있음 / - 피해자들이 임의제출한 제1,2,3 USB는 피해자가 소유, 관리에 속하는 정보저장매체로서 그 자체는 피고인과 관련이 없는 점 / - 피고인이 소유, 관리하는 원본 USB는 수사기관에 임의제출되거나 압수된 바 없으므로 원본 USB에 관하여 실질적 피압수자라는 지위를 상정하기 어려운 점 / - 이 사건 전자정보 등의 압수, 수색(임의제출) 과정에서는 특별한 사정이 없는 한 임의제출자인 피해자들(피압수자)에게 형사소송법이 정하는 바에 따라 참여의 기회를 부여하는 것으로 충분하므로 피고인을 실질적 피압수자로 보아 피고인에게까지 참여의 기회를 부여해야만 임의제출이 적법하다고 평가할 수는 없는 점 / O 변호인의 위 주장 받아들이지 아니함 / 나) 증거의 요지","발문":"7. 증거능력 > 라. 전문법칙 > 8) 정보저장매체 및 출력물의 증거능력","사실관계":"피해자들 소유 USB1,2,3에 피고인 소유 USB에 저장되어 있는 사진, 동영상을 복사하고 피해자들이 USB 1,2,3 임의제출","링판번호":154},{"카드ID":"C149-1","판례ID":"C149","대분류":"7. 증거능력","중분류":"라. 전문법칙","소분류":"8) 정보저장매체 및 출력물의 증거능력","쟁점":"전문증거 해당여부 (진술사실 자체 또는 간접사실에 대한 정황증거)","사건번호":"2012도16001","태그":["L"],"중요도":0,"단락순번":1,"총단락수":1,"소제목":"3. '살인의 범의에 기한 1차 사고'의 존재","법리원문":"어떤 진술이 기재된 서류가 그 내용의 진실성이 범죄사실에 대한 직접증거로 사용될 때는 전문증거가 된다고 하더라도, 그와 같은 진술을 하였다는 것 자체 또는 그 진술의 진실성과 관계없는 간접사실에 대한 정황증거로 사용될 때는 반드시 전문증거가 되는 것은 아님","힌트_첫어절":"어떤 진술이 기재된 서류가","힌트_초성":"ㅇㄸ ㅈㅅㅇ ㄱㅈㄷ ㅅㄹㄱ ㄱ ㄴㅇㅇ ㅈㅅㅅㅇ ㅂㅈㅅㅅㅇ ㄷㅎ ㅈㅈㅈㄱㄹ ㅅㅇㄷ ㄸㄴ ㅈㅁㅈㄱㄱ ㄷㄷㄱ ㅎㄷㄹㄷ, ㄱㅇ ㄱㅇ ㅈㅅㅇ ㅎㅇㄷㄴ ㄱ ㅈㅊ ㄸㄴ ㄱ ㅈㅅㅇ ㅈㅅㅅㄱ ㄱㄱㅇㄴ ㄱㅈㅅㅅㅇ ㄷㅎ ㅈㅎㅈㄱㄹ ㅅㅇㄷ ㄸㄴ ㅂㄷㅅ ㅈㅁㅈㄱㄱ ㄷㄴ ㄱㅇ ㅇㄴ","핵심키워드":["정황증거","전문증거","간접사실","직접증거","진실성","진술","범죄사실","서류","사용"],"유사법리":"C118-2(2018도2738,0.5)","빈칸":{"1":[[3,5],[11,13],[21,24],[26,30],[35,39],[41,43],[48,52],[70,72],[89,91],[93,96],[103,107],[112,116],[118,120],[129,133]],"2":[[3,5],[11,13],[21,24],[26,30],[35,39],[41,43],[48,52],[70,72],[89,91],[93,96],[103,107],[112,116],[118,120],[129,133],[141,143]],"3":[[3,52],[70,72],[89,120],[129,143]]},"발문":"7. 증거능력 > 라. 전문법칙 > 8) 정보저장매체 및 출력물의 증거능력","사실관계":"피고인1이 피고인2와 공모하여 선거사무원으로 신고되지 아니한 채 선거운동을 한 사람들에게 금품제공 약속을 하여 공직선거법을 위반하였다는 공소사실에 피고인이 공동피고인중 1인에 저장되어 있던 파일을 자신의 이메일로 보내면서 그 이메일에 첨부했던 문건 근에서 본드를 흡입한 적이 있다고 진술하자, 피고인이 본드를 흡입한 상태에서 위 각 사건을 저지른 것으로 의심하고, 피해자들로 하여금 피고인이 범인인지 여부를 확인하도록 한 것임 / - 피해자 1의 경우에는 다른 비교대상자 없이 피고인만을 직접 대면하게 하여 피고인이 범인인지 여부를 확인하게 하였고, 공소외 2의 경우에는 피고인만의 사진을 제시한 채 범인인지를 물어 범인일 가능성이 70~80% 정도라는 대답을 들은 후, 피고인과 또 다른 한 사람만을 직접 대면하도록 한 상태에서 피고인이 범인인지 여부를 확인하도록 하였음 / - 피해자 1의 경우에는 사건 발생일로부터 5개월 이상 경과한 후에, 김순옥의 경우에는 3개월 가량 경과한 후에 위와 같은 범인식별절차가 이루어짐 / - 피해자 2는 제1심법정에서 피고인이 범인이라고 확신하는 정도가 70~80% 가량이라고 진술함 / (3) 판단 / 위 인정사실로부터 알 수 있는 다음과 같은 사정들 즉, / - 피해자들은 피고인의 인상착의에 대하여 진술한 바 있으나 피고인을 범인으로 단정 지을 수 있을 정도로 상세한 진술을 한 바 없고 / - 피고인을 범인으로 의심하게된 경위에 비추어 보아도 피고인이 위 사건의 범인이라고 단정할 만한 객관적인 자료를 찾아볼 수 없는 점 / - 범인식별절차에 있어서 신빙성을 높이기 위하여 준수하여야 할 절차를 충족하지 못하였을 뿐 아니라, 그 과정에서 사진상의 인물인 피고인이 위 각 사건의 범인일 가능성이 있다는 암시가 주어졌을 개연성이 있는 점 / - 종전에 피고인을 만난 적이 없던 위 피해자들로서는 기억력의 한계 등으로 인하여 범인에 대한 기억이 부정확할 여지가 있는 점 / - 그 스스로도 피고인이 범인이 아닐 가능성을 배제하지 못하고 있는 점 등에 비추어, 피고인을 위 각 사건의 범인으로 지목한 피해자들의 각 진술은 선뜻 믿기 어려움 / 나) DNA 분석의 증명력에 관하여 / (1) 법리 / DNA분석을 통한 유전자검사 결과는 충분한 전문적인 지식과 경험을 지닌 감정인이 적절하게 관리, 보존된 감정자료에 대하여 일반적으로 확립된 표준적인 검사기법을 활용하여 감정을 실행하고, 그 결과의 분석이 적정한 절차를 통하여 수행되었음이 인정되는 이상 높은 신뢰성을 지닌다 할 것임 / (2) 인정사실 / 경찰은 피해자 1에 대한 특수강간미수 등의 범행이 있은 직후 피해자 1로부터 범인의 정액이 묻어있는 옷을 제출받아 국립과학수사연구소에 유전자감정을 의뢰한 사실, 경찰은 피고인이 위 사건의 범인과 동일인인지 여부를 확인하기 위하여 피고인의 모발 및 타액에 대하여도 국립과학수사연구소에 유전자감정을 의뢰하였는데, DNA분석 결과 피고인의 유전자형이 범인의 그것과 상이하다는 감정 결과가 제1심법원에 제출된 사실이 인정됨. / (3) 판단 / 위 인정사실을 앞서 본 법리에 비추어 보면 위와 같은 감정 결과는 감정인의 자격, 감정자료의 관리 및 보존상태, 검사기법의 적절성, 유전자형이 다르면 동일인이 아니라고 확신할 수 있다는 유전자감정 분야에서 일반적으로 승인된 전문지식 등에 비추어 볼 때 피고인의 무죄를 입증할 수 있는 유력한 증거에 해당함 / 검사의 위 주장 받아들이지 아니함 / 다) 부족증거 / 그 밖의 유죄의 증거로서 피고인의 법정 진술 및 피해자 2의 피해신고서 등을 들고 있으나, 피고인은 제1심 및 원심법정에서 위 각 범행을 저질렀는지 여부가 기억이 나지 않는다는 취지로 진술하였을 뿐이고, 위 피해신고서는 강도치상의 피해를 당한 사실을 신고한다는 내용에 불과하여 위 증거들 만으로는 피고인이 피해자들을 - 하였다는 사실을 인정하기에 부족하고 달리 이를 인정할 증거가 없음 / 라) 소결론 / 이 부분 공소사실은 범죄사실의 증명이 없는 때에 해당하여 형소법 제325조 후단에 의하여 무죄를 선고함","발문":"7. 증거능력 > 라. 전문법칙 > 8) 정보저장매체 및 출력물의 증거능력","사실관계":"1) 피해자 공소외 1에 대한 특수강간미수 등의 범행이 있은 직후, 경찰은 공소외 1로부터 범인의 정액이 묻어있는 옷을 제출받아 국립과학수사연구소에 유전자감정을 의
