<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>형재실 링판 · 법리 암기 & 타자연습</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e2dfd8;
  --accent:#2f4858; --ok:#2f6b3f; --okbg:#e6f2e8; --bad:#a8332b; --badbg:#fbe9e7;
  --pend:#b9b5ad; --warn:#8a6d1f; --warnbg:#fdf5e0; --cur:#fff6d6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* 본문 글꼴·크기는 헌법 앱(constitution/app/index.html)에 맞춘다 — 가독성.
   Pretendard 가 없는 환경에서는 애플 SD 고딕 → 맑은 고딕으로 내려간다. */
body{background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
  font-size:15.5px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
/* 버전·업데이트일 — 부제 옆. 값은 lib/appio.mjs 의 APPS 에 있고 손으로 올린다 */
.ver{font-size:11.5px;color:var(--muted);background:#eceae5;border-radius:999px;
  padding:2px 9px;letter-spacing:.02em;white-space:nowrap}
.ver b{color:var(--ink);font-weight:700}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:10px}
label.f{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
select,input[type=number]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink);max-width:230px}
button{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:var(--ink);cursor:pointer;transition:.12s}
button:hover{background:#f0eee9}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{border-radius:999px;padding:7px 20px;font-size:13.5px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;
  background:#eceae5;color:var(--muted);white-space:nowrap}
.chip.b{background:var(--accent);color:#fff}
.chip.g{background:var(--okbg);color:var(--ok)}
.chip.y{background:var(--warnbg);color:var(--warn)}
.chip.r{background:var(--badbg);color:var(--bad)}
.chip.o{background:#fff;border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:12px}
.bread{font-size:12px;color:var(--muted);margin-bottom:6px}
.issue{font-size:16.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.factlabel{font-size:11.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:5px}
.fact{background:#faf9f6;border-left:3px solid var(--accent);padding:11px 14px;border-radius:0 6px 6px 0;
  font-size:14.5px;white-space:pre-wrap}
.prompt{background:#f4f6f7;border-left:3px solid var(--accent);padding:12px 15px;border-radius:0 6px 6px 0;
  font-size:15px;font-weight:600;letter-spacing:-.01em}
.hintbox{margin-top:10px;font-size:13.5px;color:var(--warn);background:var(--warnbg);
  border-radius:6px;padding:9px 12px;display:none;white-space:pre-wrap;word-break:break-all}
/* 4단계 전문 작성 — 헌법 앱 textarea.recall-input 과 같은 크기 */
textarea{width:100%;min-height:180px;font:inherit;font-size:15.5px;line-height:1.8;padding:14px;
  border:1px solid var(--line);border-radius:8px;resize:vertical;background:#fffef9;color:var(--ink)}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
/* 정답 대조 — 헌법 앱 .diff-view 와 같은 크기 (글꼴은 body 를 물려받는다) */
.diff{font-size:15.5px;line-height:2;white-space:pre-wrap;
  word-break:break-all;margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:8px;
  background:#fcfcfa;display:none}
.diff .ok{color:var(--ok);background:var(--okbg)}
.diff .bad{color:var(--bad);background:var(--badbg);text-decoration:line-through}
.diff .miss{color:var(--bad);background:var(--badbg);border-bottom:2px solid var(--bad)}
.diff .pend{color:var(--pend)}
.answer{display:none;margin-top:12px;padding:14px;border-radius:8px;background:#f2f5f6;
  border:1px solid #dbe3e6;font-size:15.5px;line-height:2;
  white-space:pre-wrap}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.stat b{color:var(--ink);font-weight:700}
.prog{height:5px;background:#e6e3dc;border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:.25s}
.rel{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rel b{color:var(--ink)}
.rel a{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
kbd{font-family:inherit;font-size:11.5px;background:#eceae5;border-radius:4px;padding:1px 5px;color:var(--muted)}
details.more{margin-top:10px;font-size:13px}
details.more summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details.more .body{margin-top:8px;padding:12px 14px;background:#faf9f6;border:1px solid var(--line);
  border-radius:8px;white-space:pre-wrap;line-height:1.85}
.kwlist{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* ---- 단계별 빈칸 ---- */
/* 학습범위는 '목차별' 과 '사례번호' 둘 중 하나로만 정한다. 고르지 않은 쪽은 꺼 둔다 —
   두 방식이 나란히 켜져 있으면 지금 무엇이 범위를 정하는지 화면만 보고 알 수 없다. */
.grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 테두리·여백은 스위치가 있는 앱에서만 준다 — 나머지 넷은 이전과 픽셀이 같아야 한다 */
.grp.on,.grp.off{padding:4px 9px;border:1px solid transparent;border-radius:8px}
.grp.on{background:#fff;border-color:var(--accent)}
.grp.off{opacity:.38}
.grp.off select,.grp.off input{pointer-events:none;background:#f2f0ec}
.stg{display:inline-flex;gap:3px}
.stg button{padding:4px 10px;font-size:12px;border-radius:6px}
.stg button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
/* 헌법 앱 .cloze-text 와 같은 크기 — 다만 줄 간격은 조금 넉넉하게 둔다.
   이쪽 빈칸은 밑줄(border-bottom)이 있어 2.05 로는 아랫줄과 붙는다. */
.cz{font-size:17.5px;line-height:2.3;
  background:#fffef9;border:1px solid var(--line);border-radius:8px;padding:16px 18px;
  white-space:pre-wrap;word-break:keep-all}
.bl{display:inline-block;max-width:100%;white-space:pre-wrap;vertical-align:baseline;
  min-width:5.4em;padding:1px 6px;margin:0 1px;border:0;border-bottom:2px solid var(--accent);
  background:#f3f6f7;border-radius:4px 4px 0 0;outline:none;color:var(--accent);font-weight:600}
.bl:focus{background:var(--cur);border-bottom-color:#b8952a;box-shadow:0 2px 0 0 #b8952a}
.bl:empty::before{content:attr(data-ph);color:#b6b2aa;font-weight:400}
/* 초성 힌트는 친 만큼 줄어든다 — ㄱㄷㅂㅇ → 강ㄷㅂㅇ → 강도ㅂㅇ.
   :empty::before 는 한 글자만 쳐도 통째로 사라지므로 남은 초성은 ::after 로 그린다.
   생성 내용이라 DOM(textContent)·캐럿·선택에 끼어들지 않는다. */
.bl[data-rest]::after{content:attr(data-rest);color:#b6b2aa;font-weight:400;user-select:none}
.bl.ok{background:var(--okbg);border-bottom-color:var(--ok);color:var(--ok)}
.bl.bad{background:var(--badbg);border-bottom-color:var(--bad);color:var(--bad)}
.bl.big{display:block;width:100%;margin:8px 0;padding:11px 13px;min-height:3.4em;
  border:2px dashed #b9c6cc;border-radius:8px;background:#f7fafb;line-height:2.1}
.bl.big:focus{border-color:#b8952a;background:var(--cur);box-shadow:none}
.bl.big.ok{border-color:var(--ok);background:var(--okbg)}
.bl.big.bad{border-color:var(--bad);background:var(--badbg)}
.fixhint{color:var(--ok);font-weight:700;font-size:13px;margin-left:4px}
.czinfo{font-size:12.5px;color:var(--muted);margin-bottom:8px}

/* ---- 타자 모드 ---- */
/* 헌법 앱 .type-target 과 같은 글꼴·크기 (font-family 는 body 를 물려받는다) */
.tp{font-size:20px;line-height:2.1;
  letter-spacing:.02em;white-space:pre-wrap;word-break:break-all}
.tp .done{color:#a9a59d}
.tp .cur{background:var(--cur);border-radius:4px;padding:3px 5px;display:block;margin:2px 0}
.tp .nxt{color:#b4b0a8}
.tp .c-ok{color:var(--ok)}
.tp .c-bad{color:#fff;background:var(--bad);border-radius:2px}
.tp .c-now{border-bottom:2px solid var(--accent)}
.tp .c-todo{color:var(--ink)}
.tinput{width:100%;font:inherit;font-size:18px;
  padding:12px 14px;border:2px solid var(--accent);border-radius:8px;background:#fffef9;color:var(--ink);
  letter-spacing:.02em;margin-top:10px}
.tinput:focus{outline:none;box-shadow:0 0 0 3px rgba(47,72,88,.15)}
.gauge{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.gauge div{text-align:center}
.gauge .n{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.gauge .l{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:.95}
@media (max-width:640px){.wrap{padding:12px}.issue{font-size:15px}textarea{font-size:14px}
  .tp,.tinput{font-size:16px}.gauge .n{font-size:21px}.gauge{gap:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>형재실 링판 · 법리 암기 & 타자연습</h1>
  <span class="sub">2025 전북대 형재실 판례정리(링판) 법리 원문 · 기호 정제 · 요약결론 제외</span>
  <span class="ver" title="앱 버전 · 마지막 업데이트일"><b>v1.8</b> · 2026-08-20</span>
</header>

<div class="tabs">
  <button id="tabMemo" class="on">암기 모드</button>
  <button id="tabType">타자 모드</button>
</div>

<div class="bar">
  <div class="row">
    <label class="f">범위
      <span class="stg" id="scp">
        <button data-scope="toc" class="on">목차별</button><button data-scope="case">사례번호</button>
      </span>
      <input type="hidden" id="fScope" value="toc"></label>
    <span class="grp" data-scope="toc">
      <label class="f">대분류 <select id="fTop"></select></label>
      <label class="f">중분류 <select id="fMid"></select></label>
    </span>
    <span class="grp" data-scope="case">
      <label class="f" title="링판정리본에 인쇄된 사례번호(1~185) · 판례를 세는 번호라 카드 수와 다르다">사례
        <input type="number" id="fCaseFrom" value="1" min="1" max="185" step="1" style="width:62px"> ~
        <input type="number" id="fCaseTo" value="185" min="1" max="185" step="1" style="width:62px">
        <b id="caseN"></b></label>
      <span class="f" id="caseNote" style="color:var(--muted)"></span>
    </span>
    <label class="f">태그 <select id="fTag"></select></label>
    <label class="f">중요도 <select id="fStar"><option value="">전체</option><option value="1">★ 이상</option><option value="2">★★ 이상</option><option value="3">★★★</option></select></label>

    <label class="f">글자수 ≤ <input type="number" id="fLen" value="2000" min="20" step="50" style="width:80px"></label>
  </div>
  <div class="row">
    <label class="f"><input type="checkbox" id="fRep" checked> 중복법리는 대표 1개만</label>
    <label class="f"><input type="checkbox" id="fNeg"> 불성립(X) 판례만</label>
    <label class="f"><input type="checkbox" id="fNoTheory"> 학설(견해·검토) 제외</label>

    <label class="f"><input type="checkbox" id="fDue"> 오늘 복습할 카드만 <b id="dueN">0</b></label>
    <label class="f"><input type="checkbox" id="fShuffle"> 무작위 순서</label>
  </div>
  <div class="row">
    <label class="f" data-mode="memo">단계
      <span class="stg" id="stg">
        <button data-s="1">1 키워드</button><button data-s="2">2 표현</button>
        <button data-s="3">3 문장</button><button data-s="4" class="on">4 전체</button>
      </span></label>
    <label class="f" data-mode="memo"><input type="checkbox" id="fSeq"> 1→4 순차</label>
    <label class="f" data-mode="memo" data-s4><input type="checkbox" id="fLive" checked> 실시간 채점</label>
    <label class="f" data-mode="memo" data-s4><input type="checkbox" id="fSent"> 문장 단위로 쪼개기</label>
    <label class="f" data-mode="type">한 줄 <input type="number" id="fWrap" value="34" min="16" max="70" step="2" style="width:64px"> 자</label>
    <label class="f" data-mode="type"><input type="checkbox" id="fStrict" checked> 오타 나면 넘어가지 않기</label>
    <label class="f">조문 <select id="fJe">
      <option value="on">제312조 (붙여서)</option><option value="off">312조 (빼고)</option></select></label>
    <span style="flex:1"></span>
    <button id="apply" class="primary">적용 / 다시 시작</button>
    <button id="wrongOnly">오답만 다시</button>
    <button id="expBtn" title="오답·진도를 JSON 파일로 내려받기">진도 내보내기</button>
    <button id="impBtn" title="내보낸 JSON 불러오기">불러오기</button>
    <button id="resetBtn" title="학습 이력 초기화">이력 초기화</button>
    <span class="f" id="saveInfo" style="color:var(--muted)"></span>
    <input type="file" id="impFile" accept="application/json" style="display:none">
  </div>
</div>

<div id="stage"></div>
</div>
<div class="toast" id="toast"></div>

고 주장함 / 2. 검토 / 가) 강도의 성립여부 / (1) 인정사실 / - 금반지 교부하고 100만원 받고, 롤렉스 사진 보냈으나 실제로 없음 / - 피고인 피해자에게 전화해 모텔로 오라고 함 / - 피고인 천 끈 만들었음 / - 피고인 모텔 열쇠를 들고 피해자의 차에서 지갑 가져옴, 모텔은 열쇠없으면 불 안켜짐 / - 모텔안에서 폰뱅킹으로 211만 이체, 피해자 통화함 / - 피해자 점퍼 앞부분 볼록하게 나와있는 상태로 모텔 나감, 피고인 허리춤에 30cm정도 되는 기다란 자처럼 생긴 것 차고 있었음. / - 나갈 때 피고인은 늦어서 미안하다 말하고 피해자 앞만보고나감 / - 현금을 인출하기 위해 국민은행 공릉동지점에 가서 50만원 인출하려 함 / - 인출하려는 동안 피해자 도망가다가 찰과상입음 / (2) 신빙성검토 / - 피해자는 -라고 진술함 / - 피고인 -라고 진술함 / - 피해자의 진술은 일관될 뿐 아니라 인정사실 및 관련증거에 비추어 아래와 같이 객관적 증거와 부합하고 합리성이 인정되므로 신빙성 있으며 이에 반하는 피고인의 진술은 신뢰하기 어려움 / - 피해자가 모텔로 온 경위 / 금반지2개 가치는 50만원 정도여서 매매대금이 아닌 차용금으로 보이는 점, 피고인 롤렉스 없으면서 허풍떤점, 돈을 주기 위해서 계좌이체 등 다른방법을 이용할 수 있음에도 모텔로 간 점 고려하면 피고인이 강도범행 목적으로 피해자를 유인한 것으로 보임 / - 결박된 상태였는지 / 피고인 혼자 모텔 주차장으로 내려가 지갑 가져온 점, 피해자 혼자 있는데 방안 소등된 점, 모텔에 있는 동안 짧은 수신통화만 한 점, 피고인 천 끈 만든점 등 고려하면 피해자 진술이 진실일 가능성 높음 / - 돈 이체 및 외환카드 교부 경위 / 전날 100만원 빌려줬음에도 다음날 영업도 하지 않은 채 모텔로 찾아가 211만원을 이체하고 차로 25분 정도의 거리에 있는 은행에서 50만원 까지 이체해주려고 하였다는 것은 매우 이례적인 점, 피고인 형사합의금이 필요하다고 했다가 어머니의 치료비가 필요하다고 진술 번복하였으나 실제로 그런 사정이 있는지 알 수 없는 점, 현금인출 후 피해자가 카드 사용정지신청 해놓은점 등 고려하면 피해자가 스스로 돈을 이체하고 외환카드 교부하였다는 피고인의 주장 믿기 어려움 / - 모텔 나가는 상황에서 피해자 경직된 상태였던 점 고려하면 피고인이 피해자의 뒤에서 칼로 위협하며 모텔을 나간 것으로 보임 / - 천끈 / 자살할 이유 없고, 천 끈의 형태 길이와 종류가 다양한 점, 절단면 매끄러운점 보면 회칼로 침대 시트를 잘라 만든 것으로 보임 / - 피해자 상해경위 / 피해자 갑자기 뛰어 내려갈 이유 없는 점 고려하면 신변에 위협을 느껴 차에서 도망간 것으로 보는 것이 경험칙에 부합함 / - 신빙성 있는 피해자 진술과 위 각 증거들에 의하면 피고인이 회칼로 피해자를 위협하여 돈을 이체하게 하고, 외환카드를 강취한 사실 인정할 수 있음 / - 피고인의 위 주장 받아들이지 아니함 / 나) 강도상해 성립여부 / (1) 피해자의 상해가 피고인의 행위로 인한 것인지 여부 / - 피고인이 현금을 인출하려는 동안 피고인이 피해자를 쫓아가 상해를 가하였다는 피해자 진술이 신빙성 있음 / - 상해진단서 기재에 의하면 의사에게 강도범행으로 상해를 입었다고 말한 사실도 인정됨 / - 따라서 피해자 진술과 상해진단서의 기재에 의하면 피고인의 행위로 피해자가 상해를 입었다고 할 수 있음 / - 변호인의 이 부분 주장 받아들이지 아니함 / (2) 피해자의 상해가 강도의 기회에 발생한 것인지 여부 / (가) 법리 / O 강도상해죄는 강도범인이 강도의 기회에 상해행위를 함으로써 성립하므로 사회통념상 범죄행위가 완료되지 아니하였다고 볼 수 있는 단계에서 상해가 행하여짐을 요건으로 함. 또한 강도범행으로 인한 피해자의 심리적 저항불능상태가 해소되지 않은 상태에서 강도범인의 상해행위가 있었다면 강취행위와 상해행위 사이에 다소의 시간적, 공간적 간격이 있었다는 것만으로는 강도상해죄의 성립에 영향이 없음 / (나) 사안의 경우 / O 앞에서 인정한 사실관계와 피해자 [81,83],[92,94],[96,98],[109,111],[115,117]],"3":[[0,50],[59,83],[92,98],[109,111],[115,117]]},"기재례":"[기재] 공범이 아니어서 공소시효 정지가 없는 경우 / 1) 주장 및 쟁점 / O 피고인 및 변호인은 처분한 사실은 인정하나 자신이 소유자가 아니기 때문에 권리행사방해죄가 성립하지 않는다고 주장 / O 변호인은 공소시효가 완성되어 면소 선고해야 한다고 주장하나 검사는 공소시효가 정지되어 공소시효가 완성되지 않았다고 주장 / 2) 검토 / 가) 면소사유 검토 / (1) 법리 / O 형소법 제253조 제1항, 제2항에 의하면 공소시효는 공소의 제기로 진행이 정지되고, 공범의 1인에 대한 공소시효의 정지는 다른 공범자에 대하여 효력이 미치고 당해 사건의 재판이 확정된 때로부터 진행함 / O 책임조각이 아닌 범죄의 증명이 없다는 이유로 공범 중 1인이 무죄의 확정판결을 선고받은 경우 그에 대하여 제기된 공소로써는 진범에 대한 공소정지의 효력이 없음 / (2) 사안의 경우 / O 권리행사방해죄는 형법 제323조에 의해 법정형이 5년 이하의 징역 또는 700만 원 이하의 벌금에 해당하는 죄로 형소법 제250조, 형법 제50조, 형소법 제249조 제1항 제4호에 의하여 공소시효는 7년임 / O 공범 무죄를 선고 받은 사실이 인정 / O 위 인정사실을 앞서 본 법리에 비추어 보면, 공범관계가 더 이상 인정되지 않으므로 A에 대한 공소제기에 의하여 피고인에 대한 공소시효는 정지되지 않음 / O 이 부분 공소는 범행이 종료된 0000.00.00. 로부터 7년이 경과한 후인 0000.00.00.에 제기되었음이 기록상 명백함 / (3) 소결론 / 이 부분 공소사실은 형소법 제326조 제3호에 의해 면소사유 있음 / 나) 무죄사유 검토 / (1) 법리 / O 권리행사방해죄는 취거, 은닉 또는 손괴한 물건이 자기의 물건이 아니라면 성립하지 않고 소유자가 아닌 자는 형법 제33조에 따라 소유자의 범행에 가담한 경우에 한해 공범이 될 수 있음 / (2) 사안의 경우 / O -에 의하면 이 사건 승용차는 A의 명의, 이 사건 범행은 A의 동의없이 피고인이 임의로 저지른 것이고 A와 공모하였다는 점에 관한 증명이 부족하다는 이유로 0000.00.00. 무죄가 선고되었고 0000.00.00 확정된 사실이 인정됨 / O 위 인정사실을 앞서 본 법리에 비추어 보면, 피고인은 이 사건 승용차의 소유자가 아니기 때문에 소유자인 A가 무죄인 이상 피고인 단독으로는 권리행사방해죄의 주체가 될 수 없음 / O - 만으로 피고인이 권리행사방해죄의 주체로 범행하였다는 사실을 인정하기에 부족하고, 달리 이를 인정할 증거가 없음 / (3)소결론 / 후단무죄사유 있음 / 다) 최종결론 / 이 부분 공소사실에 면소사유, 무죄사유 경합하나 형식재판우선의 원칙에 따라 면소를 선고함","발문":"5. 유죄 이외의 판결 > 나. 공소시효 완성 (제326조 제3호) > 2) 공소시효 - 공범과의 관계","사실관계":"범죄행위 종료일 1991. 8. 2. 당시 기준 시효 5년 / - 공소제기 / 갑, 을: 1991. 12. 17 / 병: 1992. 5. 20 / - 판결 확정 / 갑: 1992. 8. 19 / 을: 1992. 5. 22 / 병: 1993. 4. 22 / - 원심에서 공범이라고 판시한 정은 1991. 12. 17. 공소제기되었다가 무죄를 선고받고 1994. 5. 10. 확정됨 / - 피고인 1998. 6. 15. 공소제기","링판번호":64},{"카드ID":"C062-2","판례ID":"C062","대분류":"5. 유죄 이외의 판결","중분류":"나. 공소시효 완성 (제326조 제3호)","소분류":"2) 공소시효 - 공범과의 관계","쟁점":"공범의 1인이 범죄의 증명이 없어 무죄판결 선고받은 경우 공소시효가 정지되는지 여부","사건번호":"98도4621","태그":["L"],"중요도":0,"단락순번":2,"총단락수":3,"법리원문":"형소법 제253조 제2항의 공범관계의 존부는 현재 주주총회 소집공고문을 등록하면서 공고문에 재무제표를 포함한 관련 자료를 본점 등에 비치해 두었다는 취지를 기재한 사실 인정됨. 검사가 제출한 증거들만으로는 허위의 재무제표가 본점에 비치된 정확한 시점 확정할 수 없으므로 늦어도 0000.00.00.에 재무제표가 본점에 비치되었다고 보아야 하므로 0000.00.00.부터 공소시효가 진행됨 / O 이 사건 공소는 위 외부감사법 위반행위가 종료된 0000.00.00.부터 5년이 지난 0000.00.00. 제기된 사실이 기록상 명백함 / 3) 소결론 / 이 부분 공소사실은 공소시효가 완성되었을 때에 해당하므로 형소법 제326조 제3호에 의하여 면소를 선고함","발문":"5. 유죄 이외의 판결 > 나. 공소시효 완성 (제326조 제3호) > 2) 공소시효 - 공범과의 관계","사실관계":"피고인(회사)의 상무인 G가 2017년도 재무제표를 거짓으로작성, 공시하여 외부감사법 위반하였음 / - 행위자는 공소시효 만료 이전인 2022. 12. 16. 기소되고 회사는 공소시효 만료 후인 2023. 3. 15. 기소됨","링판번호":66},{"카드ID":"C064-2","판례ID":"C064","대분류":"5. 유죄 이외의 판결","중분류":"나. 공소시효 완성 (제326조 제3호)","소분류":"2) 공소시효 - 공범과의 관계","쟁점":"공범 중 1인에 대한 공소제기가 다른 공범자의 공소시효에 미치는 영향, 특히 양벌규정에 따른 사업주와 행위자의 관계가 형사소송법 제253조 제2항의 공범 관계에 해당하는지","사건번호":"2024도15290","태그":["NL"],"중요도":1,"단락순번":2,"총단락수":3,"법리원문":"이와 같이 형소법은 공범 사이의 처벌에 형평을 기하기 위하여 공범 중 1인에 대한 공소의 제기로 다른 공범자에 대하여도 공소시효가 정지되도록 규정하면서, 위 공범의 개념이나 유형에 관하여는 따로 언급이 없음. 위 조항은 공소제기 효력의 인적 범위를 확장하는 예외를 마련하여 놓은 것이므로 원칙적으로 엄격하게 해석하여야 하고 피고인에게 불리한 방향으로 지나치게 확장해석하거나 유추해석해서는 아니 됨","힌트_첫어절":"이와 같이 형소법은 공범","힌트_초성":"ㅇㅇ ㄱㅇ ㅎㅅㅂㅇ ㄱㅂ ㅅㅇㅇ ㅊㅂㅇ ㅎㅍㅇ ㄱㅎㄱ ㅇㅎㅇ ㄱㅂ ㅈ 1ㅇㅇ ㄷㅎ ㄱㅅㅇ ㅈㄱㄹ ㄷㄹ ㄱㅂㅈㅇ ㄷㅎㅇㄷ ㄱㅅㅅㅎㄱ ㅈㅈㄷㄷㄹ ㄱㅈㅎㅁㅅ, ㅇ ㄱㅂㅇ ㄱㄴㅇㄴ ㅇㅎㅇ ㄱㅎㅇㄴ ㄸㄹ ㅇㄱㅇ ㅇㅇ. ㅇ ㅈㅎㅇ ㄱㅅㅈㄱ ㅎㄹㅇ ㅇㅈ ㅂㅇㄹ ㅎㅈㅎㄴ ㅇㅇㄹ ㅁㄹㅎㅇ ㄴㅇ ㄱㅇㅁㄹ ㅇㅊㅈㅇㄹ ㅇㄱㅎㄱ ㅎㅅㅎㅇㅇ ㅎㄱ ㅍㄱㅇㅇㄱ ㅂㄹㅎ ㅂㅎㅇㄹ ㅈㄴㅊㄱ ㅎㅈㅎㅅㅎㄱㄴ ㅇㅊㅎㅅㅎㅅㄴ ㅇㄴ ㄷ","핵심키워드":["공소시효","공소","공범","공범자","효력","공소제기","원칙","예외","조항","제기","확장해석","정지","처벌","해석","규정"],"유사법리":"C063-1(2012도4842,0.7)","빈칸":{"1":[[11,13],[18,20],[34,36],[46,48],[50,52],[57,60],[67,71],[73,75],[79,81],[88,90],[119,121],[123,127],[128,130],[144,146],[161,163],[172,174],[201,205]],"2":[[6,9],[11,13],[18,20],[22,24],[34,36],[46,48],[50,52],[57,60],[67,71],[73,75],[79,81],[88,90],[109,111],[119,121],[123,127],[128,130],[144,146],[161,163],[172,174],[181,184],[191,193],[201,205]],"3":[[6,24],[34,36],[46,90],[109,130],[144,146],[161,163],[172,205]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인은 공소시효가 완성되어 면소 선고해야 한다고 주장하나 검사는 공소시효가 정지되어 공소시효가 완성되지 않았다고 주장 / 2) 검토 / 가) 법리 / O 형소법 제253조 제1항, 제2항에  주장함 / 2) 검토 / 가) 법리 / O 사고차량으로 인정되는 차량에서 내리는 사람을 발견한 경우 형소법 제211조 제2항 제2호 소정의 장물이나 범죄에 사용되었다고 인정함에 충분한 흉기 기타 물건을 소지하고 있는 때에 해당하므로 준현행범으로서 영장없이 체포할 수 있음 / O 현행범 체포의 경우 반드시 형소법 제200조의5에 따라 범죄사실의 요지 등 권리를 고지하여야 하고 이는 체포를 위한 실력행사 이전에 미리 하여야 함이 원칙이나 달아나거나 폭력으로 대항하는 피의자를 제압하는 경우 그 과정에서 하거나 제압한 후 지체없이 하여야 함 / O 위법한 체포를 면하려고 반항하는 과정에서 경찰의 안경을 손괴한 경우 공집방은 적법한 공무에 해당하지 아니하여 구성요건 해당성이 없어 무죄이고, 재물손괴죄는 신체에 대한 현재의 부당한 침해에서 벗어나기 위한 행위로 정당방위에 해당하므로 위법성이 조각되어 무죄임 / 나) 인정사실 / 검정색 차량이 도주하였다는 무전 받고 수색, 10분 후 1km 떨어진 곳에서 해당 차량에서 피고인이 내리는 것 발견, 범퍼 및 휀더 부분 파손, 차적 조회, 피고인 저항, 권리 미고지 / 다) 판단 (해당 판례 결론) / O 피고인 형소법 제211조 제2항 제2호 소정의 준현행범인에 해당함 / O (현체 권리고지 법리)하여야 하나 A, B가 위와 같은 절차를 준수했다는 사실을 인정할 아무런 증거가 없음 / O 따라서 경찰 A가 피고인을 체포한 행위는 적법한 공무집행이라고 볼 수 없어 공무집행방해죄의 구성요건 해당성이 없고, 피고인이 위법한 체포를 면하려고 경찰에게 상해를 가한 것은 위법한 체포로 인한 신체에 대한 현재의 부당한 침해에서 벗어나기 위한 행위로서 정당방위에 해당하여 위법성이 조각됨 / 라) 소결론 / 공무집행방해 형소법 제325조 후단, 상해 제325조 전단에 의하여 각 무죄","발문":"6. 영장실무","사실관계":"교통사고를 낸 차량이 도주하였다는 연락을 받은 경찰관이 사고차량으로 인정되는 차량에서 내린 운전자를 준현행범인으로 체포하는 중 권리 미고지하였고 피고인은 경찰관에 상해를 가함","링판번호":86},{"카드ID":"C085-1","판례ID":"C085","대분류":"6. 영장실무","소분류":"2) 구속","쟁점":"사인의 현행범인 체포시 구속영장 청구기간인 48시간의 기산점","사건번호":"2011도12927","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"현행범인은 누구든지 영장 없이 체포할 수 있고(형소법 제212조), 검사 또는 사법경찰관리 아닌 이가 현행범인을 체포한 때에는 즉시 검사 등에게 인도해야 함(형소법 제213조 제1항). 여기서 즉시라고 함은 반드시 체포시점과 시간적으로 밀착된 시점이어야 하는 것은 아니고, 정당한 이유 없이 인도를 지연하거나 체포를 계속하는 등으로 불필요한 지체를 함이 없이라는 뜻으로 볼 것임. 또한 검사 등이 현행범인을 체포하거나 현행범인을 인도받은 후 현행범인을 구속하고자 하는 경우 48시간 이내에 구속영장을 청구해야 하고 그 기간 내에 구속영장을 청구하지 아니하는 때에는 즉시 석방하여야 함(형소법 제213조의2, 제200조의2 제5항)","힌트_첫어절":"현행범인은 누구든지 영장 없이","힌트_초성":"ㅎㅎㅂㅇㅇ ㄴㄱㄷㅈ ㅇㅈ ㅇㅇ ㅊㅍㅎ ㅅ ㅇㄱ(ㅎㅅㅂ ㅈ212ㅈ), ㄱㅅ ㄸㄴ ㅅㅂㄱㅊㄱㄹ ㅇㄴ ㅇㄱ ㅎㅎㅂㅇㅇ ㅊㅍㅎ ㄸㅇㄴ ㅈㅅ ㄱㅅ ㄷㅇㄱ ㅇㄷㅎㅇ ㅎ(ㅎㅅㅂ ㅈ213ㅈ ㅈ1ㅎ). ㅇㄱㅅ ㅈㅅㄹㄱ ㅎㅇ ㅂㄷㅅ ㅊㅍㅅㅈㄱ ㅅㄱㅈㅇㄹ ㅁㅊㄷ ㅅㅈㅇㅇㅇ ㅎㄴ ㄱㅇ ㅇㄴㄱ, ㅈㄷㅎ ㅇㅇ ㅇㅇ ㅇㄷㄹ ㅈㅇㅎㄱㄴ ㅊㅍㄹ ㄱㅅㅎㄴ ㄷㅇㄹ ㅂㅍㅇㅎ ㅈㅊㄹ ㅎㅇ ㅇㅇㄹㄴ ㄸㅇㄹ ㅂ ㄱㅇ. ㄸㅎ ㄱㅅ ㄷㅇ ㅎㅎㅂㅇㅇ ㅊㅍㅎㄱㄴ ㅎㅎㅂㅇㅇ ㅇㄷㅂㅇ ㅎ ㅎㅎㅂㅇㅇ ㄱㅅㅎㄱㅈ ㅎㄴ ㄱㅇ 48ㅅㄱ ㅇㄴㅇ ㄱㅅㅇㅈㅇ ㅊㄱㅎㅇ ㅎㄱ ㄱ ㄱㄱ ㄴㅇ ㄱㅅㅇㅈㅇ ㅊㄱㅎㅈ ㅇㄴㅎㄴ ㄸㅇㄴ ㅈㅅ ㅅㅂㅎㅇㅇ ㅎ(ㅎㅅㅂ  재항고의 사유로 다음과 같이 주장함(가) 지방법원판사의 영장기각 재판은 재판의 일종임(나) 대법원은 최고법원으로서 하급법원의 잘못된 재판을 바로잡을 권한이 있음\n(다) 영장기각 재판에 대해 대법원의 판단을 받지 못하는 것은 재판청구권을 침해하는 것으로서 헌법 위반임","링판번호":89},{"카드ID":"C087-3","판례ID":"C087","대분류":"6. 영장실무","소분류":"2) 구속","쟁점":"구속영장청구기각 재판에 대한 준항고 가능 여부","사건번호":"2006모646","태그":["L"],"중요도":0,"단락순번":3,"총단락수":3,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"헌법 제12조 제1항, 제3항, 제6항 및 형소법 제37조, 제200조의2, 제201조, 제214조의2, 제402조, 제416조 제1항 등의 규정들은, 신체의 자유와 관련한 기본권의 침해는 부당한 구속 등에 의하여 비로소 생길 수 있고 검사의 영장청구가 기각된 경우에는 그로 인한 직접적인 기본권침해가 발생할 여지가 없다는 점 및 피의자에 대한 체포영장 또는 구속영장의 청구에 관한 재판 자체에 대하여 항고 또는 준항고를 통한 불복을 허용하게 되면 그 재판의 효력이 장기간 유동적인 상태에 놓여 피의자의 지위가 불안하게 될 우려가 있으므로 그와 관련된 법률관계를 가급적 조속히 확정시키는 것이 바람직하다는 점 등을 고려하여, 체포영장 또는 구속영장에 관한 재판 그 자체에 대하여 직접 항고 또는 준항고를 하는 방법으로 불복하는 것은 이를 허용하지 아니하는 대신에, 체포영장 또는 구속영장이 발부된 경우에는 피의자에게 체포 또는 구속의 적부심사를 청구할 수 있도록 하고 그 영장청구가 기각된 경우에는 검사로 하여금 그 영장의 발부를 재청구할 수 있도록 허용함으로써, 간접적인 방법으로 불복할 수 있는 길을 열어 놓고 있는데 그 취지가 있고, 이는 헌법이 법률에 유보한 바에 따라 입법자의 형성의 자유의 범위 내에서 이루어진 합리적인 정책적 선택의 결과일 뿐 헌법에 위반되는 것이라고는 할 수 없음","힌트_첫어절":"헌법 제12조 제1항, 제3항,","힌트_초성":"ㅎㅂ ㅈ12ㅈ ㅈ1ㅎ, ㅈ3ㅎ, ㅈ6ㅎ ㅁ ㅎㅅㅂ ㅈ37ㅈ, ㅈ200ㅈㅇ2, ㅈ201ㅈ, ㅈ214ㅈㅇ2, ㅈ402ㅈ, ㅈ416ㅈ ㅈ1ㅎ ㄷㅇ ㄱㅈㄷㅇ, ㅅㅊㅇ ㅈㅇㅇ ㄱㄹㅎ ㄱㅂㄱㅇ ㅊㅎㄴ ㅂㄷㅎ ㄱㅅ ㄷㅇ ㅇㅎㅇ ㅂㄹㅅ ㅅㄱ ㅅ ㅇㄱ ㄱㅅㅇ ㅇㅈㅊㄱㄱ ㄱㄱㄷ ㄱㅇㅇㄴ ㄱㄹ ㅇㅎ ㅈㅈㅈㅇ ㄱㅂㄱㅊㅎㄱ ㅂㅅㅎ ㅇㅈㄱ ㅇㄷㄴ ㅈ ㅁ ㅍㅇㅈㅇ ㄷㅎ ㅊㅍㅇㅈ ㄸㄴ ㄱㅅㅇㅈㅇ ㅊㄱㅇ ㄱㅎ ㅈㅍ ㅈㅊㅇ ㄷㅎㅇ ㅎㄱ ㄸㄴ ㅈㅎㄱㄹ ㅌㅎ ㅂㅂㅇ ㅎㅇㅎㄱ ㄷㅁ ㄱ ㅈㅍㅇ ㅎㄹㅇ ㅈㄱㄱ ㅇㄷㅈㅇ ㅅㅌㅇ ㄴㅇ ㅍㅇㅈㅇ ㅈㅇㄱ ㅂㅇㅎㄱ ㄷ ㅇㄹㄱ ㅇㅇㅁㄹ ㄱㅇ ㄱㄹㄷ ㅂㄹㄱㄱㄹ ㄱㄱㅈ ㅈㅅㅎ ㅎㅈㅅㅋㄴ ㄱㅇ ㅂㄹㅈㅎㄷㄴ ㅈ ㄷㅇ ㄱㄹㅎㅇ, ㅊㅍㅇㅈ ㄸㄴ ㄱㅅㅇㅈㅇ ㄱㅎ ㅈㅍ ㄱ ㅈㅊㅇ ㄷㅎㅇ ㅈㅈ ㅎㄱ ㄸㄴ ㅈㅎㄱㄹ ㅎㄴ ㅂㅂㅇㄹ ㅂㅂㅎㄴ ㄱㅇ ㅇㄹ ㅎㅇㅎㅈ ㅇㄴㅎㄴ ㄷㅅㅇ, ㅊㅍㅇㅈ ㄸㄴ ㄱㅅㅇㅈㅇ ㅂㅂㄷ ㄱㅇㅇㄴ ㅍㅇㅈㅇㄱ ㅊㅍ ㄸㄴ ㄱㅅㅇ ㅈㅂㅅㅅㄹ ㅊㄱㅎ ㅅ ㅇㄷㄹ ㅎㄱ ㄱ ㅇㅈㅊㄱㄱ ㄱㄱㄷ ㄱㅇㅇㄴ ㄱㅅㄹ ㅎㅇㄱ ㄱ ㅇㅈㅇ ㅂㅂㄹ ㅈㅊㄱㅎ ㅅ ㅇㄷㄹ ㅎㅇㅎㅇㄹㅆ, ㄱㅈㅈㅇ ㅂㅂㅇㄹ ㅂㅂㅎ ㅅ ㅇㄴ ㄱㅇ ㅇㅇ ㄴㄱ ㅇㄴㄷ ㄱ ㅊㅈㄱ ㅇㄱ, ㅇㄴ ㅎㅂㅇ ㅂㄹㅇ ㅇㅂㅎ ㅂㅇ ㄸㄹ ㅇㅂㅈㅇ ㅎㅅㅇ ㅈㅇㅇ ㅂㅇ ㄴㅇㅅ ㅇㄹㅇㅈ ㅎㄹㅈㅇ ㅈㅊㅈ ㅅㅌㅇ ㄱㄱㅇ ㅃ ㅎㅂㅇ ㅇㅂㄷㄴ ㄱㅇㄹㄱㄴ ㅎ ㅅ ㅇㅇ","핵심키워드":["장기간","기본권침해","기본권","준항고","적부심사","체포영장","법률관계","구속영장","항고","영장청구","구속","영장","지위","침해","체포","대신","효력","기각","불복","규정들","자유","신체","입법자","직접","법률","재판","청구","상태","발부","재청구","위반","관련","발생","허용"],"빈칸":{"1":[[79,82],[85,87],[89,91],[9 나 증거동의 하여도 마찬가지임 / 나) 인정사실 / 범인이 벗어놓은 점퍼에서 매출전표 발견, 공문 발송하여 피고인 특정, 긴급체포하고 당시 새것으로 보이는 구두 등 발견, 제2범행 자백, 구속영장 기각, 제3범행 자백 후 구두 임의제출, 구두 압수, 제2, 3범행에 대하여 피해자 각 진술서 제출, 공판기일에서 피고인 1-3범행 모두 자백 / 다) 피고인에 대한 1, 2회 각 경찰 피신조서, 긴급체포서, 압수조서 / 위 인정사실에 의하면 법관의 영장없이 거래명의자에 관한 정보를 획득한 조치는 위법하고 이를 기초로한 체포역시 위법하므로 위법한 체포상태에서 작성한 각 피신조서 등 각 증거들 위수증으로 증거능력 없음 / 피고인이 동의하거나 사후영장 발부받아도 마찬가지임 / 라) 법정진술, 3회 경피신, 피해자들 각 진술서, 압수된 구두 / - 의도적으로 영장주의정신을 회피하려고 시도한 것 아닌점, 피해자들 진술서는 기존 수사절차로부터 독립하여 자발적으로 자신들 피해사실을 임의로 진술한 것으로 보이는 점, 피고인 이미 석방되었음에도 제3범행 자백하면서 피해품을 임의로 제출한 점 등 종합할 때 유죄인정의 증거로 사용할 수 있음 / - 구속영장 기각되어 피고인 석방된 이후 진행된 3회 경찰 피의자신문 당시 제3범행에 관하여 자백하였고, 이 사건 범행 전부에 대한 제1심 법정 자백은 최초 자백 이후 약 3개월 지난 시점에 공개된 법정에서 적법한 절차를 통하여 임의로 이루어진 점 종합적으로 고려할 때 유죄인정의 증거로 사용 할 수 있음 / - 압수된 구두는 적법하게 실시된 피의자신문과정에서 임의제출형식으로 제출한 것이므로 제출의 임의성 인정됨. 당초 위법수집절차와의 인과관계가 희석 내지 단절된 것으로 보이므로, 예외적 사정에 해당하여 증거능력 있음 / 마) 증거의 요지 / 바) 소결론 / 사) 부수처분 / 압수된 구두 1켤레(증 제n호)를 피해자에게 환부(형소법 제333조 제1항)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"1범행에 관한 신고를 받은 경찰이 카드회사에 공문을 발송하는 방법으로 매출전표의 거래명의자의 인적사항을 알아내고 피고인을 특정, 긴급체포함 / - 1범행, 2범행 자백 후 석방, 3범행 자백하고 피해품 임의제출, 2, 3범행의 피해자 진술서 작성 / - 피고인은 공판기일에서 위 범행 모두 자백함","링판번호":100},{"카드ID":"C098-2","판례ID":"C098","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"위법수집증거(금융거래정보)에 기초한 2차 증거 증거능력 판단기준","사건번호":"2012도13607","태그":["L"],"중요도":1,"단락순번":2,"총단락수":3,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"다만 법이 정한 절차에 따르지 아니하고 수집한 증거라고 할지라도 수사기관의 절차 위반 행위가 적법절차의 실질적인 내용을 침해하는 경우에 해당하지 아니하고, 오히려 그 증거의 증거능력을 배제하는 것이 적법절차의 원칙과 실체적 진실 규명의 조화를 도모하고 이를 통하여 형사사법 정의를 실현하려 한 취지에 반하는 결과를 초래하는 것으로 평가되는 예외적인 경우라면, 법원은 그 증거를 유죄 인정의 증거로 사용할 수 있으므로, 법원이 2차적 증거의 증거능력 인정 여부를 최종적으로 판단할 때에는 먼저 절차에 따르지 아니한 1차적 증거 수집과 관련된 모든 사정들, 즉 절차 조항의 취지와 그 위반의 내용 및 정도, 구체적인 위반 경위와 회피가능성, 절차 조항이 보호하고자 하는 권리 또는 법익의 성질과 침해 정도 및 피고인과의 관련성, 절차 위반행위와 증거수집 사이의 인과관계 등 관련성의 정도, 수사기관의 인식과 의도 등을 살피는 것은 물론, 나아가 1차적 증거를 기초로 하여 다시 2차적 증거를 수집하는 과정에서 추가로 발생한 모든 사정들까지 구체적인 사안에 따라 주로 인과관계 희 3,134],[148,152],[176,178],[201,224],[234,250],[275,277],[291,327],[343,448],[475,477],[493,559],[567,580]]},"기재례":"[기재] - 22년 본시험 / 1) 주장 및 쟁점 / O 변호인 수사기관이 영장에 의하지 않고 매출전표 거래명의자에 관한 정보를 획득한 경우 위수증에 해당한다고 주장 / 2) 검토 / 가) 관련 법리 / O 위수증(원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 수사기관이 범죄수사 목적으로 금융회사 등에 매출전표의 거래명의자에 관한 정보를 요구하는 경우, 법관이 발부한 영장에 의하여야 함. 그럼에도 영장에 의하지 아니하고 위 정보를 획득하였다면, 위수증에 해당하여 증거능력 없음 / O 사후에 영장을 발부받거나 증거동의 하여도 마찬가지임 / 나) 인정사실 / 범인이 벗어놓은 점퍼에서 매출전표 발견, 공문 발송하여 피고인 특정, 긴급체포하고 당시 새것으로 보이는 구두 등 발견, 제2범행 자백, 구속영장 기각, 제3범행 자백 후 구두 임의제출, 구두 압수, 제2, 3범행에 대하여 피해자 각 진술서 제출, 공판기일에서 피고인 1-3범행 모두 자백 / 다) 피고인에 대한 1, 2회 각 경찰 피신조서, 긴급체포서, 압수조서 / 위 인정사실에 의하면 법관의 영장없이 거래명의자에 관한 정보를 획득한 조치는 위법하고 이를 기초로한 체포역시 위법하므로 위법한 체포상태에서 작성한 각 피신조서 등 각 증거들 위수증으로 증거능력 없음 / 피고인이 동의하거나 사후영장 발부받아도 마찬가지임 / 라) 법정진술, 3회 경피신, 피해자들 각 진술서, 압수된 구두 / - 의도적으로 영장주의정신을 회피하려고 시도한 것 아닌점, 피해자들 진술서는 기존 수사절차로부터 독립하여 자발적으로 자신들 피해사실을 임의로 진술한 것으로 보이는 점, 피고인 이미 석방되었음에도 제3범행 자백하면서 피해품을 임의로 제출한 점 등 종합할 때 유죄인정의 증거로 사용할 수 있음 / - 구속영장 기각되어 피고인 석방된 이후 진행된 3회 경찰 피의자신문 당시 제3범행에 관하여 자백하였고, 이 사건 범행 전부에 대한 제1심 법정 자백은 최초 자백 이후 약 3개월 지난 시점에 공개된 법정에서 적법한 절차를 통하여 임의로 이루어진 점 종합적으로 고려할 때 유죄인정의 증거로 사용 할 수 있음 / - 압수된 구두는 적법하게 실시된 피의자신문과정에서 임의제출형식으로 제출한 것이므로 제출의 임의성 인정됨. 당초 위법수집절차와의 인과관계가 희석 내지 단절된 것으로 보이므로, 예외적 사정에 해당하여 증거능력 있음 / 마) 증거의 요지 / 바) 소결론 / 사) 부수처분 / 압수된 구두 1켤레(증 제n호)를 피해자에게 환부(형소법 제333조 제1항)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"1범행에 관한 신고를 받은 경찰이 카드회사에 공문을 발송하는 방법으로 매출전표의 거래명의자의 인적사항을 알아내고 피고인을 특정, 긴급체포함 / - 1범행, 2범행 자백 후 석방, 3범행 자백하고 피해품 임의제출, 2, 3범행의 피해자 진술서 작성 / - 피고인은 공판기일에서 위 범행 모두 자백함","링판번호":100},{"카드ID":"C098-3","판례ID":"C098","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"위법수집증거(금융거래정보)에 기초한 2차 증거 증거능력 판단기준","사건번호":"2012도13607","태그":["L"],"중요도":1,"단락순번":3,"총단락수":3,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"수사기관이 법관의 영장에 의하지 아니하고 매출전표의 거래명의자에 관한 정보를 획득한 경우 이에 터 잡아 수집한 2차적 증거들, 예컨대 피의자의 자백이나 범죄 피해에 대한 제3자의 진술 등이 유죄 인정의 증거로 사용될 수 있는지 역시 위와 같은 법리에 우, 법관이 발부한 영장에 의하여야 함. 그럼에도 영장에 의하지 아니하고 위 정보를 획득하였다면, 위수증에 해당하여 증거능력 없음 / O 사후에 영장을 발부받거나 증거동의 하여도 마찬가지임 / 나) 인정사실 / 범인이 벗어놓은 점퍼에서 매출전표 발견, 공문 발송하여 피고인 특정, 긴급체포하고 당시 새것으로 보이는 구두 등 발견, 제2범행 자백, 구속영장 기각, 제3범행 자백 후 구두 임의제출, 구두 압수, 제2, 3범행에 대하여 피해자 각 진술서 제출, 공판기일에서 피고인 1-3범행 모두 자백 / 다) 피고인에 대한 1, 2회 각 경찰 피신조서, 긴급체포서, 압수조서 / 위 인정사실에 의하면 법관의 영장없이 거래명의자에 관한 정보를 획득한 조치는 위법하고 이를 기초로한 체포역시 위법하므로 위법한 체포상태에서 작성한 각 피신조서 등 각 증거들 위수증으로 증거능력 없음 / 피고인이 동의하거나 사후영장 발부받아도 마찬가지임 / 라) 법정진술, 3회 경피신, 피해자들 각 진술서, 압수된 구두 / - 의도적으로 영장주의정신을 회피하려고 시도한 것 아닌점, 피해자들 진술서는 기존 수사절차로부터 독립하여 자발적으로 자신들 피해사실을 임의로 진술한 것으로 보이는 점, 피고인 이미 석방되었음에도 제3범행 자백하면서 피해품을 임의로 제출한 점 등 종합할 때 유죄인정의 증거로 사용할 수 있음 / - 구속영장 기각되어 피고인 석방된 이후 진행된 3회 경찰 피의자신문 당시 제3범행에 관하여 자백하였고, 이 사건 범행 전부에 대한 제1심 법정 자백은 최초 자백 이후 약 3개월 지난 시점에 공개된 법정에서 적법한 절차를 통하여 임의로 이루어진 점 종합적으로 고려할 때 유죄인정의 증거로 사용 할 수 있음 / - 압수된 구두는 적법하게 실시된 피의자신문과정에서 임의제출형식으로 제출한 것이므로 제출의 임의성 인정됨. 당초 위법수집절차와의 인과관계가 희석 내지 단절된 것으로 보이므로, 예외적 사정에 해당하여 증거능력 있음 / 마) 증거의 요지 / 바) 소결론 / 사) 부수처분 / 압수된 구두 1켤레(증 제n호)를 피해자에게 환부(형소법 제333조 제1항)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"1범행에 관한 신고를 받은 경찰이 카드회사에 공문을 발송하는 방법으로 매출전표의 거래명의자의 인적사항을 알아내고 피고인을 특정, 긴급체포함 / - 1범행, 2범행 자백 후 석방, 3범행 자백하고 피해품 임의제출, 2, 3범행의 피해자 진술서 작성 / - 피고인은 공판기일에서 위 범행 모두 자백함","링판번호":100},{"카드ID":"C099-1","판례ID":"C099","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"위법수집증거 (피고인의 자의 동의하에 실시한 강제채혈)","사건번호":"2011도15258","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"수사기관이 범죄 증거를 수집할 목적으로 피의자의 동의 없이 피의자의 혈액을 취득, 보관하는 행위는 법원으로부터 감정처분허가장을 받아 형소법 제221조의4 제1항, 제173조 제1항에 의한 감정에 필요한 처분으로도 할 수 있지만, 같은 법 제219조, 제106조 제1항에 정한 압수의 방법으로도 할 수 있고, 압수의 방법에 의하는 경우 혈액의 취득을 위하여 피의자의 신체로부터 혈액을 채취하는 행위는 그 혈액의 압수를 위한 것으로서 같은 법 제219조, 제120조 제1항에 정한 압수영장의 집행에 있어 필요한 처분에 해당함","힌트_첫어절":"수사기관이 범죄 증거를 수집할","힌트_초성":"ㅅㅅㄱㄱㅇ ㅂㅈ ㅈㄱㄹ ㅅㅈㅎ ㅁㅈㅇㄹ ㅍㅇㅈㅇ ㄷㅇ ㅇㅇ ㅍㅇㅈㅇ ㅎㅇㅇ ㅊㄷ, ㅂㄱㅎㄴ ㅎㅇㄴ ㅂㅇㅇㄹㅂㅌ ㄱㅈㅊㅂㅎㄱㅈㅇ ㅂㅇ ㅎㅅㅂ ㅈ221ㅈㅇ4 ㅈ1ㅎ, ㅈ173ㅈ ㅈ1ㅎㅇ ㅇㅎ ㄱㅈㅇ ㅍㅇㅎ ㅊㅂㅇㄹㄷ ㅎ ㅅ ㅇㅈㅁ, ㄱㅇ  변호인 조력, 진술거부권 고지, 증거수집 위법성 이해하면서 인정 / O 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / O 형소법 제310조에 의하면 자백이 피고인에게 불리한 유일의 증거인 때에는 유죄인정의 증거로 하지 못함. 법정자백 증거능력 있으나 자백을 보강할 증거 없으므로 피고인의 자백이 피고인에게 불리한 유일의 증거에 해당하여 유죄의 증거로 할 수 없음 / 마) 소결론 / 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"1) 피고인은 오토바이를 운전하여 가다가 선행 차량의 뒷부분을 들이받는 교통사고를 야기한 후 의식을 잃은 채 119 구급차량에 의하여 병원 응급실로 후송되었음\n2) 사고 시각으로부터 약 1시간 후 사고 신고를 받고 병원 응급실로 출동한 경찰관은 법원으로부터 압수, 수색 또는 검증영장을 발부받지 아니한 채 피고인의 아들로부터 동의를 받아 간호사로 하여금 의식을 잃고 응급실에 누워 있는 피고인으로부터 채혈을 하도록 하였음(사후에 영장을 발부받지 아니함)\n3) 국과수는 피고인의 혈액을 감정한 결과 혈중알콜농도가 0.211%라는 취지로 감정의뢰회보를 제출하였고, 검사는 피고인을 기소하면서 위 감정의뢰회보를 증거로 제출함\n4) 피고인은 공소사실을 모두 인정하고 모든 증거에 동의함","링판번호":101},{"카드ID":"C099-2","판례ID":"C099","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"위법수집증거 (피고인의 자의 동의하에 실시한 강제채혈)","사건번호":"2011도15258","태그":["L"],"중요도":1,"단락순번":2,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"그런데 음주운전 중 교통사고를 야기한 후 피의자가 의식불명 상태에 빠져 있는 등으로 도교법이 음주운전의 제1차적 수사방법으로 규정한 호흡조사에 의한 음주측정이 불가능하고 혈액 채취에 대한 동의를 받을 수도 없을 뿐만 아니라 법원으로부터 혈액 채취에 대한 감정처분허가장이나 사전 압수영장을 발부받을 시간적 여유도 없는 긴급한 상황이 생길 수 있음. 이러한 경우 피의자의 신체 내지 의복류에 주취로 인한 냄새가 강하게 나는 등 형소법 제211조 제2항 제3호가 정하는 범죄의 증적이 현저한 준현행범인으로서의 요건이 갖추어져 있고 교통사고 발생 시각으로부터 사회통념상 범행 직후라고 볼 수 있는 시간 내라면, 피의자의 생명, 신체를 구조하기 위하여 사고현장으로부터 곧바로 후송된 병원 응급실 등의 장소는 형소법 제216조 제3항의 범죄 장소에 준한다 할 것이므로, 검사 또는 사법경찰관은 피의자의 혈중알코올농도 등 증거의 수집을 위하여 의료법상 의료인의 자격이 있는 자로 하여금 의료용 기구로 의학적인 방법에 따라 필요최소한의 한도 내에서 피의자의 혈액을 채취하게 한 후 그 혈액을 영장 없이 압수할 수 있음. 다만 이 경우에도 같은 법 제216조 제3항 단서, 형사소송규칙 제58조, 제107조 제1항 제3호에 따라 사후에 지체 없이 강제채혈에 의한 압수의 사유 등을 기재한 영장청구서에 의하여 법원으로부터 압수영장을 받아야 함","힌트_첫어절":"그런데 음주운전 중 교통사고를","힌트_초성":"ㄱㄹㄷ ㅇㅈㅇㅈ ㅈ ㄱㅌㅅㄱㄹ ㅇㄱㅎ ㅎ ㅍㅇㅈㄱ ㅇㅅㅂㅁ ㅅㅌㅇ ㅃㅈ ㅇㄴ ㄷㅇㄹ ㄷㄱㅂㅇ ㅇㅈㅇㅈㅇ ㅈ1ㅊㅈ ㅅㅅㅂㅂㅇㄹ ㄱㅈㅎ ㅎㅎㅈㅅㅇ ㅇㅎ ㅇㅈㅊㅈㅇ ㅂㄱㄴㅎㄱ ㅎㅇ ㅊㅊㅇ ㄷㅎ ㄷㅇㄹ ㅂㅇ ㅅㄷ ㅇㅇ ㅃㅁ ㅇㄴㄹ ㅂㅇㅇㄹㅂㅌ ㅎㅇ ㅊㅊㅇ ㄷㅎ ㄱㅈㅊㅂㅎㄱㅈㅇㄴ ㅅㅈ ㅇㅅㅇㅈㅇ ㅂㅂㅂㅇ ㅅㄱㅈ ㅇㅇㄷ ㅇㄴ ㄱㄱㅎ ㅅㅎㅇ ㅅㄱ ㅅ ㅇㅇ. ㅇㄹㅎ ㄱㅇ ㅍㅇㅈㅇ ㅅㅊ ㄴㅈ ㅇㅂㄹㅇ ㅈㅊㄹ ㅇㅎ ㄴㅅㄱ ㄱㅎㄱ ㄴㄴ ㄷ ㅎㅅㅂ ㅈ211ㅈ ㅈ2ㅎ ㅈ3ㅎㄱ ㅈㅎㄴ ㅂㅈㅇ ㅈㅈㅇ ㅎㅈㅎ ㅈㅎㅎㅂㅇㅇㄹㅅㅇ ㅇㄱㅇ ㄱㅊㅇㅈ ㅇㄱ ㄱㅌㅅㄱ ㅂㅅ ㅅㄱㅇㄹㅂㅌ ㅅㅎㅌㄴㅅ ㅂㅎ ㅈㅎㄹㄱ ㅂ ㅅ ㅇ 나) 증없증 / (1) 법리 / O 위수증 (원칙,예외,적법절차,사법정의,인과희석,검사입증) / O 위 판례 첫 번째 법리 / O 위 판례 두 번째 법리, 이러한 절차를 위반하여 수집한 증거는 증거능력 없음 / O 피고인, 변호인이 증거동의 하더라도 달리 볼 것 아님 / (2) 인정사실 / 피고인 음주상태에서 운전하다 사고낸 후 의식 잃음, 응급실 후송되었는데 옷에서 술냄새 많이 났고 사고 시각으로부터 약 1시간 후 신고 받고 출동한 경찰관은 피고인의 아들로부터 채혈동의를 받고 간호사를 통해 혈액 채취, 영장없이 압수하였다는 내용으로 조서 작성, 감정, 사후영장발부X / (3) 압수된 혈액 / O 위 인정사실을 종합하면, 피고인은 의식을 잃은 상태였으므로, 피고인의 동의를 얻을 수 없는 긴급한 상황으로 보이고, 피고인의 옷에서 술냄새가 강하게 나는 등 준형행범인의 요건을 갖추고 있었으며, 사고 이후 바로 후송된 병원은 범죄장소에 준하고, 교통사고 발생시각으로부터 1시간 후는 사회통념상 범행 직후로 볼 수 있음. 따라서 형소법 제216조 제3항에 의하여 범죄장소에서의 압수수색이 가능하고, 압수수색에 필요한 처분으로 피고인으로부터의 혈액채취는 적법함. 다만, 사후 영장을 받았다는 사실을 인정할 아무런 증거가 없으므로, 위 압수는 적법절차의 실질 내용을 침해하는 위법한 압수에 해당함. 증거능력 없음 / (4) 피고인에 대한 검피신, 감정의뢰회보, 수사보고, 주취운전자 적발보고서, 주취운전자 정황보고서, 압수조서 / O 위 각 증거들은 위법하게 수집된 혈액을 기초로 수집된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면, 그 수집절차와 혈액의 수집절차의 위법사유 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 위 각 증거는 피고인에 대하여 증거능력 없고, 피고인 및 변호인이 증거동의 하였다고 달리 볼 것 아님 / 다) 피고인의 법정진술 / O 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지, 증거수집 위법성 이해하면서 인정 / O 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / O 형소법 제310조에 의하면 자백이 피고인에게 불리한 유일의 증거인 때에는 유죄인정의 증거로 하지 못함. 법정자백 증거능력 있으나 자백을 보강할 증거 없으므로 피고인의 자백이 피고인에게 불리한 유일의 증거에 해당하여 유죄의 증거로 할 수 없음 / 마) 소결론 / 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"1) 피고인은 오토바이를 운전하여 가다가 선행 차량의 뒷부분을 들이받는 교통사고를 야기한 후 의식을 잃은 채 119 구급차량에 의하여 병원 응급실로 후송되었음\n2) 사고 시각으로부터 약 1시간 후 사고 신고를 받고 병원 응급실로 출동한 경찰관은 법원으로부터 압수, 수색 또는 검증영장을 발부받지 아니한 채 피고인의 아들로부터 동의를 받아 간호사로 하여금 의식을 잃고 응급실에 누워 있는 피고인으로부터 채혈을 하도록 하였음(사후에 영장을 발부받지 아니함)\n3) 국과수는 피고인의 혈액을 감정한 결과 혈중알콜농도가 0.211%라는 취지로 감정의뢰회보를 제출하였고, 검사는 피고인을 기소하면서 위 감정의뢰회보를 증거로 제출함\n4) 피고인은 공소사실을 모두 인정하고 모든 증거에 동의함","링판번호":101},{"카드ID":"C100-1","판례ID":"C100","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"강제채뇨의 허용 여부 및 적법요건","사건번호":"2018도6219","태그":["L"],"중요도":0,"단락순번":1,"총단락수":3,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"강제 채뇨는 피의자가 임의로 소변을 제출하지 않는 경우 피의자에 대하여 강제력을 사용해서 도뇨관을 요도를 통하여 방광에 삽입한 뒤 체내에 있는 소변을 배출시켜 소변을 취득, 보관하는 행위임. 수사기관이 범죄 증거를 수집할 목적으로 하는 강제 채뇨는 피의자의 신체에 직접적인 작용을 수반할 뿐만 아니라 피의자에게 신체적 고통이나 장애를 초래하거나 수치심이나 굴욕감을 줄 수 있음. 따라서 피의자에게 범죄 혐의가 있고 그 범죄가 중대한지, 소변성분 분석을 통해서 범죄 혐의를 밝힐 수 있는지, 범죄 증거를 수집하기 위하여 피의자의 신체에서 소변을 확보하는 것이 필요한 것인지, 채뇨가 아닌 다른 수단으로는 증명이 곤란한지 등을 고려하여 범죄 수사를 위해서 강제 채뇨가 부득이하다고 인정되는 경우에 최후의 수단으로 적법한 절차에 따라 허용된다고 보아야 함. 이때 의사, 간호사, 그 밖의 숙련된 의료인 등으로 하여금 소변 채취에 적합한 의료장비와 시설을 갖춘 곳에서 피의자의 신체와 건강을 해칠 위험이 적고 피의자의 굴욕감 등을 최소화하는 방법으로 소변을 채취하여야 함","힌트_첫어절":"강제 채뇨는 피의자가 임의로","힌트_초성":"ㄱㅈ ㅊㄴㄴ ㅍㅇㅈㄱ ㅇㅇㄹ ㅅㅂㅇ ㅈㅊㅎㅈ ㅇㄴ ㄱㅇ ㅍㅇㅈㅇ ㄷㅎㅇ ㄱㅈㄹㅇ ㅅㅇㅎㅅ ㄷㄴㄱㅇ ㅇㄷㄹ ㅌㅎㅇ ㅂㄱㅇ ㅅㅇㅎ ㄷ ㅊㄴㅇ ㅇㄴ ㅅㅂㅇ ㅂㅊㅅㅋ ㅅㅂㅇ ㅊㄷ, ㅂㄱㅎㄴ ㅎㅇㅇ. ㅅㅅㄱㄱㅇ ㅂㅈ ㅈㄱㄹ ㅅㅈㅎ ㅁㅈㅇㄹ ㅎㄴ ㄱㅈ ㅊㄴㄴ ㅍㅇㅈㅇ ㅅㅊㅇ ㅈㅈㅈㅇ ㅈㅇㅇ ㅅㅂㅎ ㅃㅁ ㅇㄴㄹ ㅍㅇㅈㅇㄱ ㅅㅊㅈ ㄱㅌㅇㄴ ㅈㅇㄹ ㅊㄹㅎㄱㄴ ㅅㅊㅅㅇㄴ ㄱㅇㄱㅇ ㅈ ㅅ ㅇㅇ. ㄸㄹㅅ ㅍㅇㅈㅇㄱ ㅂㅈ ㅎㅇㄱ ㅇㄱ ㄱ ㅂㅈㄱ ㅈㄷㅎㅈ, ㅅㅂㅅㅂ ㅂㅅㅇ ㅌㅎㅅ ㅂㅈ ㅎㅇㄹ ㅂㅎ ㅅ ㅇㄴㅈ, ㅂㅈ ㅈㄱㄹ ㅅㅈㅎㄱ ㅇㅎㅇ ㅍㅇㅈㅇ ㅅㅊㅇㅅ ㅅㅂㅇ ㅎㅂㅎㄴ ㄱㅇ ㅍㅇㅎ ㄱㅇㅈ, ㅊㄴㄱ ㅇㄴ ㄷㄹ ㅅㄷㅇㄹㄴ ㅈㅁㅇ ㄱㄹㅎㅈ ㄷㅇ ㄱㄹㅎㅇ ㅂㅈ ㅅㅅㄹ ㅇㅎㅅ ㄱㅈ ㅊㄴㄱ ㅂㄷㅇㅎㄷㄱ ㅇㅈㄷㄴ ㄱㅇㅇ ㅊㅎㅇ ㅅㄷㅇㄹ ㅈㅂㅎ ㅈㅊㅇ ㄸㄹ ㅎㅇㄷㄷㄱ ㅂㅇㅇ ㅎ. ㅇㄸ ㅇㅅ, ㄱㅎㅅ, ㄱ ㅂㅇ ㅅㄹㄷ ㅇㄹㅇ ㄷㅇㄹ ㅎㅇㄱ ㅅㅂ ㅊㅊㅇ ㅈㅎㅎ ㅇㄹㅈㅂㅇ ㅅㅅㅇ ㄱㅊ ㄱㅇㅅ ㅍㅇㅈㅇ ㅅㅊㅇ ㄱㄱㅇ ㅎㅊ ㅇㅎㅇ ㅈㄱ ㅍㅇㅈㅇ ㄱㅇㄱ ㄷㅇ ㅊㅅㅎㅎㄴ ㅂㅂㅇㄹ ㅅㅂㅇ ㅊㅊㅎㅇㅇ ㅎ","핵심키워드":["채뇨","분석","최후","수치심","의료장비","도뇨관","수사","시설","위험","굴욕감","절차","강제","보관","장애","의사","범죄","증거","확보","적법","신체","수단","간호사","강제력","취득","의료인","증명","수집","제출"],"빈칸":{"1":[[0,2],[3,5],[40,43],[50,53],[93,95],[97,99],[113,115],[116,118],[132,134],[135,137],[144,146],[183,185],[193,196],[199,202],[222,224],[234,236],[249,251],[257,259],[274,276],[277,279],[295,297],[304,306],[321,323],[331,333],[337,339],[354,356],[357,359],[365,367],[368,370],[388,390],[392,394],[397,399],[401,403],[424,426],[428,431],[442,445],[465,469],[471,473],[487,489],[498,500],[510,513]],"2":[[0,2],[3,5],[7,10],[16,18],[20,22],[31,34],[40,43],[50,53],[63,65],[73,75],[80,82],[89,91],[93,95],[97,99],[107,111],[113,115],[116,118],[120,122],[132,134],[135,137],[139,142],[144,146],[153,155],[168,171],[178,180],[183,185],[187,189],[193,196],[199,202],[216,219],[222,224],[234,236],[249,251],[257,259],[274,276],[277,279],[281,283],[290,293],[295,297],[300,302],[304,306],[321,323],[331,333],[337,339],[341,343],[354,356],[357,359],[365,367],[368,370],[388,390],[392,394],[397,399],[401,403],[424,426],[428,431],[442,445],[454,456],[457,459],[465,469],[471,473],[482,485],[487,489],[491,493],[498,500],[505,508],[510,513],[528,530],[532,534]],"3":[[0,22],[31,53],[63,122],[132,155],[168,202],[216,224],[234,236],[249,259],[274,306],[321,343],[354,370],[388,403],[424,431],[442,445],[454,473],[482,513],[528,534]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 강제채뇨에 따른 소변 및 간이시약검사서는 위수증에 해당하여 증거능력 없다 주장 / 2) 검토 / 가) 법리 / O 수사기관이 범죄 증거를 수집할 목적으로 피의자의 동의 없이 소변을 채취하는 것은 감정허가장을 받아 감정에 필요한 처분으로, 압수수색영장을 받아 압수수색의 방법으로도 할 수 있으나, 부득이하다고 인정되는 경우에 최후의 수단으로 적법한 절차에 따라 허용되고 의료인으로 하여금 적합한 의료장비와 시설을 갖춘 곳에서 피의자의 신체와 건강을 해칠 위험이 적고 피의자의 굴욕감 등을 최소화하는 방법으로 채취하여야 함 / O 피의자에게서 임의동행을 기대할 수 없는 사정이 있는 때에는 소변 채취에 적합한 장소로 피의자를 데려가기 위해서 필요최소한의 유형력은 형소법 제219조, 제120조 제1항에서 정한 압수, 수색영장의 집행에 필요한 처분에 해당하여 허용됨 / 나) 인정사실 / 필로폰 투약으로 압수수색검증영장 발부, 압수할 물건으로 - 수색검증할 장소, 신체 또는 물건으로 -가 각 기재, 주거지 수색하여 주사기 압수, 피의자에게 소변 및 모발 제출요구하였으나 피의자 거부하고 자해하여 피의자에게 포승 채워 강제채취, 양성반응, 모발채취, 압수 / 다) 판단 / O 위 인정사실에 의하여 알 수 있는 다음과 같은 사정들, 경찰관의 장시간에 걸친 설득에도 불구하고 피고인은 소변의 임의 제출을 거부하면서 판사가 적법하게 발부한 압수영장의 집행에 저항한 점, 경찰관은 다른 방법으로 수사 목적을 달성하기 곤란하다고 판단하여 압수대상물인 피고인의 소변을 채취하기 위하여 강제로 피고인을 소변 채취에 적합한 장소인 인근 병원 응급실로 데리고 가 의사의 지시를 받은 응급구조사로 하여금 피고인의 신체에서 소변을 채취하도록 하였고, 그 과정에서 피고인에 대한 강제력의 행사가 필요 최소한도를 벗어나지 않은 점 등을 위 법리에 비추어 보면 경찰관의 이러한 조치는 형소법 제219조,제120조 제1항에서 정한 압수영장의 집행에 필요한 처분으로서 허용된다고 보는 것이 타당함 / O 위와 같이 경찰관의 적법한 압수수색영장 집행을 통해 수집한 증거물은 증거능력 있음 / O 변호인의 주장 받아들이지 아니함 / 라) 증거의 요지 / 마) 소결론 / 바) 부수처분 / - 수사보고(필로폰거래가격)의 기재에 의하면 필로폰 - 의 시가는 -원인 사실이 인정됨 / - 피고인으로부터 - 원 추징(마약법 제67조 단서)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"1) 피고인이 2017. 8. 초순 메트암페타민을 투약했다는 제보를 바탕으로 부산지방법원에 압수수색검증영장을 청구하여 2017. 8. 10. 영장담당판사로부터 마약류 관리에 관한 법률 위반 혐의에 관하여 압수수색검증영장을 발부받음\n2) 이 사건 영장의 압수할 물건란에는 피의자의 소변 30cc, 모발 약 80수, 마약류 불법사용에 대한 도구등이, 수색검증할 장소란에는 피의자의 실제 주거지 등이 포함되어 있음 피고인은 필로폰 투약으로 인한 마약류 관리에 관한 법률 위반(향정)죄로 수차례 처벌받은 전력이 있음\n3) 경찰관은 이 사건 영장 제시하고 피고인의 주거지 수색하여 사용 흔적이 있는 주사기 4개를 증거물로 압수하고, 3시간가량 소변과 모발 제출하도록 설득하였으나 피고인이 계속 거부하면서 자해함\n4) 피고인을 제압하고 수갑과 포승을 채운 뒤 강제로 병원 응급실로 데리고 가 응급구조사로 하여금 피고인의 신체에서 소변 30cc를 채취하도록 하여 이를 압수하고, 압수한 소변을 검사한 결과 필로폰 양성반응이 나옴","링판번호":102},{"카드ID":"C100-2","판례ID":"C100","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"강제채뇨의 허용 여부 및 적법요건","사건번호":"2018도6219","태그":["L"],"중요도":0,"단락순번":2,"총단락수":3,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"수사기관이 범죄 증거를 수집할 목적으로 피의자의 동의 없이 피의자의 소변을 채취하는 것은 법원으로부터 감정허가장을 받아 형소법 제221조의4 제1항, 제173조 제1항에서 정한 감정에 필요한 처분으로 할 수 있지만, 제219조, 제106조 제1항, 제109조에 따른 압수, 수색의 방법으로도 할 수 있음. 이러한 압수, 수색의 경우에도 수사기관은 원칙적으로 형소법 제215조에 따라 판사로부터 압수, 수색영장을 적법하게 발부받아 집행해야 함","힌트_첫어절":"수사기관이 범죄 증거를 수집할","힌트_초성":"ㅅㅅㄱㄱㅇ ㅂㅈ ㅈㄱㄹ ㅅㅈㅎ ㅁㅈㅇㄹ ㅍㅇㅈㅇ ㄷㅇ ㅇㅇ ㅍㅇㅈㅇ ㅅㅂㅇ ㅊㅊㅎㄴ ㄱㅇ ㅂㅇㅇㄹㅂㅌ ㄱㅈㅎㄱㅈㅇ ㅂㅇ ㅎㅅㅂ ㅈ221ㅈㅇ4 ㅈ1ㅎ, ㅈ173ㅈ ㅈ1ㅎㅇㅅ ㅈㅎ ㄱㅈㅇ ㅍㅇㅎ ㅊㅂㅇㄹ ㅎ ㅅ ㅇㅈㅁ, ㅈ219ㅈ, ㅈ106ㅈ ㅈ1ㅎ, ㅈ109ㅈㅇ ㄸㄹ ㅇㅅ, ㅅㅅㅇ ㅂㅂㅇㄹㄷ ㅎ ㅅ ㅇㅇ. ㅇㄹㅎ ㅇㅅ, ㅅㅅㅇ ㄱㅇㅇㄷ ㅅㅅㄱㄱㅇ ㅇㅊㅈㅇㄹ ㅎㅅㅂ ㅈ215ㅈㅇ ㄸㄹ ㅍㅅㄹㅂㅌ ㅇㅅ, ㅅㅅㅇㅈㅇ ㅈㅂㅎㄱ ㅂㅂㅂㅇ ㅈㅎㅎㅇ ㅎ","핵심키워드":["수색영장","감정허가장","감정","처분","수색","압수","원칙","범죄","증거","집행","적법","수집"],"유사법리":"C099-1(2011도15258,0.62)","빈칸":{"1":[[6,8],[9,11],[13,15],[57,62],[99,101],[107,109],[149,151],[153,155],[175,177],[179,181],[194,196],[220,222],[224,228],[230,232],[240,242]],"2":[[0,4],[6,8],[9,11],[13,15],[22,25],[33,36],[38,40],[42,44],[50,52],[57,62],[67,70],[71,78],[79,82],[84,89],[90,93],[99,101],[107,109],[121,126],[128,133],[134,137],[139,144],[149,151],[153,155],[175,177],[179,181],[188,192],[194,196],[200,203],[204,209],[214,216],[220,222],[224,228],[230,232],[240,242]],"3":[[0,109],[121,155],[175,181],[188,196],[200,203],[204,209],[214,216],[220,222],[224,228],[230,232],[240,242]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 강제채뇨에 따른 소변 및 간이시약검사서는 위수증에 해당하여 증거능력 없다 주장 / 2) 검토 / 가) 법리 / O 수사기관이 범죄 증거를 수집할 목적으로 피의자의 동의 없이 소변을 채취하는 것은 감정허가장을 받아 감정에 필요한 처분으로, 압수수색영장을 받아 압수수색의 방법으로도 할 수 있으나, 부득이하다고 인정되는 경우에 최후의 수단으로 적법한 절차에 따라 허용되고 의료인으로 하여금 적합한 의료장비와 시설을 갖춘 곳에서 피의자의 신체와 건강을 해칠 위험이 적고 피의자의 굴욕감 등을 최소화하 사정들, 경찰관의 장시간에 걸친 설득에도 불구하고 피고인은 소변의 임의 제출을 거부하면서 판사가 적법하게 발부한 압수영장의 집행에 저항한 점, 경찰관은 다른 방법으로 수사 목적을 달성하기 곤란하다고 판단하여 압수대상물인 피고인의 소변을 채취하기 위하여 강제로 피고인을 소변 채취에 적합한 장소인 인근 병원 응급실로 데리고 가 의사의 지시를 받은 응급구조사로 하여금 피고인의 신체에서 소변을 채취하도록 하였고, 그 과정에서 피고인에 대한 강제력의 행사가 필요 최소한도를 벗어나지 않은 점 등을 위 법리에 비추어 보면 경찰관의 이러한 조치는 형소법 제219조,제120조 제1항에서 정한 압수영장의 집행에 필요한 처분으로서 허용된다고 보는 것이 타당함 / O 위와 같이 경찰관의 적법한 압수수색영장 집행을 통해 수집한 증거물은 증거능력 있음 / O 변호인의 주장 받아들이지 아니함 / 라) 증거의 요지 / 마) 소결론 / 바) 부수처분 / - 수사보고(필로폰거래가격)의 기재에 의하면 필로폰 - 의 시가는 -원인 사실이 인정됨 / - 피고인으로부터 - 원 추징(마약법 제67조 단서)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"1) 피고인이 2017. 8. 초순 메트암페타민을 투약했다는 제보를 바탕으로 부산지방법원에 압수수색검증영장을 청구하여 2017. 8. 10. 영장담당판사로부터 마약류 관리에 관한 법률 위반 혐의에 관하여 압수수색검증영장을 발부받음\n2) 이 사건 영장의 압수할 물건란에는 피의자의 소변 30cc, 모발 약 80수, 마약류 불법사용에 대한 도구등이, 수색검증할 장소란에는 피의자의 실제 주거지 등이 포함되어 있음 피고인은 필로폰 투약으로 인한 마약류 관리에 관한 법률 위반(향정)죄로 수차례 처벌받은 전력이 있음\n3) 경찰관은 이 사건 영장 제시하고 피고인의 주거지 수색하여 사용 흔적이 있는 주사기 4개를 증거물로 압수하고, 3시간가량 소변과 모발 제출하도록 설득하였으나 피고인이 계속 거부하면서 자해함\n4) 피고인을 제압하고 수갑과 포승을 채운 뒤 강제로 병원 응급실로 데리고 가 응급구조사로 하여금 피고인의 신체에서 소변 30cc를 채취하도록 하여 이를 압수하고, 압수한 소변을 검사한 결과 필로폰 양성반응이 나옴","링판번호":102},{"카드ID":"C101-1","판례ID":"C101","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"위법한 임의동행에 기초한 1, 2차적 증거의 증거능력 판단기준","사건번호":"2012도13611","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"피의자가 동행을 거부하는 의사를 표시하였음에도 불구하고 경찰관들이 영장에 의하지 아니하고 피의자를 강제로 연행한 행위는 수사상의 강제처분에 관한 형소법상의 절차를 무시한 채 이루어진 것으로 위법한 체포에 해당하고, 이와 같이 위법한 체포상태에서 마약 투약 혐의를 확인하기 위한 채뇨 요구가 이루어진 경우, 채뇨 요구를 위한 위법한 체포와 그에 이은 채뇨 요구는 마약 투약이라는 범죄행위에 대한 증거 수집을 위하여 연속하여 이루어진 것으로서 개별적으로 그 적법 여부를 평가하는 것은 적절하지 아니하므로 그 일련의 과정을 전체적으로 보아 위법한 채뇨 요구가 있었던 것으로 볼 수밖에 없음","힌트_첫어절":"피의자가 동행을 거부하는 의사를","힌트_초성":"ㅍㅇㅈㄱ ㄷㅎㅇ ㄱㅂㅎㄴ ㅇㅅㄹ ㅍㅅㅎㅇㅇㅇㄷ ㅂㄱㅎㄱ ㄱㅊㄱㄷㅇ ㅇㅈㅇ ㅇㅎㅈ ㅇㄴㅎㄱ ㅍㅇㅈㄹ ㄱㅈㄹ ㅇㅎㅎ ㅎㅇㄴ ㅅㅅㅅㅇ ㄱㅈㅊㅂㅇ ㄱㅎ ㅎㅅㅂㅅㅇ ㅈㅊㄹ ㅁㅅㅎ ㅊ ㅇㄹㅇㅈ ㄱㅇㄹ ㅇㅂㅎ ㅊㅍㅇ ㅎㄷㅎㄱ, ㅇㅇ ㄱㅇ ㅇㅂㅎ ㅊㅍㅅㅌㅇㅅ ㅁㅇ ㅌㅇ ㅎㅇㄹ ㅎㅇㅎㄱ ㅇㅎ ㅊㄴ ㅇㄱㄱ ㅇㄹㅇㅈ ㄱㅇ, ㅊㄴ ㅇㄱㄹ ㅇㅎ ㅇㅂㅎ ㅊㅍㅇ ㄱㅇ ㅇㅇ ㅊㄴ ㅇㄱㄴ ㅁㅇ ㅌㅇㅇㄹㄴ ㅂㅈㅎㅇㅇ ㄷㅎ ㅈㄱ ㅅㅈㅇ ㅇㅎ 사를 표시하였음에도 영장에 의하지 아니하고 피고인 마옥환을 강제로 연행한 조치는 위법한 체포에 해당함 / O 피고인 마옥환에 대한 채뇨요구 역시 위법한 체포상태에서 증거 수집을 위하여 연속하여 이루어진 것으로서 그 일련의 과정을 전체적으로 보아 경찰관들의 채뇨 요구 역시 위법하고, 위법한 채뇨 요구에 의하여 수집된 소변채취동의서와 소변검사시인서 역시 적법한 절차에 따르지 아니하고 수집된 것으로서 유죄 인정의 증거로 삼을 수 없음 / O 수사보고(현장출동등), 피고인 마옥환에 대한 제1회 경찰 피의자신문조서 역시 위와 같은 위법한 체포상태에서 그에 기초하여 수집된 증거로 볼 수 있으므로 유죄 인정의 증거로 삼을 수 없음 / O 위 증거들은 모두 적법한 절차를 따르지 않고 수집한 증거이므로, 피고인 마옥환이나 그 변호인의 동의가 있더라도 유죄 인정의 증거로 삼을 수 없음 / (나) 감정서(모발), 감정서(소변), 수사보고(감정의뢰등) / O 위 인정사실에서 알 수 있는 아래와 같은 사정들을 종합하여 보면, 2차적 증거 수집이 위법한 체포.구금절차에 의하여 형성된 상태를 직접 이용하여 행하여진 것으로는 평가할 수 없으므로 체포과정에서의 절차적 위법과 2차적 증거 수집 사이의 인과관계를 희석하게 할 만한 정황에 속한다고 할 것임 / - 112신고된 내용, 경찰관들이 피고인 마옥환을 연행할 당시와 연행 후 경찰서에서 보인 행동 등에 비추어 피고인 마옥환 에 대한 긴급한 구호의 필요성이 있었다고 보임 / - 경찰관들로서는 피고인 마옥환을 마약 투약 혐의로 긴급체포 하는것도 고려할 수 있었고, 실제로 경찰관들은 긴급체포의 절차를 밟는 등 절차의 잘못을 시정하려고 한 바 있으므로, 경찰관들이 임의동행의 형식으로 피고인 마옥환을 연행한 조치는 단지 그 수사의 순서를 잘못 선택한 것이라고 할 수 있지만 그 위법의 정도가 헌법에 규정된 영장주의 원칙을 현저히 침해할 정도에 이르렀다고 보기 어려움 / - 연행 당시 경찰관들로서는 피고인 마옥환에게 마약 투약 범죄의 혐의가 있다고 인식하기에 충분한 상황이었고, 모텔에 투숙 중이던 피고인 마옥환이 마약 투약 혐의를 부인하면서 경찰서에의 동행을 거부하였으므로 피고인 마옥환의 임의 출석을 기대하기 어려울 뿐 아니라, 시일의 경과에 따라 피고인 마옥환의 신체에서 마약 성분이 희석, 배설됨으로써 증거가 소멸될 위험성도 농후하였음 / - 수사기관은 법원에 피고인 마옥환의 소변과 모발 등에 대한 압수영장을 청구하여 이를 발부받았고 피고인 마옥환 역시 경찰관으로부터 압수영장을 제시받은 뒤 그 집행에 응하여 소변과 모발을 제출하였음 / O 마약범죄같은 중대한 범죄 수사를 위하여 피고인 마옥환을 경찰 서로 동행하는 과정에서 위법이 있었다는 사유만으로 법원의 영장발부에 기하여 수집된 2차적 증거의 증거능력마저 부인한다면, 이는 오히려 적법절차의 원칙과 실체적 진실 규명의 조화를 도모하고 형사사법정의를 실현하려 한 취지에 반하는 결과를 초래할 수 있음 / O 따라서 위 증거들은 증거능력이 있음 / (다) 피고인 마옥환에 대한 제2회 경찰 피의자신문조서, 피고인 마옥환에 대한 제1회 검찰 피의자신문조서 / O 위 증거들은 당초의 위법한 체포와의 인과관계가 단절 또는 희석할 만한 정황이 있음을 이유로 그 증거능력이 인정되는 수사보고(감정의뢰등), 감정서(모발), 감정서(소변)가 수집된 이후 위법한 체포와는 독립되어 피고인 마옥환의 자발적 진술에 기초하여 수집된 것으로 볼 수 있어 그 증거능력이 있음 / (4) 증거의 요지 / - 마옥환에 대한 제1회 검찰 피의자신문조서의 진술기재 / - 신고현에 대한 경찰 진술조서의 진술기재 / - 감정서(소변)의 기재 / - 수사보고(감정의뢰등)의 기재 / (5) 소결론 / (6) 부수처분 / O 수사보고(필로폰거래가격)의 기재에 의하면, 필로폰 0.03g의 거래가격은 100,000원인 사실을 인정할 수 있음. / O 피고인으로부터 100,000원을 추징(마약법 제67조 단서)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"위법한 체포상태에서 1차 채뇨, 영장 발부받은 후 구속, 영장 발부받은 후 2차 채뇨 및 채모","링판번호":103},{"카드ID":"C101-2","판례ID":"C101","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"위법한 임의동행에 기초한 1, 2차적 증거의 증거능력 판단기준","사건번호":"2012도13611","태그":["L"],"중요도":1,"단락순번":2,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"수사기관이 헌법과 형소법이 정한 절차에 따르지 아니하고 수집한 증거는 물론, 이를 기초로 하여 획득한 2차적 증거 역시 유죄 인정의 증거로 삼을 수 없는 것이 원칙임. 다만 수사기관의 절차 위반 행위가 적법절차의 실질적인 내용을 침해하는 경우에 해당하지 아니하고, 오히려 그 증거의 증거능력을 배제하는 것이 헌법과 형소법이 형사소송에 관한 절차조항을 마련하여 적법절차의 원칙과 실체적 진실 규명의 조화를 도모하고, 이를 통하여 형사 사법 정의를 실현하려고 한 취지에 반하는 결과를 초래하는 것으로 평가되는 예외적인 경우라면, 법원은 그 증거를 유죄 인정의 증거로 사용할 수 있음. 따라서 법원이 2차적 증거의 증거능력 인정 여부를 최종적으로 판단할 때에는 먼저 절차에 따르지 아니한 1차적 증거 수집과 관련된 모든 사정들, 즉 절차조항의 취지와 그 위반의 내용 및 정도, 구체적인 위반 경위와 회피가능성, 절차조항이 보호하고자 하는 권리 또는 법익의 성질과 침해 정도 및 피고인과의 관련성, 절차 위반행위와 증거수집 사이의 인과관계 등 관련성의 정도, 수사기관의 인식과 의도 등을 살피는 것은 물론, 나아가 1차적 증거를 기초로 하여 다시 2차적 증거를 수집하는 과정에서 추가로 발생한 모든 사정들까지 구체적인 사안에 따라 주로 인과관계 희석 또는 단절 여부를 중심으로 전체적, 종합적으로 고려하여야 함. 수사기관이 이른바 임의동행 명목으로 피의자를 수사관서 등에 동행하는 방법에 의하여 실질적으로 영장 없이 피의자를 체포한 위법이 있는 경우에도, 그와 같이 체포된 상태에서 수집된 2차적 증거를 유죄 인정의 증거로 삼을 수 있는지 역시 위와 같은 법리에 의하여 판단되어야 함","힌트_첫어절":"수사기관이 헌법과 형소법이 정한","힌트_초성":"ㅅㅅㄱㄱㅇ ㅎㅂㄱ ㅎㅅㅂㅇ ㅈㅎ ㅈㅊㅇ ㄸㄹㅈ ㅇㄴㅎㄱ ㅅㅈㅎ ㅈㄱㄴ ㅁㄹ, ㅇㄹ ㄱㅊㄹ ㅎㅇ ㅎㄷㅎ 2ㅊㅈ ㅈㄱ ㅇㅅ ㅇㅈ ㅇㅈㅇ ㅈㄱㄹ ㅅㅇ ㅅ ㅇㄴ ㄱㅇ ㅇㅊㅇ. ㄷㅁ ㅅㅅㄱㄱㅇ ㅈㅊ ㅇㅂ ㅎㅇㄱ ㅈㅂㅈㅊㅇ ㅅㅈㅈㅇ ㄴㅇㅇ ㅊㅎㅎㄴ ㄱㅇㅇ ㅎㄷㅎㅈ ㅇㄴㅎㄱ, ㅇㅎㄹ ㄱ ㅈㄱㅇ ㅈㄱㄴㄹㅇ ㅂㅈㅎㄴ ㄱㅇ ㅎㅂㄱ ㅎㅅㅂㅇ ㅎㅅㅅㅅㅇ ㄱㅎ ㅈㅊㅈㅎㅇ ㅁㄹㅎㅇ ㅈㅂㅈㅊㅇ ㅇㅊㄱ ㅅㅊㅈ ㅈㅅ ㄱㅁㅇ ㅈㅎㄹ ㄷㅁㅎㄱ, ㅇㄹ ㅌㅎㅇ ㅎㅅ ㅅㅂ ㅈㅇㄹ ㅅㅎㅎㄹㄱ ㅎ ㅊㅈㅇ ㅂㅎㄴ ㄱㄱㄹ ㅊㄹㅎㄴ ㄱㅇㄹ ㅍㄱㄷㄴ ㅇㅇㅈㅇ ㄱㅇㄹㅁ, ㅂㅇㅇ ㄱ ㅈㄱㄹ ㅇㅈ ㅇㅈㅇ ㅈㄱㄹ ㅅㅇㅎ ㅅ ㅇㅇ. ㄸㄹㅅ ㅂㅇㅇ 2ㅊㅈ ㅈㄱㅇ ㅈㄱㄴㄹ ㅇㅈ ㅇㅂㄹ ㅊㅈㅈㅇㄹ ㅍㄷㅎ ㄸㅇㄴ ㅁㅈ ㅈㅊㅇ ㄸㄹㅈ ㅇㄴㅎ 1ㅊㅈ ㅈㄱ ㅅㅈㄱ ㄱㄹㄷ ㅁㄷ ㅅㅈㄷ, ㅈ ㅈㅊㅈㅎㅇ ㅊㅈㅇ ㄱ ㅇㅂㅇ ㄴㅇ ㅁ ㅈㄷ, ㄱㅊㅈㅇ ㅇㅂ ㄱㅇㅇ ㅎㅍㄱㄴㅅ, ㅈㅊㅈㅎㅇ ㅂㅎㅎㄱㅈ ㅎㄴ ㄱㄹ ㄸㄴ ㅂㅇㅇ ㅅㅈㄱ ㅊㅎ ㅈㄷ ㅁ ㅍㄱㅇㄱㅇ ㄱㄹㅅ, ㅈㅊ ㅇㅂㅎㅇㅇ ㅈㄱㅅㅈ ㅅㅇㅇ ㅇㄱㄱㄱ ㄷ ㄱㄹㅅㅇ ㅈㄷ, ㅅㅅㄱㄱㅇ ㅇㅅㄱ ㅇㄷ ㄷㅇ ㅅㅍㄴ ㄱㅇ ㅁㄹ, ㄴㅇㄱ 1ㅊㅈ ㅈㄱㄹ ㄱㅊㄹ ㅎㅇ ㄷㅅ 2ㅊㅈ ㅈㄱㄹ ㅅㅈㅎㄴ ㄱㅈㅇㅅ ㅊㄱㄹ ㅂㅅㅎ ㅁㄷ ㅅㅈㄷㄲㅈ ㄱㅊㅈㅇ ㅅㅇㅇ ㄸㄹ ㅈㄹ ㅇㄱㄱㄱ ㅎㅅ ㄸㄴ ㄷㅈ ㅇㅂㄹ ㅈㅅㅇㄹ ㅈㅊㅈ, ㅈㅎㅈㅇㄹ ㄱㄹㅎㅇㅇ ㅎ. ㅅㅅㄱㄱㅇ ㅇㄹㅂ ㅇㅇㄷㅎ ㅁㅁㅇㄹ ㅍㅇㅈㄹ ㅅㅅㄱㅅ ㄷㅇ ㄷㅎㅎㄴ ㅂㅂㅇ ㅇㅎㅇ ㅅㅈㅈㅇㄹ ㅇㅈ ㅇㅇ ㅍㅇㅈㄹ ㅊㅍㅎ ㅇㅂㅇ ㅇㄴ ㄱㅇㅇㄷ, ㄱㅇ ㄱㅇ ㅊㅍㄷ ㅅㅌㅇㅅ ㅅㅈㄷ 2ㅊㅈ ㅈㄱㄹ ㅇㅈ ㅇㅈㅇ ㅈㄱㄹ ㅅㅇ 소사실 부인 / 2) 검토 / 가) 필로폰 투약 부분 / (1) 법리 / O 위수증 (원칙,예외,적법절차,사법정의,인과희석,검사입증) / O 피고인이나 변호인이 증거동의 하여도 달리 볼 것 아님 / (2) 인정사실 / O 신고현은 위 모텔에 전화를 하여 신고를 부탁, 위 모텔 업주는 112전화로 신고를 하였음 / O 이에 경찰관들이 피고인 마옥환이 있던 위 모텔 방에 현장출동하였는데, 당시 피고인 마옥환은 비상식적인 행동을 하였고 술만 먹었지 마약을 투약하지 않았다라고 함 / O 경찰관들이 피고인 마옥환에게 소변검사를 하자고 하였으나, 피고인 마옥환은 영장 없으면 가지 않겠다라고 말하며 머리를 벽에 부딪히는 행동을 하였고, 이에 경찰관들은 피고인 마옥환의 팔을 잡아 서울서초경찰서로 동행하였음 / O 피고인 마옥환은 경찰서 형사과에 도착한 후 소변을 채취하자는 요구를 계속 거부하다가 소변채취동의서에 서명하고 화장실에 가서 종이컵에 소변을 받는 척 하다가 화장실 쓰레기통에 소변을 본 후 경찰관이 들고 있던 종이컵을 빼앗아 구겨버렸음(제1차 채뇨 절차) / O 경찰관이 종이컵에 남아 있는 미량의 소변에 대하여 간이시약검사를 한 결과 메트암페타민에 대한 양성반응이 나왔고, 이에 피고인 소변검사시인서에 서명무인하였음 / O 피고인 마옥환을 마약법위반(향정) 혐의로 긴급체포, 같은 날 피고인 마옥환에 대한 구속영장과 소변 및 모발 등에 대한 압수, 수색, 검증영장을 청구, 각 발부 / O 경찰관들은 피고인 마옥환에게 압수영장을 제시하고 소변과 모발을 채취하여(제2차 채뇨절차) 감정의뢰하였고, 감정결과 메트암페타민 성분이 검출되었음 / (3) 증거능력에 관한 검토 / (가) 소변채취동의서, 소변검사시인서, 수사보고(현장출동등), 피고인 마옥환에 대한 제1회 경찰 피의자신문조서 / O 위 인정사실에 의하면, 피고인 마옥환이 동행을 거부하겠다는 의사를 표시하였음에도 영장에 의하지 아니하고 피고인 마옥환을 강제로 연행한 조치는 위법한 체포에 해당함 / O 피고인 마옥환에 대한 채뇨요구 역시 위법한 체포상태에서 증거 수집을 위하여 연속하여 이루어진 것으로서 그 일련의 과정을 전체적으로 보아 경찰관들의 채뇨 요구 역시 위법하고, 위법한 채뇨 요구에 의하여 수집된 소변채취동의서와 소변검사시인서 역시 적법한 절차에 따르지 아니하고 수집된 것으로서 유죄 인정의 증거로 삼을 수 없음 / O 수사보고(현장출동등), 피고인 마옥환에 대한 제1회 경찰 피의자신문조서 역시 위와 같은 위법한 체포상태에서 그에 기초하여 수집된 증거로 볼 수 있으므로 유죄 인정의 증거로 삼을 수 없음 / O 위 증거들은 모두 적법한 절차를 따르지 않고 수집한 증거이므로, 피고인 마옥환이나 그 변호인의 동의가 있더라도 유죄 인정의 증거로 삼을 수 없음 / (나) 감정서(모발), 감정서(소변), 수사보고(감정의뢰등) / O 위 인정사실에서 알 수 있는 아래와 같은 사정들을 종합하여 보면, 2차적 증거 수집이 위법한 체포.구금절차에 의하여 형성된 상태를 직접 이용하여 행하여진 것으로는 평가할 수 없으므로 체포과정에서의 절차적 위법과 2차적 증거 수집 사이의 인과관계를 희석하게 할 만한 정황에 속한다고 할 것임 / - 112신고된 내용, 경찰관들이 피고인 마옥환을 연행할 당시와 연행 후 경찰서에서 보인 행동 등에 비추어 피고인 마옥환 에 대한 긴급한 구호의 필요성이 있었다고 보임 / - 경찰관들로서는 피고인 마옥환을 마약 투약 혐의로 긴급체포 하는것도 고려할 수 있었고, 실제로 경찰관들은 긴급체포의 절차를 밟는 등 절차의 잘못을 시정하려고 한 바 있으므로, 경찰관들이 임의동행의 형식으로 피고인 마옥환을 연행한 조치는 단지 그 수사의 순서를 잘못 선택한 것이라고 할 수 있지만 그 위법의 정도가 헌법에 규정된 영장주의 원칙을 현저히 침해할 정도에 이르렀다고 보기 어려움 / - 연행 당시 경찰관들로서는 피고인 마옥환에게 마약 투약 범죄의 혐의가 있다고 인식하기에 충분한 상황이었고, 모텔에 투숙 중이던 피고인 마옥환이 마약 투약 혐의를 부인하면서 경찰서에의 동행을 거부하였으므로 피고인 마옥환의 임의 출석을 기대하기 어려울 뿐 아니라, 시일의 경과에 따라 피고인 마옥환의 신체에서 마약 성분이 희석, 배설됨으로써 증거가 소멸될 위험성도 농후하였음 / - 수사기관은 법원에 피고인 마옥환의 소변과 모발 등에 대한 압수영장을 청구하여 이를 발부받았고 피고인 마옥환 역시 경찰관으로부터 압수영장을 제시받은 뒤 그 집행에 응하여 소변과 모발을 제출하였음 / O 마약범죄같은 중대한 범죄 수사를 위하여 피고인 마옥환을 경찰 서로 동행하는 과정에서 위법이 있었다는 사유만으로 법원의 영장발부에 기하여 수집된 2차적 증거의 증거능력마저 부인한다면, 이는 오히려 적법절차의 원칙과 실체적 진실 규명의 조화를 도모하고 형사사법정의를 실현하려 한 취지에 반하는 결과를 초래할 수 있음 / O 따라서 위 증거들은 증거능력이 있음 / (다) 피고인 마옥환에 대한 제2회 경찰 피의자신문조서, 피고인 마옥환에 대한 제1회 검찰 피의자신문조서 / O 위 증거들은 당초의 위법한 체포와의 인과관계가 단절 또는 희석할 만한 정황이 있음을 이유로 그 증거능력이 인정되는 수사보고(감정의뢰등), 감정서(모발), 감정서(소변)가 수집된 이후 위법한 체포와는 독립되어 피고인 마옥환의 자발적 진술에 기초하여 수집된 것으로 볼 수 있어 그 증거능력이 있음 / (4) 증거의 요지 / - 마옥환에 대한 제1회 검찰 피의자신문조서의 진술기재 / - 신고현에 대한 경찰 진술조서의 진술기재 / - 감정서(소변)의 기재 / - 수사보고(감정의뢰등)의 기재 / (5) 소결론 / (6) 부수처분 / O 수사보고(필로폰거래가격)의 기재에 의하면, 필로폰 0.03g의 거래가격은 100,000원인 사실을 인정할 수 있음. / O 피고인으로부터 100,000원을 추징(마약법 제67조 단서)","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"위법한 체포상태에서 1차 채뇨, 영장 발부받은 후 구속, 영장 발부받은 후 2차 채뇨 및 채모","링판번호":103},{"카드ID":"C102-1","판례ID":"C102","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"전자정보의 압수방법 (선별압수, 저장매체 반출, 이미징 및 참여권)","사건번호":"2009모1190","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"전자정보에 대한 압수, 수색영장의 집행에 있어서는 원칙적으로 영장 발부의 사유로 된 혐의사실과 관련된 부분만을 문서 출력물로 수집하거나 수사기관이 휴대한 저장매체에 해당 파일을 복사하는 방식으로 이루어져야 하고, 집행현장의 사정상 위와 같은 방식에 의한 집행이 불가능하거나 현저히 곤란한 부득이한 사정이 존재하더라도 그와 같은 경우에 그 저장매체 자체를 직접 혹은 하드카피나 이미징 등 형태로 수사기관 사무실 등 외부로 반출하여 해당 파일을 압수, 수색할 수 있도록 영장에 기재되어 있고 실제 그와 같은 사정이 발생한 때에 한하여 예외적으로 허용될 수 있을 뿐임. 나아가 이처럼 저장매체 자체를 수사기관 사무실 등으로 옮긴 후 영장에 기재된 범죄 혐의 관련 전자정보를 탐색하여 해당 전자정보를 문서로 출력하거나 파일을 복사하는 과정 역시 전체적으로 압수, 수색영장 집행의 일환에 포함된다고 보아야 함. 따라서 그러한 경우의 문서출력 또는 파일복사의 대상 역시 혐의사실과 관련된 부분으로 한정되어야 함은 헌법 제12조 제1항, 제3항, 형소법 제114조, 제215조의 적법절차 및 영장주의의 원칙상 당연함. 그러므로 수사기관 사무실 등으로 옮긴 저장매체에서 범죄 혐의와의 관련성에 대한 구분 없이 저장된 전자정보 중 임의로 문서출력 혹은 파일복사를 하는 행위는 특별한 사정이 없는 한 영장주의 등 원칙에 반하는 위법한 집행이 됨","힌트_첫어절":"전자정보에 대한 압수, 수색영장의","힌트_초성":"ㅈㅈㅈㅂㅇ 정들 즉, / - 수사기관이 이 사건 저장매체 내 전자정보에 대한 압수수색영장을 집행함에 있어 저장매체를 수사기관의 사무실로 옮긴 것은 영장이 예외적으로 허용한 부득이한 사유의 발생에 따른 것인 점 / - 수사기관이 나름대로 혐의사실과 관련있는 부분으로 복사 대상을 제한하려고 노력한 것으로 보이는 점 / - 당사자 측도 그 조치의 적합성에 대해 묵시적으로 동의한 것으로 볼 수 있는 점 등 압수수색의 전과정에 비추어 볼 때 수사기관의 영장집행이 위법하다고 볼 수 없음","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"8,000여개의 전자정보파일을 복사하였으나 피압수자 측의 참여권 보장되었고 당사자 측이 묵시적으로 동의한 것으로 보아 적법하다고 한 사례","링판번호":104},{"카드ID":"C103-1","판례ID":"C103","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"전자정보의 압수방법 및 별건 전자정보 압수방법","사건번호":"2011모1839","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\" / 제1영장에 기한 압수, 수색의 적법성","법리원문":"수사기관 사무실 등으로 반출된 저장매체 또는 복제본에서 혐의사실 관련성에 대한 구분 없이 임의로 저장된 전자정보를 문서로 출력하거나 파일로 복제하는 행위는 원칙적으로 영장주의 원칙에 반하는 위법한 압수가 됨. 저장매체에 대한 압수, 수색 과정에서 범위를 정하여 출력 또는 복제하는 방법이 불가능하거나 압수의 목적을 달성하기에 현저히 곤란한 예외적인 사정이 인정되어 전자정보가 담긴 저장매체 또는 복제본을 수사기관 사무실 등으로 옮겨 이를 복제, 탐색, 출력하는 경우에도, 그와 같은 일련의 과정에서 형소법 제219조, 제121조에서 규정하는 피압수자나 그 변호인에게 참여의 기회를 보장하고 혐의사실과 무관한 전자정보의 임의적인 복제 등을 막기 위한 적절한 조치를 취하는 등 영장주의 원칙과 적법절차를 준수하여야 함. 만약 그러한 조치가 취해지지 않았다면 피압수자 측이 참여하지 아니한다는 의사를 명시적으로 표시하였거나 절차 위반행위가 이루어진 과정의 성질과 내용 등에 비추어 피압수자 측에 절차 참여를 보장한 취지가 실질적으로 침해되었다고 볼 수 없을 정도에 해당한다는 등의 특별한 사정이 없는 이상 압수, 수색이 적법하다고 평가할 수 없고, 비록 수사기관이 저장매체 또는 복제본에서 혐의사실과 관련된 전자정보만을 복제, 출력하였다 하더라도 달리 볼 것은 아님","힌트_첫어절":"수사기관 사무실 등으로 반출된","힌트_초성":"ㅅㅅㄱㄱ ㅅㅁㅅ ㄷㅇㄹ ㅂㅊㄷ ㅈㅈㅁㅊ ㄸㄴ ㅂㅈㅂㅇㅅ ㅎㅇㅅㅅ ㄱㄹㅅㅇ ㄷㅎ ㄱㅂ ㅇㅇ ㅇㅇㄹ ㅈㅈㄷ ㅈㅈㅈㅂㄹ ㅁㅅㄹ ㅊㄹㅎㄱㄴ ㅍㅇㄹ ㅂㅈㅎㄴ ㅎㅇㄴ ㅇㅊㅈㅇㄹ ㅇㅈㅈㅇ ㅇㅊㅇ ㅂㅎㄴ ㅇㅂㅎ ㅇㅅㄱ ㄷ. ㅈㅈㅁㅊㅇ ㄷㅎ ㅇㅅ, ㅅㅅ ㄱㅈㅇㅅ ㅂㅇㄹ ㅈㅎㅇ ㅊㄹ ㄸㄴ ㅂㅈㅎㄴ ㅂㅂㅇ ㅂㄱㄴㅎㄱㄴ ㅇㅅㅇ ㅁㅈㅇ ㄷㅅㅎㄱㅇ ㅎㅈㅎ ㄱㄹㅎ ㅇㅇㅈㅇ ㅅㅈㅇ ㅇㅈㄷㅇ ㅈㅈㅈㅂㄱ ㄷㄱ ㅈㅈㅁㅊ ㄸㄴ ㅂㅈㅂㅇ ㅅㅅㄱㄱ ㅅㅁㅅ ㄷㅇㄹ ㅇㄱ ㅇㄹ ㅂㅈ, ㅌㅅ, ㅊㄹㅎㄴ ㄱㅇㅇㄷ, ㄱㅇ ㄱㅇ ㅇㄹㅇ ㄱㅈㅇㅅ ㅎㅅㅂ ㅈ219ㅈ, ㅈ121ㅈㅇㅅ ㄱㅈㅎㄴ ㅍㅇㅅㅈㄴ ㄱ ㅂㅎㅇㅇㄱ ㅊㅇㅇ ㄱㅎㄹ ㅂㅈㅎㄱ ㅎㅇㅅㅅㄱ ㅁㄱㅎ ㅈㅈㅈㅂㅇ ㅇㅇㅈㅇ ㅂㅈ ㄷㅇ ㅁㄱ ㅇㅎ ㅈㅈㅎ ㅈㅊㄹ ㅊㅎㄴ ㄷ ㅇㅈㅈㅇ ㅇㅊㄱ ㅈㅂㅈㅊㄹ ㅈㅅㅎㅇㅇ ㅎ. ㅁㅇ ㄱㄹㅎ ㅈㅊㄱ ㅊㅎㅈㅈ ㅇㅇㄷㅁ ㅍㅇㅅㅈ ㅊㅇ ㅊㅇㅎㅈ ㅇㄴㅎㄷㄴ ㅇㅅㄹ ㅁㅅㅈㅇㄹ ㅍㅅㅎㅇㄱㄴ ㅈㅊ ㅇㅂㅎㅇㄱ ㅇㄹㅇㅈ ㄱㅈㅇ ㅅㅈㄱ ㄴㅇ ㄷㅇ ㅂㅊㅇ ㅍㅇㅅㅈ ㅊㅇ ㅈㅊ ㅊㅇㄹ ㅂㅈㅎ ㅊㅈㄱ ㅅㅈㅈㅇㄹ ㅊㅎㄷㅇㄷㄱ ㅂ ㅅ ㅇㅇ ㅈㄷㅇ ㅎㄷㅎㄷㄴ ㄷㅇ ㅌㅂㅎ ㅅㅈㅇ ㅇㄴ ㅇㅅ ㅇㅅ, ㅅㅅㅇ ㅈㅂㅎㄷㄱ ㅍㄱㅎ ㅅ ㅇㄱ, ㅂㄹ ㅅㅅㄱㄱㅇ ㅈㅈㅁㅊ ㄸㄴ ㅂㅈㅂㅇㅅ ㅎㅇㅅㅅㄱ ㄱㄹㄷ ㅈ 분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"전자정보의 압수방법 및 별건 전자정보 압수방법","사건번호":"2011모1839","태그":["L"],"중요도":1,"단락순번":2,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\" / 제2영장에 기한 압수수색의 적법성","법리원문":"전자정보에 대한 압수, 수색에 있어 그 저장매체 자체를 외부로 반출하거나 하드카피, 이미징 등의 형태로 복제본을 만들어 외부에서 그 저장매체나 복제본에 대하여 압수, 수색이 허용되는 예외적인 경우에도 혐의사실과 관련된 전자정보 이외에 이와 무관한 전자정보를 탐색, 복제, 출력하는 것은 원칙적으로 위법한 압수, 수색에 해당하므로 허용될 수 없음. 그러나 전자정보에 대한 압수, 수색이 종료되기 전에 혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관으로서는 더 이상의 추가 탐색을 중단하고 법원으로부터 별도의 범죄혐의에 대한 압수, 수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수, 수색을 할 수 있음. 나아가 이러한 경우에도 그 피압수자에게 형소법 제219조, 제121조, 제129조에 따라 참여권을 보장하고 압수한 전자정보 목록을 교부하는 등 피압수자의 이익을 보호하기 위한 적절한 조치가 이루어져야 할 것임","힌트_첫어절":"전자정보에 대한 압수, 수색에","힌트_초성":"ㅈㅈㅈㅂㅇ ㄷㅎ ㅇㅅ, ㅅㅅㅇ ㅇㅇ ㄱ ㅈㅈㅁㅊ ㅈㅊㄹ ㅇㅂㄹ ㅂㅊㅎㄱㄴ ㅎㄷㅋㅍ, ㅇㅁㅈ ㄷㅇ ㅎㅌㄹ ㅂㅈㅂㅇ ㅁㄷㅇ ㅇㅂㅇㅅ ㄱ ㅈㅈㅁㅊㄴ ㅂㅈㅂㅇ ㄷㅎㅇ ㅇㅅ, ㅅㅅㅇ ㅎㅇㄷㄴ ㅇㅇㅈㅇ ㄱㅇㅇㄷ ㅎㅇㅅㅅㄱ ㄱㄹㄷ ㅈㅈㅈㅂ ㅇㅇㅇ ㅇㅇ ㅁㄱㅎ ㅈㅈㅈㅂㄹ ㅌㅅ, ㅂㅈ, ㅊㄹㅎㄴ ㄱㅇ ㅇㅊㅈㅇㄹ ㅇㅂㅎ ㅇㅅ, ㅅㅅㅇ ㅎㄷㅎㅁㄹ ㅎㅇㄷ ㅅ ㅇㅇ. ㄱㄹㄴ ㅈㅈㅈㅂㅇ ㄷㅎ ㅇㅅ, ㅅㅅㅇ ㅈㄹㄷㄱ ㅈㅇ ㅎㅇㅅㅅㄱ ㄱㄹㄷ ㅈㅈㅈㅂㄹ ㅈㅂㅎㄱ ㅌㅅㅎㄴ ㄱㅈㅇㅅ ㅂㄷㅇ ㅂㅈㅎㅇㅇ ㄱㄹㄷ ㅈㅈㅈㅂㄹ ㅇㅇㅎ ㅂㄱㅎ ㄱㅇㄹㅁ, ㅅㅅㄱㄱㅇㄹㅅㄴ ㄷ ㅇㅅㅇ ㅊㄱ ㅌㅅㅇ ㅈㄷㅎㄱ ㅂㅇㅇㄹㅂㅌ ㅂㄷㅇ ㅂㅈㅎㅇㅇ ㄷㅎ ㅇㅅ, ㅅㅅㅇㅈㅇ ㅂㅂㅂㅇ ㄱㅇㅇ ㅎㅎㅇ ㄱㄹㅎ ㅈㅂㅇ ㄷㅎㅇㄷ ㅈㅂㅎㄱ ㅇㅅ, ㅅㅅㅇ ㅎ ㅅ ㅇㅇ. ㄴㅇㄱ ㅇㄹㅎ ㄱㅇㅇㄷ ㄱ ㅍㅇㅅㅈㅇㄱ ㅎㅅㅂ ㅈ219ㅈ, ㅈ121ㅈ, ㅈ129ㅈㅇ ㄸㄹ ㅊㅇㄱㅇ ㅂㅈㅎㄱ ㅇㅅㅎ ㅈㅈㅈㅂ ㅁㄹㅇ ㄱㅂㅎㄴ ㄷ ㅍㅇㅅㅈㅇ ㅇㅇㅇ ㅂㅎㅎㄱ ㅇㅎ ㅈㅈㅎ ㅈㅊㄱ ㅇㄹㅇㅈㅇ ㅎ ㄱㅇ","핵심키워드":["참여권","범죄혐의","수색영장","복제본","저장매체","혐의사실","피압수자","목록","수색","이익","전자정보","압수","복제","원칙","보호","정보","하드카피","조치","적법","위법","과정","발견","교부","보장","관련","허용"],"유사법리":"C112-5(2016도348,0.49)","빈칸":{"1":[[0,4],[9,11],[13,15],[22,26],[41,45],[58,61],[74,78],[80,83],[89,91],[93,95],[97,99],[112,116],[118,120],[122,126],[138,142],[148,150],[160,162],[166,168],[170,172],[174,176],[184,186],[198,202],[207,209],[211,213],[223,227],[229,231],[233,237],[239,241],[249,251],[258,262],[264,266],[268,272],[278,280],[326,330],[335,337],[339,343],[362,364],[371,373],[376,378],[380,382],[407,411],[442,445],[447,449],[452,454],[456,460],[461,463],[465,467],[472,476],[478,480],[482,484],[494,496]],"2":[[0,4],[9,11],[13,15],[22,26],[31,33],[41,45],[58,61],[67,69],[74,78],[80,83],[89,91],[93,95],[97,99],[112,116],[118,120],[122,126],[138,142],[144,146],[148,150],[152,154],[160,162],[166,168],[170,172],[174,176],[184,186],[198,202],[207,209],[211,213],[223,227],[229,231],[233,237],[239,241],[244,246],[249,251],[258,262],[264,266],[268,272],[278,280],[288,292],[306,308],[315,317],[326,330],[335,337],[339,343],[362,364],[371,373],[376,378],[380,382],[407,411],[414,417],[418,423],[425,430],[432,437],[442,445],[447,449],[452,454],[456,460],[461,463],[465,467],[472,476],[478,480],[482,484],[494,496]],"3":[[0,45],[58,99],[112,126],[138,186],[198,213],[223,292],[306,317],[326,343],[362,382],[407,484],[494,496]]},"발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 3) 압수, 수색, 검증의 대상","사실관계":"배임혐의 관련 압수수색영장(제1영장) 발부받고 저장매체를 반출, 피압수자의 참여하에 정보파일 전부를 복제(제1처분)한 뒤 피압수자 참여 없이 검사 소지 외장하드에 다운로드 및 저장(제2처분), 이후 별건 혐의와 관련된 정보 출력(제3처분)하여 제2 압수수색영장을 받아 압수(제4처분)후 문서로 출력(제5처분)","링판번호":105},{"카드ID":"C104-1","판례ID":"C104","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"전자정보 출력문건의 동일성, 무결성 증명방법","사건번호":"2013도2511","태그":["L"],"중요도":0,"단락순번":1,"총단락수":1,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"압수물인 컴퓨터용 디스크 그 밖에 이와 비슷한 정보저장매체에 입력하여 기억된 문자정보 또는 그 출력물을 증거로 사용하기 위해서는 정보저장매체 원본에 저장된 내용과 출력 문건의 동일성이 인정되어야 하고, 이를 위해서는 정보저장매체 원본이 압수 시부터 문건 출력 시까지 변경되지 않았다는 사정, 즉 무결성이 담보되어야 함. 특히 정보저장매체 원본을 대신하여 저장매체에 저장된 자료를 하드카피 또는 이미징한 매체로부터 출력한 문건의 경우에는 정보저장매체 원본과 하드카피 또는 이미징한 매체 사이에 자료의 동일성도 인정되어야 할 뿐만 아니라, 이를 확인하는 과정에서 이용한 컴퓨터의 기계적 정확성, 프로그램의 신뢰성, 입력, 처리, 출력의 각 단계에서 조작자의 전문적인 기술능력과 정확성이 담보되어야 함. 이 경우 출력 문건과 정보저장매체에 저장된 자료가 동일하고 정보저장매체 원본이 문건 출력 시까지 변경되지 않았다는 점은, 피압수, 수색 당사자가 정보저장매체 원본과 하드카피 또는 이미징한 매체의 해시값이 동일하다는 취지로 서명한 확인서면을 교부받아 법원에 제출하는 방법에 의하여 증명하는 것이 원칙이나, 그와 같은 방법에 의한 증명이 불가능하거나 현저히 곤란한 경우에는, 정보저장매체 원본에 대한 압수, 봉인, 봉인해제, 하드카피 또는 이미징 등 일련의 절차에 참여한 수사관이나 전문가 등의 증언에 의해 정보저장매체 원본과 하드카피 또는 이미징한 매체 사이의 해시값이 동일하다거나 정보저장매체 원본이 최초 압수 시부터 밀봉되어 증거 제출 시까지 전혀 변경되지 않았다는 등의 사정을 증명하는 방법 또는 법원이 그 원본에 일 : 압수수색이 개시된 이후 시점에 MP3 파일이 저장된 하드디스크에 접속한 흔적이 있음","링판번호":106},{"카드ID":"C105-1","판례ID":"C105","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"3) 압수, 수색, 검증의 대상","쟁점":"영장에 의한 전자정보 압수의 적법절차 및 위법성 치유 여부","사건번호":"2022도2960","태그":["L"],"중요도":1,"단락순번":1,"총단락수":1,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"압수의 대상이 되는 전자정보와 그렇지 않은 전자정보가 혼재된 정보저장매체나 그 복제본을 압수수색한 수사기관이 정보저장매체 등을 수사기관 사무실 등으로 옮겨 이를 탐색, 복제, 출력하는 경우, 그와 같은 일련의 과정에서 형소법 제219조, 제121조에서 규정하는 피압수수색당사자(이하 피압수자라 함)나 변호인에게 참여의 기회를 보장하고 압수된 전자정보의 파일 명세가 특정된 압수목록을 작성, 교부하여야 하며 범죄혐의사실과 무관한 전자정보의 임의적인 복제 등을 막기 위한 적절한 조치를 취하는 등 영장주의 원칙과 적법절차를 준수하여야 함. 만약 그러한 조치가 취해지지 않았다면 피압수자 측이 참여하지 아니한다는 의사를 명시적으로 표시하였거나 절차 위반행위가 이루어진 과정의 성질과 내용 등에 비추어 피압수자 측에 절차 참여를 보장한 취지가 실질적으로 침해되었다고 볼 수 없을 정도에 해당한다는 등의 특별한 사정이 없는 이상 압수수색이 적법하다고 평가할 수 없고, 비록 수사기관이 정보저장매체 또는 복제본에서 범죄혐의사실과 관련된 전자정보만을 복제, 출력하였다 하더라도 달리 볼 것은 아님 따라서 수사기관이 피압수자 측에게 참여의 기회를 보장하거나 압수한 전자정보 목록을 교부하지 않는 등 영장주의 원칙과 적법절차를 준수하지 않은 위법한 압수수색과정을 통하여 취득한 증거는 위법수집증거에 해당하고, 사후에 법원으로부터 영장이 발부되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 위법성이 치유되는 것도 아님","힌트_첫어절":"압수의 대상이 되는 전자정보와","힌트_초성":"ㅇㅅㅇ ㄷㅅㅇ ㄷㄴ ㅈㅈㅈㅂㅇ ㄱㄹㅈ ㅇㅇ ㅈㅈㅈㅂㄱ ㅎㅈㄷ ㅈㅂㅈㅈㅁㅊㄴ ㄱ ㅂㅈㅂㅇ ㅇㅅㅅㅅㅎ ㅅㅅㄱㄱㅇ ㅈㅂㅈㅈㅁㅊ ㄷㅇ ㅅㅅㄱㄱ ㅅㅁㅅ ㄷㅇㄹ ㅇㄱ ㅇㄹ ㅌㅅ, ㅂㅈ, ㅊㄹㅎㄴ ㄱㅇ, ㄱㅇ ㄱㅇ ㅇㄹㅇ ㄱㅈㅇㅅ ㅎㅅㅂ ㅈ219ㅈ, ㅈ121ㅈㅇㅅ ㄱㅈㅎㄴ ㅍㅇㅅㅅㅅㄷㅅㅈ(ㅇㅎ ㅍㅇㅅㅈㄹ ㅎ)ㄴ ㅂㅎㅇㅇㄱ ㅊㅇㅇ ㄱㅎㄹ ㅂㅈㅎㄱ ㅇㅅㄷ ㅈㅈㅈㅂㅇ ㅍㅇ ㅁㅅㄱ ㅌㅈㄷ ㅇㅅㅁㄹㅇ ㅈㅅ, ㄱㅂㅎㅇㅇ ㅎㅁ ㅂㅈㅎㅇㅅㅅㄱ ㅁㄱㅎ ㅈㅈㅈㅂㅇ ㅇㅇㅈㅇ ㅂㅈ ㄷㅇ ㅁㄱ ㅇㅎ ㅈㅈㅎ ㅈㅊㄹ ㅊㅎㄴ ㄷ ㅇㅈㅈㅇ ㅇㅊㄱ ㅈㅂㅈㅊㄹ ㅈㅅㅎㅇㅇ ㅎ. ㅁㅇ ㄱㄹㅎ ㅈㅊㄱ ㅊㅎㅈㅈ ㅇㅇㄷㅁ ㅍㅇㅅㅈ ㅊㅇ ㅊㅇㅎㅈ ㅇㄴㅎㄷㄴ ㅇㅅㄹ ㅁㅅㅈㅇㄹ ㅍㅅㅎㅇㄱㄴ ㅈㅊ ㅇㅂㅎㅇㄱ ㅇㄹㅇㅈ ㄱㅈㅇ ㅅㅈㄱ ㄴㅇ ㄷㅇ ㅂㅊㅇ ㅍㅇㅅㅈ ㅊㅇ ㅈㅊ ㅊㅇㄹ ㅂㅈㅎ ㅊㅈㄱ ㅅㅈㅈㅇㄹ ㅊㅎㄷㅇㄷㄱ ㅂ ㅅ ㅇㅇ ㅈㄷㅇ ㅎㄷㅎㄷㄴ ㄷㅇ ㅌㅂㅎ ㅅㅈㅇ ㅇㄴ ㅇㅅ ㅇㅅㅅㅅㅇ ㅈㅂㅎㄷㄱ ㅍㄱㅎ ㅅ ㅇㄱ, ㅂㄹ ㅅㅅㄱㄱㅇ ㅈㅂㅈㅈㅁㅊ ㄸㄴ ㅂㅈㅂㅇㅅ ㅂㅈㅎㅇㅅㅅㄱ ㄱㄹㄷ ㅈㅈㅈㅂㅁㅇ ㅂㅈ, ㅊㄹㅎㅇㄷ ㅎㄷㄹㄷ ㄷㄹ ㅂ ㄱㅇ ㅇㄴ ㄸㄹㅅ ㅅㅅㄱㄱㅇ ㅍㅇㅅㅈ ㅊㅇㄱ ㅊㅇㅇ ㄱㅎㄹ ㅂㅈㅎㄱㄴ ㅇㅅㅎ ㅈㅈㅈㅂ ㅁㄹㅇ ㄱㅂㅎㅈ ㅇㄴ ㄷ ㅇㅈㅈㅇ ㅇㅊㄱ ㅈㅂㅈㅊㄹ ㅈㅅㅎㅈ ㅇㅇ ㅇㅂㅎ ㅇㅅㅅㅅㄱㅈㅇ ㅌㅎㅇ ㅊㄷㅎ ㅈㄱㄴ ㅇㅂㅅㅈㅈㄱㅇ ㅎㄷㅎㄱ, ㅅㅎㅇ ㅂㅇㅇㄹㅂㅌ ㅇㅈㅇ ㅂㅂㄷㅇㄷㄱㄴ ㅍㄱㅇㅇㄴ ㅂㅎㅇㅇ ㅇㄹ ㅈㄱㄹ ㅎㅇ ㄷㅇㅎㅇㄷㄱ ㅎㅇ ㅇㅂㅅㅇ ㅊㅇㄷㄴ ㄱㄷ ㅇㄴ","핵심키워드":["위법수집증거","영장주의","적법절차","압수수색과정","압수수색","정보저장매체","압수목록","복제본","피압수자","목록","영장","파일","절차","전자정보","압수","위반행위","복제","원칙","의사","위법성","증거","사후","범죄혐의사실", 당일 21:36경 입감됨\n경찰관은 2021. 4. 16. 09:00경 이 사건 휴대전화를 탐색하던 중 성매매영업 매출액 등이 기재된 액셀파일(이하 이 사건 액셀파일)을 발견하였고, 이를 별도의 저장매체에 복제하여 출력한 후 이 사건 수사기록에 편철함\n그러나 이 사건 휴대전화 탐색 당시까지도 피고인은 경찰서 유치장에 입감된 상태였던 것으로 보임(피고인에 대한 수사과정 확인서에 의하면 피고인은 당일 12:38경에야 수사장소에 도착하여 조사를 진행한 것으로 되어 있음)\n경찰관은 2021. 4. 17.경 이 사건 액셀파일 등에 대하여 사후 압수수색영장을 발부받았으나, 이 사건 휴대전화 내 전자정보 탐색, 복제, 출력과 관련하여 사전에 그 일시, 장소를 통지하거나 피고인에게 참여의 기회를 보장하거나, 압수한 전자정보 목록을 교부하거나 또는 피고인이 그 과정에 참여하지 아니할 의사를 가지고 있는지 여부를 확인할 수 있는 어떤 객관적인 자료도 존재하지 않음\n원심은 이 사건 액셀파일에 관한 압수절차가 적법하다고 보아 위 출력물 및 시디의 증거능력 인정함","링판번호":107},{"카드ID":"C106-1","판례ID":"C106","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"4) 압수수색 영장 집행","쟁점":"압수수색영장의 제시방법","사건번호":"2015도12400","태그":["L"],"중요도":1,"단락순번":1,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"압수, 수색영장을 집행하는 수사기관은 피압수자로 하여금 법관이 발부한 영장에 의한 압수, 수색이라는 사실을 확인함과 동시에 형소법이 압수, 수색영장에 필요적으로 기재하도록 정한 사항이나 그와 일체를 이루는 사항을 충분히 알 수 있도록 압수, 수색영장을 제시하여야 함. 나아가 압수, 수색영장은 현장에서 피압수자가 여러 명일 경우에는 그들 모두에게 개별적으로 영장을 제시해야 하는 것이 원칙임. 수사기관이 압수, 수색에 착수하면서 그 장소의 관리책임자에게 영장을 제시하였다고 하더라도, 물건을 소지하고 있는 다른 사람으로부터 이를 압수하고자 하는 때에는 그 사람에게 따로 영장을 제시하여야 함","힌트_첫어절":"압수, 수색영장을 집행하는 수사기관은","힌트_초성":"ㅇㅅ, ㅅㅅㅇㅈㅇ ㅈㅎㅎㄴ ㅅㅅㄱㄱㅇ ㅍㅇㅅㅈㄹ ㅎㅇㄱ ㅂㄱㅇ ㅂㅂㅎ ㅇㅈㅇ ㅇㅎ ㅇㅅ, ㅅㅅㅇㄹㄴ ㅅㅅㅇ ㅎㅇㅎㄱ ㄷㅅㅇ ㅎㅅㅂㅇ ㅇㅅ, ㅅㅅㅇㅈㅇ ㅍㅇㅈㅇㄹ ㄱㅈㅎㄷㄹ ㅈㅎ ㅅㅎㅇㄴ ㄱㅇ ㅇㅊㄹ ㅇㄹㄴ ㅅㅎㅇ ㅊㅂㅎ ㅇ ㅅ ㅇㄷㄹ ㅇㅅ, ㅅㅅㅇㅈㅇ ㅈㅅㅎㅇㅇ ㅎ. ㄴㅇㄱ ㅇㅅ, ㅅㅅㅇㅈㅇ ㅎㅈㅇㅅ ㅍㅇㅅㅈㄱ ㅇㄹ ㅁㅇ ㄱㅇㅇㄴ ㄱㄷ ㅁㄷㅇㄱ ㄱㅂㅈㅇㄹ ㅇㅈㅇ ㅈㅅㅎㅇ ㅎㄴ ㄱㅇ ㅇㅊㅇ. ㅅㅅㄱㄱㅇ ㅇㅅ, ㅅㅅㅇ ㅊㅅㅎㅁㅅ ㄱ ㅈㅅㅇ ㄱㄹㅊㅇㅈㅇㄱ ㅇㅈㅇ ㅈㅅㅎㅇㄷㄱ ㅎㄷㄹㄷ, ㅁㄱㅇ ㅅㅈㅎㄱ ㅇㄴ ㄷㄹ ㅅㄹㅇㄹㅂㅌ ㅇㄹ ㅇㅅㅎㄱㅈ ㅎㄴ ㄸㅇㄴ ㄱ ㅅㄹㅇㄱ ㄸㄹ ㅇㅈㅇ ㅈㅅㅎㅇㅇ ㅎ","핵심키워드":["수색영장","관리책임자","사항","피압수자","수색","영장","압수","집행","동시","소지","물건","발부","제시","착수"],"빈칸":{"1":[[0,2],[4,8],[10,12],[21,25],[35,37],[39,41],[46,48],[50,52],[65,67],[74,76],[78,82],[99,101],[115,117],[131,133],[135,139],[141,143],[154,156],[158,162],[169,173],[200,202],[204,206],[226,228],[230,232],[234,236],[246,251],[254,256],[271,273],[275,277],[296,298],[319,321],[323,325]],"2":[[0,2],[4,8],[10,12],[15,19],[21,25],[31,33],[35,37],[39,41],[46,48],[50,52],[65,67],[69,72],[74,76],[78,82],[99,101] 21조는 수사기관이 압수, 수색영장을 집행할 때에는 피압수자 또는 변호인은 그 집행에 참여할 수 있다는 취지로 규정하고 있음. 저장매체에 대한 압수, 수색 과정에서 범위를 정하여 출력 또는 복제하는 방법이 불가능하거나 압수의 목적을 달성하기에 현저히 곤란한 예외적인 사정이 인정되어 전자정보가 담긴 저장매체 또는 하드카피나 이미징 등 형태를 수사기관 사무실 등으로 옮겨 복제, 탐색, 출력하는 경우에도, 그와 같은 일련의 과정에서 피압수자나 변호인에게 참여의 기회를 보장하고 혐의사실과 무관한 전자정보의 임의적인 복제 등을 막기 위한 적절한 조치를 취하는 등 영장주의 원칙과 적법절차를 준수하여야 함. 만약 그러한 조치를 취하지 않았다면 특별한 사정이 없는 이상 압수, 수색이 적법하다고 평가할 수 없고, 비록 수사기관이 저장매체 또는 복제본에서 혐의사실과 관련된 전자정보만을 복제, 출력하였다고 하더라도 달리 볼 것은 아님","힌트_첫어절":"형소법 제219조, 제121조는 수사기관이","힌트_초성":"ㅎㅅㅂ ㅈ219ㅈ, ㅈ121ㅈㄴ ㅅㅅㄱㄱㅇ ㅇㅅ, ㅅㅅㅇㅈㅇ ㅈㅎㅎ ㄸㅇㄴ ㅍㅇㅅㅈ ㄸㄴ ㅂㅎㅇㅇ ㄱ ㅈㅎㅇ ㅊㅇㅎ ㅅ ㅇㄷㄴ ㅊㅈㄹ ㄱㅈㅎㄱ ㅇㅇ. ㅈㅈㅁㅊㅇ ㄷㅎ ㅇㅅ, ㅅㅅ ㄱㅈㅇㅅ ㅂㅇㄹ ㅈㅎㅇ ㅊㄹ ㄸㄴ ㅂㅈㅎㄴ ㅂㅂㅇ ㅂㄱㄴㅎㄱㄴ ㅇㅅㅇ ㅁㅈㅇ ㄷㅅㅎㄱㅇ ㅎㅈㅎ ㄱㄹㅎ ㅇㅇㅈㅇ ㅅㅈㅇ ㅇㅈㄷㅇ ㅈㅈㅈㅂㄱ ㄷㄱ ㅈㅈㅁㅊ ㄸㄴ ㅎㄷㅋㅍㄴ ㅇㅁㅈ ㄷ ㅎㅌㄹ ㅅㅅㄱㄱ ㅅㅁㅅ ㄷㅇㄹ ㅇㄱ ㅂㅈ, ㅌㅅ, ㅊㄹㅎㄴ ㄱㅇㅇㄷ, ㄱㅇ ㄱㅇ ㅇㄹㅇ ㄱㅈㅇㅅ ㅍㅇㅅㅈㄴ ㅂㅎㅇㅇㄱ ㅊㅇㅇ ㄱㅎㄹ ㅂㅈㅎㄱ ㅎㅇㅅㅅㄱ ㅁㄱㅎ ㅈㅈㅈㅂㅇ ㅇㅇㅈㅇ ㅂㅈ ㄷㅇ ㅁㄱ ㅇㅎ ㅈㅈㅎ ㅈㅊㄹ ㅊㅎㄴ ㄷ ㅇㅈㅈㅇ ㅇㅊㄱ ㅈㅂㅈㅊㄹ ㅈㅅㅎㅇㅇ ㅎ. ㅁㅇ ㄱㄹㅎ ㅈㅊㄹ ㅊㅎㅈ ㅇㅇㄷㅁ ㅌㅂㅎ ㅅㅈㅇ ㅇㄴ ㅇㅅ ㅇㅅ, ㅅㅅㅇ ㅈㅂㅎㄷㄱ ㅍㄱㅎ ㅅ ㅇㄱ, ㅂㄹ ㅅㅅㄱㄱㅇ ㅈㅈㅁㅊ ㄸㄴ ㅂㅈㅂㅇㅅ ㅎㅇㅅㅅㄱ ㄱㄹㄷ ㅈㅈㅈㅂㅁㅇ ㅂㅈ, ㅊㄹㅎㅇㄷㄱ ㅎㄷㄹㄷ ㄷㄹ ㅂ ㄱㅇ ㅇㄴ","핵심키워드":["영장주의","적법절차","수색영장","복제본","저장매체","혐의사실","피압수자","수색","전자정보","압수","원칙","하드카피","집행","조치","적법","복제","과정","사무실","참여","보장","관련","규정"],"빈칸":{"1":[[24,26],[28,32],[34,36],[42,46],[57,59],[61,63],[75,77],[84,88],[93,95],[97,99],[100,102],[119,121],[135,137],[171,175],[180,184],[188,192],[209,212],[220,222],[249,251],[254,258],[266,268],[274,276],[279,283],[289,293],[300,302],[316,318],[326,330],[331,333],[335,339],[357,359],[384,386],[388,390],[392,394],[417,421],[425,428],[431,435],[437,439],[441,445],[448,450]],"2":[[0,3],[4,9],[11,16],[18,22],[24,26],[28,32],[34,36],[42,46],[50,53],[57,59],[61,63],[75,77],[84,88],[93,95],[97,99],[100,102],[113,115],[119,121],[135,137],[143,145],[153,155],[171,175],[180,184],[188,192],[204,208],[209,212],[220,222],[224,226],[228,230],[245,247],[249,251],[254,258],[260,263],[266,268],[274,276],[279,283],[289,293],[300,302],[316,318],[326,330],[331,333],[335,339],[341,343],[357,359],[384,386],[388,390],[392,394],[411,415],[417,421],[425,428],[431,435],[437,439],[441,4 사","검증","수색","영장","정황","압수","의심","청구","발부","사건","신청"],"빈칸":{"1":[[7,11],[35,37],[42,44],[52,54],[86,88],[95,97],[99,105],[107,109],[111,113],[119,121],[123,125],[129,131]],"2":[[0,5],[7,11],[21,24],[35,37],[42,44],[52,54],[81,83],[86,88],[91,93],[95,97],[99,105],[107,109],[111,113],[119,121],[123,125],[129,131],[144,149],[150,153]],"3":[[0,11],[21,24],[35,54],[81,131],[144,153]]},"기재례":"[기재] - 20년 기말 / 1) 주장 및 쟁점 / O 변호인 체포와 범행현장에서의 압수수색 모두 부적법하여 도검, 마약의 압수절차 위법하므로 도검 등 증거능력 없다고 주장하나 검사는 사후영장에 기재된 제216조 제1항 제2호가 적용되지 않아도 동조 제3항, 동법 제217조 제1항에 의하여 적법한 압수수색이라고 주장함 / O 직권으로, 총포, 도검, 화약류등단속법위반의점, 보관에 관한 마약법위반(향정)의 점에 관하여 보강증거 유무 검토함 / 2) 검토 / 가) 매매에 관한 마약법위반(향정)의 점 / (1) 관련법리 / O 판례 두 번째 법리 / O 형소법 제200조의5 영장의 제시나 피의사실 등 고지는 체포전 원칙, 제압하는 경우 제압한 후 지체없이 / (2) 인정사실 / 피고인에 대하여 체포영장 발부, 피고인 발견, 피고인 도망침, 영장 제시 및 피의사실 고지, 영장없이 차량 수색하여 마약압수, 2km가량 떨어진 피고인 주거지 수색하여 도검압수, 사후영장 청구 / (3) 판단 / O 영장제시 후 고지하였으므로 적법한 체포임 / O 필로폰과 대마 압수는 체포현장에서의 압수수색으로서 영장없이 가능하고 사후영장도 발부받았으므로 적법 / O 변호인 이부분 주장 받아들이지 아니함 / (4) 증거의 요지 / (5) 소결론 / (6) 부수처분 / O 압수된 마약(증 제n호)을 피고인으로부터 몰수(마약법 제67조 본문) / 나) 총포.. 법위반의 점, 보관에 관한 마약법위반(향정)의 점에 관하여 / (1) 검제증 / (2) 증없증 / (가) 관련법리 / O 위수증(원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 형소법 제216조 제1항 제2호에 의하여 체포현장에서, 동법 제216조 제3항에 의하여 범죄장소에서, 동법 제217조 제1항에 의하여 긴급체포시 영장없이 압수할 수 있음 / O 범죄장소에서의 압수수색의 경우 압수수색 착수 당시 범행 중 또는 범행 직후라는 죄증이 명백하게 존재하여야 함. 긴급체포시의 압수수색의 경우 영장을 미리 발부 받을 시간적 여유가 없을 정도의 긴급히 압수할 필요가 있어야 하고, 체포시로부터 24시간 내에 이루어져야 함 / O 위와 같은 절차를 위반하여 수집한 증거는 위수증으로 유죄인정의 증거로 사용할 수 없고 피고인, 변호인 증거동의 하여도 마찬가지임 / (나) 인정사실 / 앞서 본 인정사실과 같이 체포한 후 차량에서 마약을 압수, 그 장소에서 2km정도 떨어진피고인의 주거지 수색하여 도검 압수 후 사후 영장 발부됨 / (다) 압수된 도검, 마약 / O 위 인정사실을 종합하여 알 수 있는 다음과 같은 사정들, 즉 체포현장에서 2km떨어진 피고인의 주거지를 체포장소로 보기는 어려운 점, 압수수색 착수당시 피고인이 주거지에 마약류, 도검류를 소지하고 있음이 명백하다고 보기는 어려운 점, 이미 사전에 체포영장이 발부되는 등 주거지에 대한 압수수색영장을 발부받을 시간적 여유가 없었다고 단정하기 어려운 점 등 고려하면 위 증거들은 위수증으로 증거능력 없고 증거동의 하고 사후영장 발부되었다 하더라도 마찬가지임 / O 검사의 이 부분 주장 받아들이지 아니함 / (라) 피고인에 대한 검, 경 각 피신조서, 현장 사진, 압수조서 / O 위 증거들은 위법하게 수집된 도검을 기초로 수집되었거나 제시되면서 작성된 2차증거로 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하므로 그 수집절차와 도검의 수집절차 사이에 인과관계가 희석 내지 단절되었다고 할 수 없으므로 위 각 증거는 증거능력이 없고 증거동의 하였다 하여 달리 볼 것 아님 / (3) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / (4) 보강증거 / (5) 소결론 - 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 피고인에 대해 필로폰 매도 등 혐의로 체포영장 발부됨\n2) 검찰청 소속 마약수사관들이 피고인의 거주지 부근에서 잠복하는 등 체포를 위한 절차에 착수하였고 당시 한 여성 등이 함께 거주 중인 사실을 확인함\n3) 피고인은 위 수사관들의 체포를 벗어나기 위해 차량을 몰고 가는 등 도주과정에서 결국 체포되어 그 직후 체포영장 제시와 함께 형소법 제200조의5의 내용 고지받음\n4) 수사관들은 위 피고인 체포 직후 별도 압수수색영장 없이 위 차량을 수색하여 필로폰과 대마 등 압수하는 한편 계속해서 2km 정도 떨어져 있는 피고인의 주거지를 수색하여 피고인이 보관 중이던 도검 압수하였고, 그 후 위 압수물들에 대한 압수수색영장 발부됨\n5) 피고인과 변호인은 위 압수물들에 대한 압수조서 및 압수물 사진을 증거로 함에 동의함","링판번호":111},{"카드ID":"C109-2","판례ID":"C109","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"영장에 의하지 아니한 강제처분 해당 여부","사건번호":"2015도364","태그":["L"],"중요도":1,"단락순번":2,"총단락수":2,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"사전영장주의에 대한 예외로서, 사법경찰관은 피의자를 체포 또는 구속하는 경우에 필요한 때에는 영장 없이 체포현장에서의 압수, 수색, 검증을 할 수 있으나(제216조 제1항 제2호), 그에 따라 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수수색영장을 청구하여야 함(제217조 제2항). 또한 범행 중 또는 범행 직후의 범죄 장소에서 긴급을 요하여 법원판사의 영장을 받을 수 없는 때에는 영장 없이 압수, 수색 또는 검증을 할 수 있고, 이 경우에는 사후에 지체 없이 영장을 받아야 함(같은 법 제216조 제3항). 그리고 사법경찰관 등이 체포영장을 소지하고 피의자를 체포하기 위해서는 체포 당시에 피의자에게 체포영장을 제시하고 피의자에 대한 범죄사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 함(제200조의5)","힌트_첫어절":"사전영장주의에 대한 예외로서, 사법경찰관은","힌트_초성":"ㅅㅈㅇㅈㅈㅇㅇ ㄷㅎ ㅇㅇㄹㅅ, ㅅㅂㄱㅊㄱㅇ ㅍㅇㅈㄹ ㅊㅍ ㄸㄴ ㄱㅅㅎㄴ ㄱㅇㅇ ㅍㅇㅎ ㄸㅇㄴ ㅇㅈ ㅇㅇ ㅊㅍㅎㅈㅇㅅㅇ ㅇㅅ, ㅅㅅ, ㄱㅈㅇ ㅎ ㅅ ㅇㅇㄴ(ㅈ216ㅈ ㅈ1ㅎ ㅈ2ㅎ), ㄱㅇ ㄸㄹ ㅇㅅㅎ ㅁㄱㅇ ㄱㅅ ㅇㅅㅎ ㅍㅇㄱ ㅇㄴ ㄱㅇㅇㄴ ㅈㅊ ㅇㅇ ㅇㅅㅅㅅㅇㅈㅇ ㅊㄱㅎㅇㅇ ㅎ(ㅈ217ㅈ ㅈ2ㅎ). ㄸㅎ ㅂㅎ ㅈ ㄸㄴ ㅂㅎ ㅈㅎㅇ ㅂㅈ ㅈㅅㅇㅅ ㄱㄱㅇ ㅇㅎㅇ ㅂㅇㅍㅅㅇ ㅇㅈㅇ ㅂㅇ ㅅ ㅇㄴ ㄸㅇㄴ ㅇㅈ ㅇㅇ ㅇㅅ, ㅅㅅ ㄸㄴ ㄱㅈㅇ ㅎ ㅅ ㅇㄱ, ㅇ ㄱㅇㅇㄴ ㅅㅎㅇ ㅈㅊ ㅇㅇ ㅇㅈㅇ ㅂㅇㅇ ㅎ(ㄱㅇ ㅂ ㅈ216ㅈ ㅈ3ㅎ). ㄱㄹㄱ ㅅㅂㄱㅊㄱ ㄷㅇ ㅊㅍㅇㅈㅇ ㅅㅈㅎㄱ ㅍㅇㅈㄹ ㅊㅍㅎㄱ ㅇㅎㅅㄴ ㅊㅍ ㄷㅅㅇ ㅍㅇㅈㅇㄱ ㅊㅍㅇㅈㅇ ㅈㅅㅎㄱ ㅍㅇㅈㅇ ㄷㅎ ㅂㅈㅅㅅㅇ ㅇㅈ, ㅊㅍㅇ ㅇㅇㅇ ㅂㅎㅇㅇ ㅅㅇㅎ ㅅ ㅇㅇㅇ ㅁㅎㄱ ㅂㅁㅎ ㄱㅎㄹ ㅈㅇㅇ ㅎ(ㅈ200ㅈㅇ5)","핵심키워드":["압수수색영장","사전영장주의","체포영장","체포현장","검증","법원판사","수색","영장","요지","체포","직후","압수","예외","범죄","구속","범죄사실","사후","선임 간적 여유가 없을 정도의 긴급히 압수할 필요가 있어야 하고, 체포시로부터 24시간 내에 이루어져야 함 / O 위와 같은 절차를 위반하여 수집한 증거는 위수증으로 유죄인정의 증거로 사용할 수 없고 피고인, 변호인 증거동의 하여도 마찬가지임 / (나) 인정사실 / 앞서 본 인정사실과 같이 체포한 후 차량에서 마약을 압수, 그 장소에서 2km정도 떨어진피고인의 주거지 수색하여 도검 압수 후 사후 영장 발부됨 / (다) 압수된 도검, 마약 / O 위 인정사실을 종합하여 알 수 있는 다음과 같은 사정들, 즉 체포현장에서 2km떨어진 피고인의 주거지를 체포장소로 보기는 어려운 점, 압수수색 착수당시 피고인이 주거지에 마약류, 도검류를 소지하고 있음이 명백하다고 보기는 어려운 점, 이미 사전에 체포영장이 발부되는 등 주거지에 대한 압수수색영장을 발부받을 시간적 여유가 없었다고 단정하기 어려운 점 등 고려하면 위 증거들은 위수증으로 증거능력 없고 증거동의 하고 사후영장 발부되었다 하더라도 마찬가지임 / O 검사의 이 부분 주장 받아들이지 아니함 / (라) 피고인에 대한 검, 경 각 피신조서, 현장 사진, 압수조서 / O 위 증거들은 위법하게 수집된 도검을 기초로 수집되었거나 제시되면서 작성된 2차증거로 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하므로 그 수집절차와 도검의 수집절차 사이에 인과관계가 희석 내지 단절되었다고 할 수 없으므로 위 각 증거는 증거능력이 없고 증거동의 하였다 하여 달리 볼 것 아님 / (3) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / (4) 보강증거 / (5) 소결론 - 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 피고인에 대해 필로폰 매도 등 혐의로 체포영장 발부됨\n2) 검찰청 소속 마약수사관들이 피고인의 거주지 부근에서 잠복하는 등 체포를 위한 절차에 착수하였고 당시 한 여성 등이 함께 거주 중인 사실을 확인함\n3) 피고인은 위 수사관들의 체포를 벗어나기 위해 차량을 몰고 가는 등 도주과정에서 결국 체포되어 그 직후 체포영장 제시와 함께 형소법 제200조의5의 내용 고지받음\n4) 수사관들은 위 피고인 체포 직후 별도 압수수색영장 없이 위 차량을 수색하여 필로폰과 대마 등 압수하는 한편 계속해서 2km 정도 떨어져 있는 피고인의 주거지를 수색하여 피고인이 보관 중이던 도검 압수하였고, 그 후 위 압수물들에 대한 압수수색영장 발부됨\n5) 피고인과 변호인은 위 압수물들에 대한 압수조서 및 압수물 사진을 증거로 함에 동의함","링판번호":111},{"카드ID":"C110-1","판례ID":"C110","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"제216조 제3항 요건 일부 충족시 위법 여부 및 치유 여부","사건번호":"2014도16080","태그":["L"],"중요도":1,"단락순번":1,"총단락수":1,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"범행 중 또는 범행 직후의 범죄 장소에서 긴급을 요하여 법원 판사의 영장을 받을 수 없는 때에는 영장 없이 압수, 수색 또는 검증을 할 수 있으나, 사후에 지체없이 영장을 받아야 함(형소법 제216조 제3항). 제216조 제3항의 요건 중 어느 하나라도 갖추지 못한 경우에 그러한 압수, 수색 또는 검증은 위법하며, 이에 대하여 사후에 법원으로부터 영장을 발부받았다고 하여 그 위법성이 치유되지 않음","힌트_첫어절":"범행 중 또는 범행","힌트_초성":"ㅂㅎ ㅈ ㄸㄴ ㅂㅎ ㅈㅎㅇ ㅂㅈ ㅈㅅㅇㅅ ㄱㄱㅇ ㅇㅎㅇ ㅂㅇ ㅍㅅㅇ ㅇㅈㅇ ㅂㅇ ㅅ ㅇㄴ ㄸㅇㄴ ㅇㅈ ㅇㅇ ㅇㅅ, ㅅㅅ ㄸㄴ ㄱㅈㅇ ㅎ ㅅ ㅇㅇㄴ, ㅅㅎㅇ ㅈㅊㅇㅇ ㅇㅈㅇ ㅂㅇㅇ ㅎ(ㅎㅅㅂ ㅈ216ㅈ ㅈ3ㅎ). ㅈ216ㅈ ㅈ3 ],[61,63],[71,73],[77,83],[85,87],[89,93],[95,98],[102,106],[110,112],[126,128],[135,139],[141,144],[146,148],[150,153],[169,171],[175,177],[191,193],[199,201],[209,211],[233,239],[244,247],[249,253],[257,259]],"3":[[0,42],[51,112],[126,153],[169,177],[191,211],[233,259]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 피고인의 2013년 범행 부분에 대한 동영상, 사진 등을 복제한 CD는 위수증으로 증거능력 없다고 주장 / O 직권으로, 자백에 대한 보강증거 유무 검토 / 2) 검토 / 가) 검제증 / 나) 증없증 / (1) 관련 법리 / O 위수증 (원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우, 압수의 대상은 임의제출의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 정보로 한정됨. 그 관련성에는 범행 동기와 경위, 수단과 방법, 시간과 장소 등에 관한 간접증거나 정황증거로 사용될 수 있는 정보도 포함됨. 다만 단순히 동종, 유사 범행임을 넘어서 구체적, 개별적 연관관계가 있어야 함. 제3자가 제출할 경우에는 더욱 제한적으로 해석하여야 함 / O 수사기관이 저장매체 자체 또는 복제본을 사무실에서 탐색, 복제, 출력하는 경우에도, 피압수자측 참여권 보장, 압수 목록 교부 하여야 하며, 피의자의 소유 관리에 속하는 정보저장매체를 제3자가 임의제출하는 경우에는 그 피의자에 대하여도 위 절차가 준수되어야 함. 압수된 전자정보가 피의자의 소유, 관리에 속하는지는 피의자가 실질적인 압수수색 당사자라는 점이 압수수색 당시 외형적, 객관적으로 인식 가능하였는지를 기준으로 판단함 / O 전자정보에 대한 압수, 수색 중 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관은 더 이상의 추가 탐색을 중단하고 법원으로부터 별도의 범죄혐의에 대한 압수, 수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수, 수색을 할 수 있음. 따라서 영장 없이 무관증거를 압수한 경우 위수증에 해당하여 증거능력 없음 / O 피고인, 변호인이 증거로 함에 동의하고 사후영장이 발부되어도 달리 볼 것 아님 / (2) 인정사실 / - 피고인은 2014. 12. 11. 자기 집에서 피해자 갑의 의사에 반해 성기를 촬영, 피해자 갑은 즉시 경찰에 신고하면서, 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 삼성휴대폰) 임의제출, 경찰관들 위 휴대전화 2대를 영장 없이 압수 피해자 갑에게 제출 범위 확인하지 않았음 / - 피고인 휴대전화 1개(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여, 다른 휴대전화 1개(삼성휴대폰)에 대해서는 비밀번호 제공을 거부, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음 / - 경찰은 휴대전화(아이폰)에 저장된 동영상 파일을 통해 피해자 공소외 1에 대한 2014년 범행을 확인한 다음, 후자의 휴대전화(삼성휴대폰)에서 2014년 범행의 증거 영상을 추가로 찾던 중, 피해자 갑이 아닌 다른 남성 2인이 침대 위에서 잠든 모습, 누군가가 손으로 그들의 성기를 잡고있는 모습 등이 촬영된 동영상 30개와 사진 등을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함 / - 경찰은 위 동영상에 등장하는 남성 2인의 인적 사항 등에 대해 조사하여 추가 수사를 통해 피고인이 2013. 12.경 피해자 을, 병에 대한 범행 인지함 / - 그 후 경찰 영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디를 증거물로 압수 / (3) 압수된 CD / O 위 인정사실에 의하면, 사안은 휴대전화에 담긴 전자정보의 제출 범위에 관한 제출자의 의사가 명확하지 않거나 이를 알 수 없는 경우에 해당하므로 압수의 범위는 2014년 범행 자체와 구체적, 개별적 연관관계가 있는 전자정보로 제한됨. 각 범죄발생 시점 사이에 상당한 간격이 있는 점, 피해자 및 범행에 이용한 휴대전화도 전혀 다른 점에 비추어 보면, 피고인의 2013년 범행에 관한 사진은 임의제출에 따른 압수의 동기가 된 2014년 범행의 범죄혐의사실과 구체적, 개별적 연관관계 있는 전자정보로 보기 어려움 / O 따라서 위 증거는 수사기관이 사전영장 없이 이를 취득한 이상 영장주의에 반하여 수집된 증거로 증거능력이 없고, 사후에 압수, 수색영장을 받아 압수절차가 진행되었고 피고인 및 그 변호인의 증거동의가 있다 하여도 달리 볼 수 없음 / (4) 피고인에 대한 제2회 경찰 피신조서, 수사보고(디지털증거분석 등), - 가 작성한 진술서, 0000. 0. 0. 자 압수조서 / O 위 각 증거들은 위법하게 수집된 나체사진을 기초로 수집되거나 이를 제시하며 작성된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 그 수집 절차와의 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 피고인에 대하여 증거능력이 없고, 피고인, 변호인이 위 각 증거에 증거동의를 하였다고 하더라도 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / 마) 소결론 - 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 피고인이 2014. 12. 11. 피해자 A를 상대로 저지른 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영) 범행(이하 2014년 범행이라 함)에 대하여 피해자 A가 즉시 피해사실을 경찰에 신고하면서 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 갤럭시 휴대폰)를 범행의 증거물로 임의제출함\n2) 경찰관들은 위 휴대전화 2대를 영장 없이 압수하면서, 피해자 A에게 위 휴대전화에 저장된 동영상과 사진 등 전자정보 전부를 제출하는 취지인지 등 제출 범위에 관한 의사를 따로 확인하지는 않음\n3) 피고인은 경찰관에게 휴대전화 1대(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여한 반면, 다른 휴대전화 1대(갤럭시 휴대폰)에 대해서는 사실상 비밀번호 제공을 거부하고, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음\n4) 경찰관은 아이폰에 저장된 동영상 파일을 통해 피해자 A에 대한 2014년 범행을 확인한 다음, A를 촬영한 휴대전화(아이폰)가 아닌 갤럭시 휴대폰에서 피고인이 2013. 12.경 피해자 B, C를 상대로 저지른 같은 법 위반 범행(이하 2013년 범행이라 함)을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함\n5) 그 후 (추가적인 조사를 거쳐) 압수, 수색영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디(CD)를 증거물로 압수함","링판번호":114},{"카드ID":"C112-2","판례ID":"C112","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"임의제출된 정보저장매체로부터 압수할 정보의 범위, 정보탐색시 필요한 조치","사건번호":"2016도348","태그":["L"],"중요도":1,"단락순번":2,"총단락수":5,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"수사기관이 정보저장매체와 거기에 저장된 전자정보를 임의제출의 방식으로 압수할 때, 제출자의 구체적인 제출 범위에 관한 의사를 제대로 확인하지 않는 등의 사유로 인해 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우에는 임의제출에 따른 압수의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 전자정보에 한하여 압수대상이 됨","힌트_ 않았음 / - 피고인 휴대전화 1개(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여, 다른 휴대전화 1개(삼성휴대폰)에 대해서는 비밀번호 제공을 거부, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음 / - 경찰은 휴대전화(아이폰)에 저장된 동영상 파일을 통해 피해자 공소외 1에 대한 2014년 범행을 확인한 다음, 후자의 휴대전화(삼성휴대폰)에서 2014년 범행의 증거 영상을 추가로 찾던 중, 피해자 갑이 아닌 다른 남성 2인이 침대 위에서 잠든 모습, 누군가가 손으로 그들의 성기를 잡고있는 모습 등이 촬영된 동영상 30개와 사진 등을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함 / - 경찰은 위 동영상에 등장하는 남성 2인의 인적 사항 등에 대해 조사하여 추가 수사를 통해 피고인이 2013. 12.경 피해자 을, 병에 대한 범행 인지함 / - 그 후 경찰 영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디를 증거물로 압수 / (3) 압수된 CD / O 위 인정사실에 의하면, 사안은 휴대전화에 담긴 전자정보의 제출 범위에 관한 제출자의 의사가 명확하지 않거나 이를 알 수 없는 경우에 해당하므로 압수의 범위는 2014년 범행 자체와 구체적, 개별적 연관관계가 있는 전자정보로 제한됨. 각 범죄발생 시점 사이에 상당한 간격이 있는 점, 피해자 및 범행에 이용한 휴대전화도 전혀 다른 점에 비추어 보면, 피고인의 2013년 범행에 관한 사진은 임의제출에 따른 압수의 동기가 된 2014년 범행의 범죄혐의사실과 구체적, 개별적 연관관계 있는 전자정보로 보기 어려움 / O 따라서 위 증거는 수사기관이 사전영장 없이 이를 취득한 이상 영장주의에 반하여 수집된 증거로 증거능력이 없고, 사후에 압수, 수색영장을 받아 압수절차가 진행되었고 피고인 및 그 변호인의 증거동의가 있다 하여도 달리 볼 수 없음 / (4) 피고인에 대한 제2회 경찰 피신조서, 수사보고(디지털증거분석 등), - 가 작성한 진술서, 0000. 0. 0. 자 압수조서 / O 위 각 증거들은 위법하게 수집된 나체사진을 기초로 수집되거나 이를 제시하며 작성된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 그 수집 절차와의 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 피고인에 대하여 증거능력이 없고, 피고인, 변호인이 위 각 증거에 증거동의를 하였다고 하더라도 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / 마) 소결론 - 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 피고인이 2014. 12. 11. 피해자 A를 상대로 저지른 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영) 범행(이하 2014년 범행이라 함)에 대하여 피해자 A가 즉시 피해사실을 경찰에 신고하면서 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 갤럭시 휴대폰)를 범행의 증거물로 임의제출함\n2) 경찰관들은 위 휴대전화 2대를 영장 없이 압수하면서, 피해자 A에게 위 휴대전화에 저장된 동영상과 사진 등 전자정보 전부를 제출하는 취지인지 등 제출 범위에 관한 의사를 따로 확인하지는 않음\n3) 피고인은 경찰관에게 휴대전화 1대(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여한 반면, 다른 휴대전화 1대(갤럭시 휴대폰)에 대해서는 사실상 비밀번호 제공을 거부하고, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음\n4) 경찰관은 아이폰에 저장된 동영상 파일을 통해 피해자 A에 대한 2014년 범행을 확인한 다음, A를 촬영한 휴대전화(아이폰)가 아닌 갤럭시 휴대폰에서 피고인이 2013. 12.경 피해자 B, C를 상대로 저지른 같은 법 위반 범행(이하 2013년 범행이라 함)을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함\n5) 그 후 (추가적인 조사를 거쳐) 압수, 수색영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디(CD)를 증거물로 압수함","링판번호":114},{"카드ID":"C112-3","판례ID":"C112","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"임의제출된 정보저장매체로부터 압수할 정보의 범위, 정보탐색시 필요한 조치","사건번호":"2016도348","태그":["L"],"중요도":1,"단락순번":3,"총단락수":5,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"범죄혐의사실과 관련된 전자정보에는 범죄혐의사실 그 자체 또는 그와 기본적 사실관계가 동일한 범행과 직접 관련되어 있는 것은 물론 범행 동기와 경위, 범행 수단과 방법, 범행 시간과 장소 등을 증명하기 위한 간접증거나 정황증거 등으로 사용될 수 있는 것도 포함될 수 있음. 다만 그 관련성은 임의제출에 따른 압수의 동기가 된 범죄혐의사실의 내용과 수사의 대상, 수사의 경위, 임의제출의 과정 등을 종합하여 구체적, 개별적 연관관계가 있는 경우에만 인정되고, 범죄혐의사실과 단순히 동종 또는 유사 범행이라는 사유만으로 관련성이 있다고 할 것은 아님","힌트_첫어절":"범죄혐의사실과 관련된 전자정보에는 범죄혐의사실","힌트_초성":"ㅂㅈㅎㅇㅅㅅㄱ ㄱㄹㄷ ㅈㅈㅈㅂㅇㄴ ㅂㅈㅎㅇㅅㅅ ㄱ ㅈㅊ ㄸㄴ ㄱㅇ ㄱㅂㅈ ㅅㅅㄱㄱㄱ ㄷㅇㅎ ㅂㅎㄱ ㅈㅈ ㄱㄹㄷㅇ ㅇㄴ ㄱㅇ ㅁㄹ ㅂㅎ ㄷㄱㅇ ㄱㅇ, ㅂㅎ ㅅㄷㄱ ㅂㅂ, ㅂㅎ ㅅㄱㄱ ㅈㅅ ㄷㅇ ㅈㅁㅎㄱ ㅇㅎ ㄱㅈㅈㄱㄴ ㅈㅎㅈㄱ ㄷㅇㄹ ㅅㅇㄷ ㅅ ㅇㄴ ㄱㄷ ㅍㅎㄷ ㅅ ㅇㅇ. ㄷㅁ ㄱ ㄱㄹㅅㅇ ㅇㅇㅈㅊㅇ ㄸㄹ ㅇㅅㅇ ㄷㄱㄱ ㄷ ㅂㅈㅎㅇㅅㅅㅇ ㄴㅇㄱ ㅅㅅㅇ ㄷㅅ, ㅅㅅㅇ ㄱㅇ, ㅇㅇㅈㅊㅇ ㄱㅈ ㄷㅇ ㅈㅎㅎㅇ ㄱㅊㅈ, ㄱㅂㅈ ㅇㄱㄱㄱㄱ ㅇㄴ ㄱㅇㅇㅁ ㅇㅈㄷㄱ, ㅂㅈㅎㅇㅅㅅㄱ ㄷㅅㅎ ㄷㅈ ㄸㄴ ㅇㅅ ㅂㅎㅇㄹㄴ ㅅㅇㅁㅇㄹ ㄱㄹㅅㅇ ㅇㄷㄱ ㅎ ㄱㅇ ㅇㄴ","핵심키워드":["정황증거","사실관계","수사","임의제출","동종","사유","관련성","전자정보","압수","범죄혐의사실","연관관계","직접","수단","과정","범행","증명","관련","사용"],"유사법리":"C092-3(2017도13458,0.78) ; C094-3(2019도14341,0.78)","빈칸":{"1":[[0,6],[8,10],[12,16],[19,25],[41,45],[51,53],[55,57],[58,60],[72,74],[83,85],[86,88],[94,96],[107,109],[121,125],[130,132],[157,160],[162,166],[171,173],[181,187],[193,195],[201,203],[209,213],[215,217],[235,239],[255,261],[267,269],[276,278],[282,284],[288,291]],"2":[[0,6],[8,10],[12,16],[19,25],[41,45],[51,53],[55,57],[58,60],[72,74],[75,77],[83,85],[86,88],[94,96],[97,99],[107,109],[121,125],[130,132],[157,160],[162,166],[171,173],[175,177],[181,187],[193,195],[201,203],[209,213],[215,217],[235,239],[255,261],[267,269],[276,278],[282,284],[288,291],[302,304]],"3":[[0,25],[41,60],[72,109],[121,132],[157,217],[235,239],[255,291],[302,304]]},"기재례":"[기재] / 1) 주장 및 쟁점 / O 변호인 피고인의 2013년 범행 부분에 대한 동영상, 사진 등을 복제한 CD는 위수증으로 증거능력 없다고 주장 / O 직권으로, 자백에 대한 보강증거 유무 검토 / 2) 검토 / 가) 검제증 / 나) 증없증 / (1) 관련 법리 / O 위수증 (원칙,예외/적법절차/사법정의/인과희석/검사입증) / O 임의제출자의 의사에 따른 전자정보 압수의 대상과 범위가 명확하지 않거나 이를 알 수 없는 경우, 압수의 대상은 임의제출의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 정보로 한정됨. 그 관련성에는 범행 동기와 경위, 수단과 방법, 시간과 장소 등에 관한 간접증거나 정황증거로 사용될 수 있는 정보도 포함됨. 다만 단순히 동종, 유사 범행임을 넘어서 구체적, 개별적 연관관계가 있어야 함. 제3자가 제출할 경우에는 더욱 제한적으로 해석하여야 함 / O 수사기관이 저장매체 자체 또는 복제본을 사무실에서 탐색, 복제, 출력하는 경우에도, 피압수자측 참여권 보장, 압수 목록 교부 하여야 하며, 피의자의 소유 관리에 속하는 정보저장매체를 제3자가 임의제출하는 경우에는 그 피의자에 대하여도 위 절차가 준수되어야 함. 압수된 전자정보가 피의자의 소유, 관리에 속하는지는 피의자가 실질적인 압수수색 당사자라는 점이 압수수색 당시 외형적, 객관적으로 인식 가능하였는지를 기준으로 판단함 / O 전자정보에 대한 압수, 수색 중 별도의 범죄혐의와 관련된 전자정보를 우연히 발견한 경우라면, 수사기관은 더 이상의 추가 탐색을 중단하고 법원으로부터 별도의 범죄혐의에 대한 압수, 수색영장을 발부받은 경우에 한하여 그러한 정보에 대하여도 적법하게 압수, 수색을 할 수 있음. 따라서 영장 없이 무관증거를 압수한 경우 위수증에 해당하여 증거능력 없음 / O 피고인, 변호인이 증거로 함에 동의하고 사후영장이 발부되어도 달리 볼 것 아님 / (2) 인정사실 / - 피고인은 2014. 12. 11. 자기 집에서 피해자 갑의 의사에 반해 성기를 촬영, 피해자 갑은 즉시 경찰에 신고하면서, 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 삼성휴대폰) 임의제출, 경찰관들 위 휴대전화 2대를 영장 없이 압수 피해자 갑에게 제출 범위 확인하지 않았음 / - 피고인 휴대전화 1개(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여, 다른 휴대전화 1개(삼성휴대폰)에 대해서는 비밀번호 제공을 거부, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음 / - 경찰은 휴대전화(아이폰)에 저장된 동영상 파일을 통해 피해자 공소외 1에 대한 2014년 범행을 확인한 다음, 후자의 휴대전화(삼성휴대폰)에서 2014년 범행의 증거 영상을 추가로 찾던 중, 피해자 갑이 아닌 다른 남성 2인이 침대 위에서 잠든 모습, 누군가가 손으로 그들의 성기를 잡고있는 모습 등이 촬영된 동영상 30개와 사진 등을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함 / - 경찰은 위 동영상에 등장하는 남성 2인의 인적 사항 등에 대해 조사하여 추가 수사를 통해 피고인이 2013. 12.경 피해자 을, 병에 대한 범행 인지함 / - 그 후 경찰 영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디를 증거물로 압수 / (3) 압수된 CD / O 위 인정사실에 의하면, 사안은 휴대전화에 담긴 전자정보의 제출 범위에 관한 제출자의 의사가 명확하지 않거나 이를 알 수 없는 경우에 해당하므로 압수의 범위는 2014년 범행 자체와 구체적, 개별적 연관관계가 있는 전자정보로 제한됨. 각 범죄발생 시점 사이에 상당한 간격이 있는 점, 피해자 및 범행에 이용한 휴대전화도 전혀 다른 점에 비추어 보면, 피고인의 2013년 범행에 관한 사진은 임의제출에 따른 압수의 동기가 된 2014년 범행의 범죄혐의사실과 구체적, 개별적 연관관계 있는 전자정보로 보기 어려움 / O 따라서 위 증거는 수사기관이 사전영장 없이 이를 취득한 이상 영장주의에 반하여 수집된 증거로 증거능력이 없고, 사후에 압수, 수색영장을 받아 압수절차가 진행되었고 피고인 및 그 변호인의 증거동의가 있다 하여도 달리 볼 수 없음 / (4) 피고인에 대한 제2회 경찰 피신조서, 수사보고(디지털증거분석 등), - 가 작성한 진술서, 0000. 0. 0. 자 압수조서 / O 위 각 증거들은 위법하게 수집된 나체사진을 기초로 수집되거나 이를 제시하며 작성된 2차적 증거로서 그 절차위반행위가 적법절차의 실질적 내용을 침해할 정도로 중대한 경우에 해당하는 점을 고려하면 그 수집 절차와의 사이에 인과관계가 단절 내지 희석되었다고 할 수 없으므로 피고인에 대하여 증거능력이 없고, 피고인, 변호인이 위 각 증거에 증거동의를 하였다고 하더라도 달리 볼 것 아님 / 다) 피고인의 법정진술 / 상당한 시간 경과, 공개 법정, 변호인 조력, 진술거부권 고지 증거수집 위법성 이해하면서 인정 / 인과관계 단절, 희석되어 증거능력 있음 / 라) 보강증거 / 마) 소결론 - 후단무죄","발문":"6. 영장실무 > 나. 압수, 수색, 검증 > 5) 영장주의에 대한 예외","사실관계":"1) 피고인이 2014. 12. 11. 피해자 A를 상대로 저지른 성폭력범죄의처벌등에관한특례법위반(카메라등이용촬영) 범행(이하 2014년 범행이라 함)에 대하여 피해자 A가 즉시 피해사실을 경찰에 신고하면서 피고인의 집에서 가지고 나온 피고인 소유의 휴대전화 2대(아이폰 및 갤럭시 휴대폰)를 범행의 증거물로 임의제출함\n2) 경찰관들은 위 휴대전화 2대를 영장 없이 압수하면서, 피해자 A에게 위 휴대전화에 저장된 동영상과 사진 등 전자정보 전부를 제출하는 취지인지 등 제출 범위에 관한 의사를 따로 확인하지는 않음\n3) 피고인은 경찰관에게 휴대전화 1대(아이폰)에 대한 비밀번호를 제공하고 그 파일 이미징 과정에 참여한 반면, 다른 휴대전화 1대(갤럭시 휴대폰)에 대해서는 사실상 비밀번호 제공을 거부하고, 저장된 동영상 파일의 복원, 추출 과정에 참여하지 않음\n4) 경찰관은 아이폰에 저장된 동영상 파일을 통해 피해자 A에 대한 2014년 범행을 확인한 다음, A를 촬영한 휴대전화(아이폰)가 아닌 갤럭시 휴대폰에서 피고인이 2013. 12.경 피해자 B, C를 상대로 저지른 같은 법 위반 범행(이하 2013년 범행이라 함)을 발견하고, 그 내용을 확인한 후 이를 시디(CD)에 복제함\n5) 그 후 (추가적인 조사를 거쳐) 압수, 수색영장을 발부받아 2013년 범행 영상의 전자정보를 복제한 시디(CD)를 증거물로 압수함","링판번호":114},{"카드ID":"C112-4","판례ID":"C112","대분류":"6. 영장실무","중분류":"나. 압수, 수색, 검증","소분류":"5) 영장주의에 대한 예외","쟁점":"임의제출된 정보저장매체로부터 압수할 정보의 범위, 정보탐색시 필요한 조치","사건번호":"2016도348","태그":["L"],"중요도":1,"단락순번":4,"총단락수":5,"소제목":"2020. 12. 8. 개정 전 : \"범죄의 실행 중이거나 실행의 즉후인 자를 현행범인이라 한다.\"","법리원문":"압수대상이 되는 전자정보와 그렇지 않은 전자정보가 혼재된 정보저장매체나 그 복제본을 임의제출 받은 수사기관이 그 정보저장매체 등을 수사기관 사무실 등으로 옮겨 이를 탐색, 복제, 출력하는 경우, 그와 같은 일련의 과정에서 형소법 제219조, 제121조에서 규정하는 피압수자나 그 변호인에게 참여의 기회를 보장하고 압수된 전자정보의 파일 명세가 특정된 압수목록을 작성, 교부하여야 하며 범죄혐의사실과 무관한 전자정보의 임의적인 복제 등을 막기 위한 적절한 조치를 취하는 등 영장주의 원칙과 적법절차를 준수하여야 함","힌트_첫어절":"압수대상이 되는 전자정보와 그렇지","힌트_초성":"ㅇㅅㄷㅅㅇ ㄷㄴ ㅈㅈㅈㅂㅇ ㄱㄹㅈ ㅇㅇ ㅈㅈㅈㅂㄱ ㅎㅈㄷ ㅈㅂㅈㅈㅁㅊㄴ ㄱ ㅂㅈㅂㅇ ㅇㅇㅈㅊ ㅂㅇ ㅅㅅㄱㄱㅇ ㄱ ㅈㅂㅈㅈㅁㅊ ㄷㅇ ㅅㅅㄱㄱ ㅅㅁㅅ ㄷㅇㄹ ㅇㄱ ㅇㄹ ㅌㅅ, ㅂㅈ, ㅊㄹㅎㄴ ㄱㅇ, ㄱㅇ ㄱㅇ ㅇㄹㅇ ㄱㅈㅇㅅ ㅎㅅㅂ ㅈ219ㅈ, ㅈ121ㅈㅇㅅ ㄱㅈㅎㄴ ㅍㅇㅅㅈㄴ ㄱ ㅂㅎㅇㅇㄱ ㅊㅇㅇ ㄱㅎㄹ ㅂㅈㅎㄱ ㅇㅅㄷ ㅈㅈㅈㅂㅇ ㅍㅇ ㅁㅅㄱ ㅌㅈㄷ ㅇㅅㅁㄹㅇ ㅈㅅ, ㄱㅂㅎㅇㅇ ㅎㅁ ㅂㅈㅎㅇㅅㅅㄱ ㅁㄱㅎ ㅈㅈㅈㅂㅇ ㅇㅇㅈㅇ ㅂㅈ ㄷㅇ ㅁㄱ ㅇㅎ ㅈㅈㅎ ㅈㅊㄹ ㅊㅎㄴ ㄷ ㅇㅈㅈㅇ ㅇㅊㄱ ㅈㅂㅈㅊㄹ ㅈㅅㅎㅇㅇ ㅎ","핵심키워드":["압수대상","영장주의"
