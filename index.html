착의 등에 의한 범인식별 절차에 있어서 용의자 한사람을 단독으로 목격자와 대질시키거나 용의자의 사진 한 장만을 목격자에게 제시하여 범인 여부를 확인하게 하는 것 및 그러한 방식에 의한 목격자의 진술은 부가적인 사정이 없는 한 그 신빙성이 낮다고 보아야 함 / (2) 인정사실 / ~에 의하면 다음과 같은 사실이 인정됨 / - 피해자 1은 사건이 발생한 직후 범인의 인상착의에 대하여 20대나 30대의 남자로서 키는 180cm 정도라고 진술하였으나, 피고인의 키는 173cm 정도임 / - 피해자 2는 범인의 인상착의에 대하여 사건이 발생한 직후에는 10대 후반 정도로 보이고, 키는 167cm 정도이며, 착한 얼굴이라는 느낌을 받았다고 진술하였고, 피고인과 대면하기 직전에는 범인이 잘 생기고 매우 착하면서도 깔끔한 인상이라고 진술하였으나, 범인의 다른 신체적 특징을 묻는 질문에 대하여는 위 사건 당시 너무 긴장을 하고 겁이 나서 범인의 얼굴을 똑바로 보지 못하였기 때문에 기억나지 않는다고 진술함 / - 위 피해자들이 피고인을 범인으로 지목하게 된 경위는, 범인에게서 LPG 가스 냄새가 났다는 피해자 2의 진술을 토대로 위 각 사건의 범인을 찾던 경찰이, 피해자 3에 대한 범행으로 구속된 피고인을 상대로 여죄를 추궁하는 과정에서 피고인이 평소 위 각 사건의 발생장소 인근에서 본드를 흡입한 적이 있다고 진술하자, 피고인이 본드를 흡입한 상태에서 위 각 사건을 저지른 것으로 의심하고, 피해자들로 하여금 피고인이 범인인지 여부를 확인하도록 한 것임 / - 피해자 1의 경우에는 다른 비교대상자 없이 피고인만을 직접 대면하게 하여 피고인이 범인인지 여부를 확인하게 하였고, 공소외 2의 경우에는 피고인만의 사진을 제시한 채 범인인지를 물어 범인일 가능성이 70~80% 정도라는 대답을 들은 후, 피고인과 또 다른 한 사람만을 직접 대면하도록 한 상태에서 피고인이 범인인지 여부를 확인하도록 하였음 / - 피해자 1의 경우에는 사건 발생일로부터 5개월 이상 경과한 후에, 김순옥의 경우에는 3개월 가량 경과한 후에 위와 같은 범인식별절차가 이루어짐 / - 피해자 2는 제1심법정에서 피고인이 범인이라고 확신하는 정도가 70~80% 가량이라고 진술함 / (3) 판단 / 위 인정사실로부터 알 수 있는 다음과 같은 사정들 즉, / - 피해자들은 피고인의 인상착의에 대하여 진술한 바 있으나 피고인을 범인으로 단정 지을 수 있을 정도로 상세한 진술을 한 바 없고 / - 피고인을 범인으로 의심하게된 경위에 비추어 보아도 피고인이 위 사건의 범인이라고 단정할 만한 객관적인 자료를 찾아볼 수 없는 점 / - 범인식별절차에 있어서 신빙성을 높이기 위하여 준수하여야 할 절차를 충족하지 못하였을 뿐 아니라, 그 과정에서 사진상의 인물인 피고인이 위 각 사건의 범인일 가능성이 있다는 암시가 주어졌을 개연성이 있는 점 / - 종전에 피고인을 만난 적이 없던 위 피해자들로서는 기억력의 한계 등으로 인하여 범인에 대한 기억이 부정확할 여지가 있는 점 / - 그 스스로도 피고인이 범인이 아닐 가능성을 배제하지 못하고 있는 점 등에 비추어, 피고인을 위 각 사건의 범인으로 지목한 피해자들의 각 진술은 선뜻 믿기 어려움 / 나) DNA 분석의 증명력에 관하여 / (1) 법리 / DNA분석을 통한 유전자검사 결과는 충분한 전문적인 지식과 경험을 지닌 감정인이 적절하게 관리, 보존된 감정자료에 대하여 일반적으로 확립된 표준적인 검사기법을 활용하여 감정을 실행하고, 그 결과의 분석이 적정한 절차를 통하여 수행되었음이 인정되는 이상 높은 신뢰성을 지닌다 할 것임 / (2) 인정사실 / 경찰은 피해자 1에 대한 특수강간미수 등의 범행이 있은 직후 피해자 1로부터 범인의 정액이 묻어있는 옷을 제출받아 국립과학수사연구소에 유전자감정을 의뢰한 사실, 경찰은 피고인이 위 사건의 범인과 동일인인지 여부를 확인하기 위하여 피고인의 모발 및 타액에 대하여도 국립과학수사연구소에 유전자감정을 의뢰하였는데, DNA분석 결과 피고인의 유전자형이 범인의 그것과 상이하다는 감정 결과가 제1심법원에 제출된 사실이 인정됨. / (3) 판단 / 위 인정사실을 앞서 본 법리에 비추어 보면 위와 같은 감정 결과는 감정인의 자격, 감정자료의 관리 및 보존상태, 검사기법의 적절성, 유전자형이 다르면 동일인이 아니라고 확신할 수 있다는 유전자감정 분야에서 일반적으로 승인된 전문지식 등에 비추어 볼 때 피고인의 무죄를 입증할 수 있는 유력한 증거에 해당함 / 검사의 위 주장 받아들이지 아니함 / 다) 부족증거 / 그 밖의 유죄의 증거로서 피고인의 법정 진술 및 피해자 2의 피해신고서 등을 들고 있으나, 피고인은 제1심 및 원심법정에서 위 각 범행을 저질렀는지 여부가 기억이 나지 않는다는 취지로 진술하였을 뿐이고, 위 피해신고서는 강도치상의 피해를 당한 사실을 신고한다는 내용에 불과하여 위 증거들 만으로는 피고인이 피해자들을 - 하였다는 사실을 인정하기에 부족하고 달리 이를 인정할 증거가 없음 / 라) 소결론 / 이 부분 공소사실은 범죄사실의 증명이 없는 때에 해당하여 형소법 제325조 후단에 의하여 무죄를 선고함","발문":"7. 증거능력 > 라. 전문법칙 > 8) 정보저장매체 및 출력물의 증거능력","사실관계":"1) 피해자 공소외 1에 대한 특수강간미수 등의 범행이 있은 직후, 경찰은 공소외 1로부터 범인의 정액이 묻어있는 옷을 제출받아 국립과학수사연구소에 유전자감정을 의뢰하였고, 또한 피고인이 위 사건의 범인과 동일인인지 여부를 확인하기 위하여 피고인의 모발 및 타액에 대하여도 국립과학수사연구소에 유전자감정을 의뢰하였는데, DNA분석 결과 피고인의 유전자형이 범인의 그것과 상이하다는 감정 결과가 제1심법원에 제출되었음\n2) 원심은 위 감정 결과의 신뢰성을 의심할 만한 다른 사정이 있는지에 관하여 아무런 심리 및 판단을 하지 아니한 채 피고인의 피해자 공소외 1에 대한 특수강간미수 범행을 유죄로 인정하였음","링판번호":156},{"카드ID":"C151-1","판례ID":"C151","대분류":"7. 증거능력","중분류":"증거능력 II","쟁점":"형사소송법 제318조 제1항 당사자 동의의 본질 및 방법","사건번호":"82도2873","태그":["L"],"중요도":0,"단락순번":1,"총단락수":1,"법리원문":"반대신문권포기설(통,판) 형소법 제318조 제1항은 전문증거금지 원칙에 대한 예외로서 반대신문권을 포기하겠다는 피고인의 의사표시에 의하여 서류 또는 물건의 증거능력을 부여하려는 규정이므로 피고인의 의사표시가 위와 같은 내용을 적극적으로 표시하는 것이라고 인정되면 증거동의로서의 효력이 있음. 또한, 그 의사표시의 절차와 방법에 관하여 형소법상 어떠한 제한이 있는 것은 아니므로, 피고인들의 의사표시가 하나하나의 증거에 대하여 형소법상의 증거조사방식을 거쳐 이루어진 것이 아니라 검사가 제시한 모든 증거에 대해 증거로 함에 동의한다는 방식으로 이루어진 것이라 하여 그 효력을 부정할 이유가 되지 못함","힌트_첫어절":"반대신문권포기설(통,판) 형소법 제318조 제1항은","힌트_초성":"ㅂㄷㅅㅁㄱㅍㄱㅅ(ㅌ,ㅍ) ㅎㅅㅂ ㅈ318ㅈ ㅈ1ㅎㅇ ㅈㅁㅈㄱㄱㅈ ㅇㅊㅇ ㄷㅎ ㅇㅇㄹㅅ ㅂㄷㅅㅁㄱㅇ ㅍㄱㅎㄱㄷㄴ ㅍㄱㅇㅇ ㅇㅅㅍㅅㅇ ㅇㅎㅇ ㅅㄹ ㄸㄴ ㅁㄱㅇ ㅈㄱㄴㄹㅇ ㅂㅇㅎㄹㄴ ㄱㅈㅇㅁㄹ ㅍㄱㅇㅇ ㅇㅅㅍㅅㄱ ㅇㅇ ㄱㅇ ㄴㅇㅇ ㅈㄱㅈㅇㄹ ㅍㅅㅎㄴ ㄱㅇㄹㄱ ㅇㅈㄷㅁ ㅈㄱㄷㅇㄹㅅㅇ ㅎㄹㅇ ㅇㅇ. ㄸㅎ, ㄱ ㅇㅅㅍㅅㅇ ㅈㅊㅇ ㅂㅂㅇ ㄱㅎㅇ ㅎㅅㅂㅅ ㅇㄸㅎ ㅈㅎㅇ ㅇㄴ ㄱㅇ ㅇㄴㅁㄹ, ㅍㄱㅇㄷㅇ ㅇㅅㅍㅅㄱ ㅎㄴㅎㄴㅇ ㅈㄱㅇ ㄷㅎㅇ ㅎㅅㅂㅅㅇ ㅈㄱㅈㅅㅂㅅㅇ ㄱㅊ ㅇㄹㅇㅈ ㄱㅇ ㅇㄴㄹ ㄱㅅㄱ ㅈㅅㅎ ㅁㄷ ㅈㄱㅇ ㄷㅎ ㅈㄱㄹ ㅎㅇ ㄷㅇㅎㄷㄴ ㅂㅅㅇㄹ ㅇㄹㅇㅈ ㄱㅇㄹ ㅎㅇ ㄱ ㅎㄹㅇ ㅂㅈㅎ ㅇㅇㄱ ㄷㅈ ㅁㅎ","핵심키워드":["반대신문권포기설(통,판)","반대신문권","전문증거금지","증거조사방식","증거능력","의사표시","증거동의","절차","효력","원칙","예외","증거","서류","제한","형소법상","물건","포기","제시","피고인들","규정"],"빈칸":{"1":[[0,13],[29,35],[36,38],[43,45],[48,53],[55  하였을 것이라고 볼 만한 정황이 있는지 등을 전체적, 종합적으로 고려하여 증인이 침묵하지 아니하고 진술한 것이 자신의 진정한 의사에 의한 것인지 여부를 기준으로 위증죄의 성립 여부를 판단하여야 함. 그러므로 헌법 제12조 제2항에 정한 불이익 진술의 강요금지 원칙을 구체화한 자기부죄거부특권에 관한 것이거나 기타 증언거부사유가 있음에도 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 할 것임","힌트_첫어절":"증언거부권 제도는 증인에게 증언의무의","힌트_초성":"ㅈㅇㄱㅂㄱ ㅈㄷㄴ ㅈㅇㅇㄱ ㅈㅇㅇㅁㅇ ㅇㅎㅇ ㄱㅈㅎ ㅅ ㅇㄴ ㄱㄹㄹ ㅂㅇㅎ ㄱㅇㄱ, ㅎㅅㅂㅅ ㅈㅇㄱㅂㄱㅇ ㄱㅈ ㅈㄷㄴ ㅈㅇㅇㄱ ㄱㄹㅎ ㄱㄹㅇ ㅈㅈㄹ ㅎㅇㅅㅋ ㅊㅁㅎ ㄱㅇㅈ ㅇㄴㅁ ㅈㅅㅎ ㄱㅇㅈㅇ ㄱㅎㅇ ㅅㅅㅅㄱㅎ ㄱㅎㄹ ㅊㅂㅎ ㅂㅇㅎㅇㄹㅆ ㅊㅁㅎ ㅅ ㅇㄴ ㄱㄹㄹ ㅂㅈㅎㄱ ㅇㅎ ㄱㅇㅇ ㄱㅇㅎ ㄸ, ㅈㅍㅈㅇ ㅅㅁ ㅈㅇ ㅈㅇㅇㄱ ㅈㅇㄱㅂㄱㅇ ㄱㅈㅎㅈ ㅇㅇ ㄱㅇㅇㄷ ㄷㅎ ㅅㄱㅇㅅ ㅈㅇ ㄷㅅ ㅈㅇㅇ ㅊㅎ ㄱㅊㅈㅇ ㅅㅎ, ㅈㅇㄱㅂㅅㅇㅇ ㄴㅇ, ㅈㅇㅇ ㅈㅇㄱㅂㅅㅇ ㄸㄴ ㅈㅇㄱㅂㄱㅇ ㅈㅈㄹ ㅇㅁ ㅇㄱ ㅇㅇㄴㅈ ㅇㅂ, ㅈㅇㄱㅂㄱㅇ ㄱㅈㅂㅇㄷㄹㄷ ㅎㅇㅈㅅㅇ ㅎㅇㅇ ㄱㅇㄹㄱ ㅂ ㅁㅎ ㅈㅎㅇ ㅇㄴㅈ ㄷㅇ ㅈㅊㅈ, ㅈㅎㅈㅇㄹ ㄱㄹㅎㅇ ㅈㅇㅇ ㅊㅁㅎㅈ ㅇㄴㅎㄱ ㅈㅅㅎ ㄱㅇ ㅈㅅㅇ ㅈㅈㅎ ㅇㅅㅇ ㅇㅎ ㄱㅇㅈ ㅇㅂㄹ ㄱㅈㅇㄹ ㅇㅈㅈㅇ ㅅㄹ ㅇㅂㄹ ㅍㄷㅎㅇㅇ ㅎ. ㄱㄹㅁㄹ ㅎㅂ ㅈ12ㅈ ㅈ2ㅎㅇ ㅈㅎ ㅂㅇㅇ ㅈㅅㅇ ㄱㅇㄱㅈ ㅇㅊㅇ ㄱㅊㅎㅎ ㅈㄱㅂㅈㄱㅂㅌㄱㅇ ㄱㅎ ㄱㅇㄱㄴ ㄱㅌ ㅈㅇㄱㅂㅅㅇㄱ ㅇㅇㅇㄷ ㅈㅇㅇ ㅈㅇㄱㅂㄱㅇ ㄱㅈㅂㅈ ㅁㅎㅇㄹ ㅇㅎㅇ ㄱ ㅈㅇㄱㅂㄱㅇ ㅎㅅㅎㄴ ㄷ ㅅㅅㅅ ㅈㅇㄱ ㅊㄹㄷㅇㄷㄱ ㅂ ㅅ ㅇㄴ ㄱㅇㅇㄴ ㅇㅈㅈㅇ ㅅㄹㅇ ㅂㅈㅎㅇㅇ ㅎ ㄱㅇ","핵심키워드":["허위진술","자기부죄거부특권","증언거부권","증언거부사유","위증죄","제도","증언의무","신문","고지","정황","재판장","원칙","이행","장애","의사","증언","권리","형소법상","불이익","진술","존재","진정","사건","보장","행사","성립"],"중복그룹":"G05","그룹대표":"Y","빈칸":{"1":[[0,5],[6,8],[15,19],[21,23],[34,36],[47,51],[52,57],[59,61],[62,64],[75,77],[79,81],[100,102],[143,145],[147,149],[166,169],[171,173],[182,187],[189,191],[205,207],[210,212],[232,238],[248,254],[258,263],[265,267],[284,289],[299,303],[319,321],[360,362],[371,373],[375,377],[395,398],[400,402],[437,440],[441,443],[450,452],[459,467],[480,486],[497,502],[520,525],[527,529],[538,540],[561,564],[566,568]],"2":[[0,5],[6,8],[10,12],[15,19],[21,23],[34,36],[38,40],[47,51],[52,57],[59,61],[62,64],[66,68],[75,77],[79,81],[100,102],[127,129],[143,145],[147,149],[166,169],[171,173],[177,179],[182,187],[189,191],[205,207],[210,212],[216,218],[228,230],[232,238],[244,246],[248,254],[258,263],[265,267],[284,289],[299,303],[319,321],[346,348],[360,362],[371,373],[375,377],[395,398],[400,402],[421,423],[424,428],[429,432],[437,440],[441,443],[450,452],[459,467],[480,486],[493,495],[497,502],[509,511],[520 리를 보장하기 위한 것임을 감안할 때, 재판장이 신문 전에 증인에게 증언거부권을 고지하지 않은 경우에도 당해 사건에서 증언 당시 증인이 처한 구체적인 상황, 증언거부사유의 내용, 증인이 증언거부사유 또는 증언거부권의 존재를 이미 알고 있었는지 여부, 증언거부권을 고지받았더라도 허위진술을 하였을 것이라고 볼 만한 정황이 있는지 등을 전체적, 종합적으로 고려하여 증인이 침묵하지 아니하고 진술한 것이 자신의 진정한 의사에 의한 것인지 여부를 기준으로 위증죄의 성립 여부를 판단하여야 함. 그러므로 헌법 제12조 제2항에 정한 불이익 진술의 강요금지 원칙을 구체화한 자기부죄거부특권에 관한 것이거나 기타 증언거부사유가 있음에도 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 할 것임","힌트_첫어절":"증언거부권 제도는 증인에게 증언의무의","힌트_초성":"ㅈㅇㄱㅂㄱ ㅈㄷㄴ ㅈㅇㅇㄱ ㅈㅇㅇㅁㅇ ㅇㅎㅇ ㄱㅈㅎ ㅅ ㅇㄴ ㄱㄹㄹ ㅂㅇㅎ ㄱㅇㄱ, ㅎㅅㅂㅅ ㅈㅇㄱㅂㄱㅇ ㄱㅈ ㅈㄷㄴ ㅈㅇㅇㄱ ㄱㄹㅎ ㄱㄹㅇ ㅈㅈㄹ ㅎㅇㅅㅋ ㅊㅁㅎ ㄱㅇㅈ ㅇㄴㅁ ㅈㅅㅎ ㄱㅇㅈㅇ ㄱㅎㅇ ㅅㅅㅅㄱㅎ ㄱㅎㄹ ㅊㅂㅎ ㅂㅇㅎㅇㄹㅆ ㅊㅁㅎ ㅅ ㅇㄴ ㄱㄹㄹ ㅂㅈㅎㄱ ㅇㅎ ㄱㅇㅇ ㄱㅇㅎ ㄸ, ㅈㅍㅈㅇ ㅅㅁ ㅈㅇ ㅈㅇㅇㄱ ㅈㅇㄱㅂㄱㅇ ㄱㅈㅎㅈ ㅇㅇ ㄱㅇㅇㄷ ㄷㅎ ㅅㄱㅇㅅ ㅈㅇ ㄷㅅ ㅈㅇㅇ ㅊㅎ ㄱㅊㅈㅇ ㅅㅎ, ㅈㅇㄱㅂㅅㅇㅇ ㄴㅇ, ㅈㅇㅇ ㅈㅇㄱㅂㅅㅇ ㄸㄴ ㅈㅇㄱㅂㄱㅇ ㅈㅈㄹ ㅇㅁ ㅇㄱ ㅇㅇㄴㅈ ㅇㅂ, ㅈㅇㄱㅂㄱㅇ ㄱㅈㅂㅇㄷㄹㄷ ㅎㅇㅈㅅㅇ ㅎㅇㅇ ㄱㅇㄹㄱ ㅂ ㅁㅎ ㅈㅎㅇ ㅇㄴㅈ ㄷㅇ ㅈㅊㅈ, ㅈㅎㅈㅇㄹ ㄱㄹㅎㅇ ㅈㅇㅇ ㅊㅁㅎㅈ ㅇㄴㅎㄱ ㅈㅅㅎ ㄱㅇ ㅈㅅㅇ ㅈㅈㅎ ㅇㅅㅇ ㅇㅎ ㄱㅇㅈ ㅇㅂㄹ ㄱㅈㅇㄹ ㅇㅈㅈㅇ ㅅㄹ ㅇㅂㄹ ㅍㄷㅎㅇㅇ ㅎ. ㄱㄹㅁㄹ ㅎㅂ ㅈ12ㅈ ㅈ2ㅎㅇ ㅈㅎ ㅂㅇㅇ ㅈㅅㅇ ㄱㅇㄱㅈ ㅇㅊㅇ ㄱㅊㅎㅎ ㅈㄱㅂㅈㄱㅂㅌㄱㅇ ㄱㅎ ㄱㅇㄱㄴ ㄱㅌ ㅈㅇㄱㅂㅅㅇㄱ ㅇㅇㅇㄷ ㅈㅇㅇ ㅈㅇㄱㅂㄱㅇ ㄱㅈㅂㅈ ㅁㅎㅇㄹ ㅇㅎㅇ ㄱ ㅈㅇㄱㅂㄱㅇ ㅎㅅㅎㄴ ㄷ ㅅㅅㅅ ㅈㅇㄱ ㅊㄹㄷㅇㄷㄱ ㅂ ㅅ ㅇㄴ ㄱㅇㅇㄴ ㅇㅈㅈㅇ ㅅㄹㅇ ㅂㅈㅎㅇㅇ ㅎ ㄱㅇ","핵심키워드":["허위진술","자기부죄거부특권","증언거부권","증언거부사유","위증죄","제도","증언의무","신문","고지","정황","재판장","원칙","이행","장애","의사","증언","권리","형소법상","불이익","진술","존재","진정","사건","보장","행사","성립"],"중복그룹":"G05","그룹대표":"N","빈칸":{"1":[[0,5],[6,8],[15,19],[21,23],[34,36],[47,51],[52,57],[59,61],[62,64],[75,77],[79,81],[100,102],[143,145],[147,149],[166,169],[171,173],[182,187],[189,191],[205,207],[210,212],[232,238],[248,254],[258,263],[265,267],[284,289],[299,303],[319,321],[360,362],[371,373],[375,377],[395,398],[400,402],[437,440],[441,443],[450,452],[459,467],[480,486],[497,502],[520,525],[527,529],[538,540],[561,564],[566,568]],"2":[[0,5],[6,8],[10,12],[15,19],[21,23],[34,36],[38,40],[47,51],[52,57],[59,61],[62,64],[66,68],[75,77],[79,81],[100,102],[127,129],[143,145],[147,149],[166,169],[171,173],[177,179],[182,187],[189,191],[205,207],[210,212],[216,218],[228,230],[232,238],[244,246],[248,254],[258,263],[265,267],[284,289],[299,303],[319,321],[346,348],[360 [101,104],[106,108],[111,113],[127,129],[143,147],[161,165],[174,177],[179,181],[210,213],[215,217],[219,223]],"3":[[0,7],[22,56],[69,82],[92,113],[127,129],[143,147],[161,165],[174,181],[210,223]]},"발문":"8. 증거조사","사실관계":"1) 피고인이 2007. 6. 중순 일자불상 22:00경 대구 신천 4동 소재 동대구 고속버스터미널 부근 상호불상 모텔 5층 방실에서 1회용 주사기에 담긴 필로폰 약 0.03그램을 생수로 희석하여 자신의 팔에 주사하는 방법으로 필로폰을 투약하였음\n2) 공소외 1은 피고인의 범행을 자인하는 것을 들었다는 진술을 검찰조사에서 진술함. 검사는 이를 검찰 진술조서에 진술기재하여 제출함","링판번호":180},{"카드ID":"C175-1","판례ID":"C175","대분류":"8. 증거조사","쟁점":"탄핵증거의 증거능력(항소이유서에서 탄핵증거라고 밝힘)","사건번호":"2005도2617","태그":["L"],"중요도":0,"단락순번":1,"총단락수":1,"법리원문":"탄핵증거로서의 증거조사절차는 검사가 입증취지를 진술하고 피고인 측에 열람의 기회를 준 후 그 의견을 듣는 방법에 의함","힌트_첫어절":"탄핵증거로서의 증거조사절차는 검사가 입증취지를","힌트_초성":"ㅌㅎㅈㄱㄹㅅㅇ ㅈㄱㅈㅅㅈㅊㄴ ㄱㅅㄱ ㅇㅈㅊㅈㄹ ㅈㅅㅎㄱ ㅍㄱㅇ ㅊㅇ ㅇㄹㅇ ㄱㅎㄹ ㅈ ㅎ ㄱ ㅇㄱㅇ ㄷㄴ ㅂㅂㅇ ㅇㅎ","핵심키워드":["증거조사절차","탄핵증거","열람","입증취지","진술"],"빈칸":{"1":[[0,4],[8,14],[20,24],[26,28],[38,40]],"2":[[0,4],[8,14],[16,18],[20,24],[26,28],[31,34],[38,40],[52,54],[63,65]],"3":[[0,40],[52,54],[63,65]]},"발문":"8. 증거조사","사실관계":"1) 공소사실 (벌금 500만 원 약식기소, 약식명령에 대하여 피고인 정식재판 청구) : 피고인은 주차된 충북OO호 무쏘 승용차를 운전하는 자인바, 2004. 7. 9. 21:40경 제천시 OOO도로에서 그곳에 주차된 위 차량을 출발시킴에 있어 전후방을 잘 살펴 안전하게 운전하여 사고를 방지할 업무상 주의의무가 있음에도 이를 태만히 한 채 좌회전한 과실로, 위 차량 좌측면 뒤쪽에서 앞쪽으로 걸어오던 피해자 김OO를 위 차량 좌측면으로 충격하여 위 피해자로 하여금 2주간의 치료를 요하는 요추부 염좌, 좌상을 입게 하고도 피해자를 구호하는 등의 조치를 취하지 않고 그대로 도주하였음\n2) 제1심 - 무죄 (피고인은 경찰에서 자백 후 법정에서 부인)\n- 충격부위나 사고경위에 관하여 피해자의 진술 일관되지 아니함 - 현장검증조서에 의하면 공소사실대로 충격가능성 없고 있었더라도 경미했을 것으로 보임- 피해자가 통증 호소했을 뿐 치료받지 아니함\n3) 검사 항소\n- 피해자의 진술은 지엽적인 부분에서 불일치할 뿐 전체적으로 일관됨- 피고인의 자백을 기재한 경찰 피신 기재는 피고인의 법정진술에 대한 탄핵증거가 될 수 있음에도 제1심이 사실을 오인함\n4) 제2심 (원심 - 검사의 항소기각)\n- 피고인에 대한 경찰 피신에 대해 탄핵증거로서 증거조사가 이루어지지 아니함 (검사가 증거로 제출하였으나, 탄핵 취지를 명시한 바가 없고, 탄핵증거로서 조사가 이루어진 바가 없으므로 탄핵증거가 될 수 없음)\n- 그 밖에 원심의 증거 판단 타당함","링판번호":181},{"카드ID":"C176-1","판례ID":"C176","대분류":"8. 증거조사","쟁점":"부동산 이중매매-배임죄 성부","사건번호":"2017도4027","태그":["L","과제"],"중요도":0,"단락순번":1,"총단락수":2,"법리원문":"부동산 매매계약에서 계약금만 지급된 단계에서는 어느 당사자나 계약금을 포기하거나 그 배액을 상환함으로써 자유롭게 계약의 구속력에서 벗어날 수 있음. 그러나 중도금이 지급되는 등 계약이 본격적으로 이행되는 단계에 이른 때에는 계약이 취소되거나 해제되지 않는 한 매도인은 매수인에게 부동산의 소유권을 이전해 줄 의무에서 벗어날 수 없음. 따라서 이러한 단계에 이른 때에 매도인은 매수인에 대하여 매수인의 재산보전에 협력하여 재산적 이익을 보호, 관리할 신임관계에 있게 됨. 그때부터 매도인은 배임죄에서 말하는 타인의 사무를 처리하는 자에 해당한다고 보아야 함. 그러한 지위에 있는 매도인이 매수인에게 계약 내용에 따라 부동산의 소유권을 이전해 주기 전에 그 부동산을 제3자에게 처분하고 제3자 앞으로 그 처분에 따른 등기를 마쳐 준 행위는 매수인의 부동산 취득 또는 보전에 지장을 초래하는 행위임. 이는 매수인과의 신임관계를 저버리는 행위로서 배임죄가 성립함","힌트_첫어절":"부동산 매매계약에서 계약금만 지급된","힌트_초성":"ㅂㄷㅅ ㅁㅁㄱㅇㅇㅅ ㄱㅇㄱㅁ ㅈㄱㄷ ㄷㄱㅇㅅㄴ ㅇㄴ ㄷㅅㅈㄴ ㄱㅇㄱㅇ ㅍㄱㅎㄱㄴ ㄱ ㅂㅇㅇ ㅅㅎㅎㅇㄹㅆ ㅈㅇㄹㄱ ㄱㅇㅇ ㄱㅅㄹㅇㅅ ㅂㅇㄴ ㅅ ㅇㅇ. ㄱㄹㄴ ㅈㄷㄱㅇ ㅈㄱㄷㄴ ㄷ ㄱㅇㅇ ㅂㄱㅈㅇㄹ ㅇㅎㄷㄴ ㄷㄱㅇ ㅇㄹ ㄸㅇㄴ ㄱㅇㅇ ㅊㅅㄷㄱㄴ ㅎㅈㄷㅈ ㅇㄴ ㅎ ㅁㄷㅇㅇ ㅁㅅㅇㅇㄱ ㅂㄷㅅㅇ ㅅㅇㄱㅇ ㅇㅈㅎ ㅈ ㅇㅁㅇㅅ ㅂㅇㄴ ㅅ ㅇㅇ. ㄸㄹㅅ ㅇㄹㅎ ㄷㄱㅇ ㅇㄹ ㄸㅇ ㅁㄷㅇㅇ ㅁㅅㅇㅇ ㄷㅎㅇ ㅁㅅㅇㅇ ㅈㅅㅂㅈㅇ ㅎㄹㅎㅇ ㅈㅅㅈ ㅇㅇㅇ ㅂㅎ, ㄱㄹㅎ ㅅㅇㄱㄱㅇ ㅇㄱ ㄷ. ㄱㄸㅂㅌ ㅁㄷㅇㅇ ㅂㅇㅈㅇㅅ ㅁㅎㄴ ㅌㅇㅇ ㅅㅁㄹ ㅊㄹㅎㄴ ㅈㅇ ㅎㄷㅎㄷㄱ ㅂㅇㅇ ㅎ. ㄱㄹㅎ ㅈㅇㅇ ㅇㄴ ㅁㄷㅇㅇ ㅁㅅㅇㅇㄱ ㄱㅇ ㄴㅇㅇ ㄸㄹ ㅂㄷㅅㅇ ㅅㅇㄱㅇ ㅇㅈㅎ ㅈㄱ ㅈㅇ ㄱ ㅂㄷㅅㅇ ㅈ3ㅈㅇㄱ ㅊㅂㅎㄱ ㅈ3ㅈ ㅇㅇㄹ ㄱ ㅊㅂㅇ ㄸㄹ ㄷㄱㄹ ㅁㅊ ㅈ ㅎㅇㄴ ㅁㅅㅇㅇ ㅂㄷㅅ ㅊㄷ ㄸㄴ ㅂㅈㅇ ㅈㅈㅇ ㅊㄹㅎㄴ ㅎㅇㅇ. ㅇㄴ ㅁㅅㅇㄱㅇ ㅅㅇㄱㄱㄹ ㅈㅂㄹㄴ ㅎㅇㄹㅅ ㅂㅇㅈㄱ ㅅㄹㅎ","핵심키워드":["소유권","배임죄","재산","의무","보호","매수인","매도인","지위","이익","단계","부동산","재산보전","처분","구속력","계약금","사무","지급","행위","중도금","이행","매매계약","취득","포기","관리","처리","신임관계","취소","성립"],"빈칸":{"1":[[0,3],[4,8],[11,14],[16,18],[20,22],[34,37],[39,41],[67,70],[87,90],[92,94],[109,111],[114,116],[145,148],[150,153],[156,159],[161,164],[172,174],[195,197],[205,208],[210,213],[219,222],[224,228],[235,237],[239,241],[243,245],[247,249],[251,255],[268,271],[273,276],[287,289],[291,293],[316,318],[323,326],[328,331],[344,347],[349,352],[366,369],[377,379],[392,394],[408,410],[412,415],[417,420],[421,423],[448,451],[454,458],[465,467],[470,473]],"2":[[0,3],[4,8],[11,14],[16,18],[20,22],[29,32],[34,37],[39,41],[47,49],[63,65],[67,70],[87,90],[92,94],[99,101],[109,111],[114,116],[125,127],[129,131],[135,137],[145,148],[150,153],[156,159],[161,164],[172,174],[195,197],[205,208],[210,213],[219,222],[224,228],[230,232],[235,237],[239,241],[243,245],[247,249],[251,255],[268,271],[273,276],[283,285],[287,289],[291,293],[316,318],[323,326],[328,331],[334,336],[344,347],[349,352],[358,360],[366,369],[371,374],[377,379],[382,385],[392,394],[399,401],[408,410],[412,415],[417,420],[421,423],[427,429],[431,433],[435,437],[448,451],[454,458],[465,467],[470,473],[475,477]],"3":[[0,49],[63,70],[87,116],[125,174],[195,255],[268,293],[316,415],[417,423],[427,429],[431,433],[435,437],[448,451],[454,458],[465,467],[470,473],[475,477]]},"발문":"8. 증거조사","사실관계":"1) 피고인은 2014. 8. 20. 피해자 A에게 피고인과 공소외 1의 공동 소유인 이 사건 부동산을 13억 8,000만 원에 매도하는 계약을 체결하였음. 피고인이 계약 당일 계약금 2억 원, 2014. 9. 20. 중도금 6억 원, 2014. 11. 30. 소유권이전등기에 필요한 서류와 상환으로 잔금 5억 8,000만 원을 지급받고, 2014. 11. 30.까지 피해자들에게 이 사건 부동산을 인도한다는 내용이었음\n2) 피고인은 피해자들로부터 계약 당일 2억 원, 2014. 9. 30. 중도금 6억 원을 지급받았음\n3) 피고인은 2015. 4. 13. 공소외 2에게 이 사건 부동산을 매매대금 15억 원에 매도하고 2015. 4. 17. 그 소유권이전등기를 마쳐 주었음\n4) 이 사건 공소사실은 피고인의 위와 같은 행위가 특정경제범죄 가중처벌 등에 관한 법률 위반(배임)죄에 해당한다는 취지임. 이에 대하여 원심은, 피고인이 배임죄의 주체인 타인의 사무를 처리하는 자의 지위에 있다고 보기 어렵고, 배임의 고의나 불법이득의사가 인정된다고 단정하기 어렵다는 이유로, 이 부분 공소사실을 무죄로 판단하였음","링판번호":182},{"카드ID":"C176-2","판례ID":"C176","대분류":"8. 증거조사","쟁점":"부동산 이중매매-배임죄 성부","사건번호":"2017도4027","태그":["L","과제"],"중요도":0,"단락순번":2,"총단락수":2,"법리원문":"그 이유는 다음과 같음 1) 배임죄는 타인과 그 재산상 이익을 보호, 관리하여야 할 신임관계에 있는 사람이 신뢰를 저버리는 행위를 함으로써 타인의 재산상 이익을 침해할 때 성립하는 범죄임. 계약관계에 있는 당사자 사이에 어느 정도의 신뢰가 형성되었을 때 형사법에 의해 보호받는 신임관계가 발생한다고 볼 것인지, 어떠한 형태의 신뢰위반 행위를 가벌적인 임무위배행위로 인정할 것인지는 계약의 내용과 이행의 정도, 그에 따른 계약의 구속력 정도, 거래 관행, 신임관계의 유형과 내용, 신뢰위반의 정도 등을 종합적으로 고려하여 타인의 재산상 이익 보호가 신임관계의 전형적, 본질적 내용이 되었는지, 해당 행위가 형사법의 개입이 정당화될 정도의 배신적인 행위인지 등에 따라 규범적으로 판단해야 함 2) 우리나라에서 부동산은 국민의 기본적 생활의 터전으로 경제활동의 근저를 이루고 있고, 국민 개개인이 보유하는 재산가치의 대부분을 부동산이 차지하는 경우도 상당함. 이렇듯 부동산이 경제생활에서 차지하는 비중이나 이를 목적으로 한 거래의 사회경제적 의미는 여전히 큼 3) 부동산 매매대금은 통상 계약금, 중도금, 잔금으로 나뉘어 지급된다. 매수인이 매도인에게 중도금을 지급하면 당사자가 임의로 계약을 해제할 수 없는 구속력이 발생함(민법 제565조 참조). 그런데 매수인이 매도인에게 매매대금의 상당부분에 이르는 계약금과 중도금까지 지급하더라도 매도인의 이중매매를 방지할 보편적이고 충분한 수단은 마련되어 있지 않음. 이러한 상황에서도 매수인은 매도인이 소유권이전등기를 마쳐 줄 것으로 믿고 중도금을 지급함. 따라서 중도금이 지급된 단계부터는 매도인이 매수인의 재산보전에 협력하는 신임관계가 당사자 관계의 전형적, 본질적 내용이 됨. 이러한 신임관계에 있는 매도인은 매수인의 소유권 취득 사무를 처리하는 자로서 배임죄에서 말하는 타인의 사무를 처리하는 자에 해당하게 됨. 나아가 그러한 지위에 있는 매도인이 매수인에게 소유권을 이전하기 전에 고의로 제3자에게 목적부동산을 처분하는 행위는 매매계약상 혹은 신의칙상 당연히 하지 않아야 할 행위로서 배임죄에서 말하는 임무위배행위로 평가할 수 있음 4) 대법원은 오래전부터 부동산 이중매매 사건에서, 매도인은 매수인 앞으로 소유권이전등기를 마칠 때까지 협력할 의무가 있고, 매도인이 중도금을 지급받은 이후 목적부동산을 제3자에게 이중으로 양도하면 배임죄가 성립한다고 일관되게 판결함으로써 그러한 판례를 확립하여 왔음. 이러한 판례 법리는 부동산 이중매매를 억제하고 매수인을 보호하는 역할을 충실히 수행하여 왔고, 현재 우리의 부동산 매매거래 현실에 비추어 보더라도 여전히 타당함. 이러한 법리가 부동산 거래의 왜곡 또는 혼란을 야기하는 것도 아니고, 매도인의 계약의 자유를 과도하게 제한한다고 볼 수도 없음. 따라서 기존의 판례는 유지되어야 함","힌트_첫어절":"그 이유는 다음과 같음","힌트_초성":"ㄱ ㅇㅇㄴ ㄷㅇㄱ ㄱㅇ 1) ㅂㅇㅈㄴ ㅌㅇㄱ ㄱ ㅈㅅㅅ ㅇㅇㅇ ㅂㅎ, ㄱㄹㅎㅇㅇ ㅎ ㅅㅇㄱㄱㅇ ㅇㄴ ㅅㄹㅇ ㅅㄹㄹ ㅈㅂㄹㄴ ㅎㅇㄹ ㅎㅇㄹㅆ ㅌㅇㅇ ㅈㅅㅅ ㅇㅇㅇ ㅊㅎㅎ ㄸ ㅅㄹㅎㄴ ㅂㅈㅇ. ㄱㅇㄱㄱㅇ ㅇㄴ ㄷㅅㅈ ㅅㅇㅇ ㅇㄴ ㅈㄷㅇ ㅅㄹㄱ ㅎㅅㄷㅇㅇ ㄸ ㅎㅅㅂㅇ ㅇㅎ ㅂㅎㅂㄴ ㅅㅇㄱㄱㄱ ㅂㅅㅎㄷㄱ ㅂ ㄱㅇㅈ, ㅇㄸㅎ ㅎㅌㅇ ㅅㄹㅇㅂ ㅎㅇㄹ ㄱㅂㅈㅇ ㅇㅁㅇㅂㅎㅇㄹ ㅇㅈㅎ ㄱㅇㅈㄴ ㄱㅇㅇ ㄴㅇㄱ ㅇㅎㅇ ㅈㄷ, ㄱㅇ ㄸㄹ ㄱㅇㅇ ㄱㅅㄹ ㅈㄷ, ㄱㄹ ㄱㅎ, ㅅㅇㄱㄱㅇ ㅇㅎㄱ ㄴㅇ, ㅅㄹㅇㅂㅇ ㅈㄷ ㄷㅇ ㅈㅎㅈㅇㄹ ㄱㄹㅎㅇ ㅌㅇㅇ ㅈㅅㅅ ㅇㅇ ㅂㅎㄱ ㅅㅇㄱㄱㅇ ㅈㅎㅈ, ㅂㅈㅈ ㄴㅇㅇ ㄷㅇㄴㅈ, ㅎㄷ ㅎㅇㄱ ㅎㅅㅂㅇ ㄱㅇㅇ ㅈㄷㅎㄷ ㅈㄷㅇ ㅂㅅㅈㅇ ㅎㅇㅇㅈ ㄷㅇ ㄸㄹ ㄱㅂㅈㅇㄹ ㅍㄷㅎㅇ ㅎ 2) ㅇㄹㄴㄹㅇㅅ ㅂㄷㅅㅇ ㄱㅁㅇ ㄱㅂㅈ ㅅㅎㅇ ㅌㅈㅇㄹ ㄱㅈㅎㄷㅇ ㄱㅈㄹ ㅇㄹㄱ ㅇㄱ, ㄱㅁ ㄱㄱㅇㅇ ㅂㅇㅎㄴ ㅈㅅㄱㅊㅇ ㄷㅂㅂㅇ ㅂㄷㅅㅇ ㅊㅈㅎㄴ ㄱㅇㄷ ㅅㄷㅎ. ㅇㄹㄷ ㅂㄷㅅㅇ ㄱㅈㅅㅎㅇㅅ ㅊㅈㅎㄴ ㅂㅈㅇㄴ ㅇㄹ ㅁㅈㅇㄹ ㅎ ㄱㄹㅇ ㅅㅎㄱㅈㅈ ㅇㅁㄴ ㅇㅈㅎ ㅋ 3) ㅂㄷㅅ ㅁㅁㄷㄱㅇ ㅌㅅ ㄱㅇㄱ, ㅈㄷㄱ, ㅈㄱㅇㄹ ㄴㄴㅇ ㅈㄱㄷㄷ. ㅁㅅㅇㅇ ㅁㄷㅇㅇㄱ ㅈㄷㄱㅇ ㅈㄱㅎㅁ ㄷㅅㅈㄱ ㅇㅇㄹ ㄱㅇㅇ ㅎㅈㅎ ㅅ ㅇㄴ ㄱㅅㄹㅇ ㅂㅅㅎ(ㅁㅂ ㅈ565ㅈ ㅊㅈ). ㄱㄹㄷ ㅁㅅㅇㅇ ㅁㄷㅇㅇㄱ ㅁㅁㄷㄱㅇ ㅅㄷㅂㅂㅇ ㅇㄹㄴ ㄱㅇㄱㄱ ㅈㄷㄱㄲㅈ ㅈㄱㅎㄷㄹㄷ ㅁㄷㅇㅇ ㅇㅈㅁㅁㄹ ㅂㅈㅎ ㅂㅍㅈㅇㄱ ㅊㅂㅎ ㅅㄷㅇ ㅁㄹㄷㅇ ㅇㅈ ㅇㅇ. ㅇㄹㅎ ㅅㅎㅇㅅㄷ ㅁㅅㅇㅇ ㅁㄷㅇㅇ ㅅㅇㄱㅇㅈㄷㄱㄹ ㅁㅊ ㅈ ㄱㅇㄹ ㅁㄱ ㅈㄷㄱㅇ ㅈㄱㅎ. ㄸㄹㅅ ㅈㄷㄱㅇ ㅈㄱㄷ ㄷㄱㅂㅌㄴ ㅁㄷㅇㅇ ㅁㅅㅇㅇ ㅈㅅㅂㅈㅇ ㅎㄹㅎㄴ ㅅㅇㄱㄱㄱ ㄷㅅㅈ ㄱㄱㅇ ㅈㅎㅈ, ㅂㅈㅈ ㄴㅇㅇ ㄷ. ㅇㄹㅎ ㅅㅇㄱㄱㅇ ㅇㄴ ㅁㄷㅇㅇ ㅁㅅㅇㅇ ㅅㅇㄱ ㅊㄷ ㅅㅁㄹ ㅊㄹㅎㄴ ㅈㄹㅅ ㅂㅇㅈㅇㅅ ㅁㅎㄴ ㅌㅇㅇ ㅅㅁㄹ ㅊㄹㅎㄴ ㅈㅇ ㅎㄷㅎㄱ ㄷ. ㄴㅇㄱ ㄱㄹㅎ ㅈㅇㅇ ㅇㄴ ㅁㄷㅇㅇ ㅁㅅㅇㅇㄱ ㅅㅇㄱㅇ ㅇㅈㅎㄱ ㅈㅇ ㄱㅇㄹ ㅈ3ㅈㅇㄱ ㅁㅈㅂㄷㅅㅇ ㅊㅂㅎㄴ ㅎㅇㄴ ㅁㅁㄱㅇㅅ ㅎㅇ ㅅㅇㅊㅅ ㄷㅇㅎ ㅎㅈ ㅇㅇㅇ ㅎ ㅎㅇㄹㅅ ㅂㅇㅈㅇㅅ ㅁㅎㄴ ㅇㅁㅇㅂㅎㅇㄹ ㅍㄱㅎ ㅅ ㅇㅇ 4) ㄷㅂㅇㅇ ㅇㄹㅈㅂㅌ ㅂㄷㅅ ㅇㅈㅁㅁ ㅅㄱㅇㅅ, ㅁㄷㅇㅇ ㅁㅅㅇ ㅇㅇㄹ ㅅㅇㄱㅇㅈㄷㄱㄹ ㅁㅊ ㄸㄲㅈ ㅎㄹㅎ ㅇㅁㄱ ㅇㄱ, ㅁㄷㅇㅇ ㅈㄷㄱㅇ ㅈㄱㅂㅇ ㅇㅎ ㅁㅈㅂㄷㅅㅇ ㅈ3ㅈㅇㄱ ㅇㅈㅇㄹ ㅇㄷㅎㅁ ㅂㅇㅈㄱ ㅅㄹㅎㄷㄱ ㅇㄱㄷㄱ ㅍㄱㅎㅇㄹㅆ ㄱㄹㅎ ㅍㄹㄹ ㅎㄹㅎㅇ ㅇㅇ. ㅇㄹㅎ ㅍㄹ ㅂㄹㄴ ㅂㄷㅅ ㅇㅈㅁㅁㄹ ㅇㅈㅎㄱ ㅁㅅㅇㅇ ㅂㅎㅎㄴ ㅇㅎㅇ ㅊㅅㅎ ㅅㅎㅎㅇ ㅇㄱ, ㅎㅈ ㅇㄹㅇ ㅂㄷㅅ ㅁㅁㄱㄹ ㅎㅅㅇ ㅂㅊㅇ ㅂㄷㄹㄷ ㅇㅈㅎ ㅌㄷㅎ. ㅇㄹㅎ ㅂㄹㄱ ㅂㄷㅅ ㄱㄹㅇ ㅇㄱ ㄸㄴ ㅎㄹㅇ ㅇㄱㅎㄴ ㄱㄷ ㅇㄴㄱ, ㅁㄷㅇㅇ ㄱㅇㅇ ㅈㅇㄹ ㄱㄷㅎㄱ ㅈㅎㅎㄷㄱ ㅂ ㅅㄷ ㅇㅇ. ㄸㄹㅅ ㄱㅈㅇ ㅍㄹㄴ ㅇㅈㄷㅇㅇ ㅎ","핵심키워드":["재산가치","소유권이전등기","이중매매","규범","임무위배행위","소유권","배임죄","이중","계약관계","신뢰위반","경제생활","목적부동산","대법원","형사법","의무","경제활동","보호","매수인","역할","매도인", 신탁자와 수탁자가 명의신탁약정을 맺고 이에 따라 수탁자가 당사자가 되어 명의신탁약정이 있다는 사실을 알지 못하는 소유자와 사이에서 부동산에 관한 매매계약을 체결한 후 그 매매계약에 기하여 당해 부동산의 소유권이전등기를 수탁자 명의로 경료한 경우에는 그 소유권이전등기에 의한 당해 부동산에 관한 물권변동은 유효하지만 신탁자와 수탁자 사이의 명의신탁약정은 무효이므로, 수탁자는 전소유자인 매도인뿐만 아니라 신탁자에 대한 관계에서도 유효하게 당해 부동산의 소유권을 취득한 것으로 보아야 하고, 따라서 그 수탁자는 타인의 재물을 보관하는 자라고 할 수 없음 위의 경우 수탁자가 신탁자에 대해 부담하는 부당이득 반환의무는 명의신탁약정의 무효로 인하여 수탁자가 신탁자에 대해 부담하는 통상의 채무에 불과할 뿐 아니라, 신탁자와 수탁자 간 무효인 명의신탁약정과 함께 이루어진 부동산 매입의 위임약정 역시 무효임. 수탁자가 신탁자와의 신임관계에 기해 신탁자를 위하여 신탁부동산을 관리한다거나 신탁자의 허락 없이 이를 처분해서는 아니되는 의무를 부담하는 등으로 타인의 사무를 처리하는 자의 지위에 있다고 볼 수 없음","힌트_첫어절":"부동산경매절차에서 부동산을 매수하려는 사람이","힌트_초성":"ㅂㄷㅅㄱㅁㅈㅊㅇㅅ ㅂㄷㅅㅇ ㅁㅅㅎㄹㄴ ㅅㄹㅇ ㅁㅅㄷㄱㅇ ㅈㅅㅇ ㅂㄷㅎㅁㅅ ㄷㄹ ㅅㄹㅇ ㅁㅇㄹ ㅁㄱㅎㄱㄱㅈㅇ ㅂㄱㄹ ㄱ ㅅㄹㄱ ㅇㅈㅎㅇ ㄸㄹ ㅁㄱㅎㄱㄱ ㅇㄹㅇㅈ ㄱㅇ ㄱㅁㅈㅊㅇㅅ ㅁㅅㅇㅇ ㅈㅇㅇ ㅅㄱ ㄷㄴ ㅅㄹㅇ ㅇㄷㄲㅈㄴ ㄱ ㅁㅇㅇㅇㅁㄹ ㄱㅁ ㅁㅈ ㅂㄷㅅㅇ ㅅㅇㄱㅇ ㅁㅅㄷㄱㅇ ㅅㅈㅈㅇㄹ ㅂㄷㅎ ㅅㄹㅇ ㄴㄱㅇㄱㅇ ㅅㄱㅇㅇ ㄱ ㅁㅇㅇㅇ ㅊㄷㅎ. ㅇ ㄱㅇ ㅁㅅㄷㄱㅇ ㅂㄷㅎ ㅅㄹㄱ ㅇㄹㅇ ㅂㄹㅈ ㅅㄹ ㅅㅇㅇㄴ ㅁㅇㅅㅌㄱㄱㄱ ㅅㄹㅎ ㄱㄹㄷ ㅂㄷㅅ ㅅㄱㄹㅈㅁㅇ ㄷㄱㅇ ㄱㅎ ㅂㄹ ㅈ2ㅈ ㅈ1ㅎ ㅁ ㅈ4ㅈㅇ ㄱㅈㅇ ㅇㅎㅁ, ㅅㅌㅈㅇ ㅅㅌㅈㄱ ㅁㅇㅅㅌㅇㅈㅇ ㅁㄱ ㅇㅇ ㄸㄹ ㅅㅌㅈㄱ ㄷㅅㅈㄱ ㄷㅇ ㅁㅇㅅㅌㅇㅈㅇ ㅇㄷㄴ ㅅㅅㅇ ㅇㅈ ㅁㅎㄴ ㅅㅇㅈㅇ ㅅㅇㅇㅅ ㅂㄷㅅㅇ ㄱㅎ ㅁㅁㄱㅇㅇ ㅊㄱㅎ ㅎ ㄱ ㅁㅁㄱㅇㅇ ㄱㅎㅇ ㄷㅎ ㅂㄷㅅㅇ ㅅㅇㄱㅇㅈㄷㄱㄹ ㅅㅌㅈ ㅁㅇㄹ ㄱㄹㅎ ㄱㅇㅇㄴ ㄱ ㅅㅇㄱㅇㅈㄷㄱㅇ ㅇㅎ ㄷㅎ ㅂㄷㅅㅇ ㄱㅎ ㅁㄱㅂㄷㅇ ㅇㅎㅎㅈㅁ ㅅㅌㅈㅇ ㅅㅌㅈ ㅅㅇㅇ ㅁㅇㅅㅌㅇㅈㅇ ㅁㅎㅇㅁㄹ, ㅅㅌㅈㄴ ㅈㅅㅇㅈㅇ ㅁㄷㅇㅃㅁ ㅇㄴㄹ ㅅㅌㅈㅇ ㄷㅎ ㄱㄱㅇㅅㄷ ㅇㅎㅎㄱ ㄷㅎ ㅂㄷㅅㅇ ㅅㅇㄱㅇ ㅊㄷㅎ ㄱㅇㄹ ㅂㅇㅇ ㅎㄱ, ㄸㄹㅅ ㄱ ㅅㅌㅈㄴ ㅌㅇㅇ ㅈㅁㅇ ㅂㄱㅎㄴ ㅈㄹㄱ ㅎ ㅅ ㅇㅇ ㅇㅇ ㄱㅇ ㅅㅌㅈㄱ ㅅㅌㅈㅇ ㄷㅎ ㅂㄷㅎㄴ ㅂㄷㅇㄷ ㅂㅎㅇㅁㄴ ㅁㅇㅅㅌㅇㅈㅇ ㅁㅎㄹ ㅇㅎㅇ ㅅㅌㅈㄱ ㅅㅌㅈㅇ ㄷㅎ ㅂㄷㅎㄴ ㅌㅅㅇ ㅊㅁㅇ ㅂㄱㅎ ㅃ ㅇㄴㄹ, ㅅㅌㅈㅇ ㅅㅌㅈ ㄱ ㅁㅎㅇ ㅁㅇㅅㅌㅇㅈㄱ ㅎㄲ ㅇㄹㅇㅈ ㅂㄷㅅ ㅁㅇㅇ ㅇㅇㅇㅈ ㅇㅅ ㅁㅎㅇ. ㅅㅌㅈㄱ ㅅㅌㅈㅇㅇ ㅅㅇㄱㄱㅇ ㄱㅎ ㅅㅌㅈㄹ ㅇㅎㅇ ㅅㅌㅂㄷㅅㅇ ㄱㄹㅎㄷㄱㄴ ㅅㅌㅈㅇ ㅎㄹ ㅇㅇ ㅇㄹ ㅊㅂㅎㅅㄴ ㅇㄴㄷㄴ ㅇㅁㄹ ㅂㄷㅎㄴ ㄷㅇㄹ ㅌㅇㅇ ㅅㅁㄹ ㅊㄹㅎㄴ ㅈㅇ ㅈㅇㅇ ㅇㄷㄱ ㅂ ㅅ ㅇㅇ","핵심키워드":["부동산경매절차","매각허가결정","명의신탁약정","반환의무","소유권이전등기","경매절차","소유권","명의신탁관계","실권리자명의","의무","매수대금","전소유자","위임약정","매수인","신탁부동산","매도인","지위","물권변동","부당이득","경매","명의인","부동산","소유자","보관","사무","신탁자","법률","유효","매매계약","재물","무효","부담","관리","수탁자","처리","신임관계","규정","취득","성립"],"빈칸":{"1":[[0,7],[10,13],[25,29],[52,58],[92,96],[99,102],[104,106],[126,129],[133,135],[139,142],[144,147],[149,153],[182,185],[197,201],[227,233],[243,246],[247,253],[288,291],[298,304],[328,334],[351,354],[361,364],[396,399],[401,408],[429,436],[444,447],[452,456],[464,467],[477,48 의신탁 약정을 맺고 명의수탁자가 당사자가 되어 명의신탁 약정이 있다는 사실을 알고 있는 소유자와 부동산에 관한 매매계약을 체결한 후 그 매매계약에 따라 당해 부동산의 소유권이전등기를 명의수탁자 명의로 마친 경우에는 부동산 실권리자명의 등기에 관한 법률(부동산실명법) 제4조 제2항 본문에 의하여 수탁자 명의의 소유권이전등기는 무효이고 당해 부동산의 소유권은 매도인이 그대로 보유하게 되므로, 명의수탁자는 부동산 취득을 위한 계약의 당사자도 아닌 명의신탁자에 대한 관계에서 횡령죄에서의 타인의 재물을 보관하는 자의 지위에 있다고 볼 수 없고, 또한 명의수탁자가 명의신탁자에 대하여 매매대금 등을 부당이득으로서 반환할 의무를 부담한다고 하더라도 이를 두고 배임죄에서의 타인의 사무를 처리하는 자의 지위에 있다고 보기도 어려움 한편 위 경우 말소등기의무의 존재나 명의수탁자에 의한 유효한 처분가능성을 들어 명의수탁자가 매도인에 대한 관계에서 횡령죄에서의 타인의 재물을 보관하는 자 또는 배임죄에서의 타인의 사무를 처리하는 자의 지위에 있다고 볼 수도 없음","힌트_첫어절":"명의신탁자와 명의수탁자가 이른바 계약명의신탁","힌트_초성":"ㅁㅇㅅㅌㅈㅇ ㅁㅇㅅㅌㅈㄱ ㅇㄹㅂ ㄱㅇㅁㅇㅅㅌ ㅇㅈㅇ ㅁㄱ ㅁㅇㅅㅌㅈㄱ ㄷㅅㅈㄱ ㄷㅇ ㅁㅇㅅㅌ ㅇㅈㅇ ㅇㄷㄴ ㅅㅅㅇ ㅇㄱ ㅇㄴ ㅅㅇㅈㅇ ㅂㄷㅅㅇ ㄱㅎ ㅁㅁㄱㅇㅇ ㅊㄱㅎ ㅎ ㄱ ㅁㅁㄱㅇㅇ ㄸㄹ ㄷㅎ ㅂㄷㅅㅇ ㅅㅇㄱㅇㅈㄷㄱㄹ ㅁㅇㅅㅌㅈ ㅁㅇㄹ ㅁㅊ ㄱㅇㅇㄴ ㅂㄷㅅ ㅅㄱㄹㅈㅁㅇ ㄷㄱㅇ ㄱㅎ ㅂㄹ(ㅂㄷㅅㅅㅁㅂ) ㅈ4ㅈ ㅈ2ㅎ ㅂㅁㅇ ㅇㅎㅇ ㅅㅌㅈ ㅁㅇㅇ ㅅㅇㄱㅇㅈㄷㄱㄴ ㅁㅎㅇㄱ ㄷㅎ ㅂㄷㅅㅇ ㅅㅇㄱㅇ ㅁㄷㅇㅇ ㄱㄷㄹ ㅂㅇㅎㄱ ㄷㅁㄹ, ㅁㅇㅅㅌㅈㄴ ㅂㄷㅅ ㅊㄷㅇ ㅇㅎ ㄱㅇㅇ ㄷㅅㅈㄷ ㅇㄴ ㅁㅇㅅㅌㅈㅇ ㄷㅎ ㄱㄱㅇㅅ ㅎㄹㅈㅇㅅㅇ ㅌㅇㅇ ㅈㅁㅇ ㅂㄱㅎㄴ ㅈㅇ ㅈㅇㅇ ㅇㄷㄱ ㅂ ㅅ ㅇㄱ, ㄸㅎ ㅁㅇㅅㅌㅈㄱ ㅁㅇㅅㅌㅈㅇ ㄷㅎㅇ ㅁㅁㄷㄱ ㄷㅇ ㅂㄷㅇㄷㅇㄹㅅ ㅂㅎㅎ ㅇㅁㄹ ㅂㄷㅎㄷㄱ ㅎㄷㄹㄷ ㅇㄹ ㄷㄱ ㅂㅇㅈㅇㅅㅇ ㅌㅇㅇ ㅅㅁㄹ ㅊㄹㅎㄴ ㅈㅇ ㅈㅇㅇ ㅇㄷㄱ ㅂㄱㄷ ㅇㄹㅇ ㅎㅍ ㅇ ㄱㅇ ㅁㅅㄷㄱㅇㅁㅇ ㅈㅈㄴ ㅁㅇㅅㅌㅈㅇ ㅇㅎ ㅇㅎㅎ ㅊㅂㄱㄴㅅㅇ ㄷㅇ ㅁㅇㅅㅌㅈㄱ ㅁㄷㅇㅇ ㄷㅎ ㄱㄱㅇㅅ ㅎㄹㅈㅇㅅㅇ ㅌㅇㅇ ㅈㅁㅇ ㅂㄱㅎㄴ ㅈ ㄸㄴ ㅂㅇㅈㅇㅅㅇ ㅌㅇㅇ ㅅㅁㄹ ㅊㄹㅎㄴ ㅈㅇ ㅈㅇㅇ ㅇㄷㄱ ㅂ ㅅㄷ ㅇㅇ","핵심키워드":["계약명의신탁","법률(부동산실명법)","명의신탁","말소등기의무","소유권이전등기","명의수탁자","소유권","배임죄","횡령죄","실권리자명의","처분가능성","의무","약정","매도인","지위","부당이득","부동산","소유자","보관","본문","명의신탁자","매매대금","무효","어려움","사무","유효","매매계약","재물","취득","반환","존재","부담","수탁자","처리"],"빈칸":{"1":[[0,5],[7,12],[18,24],[25,27],[32,37],[47,51],[52,54],[70,73],[75,78],[109,112],[114,121],[123,128],[141,144],[145,151],[159,169],[178,180],[194,201],[203,205],[211,214],[216,219],[221,224],[240,245],[247,250],[270,275],[285,288],[300,302],[308,310],[327,332],[334,339],[345,349],[353,357],[365,367],[386,389],[397,399],[409,411],[421,424],[433,439],[445,450],[455,457],[459,464],[469,474],[476,479],[489,492],[504,506],[514,517],[525,527],[537,539]],"2":[[0,5],[7,12],[18,24],[25,27],[32,37],[39,42],[47,51],[52,54],[70,73],[75,78],[83,87],[89,91],[97,101],[109,112],[114,121],[123,128],[141,144],[145,151],[152,154],[159,169], const Engine = (() => {
  const CHO = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
  const JUNG = [...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
  const JONG = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
  const VOWEL_COMP = {'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
  const JONG_COMP = {'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};

     채점에서 따지지 않는다. */
  const TAIL = /(으로부터|로부터|으로써|으로서|에게서|에서는|이라고|로써|로서|으로|에게|에서|까지|부터|이란|라고|이나|은|는|이|가|을|를|의|에|와|과|도|로|만|나|란)$/;
  const dropTail = s => { const m = s.match(TAIL); return m && s.length - m[0].length >= 2 ? s.slice(0, -m[0].length) : s; };
  function answerMatches(input, answer){
    const a = normalize(input), b = normalize(answer);
    if (!a) return false;
    if (a === b) return true;
    if (dropTail(a) === dropTail(b)) return true;
    // 여기까지 실패했을 때만 '제'를 지우고 한 번 더 — 가산적이라 통과하던 답을 막지 않는다
    if (!CITE_JE.test(input) && !CITE_JE.test(answer)) return false;
    const x = normalize(dropJe(input)), y = normalize(dropJe(answer));
    return x === y || dropTail(x) === dropTail(y);
  }

  function levenshtein(a, b){
    const n = a.length, m = b.length;
    if (!n) return m;
    if (!m) return n;
    let prev = new Uint32Array(m+1), cur = new Uint32Array(m+1);
    for (let j = 0; j <= m; j++) prev[j] = j;
    for (let i = 1; i <= n; i++){
      cur[0] = i;
      const ai = a[i-1];
      for (let j = 1; j <= m; j++)
        cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (ai === b[j-1] ? 0 : 1));
      const t = prev; prev = cur; cur = t;
    }
    return prev[m];
  }
  // 채점에서 무시할 것: 공백·문장부호 (내용이 아니라 표기 차이)
  const forCompare = s => String(s).normalize('NFC').replace(/[\s,.·ㆍ、:;()\[\]{}'"“”‘’「」『』]/g, '');

  /** 원문 대비 유사도 0~1 (자모 단위 편집거리) */
  function similarity(input, answer){
    const a = jamoSeq(forCompare(input)).join('');
    const b = jamoSeq(forCompare(answer)).join('');
    if (!b.length) return a.length ? 0 : 1;
    return Math.max(0, 1 - levenshtein(a, b) / b.length);
  }

  /* 틀리면 안 되는 토큰: 조문·수치 (법리의 정확성을 좌우한다).
     '제'를 선택으로 둔다 — 형재실은 '형소법 254조 4항'처럼 제 없이 쓴 인용이 39곳 있는데,
     예전 정규식은 그것을 아예 못 잡아 **번호를 틀려도 그냥 통과**했다. */
  const CRITICAL_RE = /제?\s?\d+조(?:의\s?\d+)?(?:\s*제?\s?\d+항)?(?:\s*제?\s?\d+호)?|\d+분의\s?\d+|\d+개월|\d+년|\d+일|\d+만원/g;
  const criticalTokens = ans => [...new Set((String(ans).match(CRITICAL_RE) || []).map(s => s.replace(/\s+/g,'')))];

  /** 서술 채점: 자모 유사도 + 핵심 토큰 정확일치의 2단 판정 */
  function gradeText(input, answer){
    let sim = similarity(input, answer);
    const need = answer.length <= 60 ? 0.95 : answer.length <= 200 ? 0.90 : 0.86;
    const hasCite = CITE_JE.test(input) || CITE_JE.test(answer);
    /* '제'를 뺀 입력은 조문 하나당 자모 2개씩 깎인다. 60자 이하 카드는 통과선이 95%라
       인용 두 개만 빼도 여유의 절반을 먹는다. 통과선에 못 미칠 때만 제-무시로 다시 재고
       높은 쪽을 쓴다 — 점수가 내려가는 경우는 없다. */
    if (hasCite && sim < need) sim = Math.max(sim, similarity(dropJe(input), dropJe(answer)));
    const crit = criticalTokens(answer);
    // 토큰 대조도 '제'를 지운 뒤에 한다 (번호·단위는 그대로 따진다)
    const typed = forCompare(dropJe(input));
    const missed = crit.filter(t => !typed.includes(forCompare(dropJe(t))));
    return { sim, pct: Math.round(sim*100), need: Math.round(need*100),
             critical: crit, missed, pass: sim >= need && missed.length === 0 };
  }

  /* 문장 분리 — 법률문 종결(…음. …함. …다.) 뒤에서만 자르고,
     그래도 안 쪼개지면 절 경계(쉼표 뒤)에서 나눈다. 기존 앱은 종결어미
     정규식에만 기대 2,709장 중 94장(3.5%)만 실제로 쪼개졌다. */
  function splitSentences(text, maxLen = 150){
    let parts = String(text).split(/(?<=[다함음됨임)\]'"])\.\s+/).map((s,i,a) => (i < a.length-1 ? s + '.' : s));
    parts = parts.map(s => s.trim()).filter(Boolean);
    const out = [];
    for (const p of parts) out.push(...splitClauses(p, maxLen));
    return out.length ? out : [String(text).trim()];
  }
  function splitClauses(text, maxLen = 150){
    if (text.length <= maxLen) return [text];
    const depth = new Array(text.length).fill(0);
    let d = 0;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if ('([{'.includes(c)) d++;
      depth[i] = d;
      if (')]}'.includes(c)) d = Math.max(0, d-1);
    }
    const marks = [];
    const re = /,\s+/g; let m;
    while ((m = re.exec(text))) { const at = m.index + m[0].length;
      if (at > 0 && at < text.length && depth[m.index] === 0) marks.push(at); }
    if (!marks.length) return [text];
    const out = []; let start = 0, last = 0;
    for (const at of marks){
      if (at - start > maxLen){ const cut = last > start ? last : at; out.push(text.slice(start, cut).trim()); start = cut; }
      last = at;
    }
    out.push(text.slice(start).trim());
    return out.filter(Boolean);
  }

  /* LCS 문자 diff — 공통 접두/접미를 먼저 잘라낸다 */
  function diff(a, b){
    a = String(a); b = String(b);
    if (!a.length) return [...b].map(c => ['pend', c]);
    let p = 0; const lim = Math.min(a.length, b.length);
    while (p < lim && a[p] === b[p]) p++;
    let s = 0;
    while (s < lim - p && a[a.length-1-s] === b[b.length-1-s]) s++;
    const head = [...a.slice(0,p)].map(c => ['ok', c]);
    const tail = [...a.slice(a.length-s)].map(c => ['ok', c]);
    const A = a.slice(p, a.length-s), B = b.slice(p, b.length-s);
    if (A.length * B.length > 360000){
      const mid = [], L = Math.max(A.length, B.length);
      for (let i = 0; i < L; i++){
        if (i < A.length && i < B.length) mid.push([A[i] === B[i] ? 'ok' : 'bad', A[i]]);
        else if (i < A.length) mid.push(['bad', A[i]]);
        else mid.push(['miss', B[i]]);
      }
      return head.concat(mid, tail);
    }
    return head.concat(lcs(A, B), tail);
  }
  function lcs(a, b){
    const n = a.length, m = b.length;
    if (!n) return [...b].map(c => ['miss', c]);
    if (!m) return [...a].map(c => ['bad', c]);
    const W = m+1, dp = new Uint32Array((n+1)*W);
    for (let i = n-1; i >= 0; i--) for (let j = m-1; j >= 0; j--)
      dp[i*W+j] = a[i] === b[j] ? dp[(i+1)*W+j+1]+1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m){
      if (a[i] === b[j]) { out.push(['ok', b[j]]); i++; j++; }
      else if (dp[(i+1)*W+j] >= dp[i*W+j+1]) { out.push(['bad', a[i]]); i++; }
      else { out.push(['miss', b[j]]); j++; }
    }
    while (i < n) out.push(['bad', a[i++]]);
    while (j < m) out.push(['miss', b[j++]]);
    return out;
  }

  return { units, strokesOf, jamoSeq, chosung, normalize, answerMatches,
           levenshtein, similarity, criticalTokens, gradeText,
           splitSentences, splitClauses, diff };
})();

const FILTER_IDS = ['fTop','fMid','fTag','fStar','fType','fLen','fRep','fShuffle','fSeq','fLive',
                    'fSent','fWrap','fStrict','fNoBopri','fNeg','fNoTheory','fDue','fJe',

/* ── 조문 '제' 표시 ────────────────────────────────────────
   데이터는 언제나 정식 표기('제312조')로 저장한다 — build 의 canonJe 가 보장한다.
   '빼고' 모드는 화면에 내보내기 직전에만 지운다. 저장된 본문은 건드리지 않는다.
   채점은 이 설정과 무관하게 늘 '제'를 따지지 않으므로, 어느 쪽으로 쳐도 정답이다.

   빈칸은 본문에 대한 좌표라 글자를 지우면 함께 옮겨야 한다. jeView 가 지운 위치를
   기억했다가 좌표를 당겨 준다 — p 앞에서 지워진 개수만큼 빼면 된다. */
const JE_RE = /제(?=\s?\d+\s?(?:조|항|호|목))/g;
const jeOff = () => { const el = $('#fJe'); return !!el && el.value === 'off'; };
const jeText = s => jeOff() ? String(s ?? '').replace(JE_RE, '') : (s ?? '');
function jeViewFor(body){
  const t = String(body ?? '');
  if (!jeOff()) return { text: t, at: p => p };
  const cut = [];
  JE_RE.lastIndex = 0;
  for (let m; (m = JE_RE.exec(t)); ) cut.push(m.index);
  if (!cut.length) return { text: t, at: p => p };
  let text = '', prev = 0;
  for (const i of cut){ text += t.slice(prev, i); prev = i + 1; }
  text += t.slice(prev);
  return { text, at: p => { let k = 0; while (k < cut.length && cut[k] < p) k++; return p - k; } };
}
function snapshot(){
  const f = {};
  FILTER_IDS.forEach(id => { const el = $('#'+id); if (el) f[id] = el.type === 'checkbox' ? el.checked : el.value; });
  return { v:2, at:new Date().toISOString(), wrong:[...P.wrong], drill:P.drill,
           pos, stage:STAGE, settings:P.settings, filters:f };
}
function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(snapshot()));
    const mastered = Object.values(P.drill).filter(d => d.best >= 100 || d.stage >= 4).length;
    const tried = Object.keys(P.drill).length;
    $('#saveInfo').textContent = `저장됨 · 채점한 카드 ${tried} · 오답 ${P.wrong.size}` + (mastered ? ` · 4단계 통과 ${mastered}` : '');
  }catch(e){}
}
function restore(obj){
  if (!obj) return;
  (obj.wrong || []).forEach(x => P.wrong.add(x));
  if (obj.drill) P.drill = obj.drill;
  if (obj.settings) Object.assign(P.settings, obj.settings);
  if (obj.stage) STAGE = obj.stage;
  if (typeof obj.pos === 'number') P.pos = obj.pos;
  if (obj.filters){
    const f = obj.filters;
    const top = $('#fTop'); if (top && f.fTop !== undefined) top.value = f.fTop;
    refreshMid();
    FILTER_IDS.forEach(id => { const el = $('#'+id); if (!el || f[id] === undefined) return;
      if (el.type === 'checkbox') el.checked = f[id]; else el.value = f[id]; });
  }
}

/* 채점 결과 기록 — 통과하면 오답에서 지우고 다음 복습일을 밀어낸다.
   '화면에 떴다'가 아니라 '실제로 채점했다'만 집계한다. */
function record(card, pass, acc, stage){
  const id = card.카드ID;
  const d = P.drill[id] = P.drill[id] || { best:0, n:0, stage:0 };
  d.n++; d.best = Math.max(d.best, acc);
  if (pass){ P.wrong.delete(id); d.stage = Math.max(d.stage, stage); }
  else P.wrong.add(id);
  d.due = dueAt(pass ? Math.min(d.stage, 5) : 0);
  save(); refreshDueCount();
}
const isDue = id => { const d = P.drill[id]; return !d || d.due == null || d.due <= Date.now(); };
function refreshDueCount(){
  const n = DATA.filter(c => P.drill[c.카드ID] && isDue(c.카드ID)).length;
  const el = $('#dueN'); if (el) el.textContent = n;
}

/* ── 사례번호 구간 (형재실 전용) ──────────────────────────
   숫자는 링판 원본에 **인쇄된** 사례번호 1~185 다 (`c.링판번호`). 판례ID 순번이
   아니다 — 원본에 '중복' 표지만 있는 행 6 개(27·39·129·130·138·153)가 번호를
   먹기 때문에 판례ID 를 그대로 쓰면 27번부터 최대 6칸 어긋난다.
   세는 단위가 판례라서 **구간 폭과 카드 수는 일치하지 않는다** (판례당 1~6장).
   입력칸이 없는 나머지 네 앱에서는 null 을 돌려 필터가 통째로 빠진다. */
const CASE_MAX = +CFG.caseMax || 0;
const CASE_DUP = CFG.caseDup || {};
const CASE_HAS = new Set(DATA.map(c => c.링판번호).filter(Boolean));
/* 학습범위를 정하는 방식은 '목차별'(대분류·중분류) 과 '사례번호' 둘 중 하나다.
   둘을 겹쳐 걸 수도 있게 두면 화면만 보고 무엇이 범위를 정하는지 알 수 없어
   0장이 되는 이유를 짐작할 수 없다. 그래서 고른 쪽만 살리고 나머지는 끈다.
   스위치가 없는 나머지 네 앱은 언제나 'toc' 다. */
const scopeOf = () => { const el = $('#fScope'); return el ? el.value : 'toc'; };
function syncScopeUI(){
  if (!$('#fScope')) return;
  const sc = scopeOf();
  document.querySelectorAll('.grp[data-scope]').forEach(g => {
    const on = g.dataset.scope === sc;
    g.classList.toggle('on', on); g.classList.toggle('off', !on);
    g.querySelectorAll('select,input').forEach(el => { el.disabled = !on; });
  });
  document.querySelectorAll('#scp button').forEach(b => b.classList.toggle('on', b.dataset.scope === sc));
}

function caseRange(){
  const a = $('#fCaseFrom'), b = $('#fCaseTo');
  if (!a || !b || !CASE_MAX || scopeOf() !== 'case') return null;
  const cl = (v, d) => { const n = Math.round(+v);
    return Number.isFinite(n) && n > 0 ? Math.min(Math.max(n, 1), CASE_MAX) : d; };
  let lo = cl(a.value, 1), hi = cl(b.value, CASE_MAX);
  if (lo > hi) [lo, hi] = [hi, lo];            // 거꾸로 넣으면 뒤집어 읽는다
  return { lo, hi, all: lo === 1 && hi === CASE_MAX };
}

/** 지금 화면의 필터를 그대로 담은 술어. build() 와 카드 수 표시가 같은 것을 쓴다. */
function deckFilter(){
  const t = $('#fTop').value, m = $('#fMid').value, tg = $('#fTag').value,
        st = +$('#fStar').value || 0, len = +$('#fLen').value || 9999, rep = $('#fRep').checked;
  const ty = $('#fType') ? $('#fType').value : '',
        nb = $('#fNoBopri') ? $('#fNoBopri').checked : false,
        neg = $('#fNeg').checked, nth = $('#fNoTheory').checked, due = $('#fDue').checked;
  const cr = caseRange();
  const toc = scopeOf() !== 'case';      // 사례번호 모드에서는 대분류·중분류를 보지 않는다
  const tagOf = c => Array.isArray(c[CFG.tagField]) ? c[CFG.tagField] : [c[CFG.tagField]].filter(Boolean);
  return c =>
    (!toc || ((!t || c.대분류 === t) && (!m || c.중분류 === m))) && (!tg || tagOf(c).includes(tg)) &&
    (c.중요도 || 0) >= st && c.법리원문.length <= len && (!rep || c.그룹대표 !== 'N') &&
    (!ty || c.유형 === ty) && (!nb || !c.기암기) && (!neg || c.불성립 === 'Y') && (!nth || c.학설 !== 'Y') &&
    (!due || (P.drill[c.카드ID] && isDue(c.카드ID))) &&
    (!cr || (c.링판번호 >= cr.lo && c.링판번호 <= cr.hi));
}

/* 구간 옆에 '몇 장인지' 와 '카드가 없는 번호' 를 적어 준다.
   번호와 카드 수가 다르다는 것을 사용자가 눈으로 확인할 수 있는 유일한 자리다. */
function refreshCaseInfo(){
  if (!$('#fCaseFrom')) return;
  const cr = caseRange();
  if (!cr) { $('#caseN').textContent = ''; $('#caseNote').textContent = ''; return; }
  const n = DATA.filter(deckFilter()).length;
  $('#caseN').textContent = n + '장';
  const gaps = [];
  for (let no = cr.lo; no <= cr.hi; no++){
    if (CASE_HAS.has(no)) continue;
    gaps.push(CASE_DUP[no] ? no + '→' + CASE_DUP[no] : no + '(원문 없음)');
  }
  $('#caseNote').textContent = gaps.length
    ? '카드 없는 번호 ' + gaps.join(' · ') + (gaps.some(g => g.includes('→')) ? ' (→ 는 원본 중복)' : '')
    : '';
}

/** 0장일 때 무엇이 좁히고 있는지 밝혀 준다 (필터를 마음대로 되돌리지는 않는다). */
function emptyWhy(){
  const why = [];
  const cr = caseRange();
  const toc = scopeOf() !== 'case';
  if (cr && !cr.all) why.push(`사례 ${cr.lo}~${cr.hi}`);
  const t = $('#fTop').value, m = $('#fMid').value, tg = $('#fTag').value, st = +$('#fStar').value || 0;
  if (toc && t) why.push(`대분류 = ${t}`);
  if (toc && m) why.push(`중분류 = ${m}`);
  if (tg) why.push(`태그 = ${tg}`);
  if (st) why.push(`중요도 ${st} 이상`);
  if ($('#fDue').checked) why.push('오늘 복습할 카드만');
  if ($('#fNeg').checked) why.push('불성립만');
  if ($('#fNoTheory').checked) why.push('학설 제외');
  const len = +$('#fLen').value || 0;
  if (len && len < 2000) why.push(`글자수 ≤ ${len}`);
  return why;
}

function build(fromWrong, keepPos){
  syncScopeUI();
  let list = DATA.filter(deckFilter());
  const due = $('#fDue').checked;
  if (fromWrong) list = list.filter(c => P.wrong.has(c.카드ID));
  if (due) list.sort((a,b) => (P.drill[a.카드ID].due || 0) - (P.drill[b.카드ID].due || 0));
  else if ($('#fShuffle').checked) list = list.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]);
  queue = list;
  pos = keepPos && P.pos < list.length ? P.pos : 0;
  seqStage = $('#fSeq').checked ? 1 : STAGE;
  lastPos = -1;
  memoStat = { done:0, acc:[], chars:0, ms:0 };
  tStat = { keys:0, ms:0, typed:0, ok:0, err:0, started:0 };
  refreshCaseInfo();
  render();
}
/* 범위 방식을 바꾸는 것은 필터 하나를 고치는 것이 아니라 무엇으로 범위를 정할지
   갈아타는 일이라, 탭처럼 그 자리에서 덱을 다시 만든다 (화면이 거짓말을 하지 않도록). */
document.querySelectorAll('#scp button').forEach(b => b.onclick = () => {
  if (scopeOf() === b.dataset.scope) return;
  $('#fScope').value = b.dataset.scope;
  syncScopeUI(); build(false);
  toast(b.dataset.scope === 'case' ? '사례번호로 범위를 정합니다' : '목차로 범위를 정합니다');
});
/* 구간·카드 수는 '적용'을 누르기 전에도 손대는 즉시 다시 센다. 덱은 건드리지 않는다. */
if ($('#fCaseFrom')) document.querySelector('.bar').addEventListener('input', refreshCaseInfo);
if ($('#fCaseFrom')) document.querySelector('.bar').addEventListener('change', refreshCaseInfo);
$('#apply').onclick = () => build(false);
$('#wrongOnly').onclick = () => { if (P.wrong.size) build(true); else toast('오답이 없습니다'); };
$('#fDue').onchange = () => build(false);
/* 조문 '제' 표시를 바꾸면 화면만 다시 그린다 (큐·진도는 그대로) */
$('#fJe').onchange = () => { save(); lastPos = -1; render(); };

/* =====================================================================
   라우터 · 카드 머리
   ===================================================================== */
function render(){
  const stage = $('#stage');
  if (!queue.length){
    bindKey(null);
    const why = emptyWhy();
    stage.innerHTML = '<div class="card empty">조건에 맞는 카드가 없습니다'
      + (why.length ? ' — ' + esc(why.join(' · ')) : '') + '. 필터를 완화해 보세요.</div>';
    return;
  }
  if (pos >= queue.length){
    bindKey(null);
    stage.innerHTML = MODE === 'memo' ? memoSummary() : typeSummary();
    const a = $('#again'), w = $('#againWrong');
    if (a) a.onclick = () => build(false);
    if (w) w.onclick = () => { if (P.wrong.size) build(true); };
    return;
  }
  P.pos = pos; save();
  MODE === 'memo' ? renderMemo() : renderType();
}

/* 뱃지는 문자열 replace 로 끼워넣지 않고 템플릿 안에서 조건부로 만든다.
   (지침 P2-4 — h.replace('</div>', …) 가 첫 번째 </div> 를 치환해 뱃지가
   경로 줄 끝에 붙던 버그. 값이 빈 칩은 아예 렌더하지 않는다.) */
function head(c){
  const d = P.drill[c.카드ID];
  const tags = Array.isArray(c[CFG.tagField]) ? c[CFG.tagField] : [c[CFG.tagField]].filter(Boolean);
  const chips = [];
  if (c.링판번호) chips.push(`<span class="chip y" title="링판정리본에 인쇄된 사례번호">링판 №${c.링판번호}</span>`);
  if (c.사건번호) chips.push(`<span class="chip b">${esc(c.사건번호)}</span>`);
  tags.forEach(t => t && chips.push(`<span class="chip">${esc(t)}</span>`));
  if (c.기출) chips.push(`<span class="chip o">기출 ${esc(c.기출)}</span>`);
  if (c.중요도) chips.push(`<span class="chip g">${stars(c.중요도)}</span>`);
  if (c.유형) chips.push(`<span class="chip o">${esc(c.유형)}</span>`);
  if (c.불성립 === 'Y') chips.push(`<span class="chip r">불성립</span>`);
  if (c.학설 === 'Y') chips.push(`<span class="chip o">학설</span>`);
  if (c.총단락수 > 1) chips.push(`<span class="chip">법리 ${c.단락순번}/${c.총단락수}단락</span>`);
  if (c.중복그룹) chips.push(`<span class="chip y">중복 ${esc(c.중복그룹)}${c.그룹대표 === 'Y' ? ' 대표' : ''}</span>`);
  if (c.기암기) chips.push(`<span class="chip y" title="${esc(c.기암기카드)}">${esc(c.기암기)}</span>`);
  if (c.면) chips.push(`<span class="chip">${esc(c.면)}면</span>`);
  chips.push(`<span class="chip">${jeText(c.법리원문).length}자</span>`);
  if (d) chips.push(`<span class="chip ${d.best >= 86 ? 'g' : ''}">최고 ${d.best}% · ${d.n}회</span>`);
  return `<div class="bread">${esc(jeText(c.발문 || [c.대분류,c.중분류,c.소분류].filter(Boolean).join(' > ')))}</div>
    <div class="issue">${esc(c.쟁점 || c.중분류 || '')}</div>
    <div class="meta">${chips.join('')}</div>`;
}

/* 발문 — '사실관계' 라는 거짓 라벨을 붙이지 않는다. 목차 경로가 곧 발문이고
   실제 사실관계가 따로 있을 때만 사실관계로 보여준다 (지침 P2-3). */
function promptBlock(c){
  let h = `<div class="factlabel">이 목차를 보고 법리를 쓰세요</div>
    <div class="prompt">${esc(jeText(c.발문 || [c.대분류,c.중분류,c.소분류].filter(Boolean).join(' > ')))}</div>`;
  if (c.사실관계) h += `<div class="factlabel" style="margin-top:10px">사실관계</div>
    <div class="fact">${esc(c.사실관계)}</div>`;
  if (c.소제목) h += `<div class="factlabel" style="margin-top:10px">소주제 · ${esc(c.소제목)}</div>`;
  return h;
}
function extras(c){
  let h = '';
  if (c.핵심키워드 && c.핵심키워드.length)
    h += `<details class="more"><summary>핵심키워드 ${c.핵심키워드.length}개 보기</summary>
      <div class="kwlist">${c.핵심키워드.map(k => `<span class="chip o">${esc(k)}</span>`).join('')}</div></details>`;
  if (c.기재례)
    h += `<details class="more"><summary>기재례 (실제 답안 작성례) 보기</summary>
      <div class="body">${esc(jeText(c.기재례)).replace(/\s\/\s/g, '\n')}</div></details>`;
  if (c.유사법리)
    h += `<div class="rel"><b>비교할 유사 법리</b> · ${linkCards(c.유사법리)}</div>`;
  return h;
}
function linkCards(s){
  return String(s).split(/[,\s]*[·,]\s*/).filter(Boolean).map(t => {
    const i = DATA.findIndex(c => c.카드ID === t.trim() || c.판례ID === t.trim() || c.사건번호 === t.trim());
    return i >= 0 ? `<a href="#" data-jump="${i}">${esc(t)}</a>` : esc(t);
  }).join(' · ');
}
function bindJumps(){
  document.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => {
    e.preventDefault();
    const card = DATA[+a.dataset.jump];
    const at = queue.findIndex(c => c.카드ID === card.카드ID);
    if (at >= 0){ pos = at; lastPos = -1; render(); }
    else { queue = [...queue.slice(0, pos+1), card, ...queue.slice(pos+1)]; pos++; lastPos = -1; render(); }
  });
}

/* =====================================================================
   암기 모드
   ===================================================================== */
const STAGE_NAME = {1:'1단계 · 핵심 키워드 채우기', 2:'2단계 · 핵심 표현 채우기',
                    3:'3단계 · 핵심 문장 채우기', 4:'4단계 · 전문 작성'};
function renderMemo(){
  if (pos !== lastPos){ lastPos = pos; if ($('#fSeq').checked) seqStage = 1; resetHint(); }
  syncModeUI();
  return curStage() === 4 ? renderFull() : renderCloze();
}

/* ---- 1~3단계 : 빈칸 ---- */
function renderCloze(){
  const c = queue[pos], lv = String(curStage());
  const spans = (c.빈칸 && c.빈칸[lv] && c.빈칸[lv].length) ? c.빈칸[lv] : null;
  if (!spans){ STAGE = 4; seqStage = 4; syncModeUI(); toast('이 카드는 빈칸이 없어 전문 작성으로 넘어갑니다'); return renderFull(); }
  const jv = jeViewFor(c.법리원문);
  const t = jv.text;
  let body = '', last = 0;
  const vspans = spans.map(([s,e]) => [jv.at(s), jv.at(e)]);   // '제'를 뺀 좌표
  vspans.forEach(([s,e], i) => {
    body += esc(t.slice(last, s));
    const ans = t.slice(s, e), big = ans.length > 60;
    /* 플레이스홀더에서 글자 수를 지운다 — 칸 폭도 답 길이에 비례시키지
       않는다. 둘 다 상시 노출되던 힌트였다 (지침 P2-2). */
    body += `<span class="bl${big ? ' big' : ''}" contenteditable="true" spellcheck="false" tabindex="0"`
          + ` data-i="${i}" data-ans="${esc(ans).replace(/"/g,'&quot;')}" data-ph="____"></span>`;
    last = e;
  });
  body += esc(t.slice(last));
  const blanked = vspans.reduce((a,[s,e]) => a+e-s, 0);
  $('#stage').innerHTML = `
  <div class="card">
    ${head(c)}
    ${promptBlock(c)}
    <div class="prog"><i id="bar"></i></div>
    <div class="stat" style="margin-top:8px">
      <span><b>${STAGE_NAME[curStage()]}</b></span>
      <span>빈칸 ${spans.length}개 · 가림 ${Math.round(blanked/t.length*100)}%</span>
      <span>진도 <b>${pos+1}</b> / ${queue.length}</span></div>
  </div>
  <div class="card">
    <div class="czinfo">밑줄 친 칸을 채우세요 · 끝 조사 한 글자 차이는 정답으로 봅니다 · <kbd>Tab</kbd> 다음 칸 · <kbd>Ctrl+Enter</kbd> 채점</div>
    <div class="cz" id="cz">${body}</div>
    <div class="row" style="margin-top:12px">
      <button id="hintBtn">힌트</button>
      <label style="display:inline-flex;align-items:center;gap:5px;font-size:.85rem;cursor:pointer"><input type="checkbox" id="hintPinCk"> 힌트 고정</label>
      <button id="showBtn">정답 보기</button>
      <button id="gradeBtn" class="primary">채점 <kbd>Ctrl+Enter</kbd></button>
      <span style="flex:1"></span>
      <button id="prevBtn">← 이전</button>
      <button id="skipBtn">건너뛰기 →</button>
    </div>
    <div class="stat" id="score"></div>
    ${extras(c)}
  </div>`;
  bindCloze(c);
  bindJumps();
}
function bindCloze(c){
  const bls = [...document.querySelectorAll('.bl')];
  const val = el => el.textContent.replace(/\s+/g,' ').trim();
  /* 이미 쓴 칸으로 되돌아오면 내용을 통째로 선택해 둔다 — 지우지 않고 바로 다시 쓸 수
     있게. contenteditable 이라 input.select() 가 없어 Range 로 잡는다.
     주소창과 같은 방식이라, 고쳐 쓰고 싶으면 방향키를 누르거나 한 번 더 누르면 된다. */
  const selectAll = el => {
    const r = document.createRange();
    r.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  };
  /* 힌트 2단계(초성) 이상에서 답 길이를 다 채웠으면, 스페이스는 공백이 아니라
     '다음 칸으로'라는 뜻이다. 초성이 사라지는 순간이 곧 다 쳤다는 신호이므로
     화면에 보이는 것과 동작이 맞아떨어진다. 답 중간의 공백은 그대로 입력된다
     ('공소사실 특정'처럼 아직 칠 글자가 남아 있으면 조건이 성립하지 않는다). */
  const filled = el => hintLv >= 2 && !el.classList.contains('ok') && !el.classList.contains('bad')
    && el.textContent.replace(/\s+$/, '').length >= (el.dataset.ans || '').length;
  const goNext = i => { const n = bls[i+1] || bls[0]; if (n) n.focus(); };

  if (bls[0]) bls[0].focus();
  bls.forEach((el, i) => {
    /* 마우스로 들어온 경우 focus 다음에 오는 mouseup 이 선택을 풀어 버린다 */
    let armed = false;
    el.addEventListener('focus', () => { if (val(el)){ armed = true; selectAll(el); } });
    el.addEventListener('mouseup', e => { if (armed){ e.preventDefault(); armed = false; } });
    el.addEventListener('blur', () => { armed = false; });
    el.addEventListener('keydown', e => {
      /* 한글 조합 중(isComposing)에는 여기서 막으면 안 된다 — 스페이스가 음절을
         확정시키는 키라, 막으면 마지막 글자가 날아간다. 그 경우는 아래 input 에서
         들어온 공백을 걷어내는 쪽으로 처리한다. */
      if (e.key === ' ' && !e.isComposing && filled(el)){ e.preventDefault(); goNext(i); return; }
      if (e.key === 'Enter'){
        e.preventDefault();
        if (e.ctrlKey || e.metaKey){ grade(); return; }
        (bls[i+1] || bls[0]).focus();
      }
      if (e.key === 'Tab'){ e.preventDefault(); (bls[e.shiftKey ? i-1 : i+1] || bls[e.shiftKey ? bls.length-1 : 0]).focus(); }
    });
    el.addEventListener('input', () => {
      el.classList.remove('ok','bad');
      /* 조합이 끝나면서 함께 들어온 끝 공백 — 다 친 뒤였다면 '다음 칸으로'로 읽는다 */
      if (/\s$/.test(el.textContent) && filled(el)){
        el.textContent = el.textContent.replace(/\s+$/, '');
        goNext(i);
      }
      restHint(el);
      const done = bls.filter(x => val(x)).length;
      $('#bar').style.width = (done/bls.length*100) + '%';
    });
  });
  bindKey(e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.querySelector('#cz')){ e.preventDefault(); grade(); } });

  /* 힌트 — 글자 수는 1단계에서만, 초성은 2단계, 앞 1/3은 3단계 */
  const HL = ['힌트', '힌트 1/3 · 글자 수', '힌트 2/3 · 초성', '힌트 3/3 · 앞 1/3'];
  /* 친 글자만큼 앞에서 잘라낸 나머지 힌트. 채점이 끝난 칸에는 붙이지 않는다. */
  const restHint = el => {
    const n = el.textContent.length;
    const a = el.dataset.ans;
    let rest = '';
    if (n && hintLv >= 2 && !el.classList.contains('ok') && !el.classList.contains('bad'))
      rest = (hintLv === 2 ? Engine.chosung(a)
                           : a.slice(0, Math.max(1, Math.ceil(a.length/3))) + '…').slice(n, n + 40);
    if (rest) el.dataset.rest = rest; else delete el.dataset.rest;
  };
  const applyHint = () => {
    bls.forEach(el => {
      const a = el.dataset.ans;
      el.dataset.ph = hintLv === 0 ? '____'
        : hintLv === 1 ? `(${a.length}자)`
        : hintLv === 2 ? Engine.chosung(a).slice(0, 40)
        : a.slice(0, Math.max(1, Math.ceil(a.length/3))) + '…';
      restHint(el);
    });
    $('#hintBtn').textContent = HL[Math.min(3, hintLv)];
    $('#hintBtn').disabled = hintLv >= 3;
  };
  $('#hintBtn').onclick = () => { hintLv = Math.min(3, hintLv+1); P.settings.hintLv = hintLv; save(); applyHint(); };
  $('#hintPinCk').checked = P.settings.hintPin;
  $('#hintPinCk').onchange = e => {
    P.settings.hintPin = e.target.checked;
    if (P.settings.hintPin && hintLv < 1) hintLv = 1;
    save(); applyHint();
  };
  applyHint();

  $('#showBtn').onclick = () => {
    bls.forEach(el => { if (!Engine.answerMatches(val(el), el.dataset.ans)){ el.textContent = el.dataset.ans; el.classList.add('bad'); } restHint(el); });
    P.wrong.add(c.카드ID); save();
  };
  $('#gradeBtn').onclick = grade;
  $('#skipBtn').onclick = () => { P.wrong.add(c.카드ID); save(); bindKey(null); pos++; resetHint(); render(); };
  $('#prevBtn').onclick = () => { if (pos > 0){ bindKey(null); pos--; resetHint(); render(); } };

  function grade(){
    let ok = 0;
    bls.forEach(el => {
      const good = Engine.answerMatches(val(el), el.dataset.ans);
      el.classList.toggle('ok', good); el.classList.toggle('bad', !good);
      restHint(el);                       // 채점이 끝나면 남은 초성을 걷는다
      // 틀린 칸에는 정답을 나란히 보여준다 (무엇이 왜 틀렸는지 알려주지 않던 문제)
      const old = el.nextElementSibling;
      if (old && old.classList && old.classList.contains('fixhint')) old.remove();
      if (!good) el.insertAdjacentHTML('afterend', `<span class="fixhint">→ ${esc(el.dataset.ans)}</span>`);
      if (good) ok++;
    });
    const acc = Math.round(ok/bls.length*100);
    const pass = ok === bls.length;
    $('#score').innerHTML = `<span>빈칸 <b>${ok}</b> / ${bls.length} 정답</span>`
      + `<span>정확도 <b style="color:${pass ? 'var(--ok)' : 'var(--bad)'}">${acc}%</b></span>`
      + `<span>${pass ? '<b style="color:var(--ok)">통과</b>' : '<b style="color:var(--bad)">빨간 칸 옆의 정답을 확인하세요</b>'}</span>`;
    memoStat.acc.push(acc);
    record(c, pass, acc, curStage());
    if (!pass) return;
    bindKey(null);
    setTimeout(() => {
      if ($('#fSeq').checked && seqStage < 4){ seqStage++; resetHint(); render(); }
      else { memoStat.done++; pos++; resetHint(); render(); }
    }, 480);
  }
}

/* ---- 4단계 : 전문 작성 ---- */
function renderFull(){
  const c = queue[pos];
  const full = jeText(c.법리원문);
  sub = $('#fSent').checked ? Engine.splitSentences(full) : [full];
  subIdx = 0; startedAt = 0;
  $('#stage').innerHTML = `
  <div class="card">
    ${head(c)}
    ${promptBlock(c)}
    <div class="hintbox" id="hint"></div>
    <div class="prog"><i id="bar"></i></div>
    <div class="stat" style="margin-top:8px">
      <span><b>${STAGE_NAME[4]}</b></span><span id="subinfo"></span>
      <span>진도 <b>${pos+1}</b> / ${queue.length}</span></div>
  </div>
  <div class="card">
    <div class="factlabel">법리를 서술하세요 — 표기가 조금 달라도 뜻과 조문번호가 맞으면 통과합니다</div>
    <textarea id="ta" placeholder="여기에 법리를 타이핑하세요…" spellcheck="false"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="hintBtn">힌트</button>
      <label style="display:inline-flex;align-items:center;gap:5px;font-size:.85rem;cursor:pointer"><input type="checkbox" id="hintPinCk"> 힌트 고정</label>
      <button id="showBtn">정답 보기</button>
      <button id="gradeBtn" class="primary">채점 <kbd>Ctrl+Enter</kbd></button>
      <span style="flex:1"></span>
      <button id="prevBtn">← 이전</button>
      <button id="skipBtn">건너뛰기 →</button>
    </div>
    <div class="diff" id="diff"></div>
    <div class="answer" id="ans"></div>
    <div class="stat" id="score"></div>
    ${extras(c)}
  </div>`;
  bindMemo(c);
  bindJumps();
}
function bindMemo(c){
  const ta = $('#ta'), df = $('#diff'), bar = $('#bar');
  const target = () => sub[subIdx];
  const info = () => { $('#subinfo').textContent = sub.length > 1 ? `문장 ${subIdx+1} / ${sub.length}` : `${target().length}자`; };
  info(); ta.focus();
  let timer = null;
  ta.addEventListener('input', () => {
    if (!startedAt) startedAt = performance.now();
    bar.style.width = Math.min(100, ta.value.length/target().length*100) + '%';
    if (!$('#fLive').checked) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const t = target(), typed = ta.value;
      if (!typed){ df.style.display = 'none'; return; }
      const win = t.slice(0, Math.min(t.length, typed.length + 40));
      df.style.display = 'block';
      df.innerHTML = paint(Engine.diff(typed, win)) + (win.length < t.length ? '<span class="pend"> …</span>' : '');
    }, 130);
  });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); grade(); } });
  bindKey(e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.querySelector('#ta')){ e.preventDefault(); grade(); } });

  const HL = ['힌트', '힌트 1/3 · 첫 어절', '힌트 2/3 · 핵심어', '힌트 3/3 · 전문 초성'];
  const applyHint = () => {
    const h = $('#hint');
    if (hintLv < 1){ h.style.display = 'none'; $('#hintBtn').textContent = HL[0]; $('#hintBtn').disabled = false; return; }
    h.style.display = 'block';
    const lines = [];
    if (hintLv >= 1) lines.push(`첫 어절 › ${(jeOff() ? '' : c.힌트_첫어절) || target().split(' ').slice(0,3).join(' ')}`);
    if (hintLv >= 2) lines.push(`핵심어 › ${(c.핵심키워드 || []).join(', ')}`);
    if (hintLv >= 3) lines.push(`초성 › ${sub.length > 1 || jeOff() ? Engine.chosung(target()) : (c.힌트_초성 || Engine.chosung(c.법리원문))}`);
    h.textContent = lines.join('\n');
    $('#hintBtn').textContent = HL[Math.min(3, hintLv)];
    $('#hintBtn').disabled = hintLv >= 3;
  };
  $('#hintBtn').onclick = () => { hintLv = Math.min(3, hintLv+1); P.settings.hintLv = hintLv; save(); applyHint(); };
  $('#hintPinCk').checked = P.settings.hintPin;
  $('#hintPinCk').onchange = e => {
    P.settings.hintPin = e.target.checked;
    if (P.settings.hintPin && hintLv < 1) hintLv = 1;
    save(); applyHint();
  };
  applyHint();

  $('#showBtn').onclick = () => { const a = $('#ans'); a.style.display = 'block'; a.textContent = target(); P.wrong.add(c.카드ID); save(); };
  $('#gradeBtn').onclick = grade;
  $('#skipBtn').onclick = () => { P.wrong.add(c.카드ID); save(); bindKey(null); pos++; resetHint(); render(); };
  $('#prevBtn').onclick = () => { if (pos > 0){ bindKey(null); pos--; resetHint(); render(); } };

  function paint(parts){
    return parts.map(([k, ch]) => k === 'ok' ? esc(ch)
      : `<span class="${k}">${esc(k === 'bad' && ch === ' ' ? '␣' : ch)}</span>`).join('');
  }
  function grade(){
    const t = target(), typed = ta.value;
    const g = Engine.gradeText(typed, t);
    df.style.display = 'block'; df.innerHTML = paint(Engine.diff(typed, t));
    const ms = startedAt ? performance.now() - startedAt : 0;
    const spd = ms > 2000 ? Math.round(keystrokes(typed)/(ms/60000)) : null;
    $('#score').innerHTML =
        `<span>유사도 <b style="color:${g.pass ? 'var(--ok)' : 'var(--bad)'}">${g.pct}%</b> <span style="color:var(--muted)">(통과 ${g.need}%)</span></span>`
      + (spd ? `<span>분당 <b>${spd}</b>타</span>` : '')
      + (g.critical.length ? `<span>핵심 토큰 <b>${g.critical.length - g.missed.length}</b>/${g.critical.length}</span>` : '')
      + (g.missed.length ? `<span style="color:var(--bad)">빠진 것 <b>${esc(g.missed.join(', '))}</b></span>` : '')
      + `<span>${g.pass ? '<b style="color:var(--ok)">통과</b>' : '<b style="color:var(--bad)">빨간 부분을 확인하세요</b>'}</span>`;
    memoStat.acc.push(g.pct);
    if (ms > 2000){ memoStat.chars += keystrokes(typed); memoStat.ms += ms; }
    if (subIdx === sub.length - 1) record(c, g.pass, g.pct, 4);
    if (!g.pass) return;
    if (subIdx < sub.length - 1){
      subIdx++; ta.value = ''; df.style.display = 'none'; $('#ans').style.display = 'none';
      resetHint(); applyHint(); startedAt = 0; bar.style.width = '0'; info(); ta.focus();
    } else {
      memoStat.done++; bindKey(null);
      setTimeout(() => { pos++; resetHint(); render(); }, 450);
    }
  }
}
function memoSummary(){
  const a = memoStat.acc, avg = a.length ? Math.round(a.reduce((x,y) => x+y, 0)/a.length) : 0;
  const spd = memoStat.ms > 2000 ? Math.round(memoStat.chars/(memoStat.ms/60000)) : '–';
  return `<div class="card empty">
    <div style="font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px">세트 완료</div>
    <div class="stat" style="justify-content:center">
      <span>통과한 카드 <b>${memoStat.done}</b></span><span>평균 유사도 <b>${avg}%</b></span>
      <span>분당 <b>${spd}</b>타</span><span>남은 오답 <b>${P.wrong.size}</b></span></div>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button id="again" class="primary">처음부터 다시</button>
      <button id="againWrong">오답만 다시 (${P.wrong.size})</button></div></div>`;
}

/* =====================================================================
   타자 모드
   ===================================================================== */
function wrapLines(t, w){
  const words = t.split(' '); const out = []; let cur = '';
  for (const wd of words){
    if (!cur) cur = wd;
    else if ((cur + ' ' + wd).length <= w) cur += ' ' + wd;
    else { out.push(cur); cur = wd; }
    while (cur.length > w){ out.push(cur.slice(0, w)); cur = cur.slice(w); }
  }
  if (cur) out.push(cur);
  return out.length ? out : [t];
}
function renderType(){
  const c = queue[pos];
  tLines = wrapLines(jeText(c.법리원문), +$('#fWrap').value || 34);
  tLine = 0;
  $('#stage').innerHTML = `
  <div class="card">
    ${head(c)}
    <div class="prog"><i id="bar"></i></div>
    <div class="stat" style="margin-top:8px">
      <span>줄 <b id="lineNo">1</b> / ${tLines.length}</span>
      <span>판례 <b>${pos+1}</b> / ${queue.length}</span>
      <span style="color:var(--muted)">엔터 또는 마지막 글자 뒤 스페이스로 다음 줄 · 정확히 치면 자동으로 넘어감</span>
    </div>
  </div>
  <div class="card">
    <div class="tp" id="tp"></div>
    <input class="tinput" id="ti" spellcheck="false" autocomplete="off" placeholder="위 노란 줄을 그대로 따라 치세요">
    <div class="gauge">
      <div><div class="n" id="gKpm">0</div><div class="l">분당 타수</div></div>
      <div><div class="n" id="gAcc">100<span style="font-size:15px">%</span></div><div class="l">정확도</div></div>
      <div><div class="n" id="gErr">0</div><div class="l">누적 오타</div></div>
      <div><div class="n" id="gTime">0:00</div><div class="l">경과</div></div>
      <span style="flex:1"></span>
      <div class="row"><button id="tPrev">← 이전 판례</button><button id="tSkip">다음 판례 →</button></div>
    </div>
    ${c.발문 ? `<div class="rel"><b>목차</b> · ${esc(jeText(c.발문))}</div>` : ''}
  </div>`;
  paintLines(''); bindType(c);
}
function paintLines(typed, composing){
  const tp = $('#tp'); if (!tp) return;
  const line = tLines[tLine] || '';
  let cur = '';
  const n = Math.max(typed.length, 0);
  for (let i = 0; i < line.length; i++){
    const ch = line[i] === ' ' ? ' ' : esc(line[i]);
    if (i < n){
      const last = (i === n-1) && composing;
      cur += last ? `<span class="c-now">${ch}</span>` : `<span class="${typed[i] === line[i] ? 'c-ok' : 'c-bad'}">${ch}</span>`;
    } else if (i === n) cur += `<span class="c-now c-todo">${ch}</span>`;
    else cur += `<span class="c-todo">${ch}</span>`;
  }
  if (n > line.length) cur += `<span class="c-bad">${esc(typed.slice(line.length))}</span>`;
  const prev = tLine > 0 ? `<span class="done">${esc(tLines[tLine-1])}</span>\n` : '';
  const next = tLine < tLines.length-1 ? `\n<span class="nxt">${esc(tLines[tLine+1])}</span>` : '';
  tp.innerHTML = prev + `<span class="cur">${cur}</span>` + next;
}
function bindType(c){
  bindKey(null);
  const ti = $('#ti'); ti.focus();
  let composing = false;
  ti.addEventListener('compositionstart', () => composing = true);
  ti.addEventListener('compositionend', () => { composing = false; paintLines(ti.value, false); check(); });
  ti.addEventListener('input', e => {
    if (/^\s+$/.test(ti.value)){ ti.value = ''; paintLines(''); return; }
    if (!tStat.started) tStat.started = performance.now();
    const cmp = composing || e.isComposing;
    paintLines(ti.value, cmp);
    if (!cmp) check();
    tick();
  });
  ti.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); nextLine(true); return; }
    if (e.key === ' ' && ti.value.replace(/\s+$/,'') === tLines[tLine]){ e.preventDefault(); nextLine(true); }
  });
  $('#tSkip').onclick = () => { pos++; render(); };
  $('#tPrev').onclick = () => { if (pos > 0){ pos--; render(); } };

  function check(){
    const line = tLines[tLine], v = ti.value;
    if (v === line || (/\s$/.test(v) && v.replace(/\s+$/,'') === line)) nextLine(false);
  }
  function nextLine(manual){
    const line = tLines[tLine], typed = ti.value.replace(/\s+$/,'');
    let ok = 0, err = 0;
    for (let i = 0; i < Math.max(line.length, typed.length); i++){
      if (i < line.length && i < typed.length && line[i] === typed[i]) ok++; else err++;
    }
    if (manual && $('#fStrict').checked && typed !== line){
      ti.style.borderColor = 'var(--bad)';
      setTimeout(() => ti.style.borderColor = 'var(--accent)', 260);
      return;
    }
    tStat.typed += typed.length; tStat.ok += ok; tStat.err += err;
    tStat.keys += keystrokes(typed);
    ti.value = ''; tLine++;
    if (tLine >= tLines.length){ pos++; render(); return; }
    $('#lineNo').textContent = tLine+1;
    $('#bar').style.width = (tLine/tLines.length*100) + '%';
    paintLines(''); tick(); ti.focus();
  }
  function tick(){
    if (!tStat.started) return;
    const ms = performance.now() - tStat.started;
    const liveKeys = tStat.keys + keystrokes(ti.value);
    $('#gKpm').textContent = ms > 1500 ? Math.round(liveKeys/(ms/60000)) : 0;
    const tot = tStat.ok + tStat.err;
    $('#gAcc').innerHTML = (tot ? Math.round(tStat.ok/tot*100) : 100) + '<span style="font-size:15px">%</span>';
    $('#gErr').textContent = tStat.err;
    const s = Math.floor(ms/1000);
    $('#gTime').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }
  clearInterval(tTimer);
  tTimer = setInterval(() => { if ($('#gTime')) tick(); else clearInterval(tTimer); }, 1000);
  $('#tp').addEventListener('click', () => ti.focus());
}
function typeSummary(){
  const ms = tStat.started ? performance.now() - tStat.started : 0;
  const kpm = ms > 1500 ? Math.round(tStat.keys/(ms/60000)) : 0;
  const tot = tStat.ok + tStat.err;
  return `<div class="card empty">
    <div style="font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px">타자연습 완료</div>
    <div class="stat" style="justify-content:center">
      <span>분당 <b>${kpm}</b>타</span><span>정확도 <b>${tot ? Math.round(tStat.ok/tot*100) : 100}%</b></span>
      <span>총 타수 <b>${tStat.keys}</b></span><span>오타 <b>${tStat.err}</b></span></div>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button id="again" class="primary">처음부터 다시</button></div></div>`;
}

/* =====================================================================
   내보내기 · 불러오기 · 시작
   ===================================================================== */
$('#expBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(snapshot(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = CFG.download; a.click();
};
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').onchange = ev => {
  const fl = ev.target.files[0]; if (!fl) return;
  const r = new FileReader();
  r.onload = () => { try { restore(JSON.parse(r.result)); build(false, true); toast('불러왔습니다'); }
                     catch(e){ alert('불러오기 실패: ' + e.message); } };
  r.readAsText(fl);
};
$('#resetBtn').onclick = () => {
  if (!confirm('오답·정답률·복습 일정을 모두 지웁니다. 계속할까요?')) return;
  P.wrong.clear(); P.drill = {}; P.pos = 0; save(); refreshDueCount(); build(false);
  toast('학습 이력을 초기화했습니다');
};

/* 진도 복원 — 저장 형식이 v2 로 바뀌었으므로 v1 스냅샷이 남아 있으면 한 번 옮겨 온다.
   v1 에는 카드별 정답률·복습일이 없고 오답 목록과 필터만 있다. */
try {
  const cur = localStorage.getItem(LS_KEY);
  if (cur) restore(JSON.parse(cur));
  else if (CFG.lsOld) {
    const old = JSON.parse(localStorage.getItem(CFG.lsOld) || 'null');
    if (old && (old.wrong || old.filters)) {
      restore({ wrong: old.wrong, stage: old.stage, filters: old.filters });
      save();
      setTimeout(() => toast(`이전 버전 진도를 옮겨 왔습니다 · 오답 ${P.wrong.size}장`), 900);
    }
  }
} catch(e){}
hintLv = P.settings.hintPin ? Math.max(1, P.settings.hintLv || 1) : 0;
syncModeUI();
refreshDueCount();
setInterval(save, 4000);
window.addEventListener('beforeunload', save);
build(false, true);
</script>
